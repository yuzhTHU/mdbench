task_name: Reconstructed 20260919 Molecular Association Partition - Variant 1-2
task_description: Equilibrium bound-ligand amounts are measured with controlled total binding-partner and free reservoir
  concentrations.
mutation: Add competitive sequestration of the binding partner. Allow sequential binding of a second ligand.
mechanism_model:
- formula: Kb = 1.4
  role: constitutive/component relations
  description: 'Fixed batch parameter: first-ligand association constant; unit m^3 mol^-1. Assumptions: Reversible
    mass-action equilibrium; ligand and competitor free concentrations buffered by large reservoirs; one conserved
    binding-partner pool; bound-ligand count excludes competitor.'
- formula: Ks = 2.2
  role: constitutive/component relations
  description: 'Fixed batch parameter: competitor association constant; unit m^3 mol^-1.'
- formula: K2 = .8
  role: constitutive/component relations
  description: 'Fixed batch parameter: second-ligand association constant; unit m^3 mol^-1.'
- formula: wB = Kb*B_free
  role: constitutive/component relations
  description: Singly ligand-bound-to-free-partner concentration ratio.
- formula: wS = Ks*S_free
  role: constitutive/component relations
  description: Competitor-bound-to-free-partner concentration ratio.
- formula: wBB = wB*K2*B_free
  role: constitutive/component relations
  description: Doubly ligand-bound-to-free-partner concentration ratio.
- formula: A_free = A_total/(1+wB+wS+wBB)
  role: conservation/balance relations
  description: Unbound binding-partner concentration from partner conservation.
- formula: AB = wB*A_free
  role: constitutive/component relations
  description: Singly ligand-bound complex concentration.
- formula: ABB = wBB*A_free
  role: constitutive/component relations
  description: Doubly ligand-bound complex concentration.
- formula: B_bound = AB+2*ABB
  role: conservation/balance relations
  description: Total concentration of ligand molecules in complexes.
phenomenal_model: B_bound = A_total*B_free*Kb*(2*B_free*K2 + 1)/(B_free**2*K2*Kb + B_free*Kb + Ks*S_free + 1)
variables:
- name: A_total
  description: Total concentration of binding-partner molecules.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.001
    max: 0.1
    ood_boundary: 0.02
    distribution: log_uniform
- name: B_free
  description: Free ligand concentration maintained by a reservoir.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    max: 5
    ood_boundary: 1
    distribution: log_uniform
- name: S_free
  description: Free competing-species concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.02
    max: 3
    ood_boundary: 0.7
    distribution: log_uniform
- name: wB
  description: Singly ligand-bound-to-free-partner concentration ratio.
  unit: '1'
  role: internal
- name: wS
  description: Competitor-bound-to-free-partner concentration ratio.
  unit: '1'
  role: internal
- name: wBB
  description: Doubly ligand-bound-to-free-partner concentration ratio.
  unit: '1'
  role: internal
- name: A_free
  description: Unbound binding-partner concentration from partner conservation.
  unit: mol m^-3
  role: internal
- name: AB
  description: Singly ligand-bound complex concentration.
  unit: mol m^-3
  role: internal
- name: ABB
  description: Doubly ligand-bound complex concentration.
  unit: mol m^-3
  role: internal
- name: B_bound
  description: Total concentration of ligand molecules in complexes.
  unit: mol m^-3
  role: target
mechanism_probes:
- probe: A_free
  description: Concentration of free binding partner, excluding both ligand-bound and competitor-bound forms.
  answer: A_free = A_total/(B_free**2*K2*Kb + B_free*Kb + Ks*S_free + 1)
- probe: ABB
  description: Concentration of complexes carrying two ligand molecules.
  answer: ABB = A_total*B_free**2*K2*Kb/(B_free**2*K2*Kb + B_free*Kb + Ks*S_free + 1)
