problem_name: Black Hole Event Horizon - Kerr-Newman
phenomenological_formula: r = G * M / c**2 + sqrt((G * M / c**2)**2 - (J / (M * c))**2 - G * Q**2 / (4 * pi * eps * c**4))
problem_description: A black hole rotates about its axis and carries electric charge. Its outer event-horizon radius r is related to the black-hole mass M, angular momentum J, and electric charge Q.
variable_description:
  target:
    name: r
    description: Outer event-horizon radius
    unit: m
  inputs:
  - name: J
    description: Angular momentum
    unit: kg m^2 s^-1
    sampling:
      min: 1.0e+36
      max: 1.0e+41
      ood_boundary: 1.0e+39
      distribution: log_uniform
  - name: M
    description: Black-hole mass
    unit: kg
    sampling:
      min: 1.0e+30
      max: 1.0e+33
      ood_boundary: 5.0e+31
      distribution: log_uniform
  - name: Q
    description: Electric charge
    unit: A s
    sampling:
      min: 1000000.0
      max: 100000000000000.0
      ood_boundary: 10000000000.0
      distribution: log_uniform
  intermediates:
  - name: R
    description: Schwarzschild diameter associated with the mass M
    unit: m
  - name: a
    description: Kerr specific angular-momentum length
    unit: m
  - name: q
    description: Charge contribution to the horizon length-squared
    unit: m^2
  - name: D
    description: Discriminant
    unit: m^2
  auxiliary_inputs: []
constants:
- name: G
  description: Gravitational constant
  value: 6.6743e-11
  unit: m^3 kg^-1 s^-2
- name: c
  description: Speed of light in vacuum
  value: 299792458.0
  unit: m s^-1
- name: eps
  description: Vacuum permittivity
  value: 8.8541878128e-12
  unit: kg^-1 m^-3 s^4 A^2
- name: pi
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: R = 2 * G * M / c**2
  formula_description: The Schwarzschild-radius definition gives the mass diameter scale R.
- formula: a = J / (M * c)
  formula_description: The Kerr spin-parameter definition converts angular momentum J into length a.
- formula: q = G * Q**2 / (4 * pi * eps * c**4)
  formula_description: The Kerr-Newman metric charge term defines the length-squared contribution q from charge Q.
- formula: D = R**2 - 4 * a**2 - 4 * q
  formula_description: The Kerr-Newman horizon quadratic has discriminant D after mass, spin, and charge contributions.
- formula: r = (R + sqrt(D)) / 2
  formula_description: The outer-root definition selects the larger Kerr-Newman horizon radius r.
