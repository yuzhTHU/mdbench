problem_name: Capillary Rise - Conical Tube
phenomenological_formula: h = (-r0 + sqrt(r0^2 + 4 * k * gamma * cos(theta) / (rho * g))) / k
problem_description: |
  A liquid rises through a slowly widening conical capillary tube. This variant replaces the constant-radius geometry with an effective radius that increases linearly with height.
variable_description:
  target: {name: h, description: Capillary rise height, unit: m}
  inputs:
    - {name: r0, description: Reference radius at the tube entrance, unit: m, sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}}
    - {name: k, description: Increase in radius per unit height, unit: 1 (dimensionless), sampling: {min: 1.0e-3, max: 0.5, ood_boundary: 0.1, distribution: log_uniform}}
    - {name: gamma, description: Liquid surface tension, unit: kg s^-2, sampling: {min: 0.01, max: 0.1, ood_boundary: 0.05, distribution: uniform}}
    - {name: theta, description: Contact angle, unit: 1 (dimensionless), sampling: {min: 0.0, max: 1.3, ood_boundary: 0.8, distribution: uniform}}
    - {name: rho, description: Liquid density, unit: kg m^-3, sampling: {min: 5.0e2, max: 1.5e3, ood_boundary: 1.0e3, distribution: uniform}}
    - {name: g, description: Gravitational acceleration, unit: m s^-2, sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}}
  intermediates:
    - {name: A_cap, description: Capillary driving area scale, unit: m^2}
    - {name: r_eff, description: Mean effective radius, unit: m}
  auxiliary_inputs: []
mechanism:
  - {formula: A_cap = 2 * gamma * cos(theta) / (rho * g), formula_description: Capillary driving scale}
  - {formula: r_eff = r0 + k * h / 2, formula_description: Mean effective radius replacing constant-radius geometry}
  - {formula: h = A_cap / r_eff, formula_description: Capillary equilibrium in a conical tube}
