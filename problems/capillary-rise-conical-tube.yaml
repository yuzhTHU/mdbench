problem_name: Narrow-Tube Liquid Rise - Case 02
phenomenological_formula: h = (-r0 + sqrt(r0^2 + 8 * k * gamma * cos(theta) / (rho * g))) / (2 * k)
problem_description: |
  A liquid rises in a narrow tube by capillary action. The target is the equilibrium rise height.
variable_description:
  target: {name: h, description: Equilibrium liquid rise height, unit: m}
  inputs:
    - {name: r0, description: Reference tube radius, unit: m, sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}}
    - {name: k, description: Dimensionless tube-shape parameter, unit: 1 (dimensionless), sampling: {min: 1.0e-3, max: 0.2, ood_boundary: 0.05, distribution: log_uniform}}
    - {name: gamma, description: Liquid surface tension, unit: kg s^-2, sampling: {min: 0.01, max: 0.1, ood_boundary: 0.05, distribution: uniform}}
    - {name: theta, description: Contact angle, unit: 1 (dimensionless), sampling: {min: 0.0, max: 1.3, ood_boundary: 0.8, distribution: uniform}}
    - {name: rho, description: Liquid density, unit: kg m^-3, sampling: {min: 5.0e2, max: 1.5e3, ood_boundary: 1.0e3, distribution: uniform}}
    - {name: g, description: Gravitational acceleration, unit: m s^-2, sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}}
  intermediates:
    - {name: c, description: Vertical projection factor of the contact angle, unit: 1 (dimensionless)}
  auxiliary_inputs: []
mechanism:
  - {formula: c = cos(theta), formula_description: Vertical projection factor set by the contact angle}
  - {formula: h = 2 * gamma * c / (rho * g * (r0 + k * h)), formula_description: "Young-Laplace capillary pressure equals hydrostatic pressure, with the meniscus radius given by the local conical-tube radius r0 + k * h"}
