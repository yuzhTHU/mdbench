problem_name: Spring Oscillator Period - Parallel Springs
phenomenological_formula: T = 2 * π * sqrt(m / (k1 + k2))
problem_description: A mass is connected to two linear springs acting in parallel, so their stiffnesses add.
variable_description:
  target:
    name: T
    description: Oscillation period with parallel springs
    unit: s
  inputs:
  - name: m
    description: Oscillator mass
    unit: kg
    sampling:
      min: 0.01
      max: 10.0
      ood_boundary: 1.0
      distribution: log_uniform
  - name: k1
    description: First spring stiffness
    unit: kg s^-2
    sampling:
      min: 0.1
      max: 10000.0
      ood_boundary: 100.0
      distribution: log_uniform
  - name: k2
    description: Second spring stiffness
    unit: kg s^-2
    sampling:
      min: 0.1
      max: 10000.0
      ood_boundary: 100.0
      distribution: log_uniform
  intermediates:
  - name: k_eff
    description: Equivalent parallel stiffness
    unit: kg s^-2
  - name: omega
    description: Angular frequency
    unit: s^-1
  auxiliary_inputs: []
constants:
- name: π
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: k_eff = k1 + k2
  formula_description: Equivalent stiffness of parallel springs
- formula: omega = sqrt(k_eff / m)
  formula_description: Angular frequency using the equivalent stiffness
- formula: T = 2 * π / omega
  formula_description: Period-frequency relation
