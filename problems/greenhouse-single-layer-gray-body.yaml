problem_name: Greenhouse Effect - Single-Layer Gray Body
phenomenological_formula: T = ((1 - a) * S / (4 * s * (1 - b / 2)))**(1/4)
problem_description: A planet exchanges energy with its atmosphere and surroundings. The target is the equilibrium planetary surface temperature.
variable_description:
  target:
    name: T
    description: Surface temperature
    unit: K
  inputs:
  - name: S
    description: Incident radiative flux
    unit: kg s^-3
    sampling:
      min: 1200.0
      max: 1500.0
      ood_boundary: 1361.0
      distribution: uniform
  - name: a
    description: Planetary shortwave albedo
    unit: 1 (dimensionless)
    sampling:
      min: 0.1
      max: 0.6
      ood_boundary: 0.3
      distribution: uniform
  - name: b
    description: Longwave absorptivity and emissivity of the gray atmospheric layer
    unit: 1 (dimensionless)
    sampling:
      min: 0.05
      max: 0.8
      ood_boundary: 0.4
      distribution: uniform
  intermediates:
  - name: S0
    description: Globally averaged absorbed solar flux
    unit: kg s^-3
  - name: f
    description: Downward longwave feedback fraction
    unit: 1 (dimensionless)
  - name: E
    description: Surface outgoing longwave emission flux
    unit: kg s^-3
  auxiliary_inputs: []
constants:
- name: s
  description: Stefan-Boltzmann constant
  value: 5.670374419e-08
  unit: kg s^-3 K^-4
mechanism:
- formula: S0 = (1 - a) * S / 4
  formula_description: Global radiative geometry and albedo define absorbed solar flux S0 from stellar flux S.
- formula: f = b / 2
  formula_description: Isotropic emission by a gray layer defines the downward feedback fraction f as half its longwave absorptivity b.
- formula: E = S0 / (1 - f)
  formula_description: Surface radiative-equilibrium balance defines emission flux E from absorbed solar flux S0 and feedback fraction f.
- formula: T = (E / s)**(1/4)
  formula_description: The Stefan-Boltzmann law E = s * T**4 defines surface temperature T from emission flux E.
