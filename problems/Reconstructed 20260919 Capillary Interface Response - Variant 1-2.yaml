task_name: Reconstructed 20260919 Capillary Interface Response - Variant 1-2
task_description: Equilibrium liquid-rise heights in narrow circular tubes are measured against tube radius, liquid
  density, gravity and dissolved additive concentration.
mutation: Change interfacial tension through saturable adsorption. Change contact angle through additive-dependent
  wetting.
mechanism_model:
- formula: sigma0 = .072
  role: constitutive/component relations
  description: 'Fixed batch parameter: clean interfacial tension; unit N m^-1. Assumptions: Static circular tube;
    negligible meniscus volume; homogeneous liquid; small Bond number; macroscopic Laplace pressure; synthetic independent
    tension and wetting closures.'
- formula: Kc = .8
  role: constitutive/component relations
  description: 'Fixed batch parameter: surface affinity concentration; unit mol m^-3.'
- formula: theta = c/(Kc+c)
  role: conservation/balance relations
  description: Equilibrium adsorbed surface fraction.
- formula: sigma_eff = sigma0/(1+theta)
  role: constitutive/component relations
  description: Liquid-gas interfacial tension.
- formula: cos_contact = .7-.2*theta
  role: constitutive/component relations
  description: Cosine of the liquid-side equilibrium contact angle.
- formula: p_laplace = 2*sigma_eff*cos_contact/a
  role: kinematic/geometric constraints
  description: Capillary pressure supporting the liquid column.
- formula: height = p_laplace/(rho*g)
  role: conservation/balance relations
  description: Column height from hydrostatic pressure balance.
phenomenal_model: height = sigma0*(7*Kc + 5*c)/(5*a*g*rho*(Kc + 2*c))
variables:
- name: a
  description: Internal tube radius.
  unit: m
  role: input
  sampling:
    min: 1.0e-05
    max: 0.0001
    ood_boundary: 5.0e-05
    distribution: log_uniform
- name: rho
  description: Liquid density.
  unit: kg m^-3
  role: input
  sampling:
    min: 800
    max: 1200
    ood_boundary: 1050
    distribution: uniform
- name: g
  description: Gravitational acceleration.
  unit: m s^-2
  role: input
  sampling:
    min: 4
    max: 15
    ood_boundary: 10
    distribution: uniform
- name: c
  description: Bulk free additive concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.02
    max: 5
    ood_boundary: 1.5
    distribution: log_uniform
- name: theta
  description: Equilibrium adsorbed surface fraction.
  unit: '1'
  role: internal
- name: sigma_eff
  description: Liquid-gas interfacial tension.
  unit: N m^-1
  role: internal
- name: cos_contact
  description: Cosine of the liquid-side equilibrium contact angle.
  unit: '1'
  role: internal
- name: p_laplace
  description: Capillary pressure supporting the liquid column.
  unit: Pa
  role: internal
- name: height
  description: Column height from hydrostatic pressure balance.
  unit: m
  role: target
mechanism_probes:
- probe: sigma_eff
  description: Liquid-gas interfacial tension at the meniscus.
  answer: sigma_eff = sigma0*(Kc + c)/(Kc + 2*c)
- probe: cos_contact
  description: Cosine of the contact angle measured through the liquid.
  answer: cos_contact = (7*Kc + 5*c)/(10*(Kc + c))
