problem_name: Pressure-Driven Tube Flow - Case 02
phenomenological_formula: Q = 3 * π * dP * r1^3 * r2^3 / (8 * u * L * (r1^2 + r1 * r2 + r2^2))
problem_description: |
  A pressure difference drives fluid flow through a tube. The target is the steady volumetric flow rate.
variable_description:
  target: {name: Q, description: Steady volumetric flow rate, unit: m^3 s^-1}
  inputs:
    - {name: r1, description: Tube radius at location 1, unit: m, sampling: {min: 5.0e-5, max: 3.0e-4, ood_boundary: 1.0e-4, distribution: log_uniform}}
    - {name: r2, description: Tube radius at location 2, unit: m, sampling: {min: 5.0e-5, max: 3.0e-4, ood_boundary: 1.0e-4, distribution: log_uniform}}
    - {name: dP, description: Pressure difference between the tube ends, unit: kg m^-1 s^-2, sampling: {min: 1.0, max: 1.0e3, ood_boundary: 1.0e2, distribution: log_uniform}}
    - {name: u, description: Fluid dynamic viscosity, unit: kg m^-1 s^-1, sampling: {min: 1.0e-3, max: 1.0, ood_boundary: 1.0e-2, distribution: log_uniform}}
    - {name: L, description: Tube length, unit: m, sampling: {min: 0.05, max: 10.0, ood_boundary: 1.0, distribution: log_uniform}}
  intermediates:
    - {name: R0, description: Common viscous-resistance coefficient, unit: kg s^-1}
    - {name: G, description: Geometric resistance factor, unit: m^-4}
    - {name: R_h, description: Hydraulic resistance, unit: kg m^-4 s^-1}
  auxiliary_inputs: []
constants:
  - {name: π, description: Pi, value: 3.141592653589793, unit: 1 (dimensionless)}
mechanism:
  - {formula: R0 = 8 * u * L / π, formula_description: "Viscous prefactor in the local Hagen-Poiseuille resistance dR = 8 * u * dx / (π * r(x)^4)"}
  - {formula: G = (r1^2 + r1 * r2 + r2^2) / (3 * r1^3 * r2^3), formula_description: "Axial integral of inverse fourth-power radius for the linear taper r(x) between r1 and r2"}
  - {formula: R_h = R0 * G, formula_description: Series addition of local hydraulic resistances along the tube axis}
  - {formula: Q = dP / R_h, formula_description: "Hydraulic-resistance definition relating pressure drop, resistance, and volumetric flow rate"}
