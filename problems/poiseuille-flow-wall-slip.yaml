problem_name: Pressure-Driven Tube Flow - Case 04
phenomenological_formula: Q = π * r^4 * dP * (1 + 4 * ell_w / r) / (8 * u * L)
problem_description: |
  A pressure difference drives fluid flow through a tube. The target is the steady volumetric flow rate.
variable_description:
  target: {name: Q, description: Steady volumetric flow rate, unit: m^3 s^-1}
  inputs:
    - {name: r, description: Circular tube radius, unit: m, sampling: {min: 5.0e-5, max: 3.0e-4, ood_boundary: 1.0e-4, distribution: log_uniform}}
    - {name: dP, description: Pressure difference between the tube ends, unit: kg m^-1 s^-2, sampling: {min: 1.0, max: 1.0e3, ood_boundary: 1.0e2, distribution: log_uniform}}
    - {name: u, description: Fluid dynamic viscosity, unit: kg m^-1 s^-1, sampling: {min: 1.0e-3, max: 1.0, ood_boundary: 1.0e-2, distribution: log_uniform}}
    - {name: L, description: Tube length, unit: m, sampling: {min: 0.05, max: 10.0, ood_boundary: 1.0, distribution: log_uniform}}
    - {name: ell_w, description: Wall-interaction length scale, unit: m, sampling: {min: 1.0e-9, max: 5.0e-6, ood_boundary: 1.0e-7, distribution: log_uniform}}
  intermediates:
    - {name: G_p, description: Magnitude of the pressure gradient, unit: kg m^-2 s^-2}
    - {name: tau_w, description: Wall shear stress, unit: kg m^-1 s^-2}
    - {name: v_max, description: No-slip centerline velocity, unit: m s^-1}
    - {name: v_avg0, description: No-slip mean velocity, unit: m s^-1}
    - {name: S, description: Slip enhancement factor, unit: 1 (dimensionless)}
    - {name: v_avg, description: Cross-sectional mean velocity, unit: m s^-1}
    - {name: A, description: Tube cross-sectional area, unit: m^2}
  auxiliary_inputs: []
constants:
  - {name: π, description: Pi, value: 3.141592653589793, unit: 1 (dimensionless)}
mechanism:
  - {formula: G_p = dP / L, formula_description: Definition of the axial pressure-gradient magnitude over tube length}
  - {formula: tau_w = G_p * r / 2, formula_description: Axial momentum balance for steady fully developed circular-tube laminar flow}
  - {formula: v_max = tau_w * r / (2 * u), formula_description: "No-slip Stokes-flow velocity-profile solution from Newtonian viscosity and the wall boundary condition"}
  - {formula: v_avg0 = v_max / 2, formula_description: Cross-sectional average of the no-slip parabolic Poiseuille profile}
  - {formula: S = 1 + 4 * ell_w / r, formula_description: Flow-rate enhancement implied by the Navier slip boundary condition v_wall = ell_w * gamma_wall}
  - {formula: v_avg = v_avg0 * S, formula_description: Cross-sectional mean velocity after applying the Navier-slip boundary correction}
  - {formula: A = π * r^2, formula_description: Area of a circle}
  - {formula: Q = A * v_avg, formula_description: Definition of volumetric flow rate}
