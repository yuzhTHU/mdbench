problem_name: Poiseuille Flow - Wall Slip
phenomenological_formula: Q = π * r^4 * dP * (1 + 4 * l_s / r) / (8 * u * L)
problem_description: |
  A fluid undergoes laminar flow through a circular tube with a finite wall-slip length. This variant replaces the no-slip boundary condition with the Navier slip condition.
variable_description:
  target: {name: Q, description: Volumetric flow rate, unit: m^3 s^-1}
  inputs:
    - {name: r, description: Circular tube radius, unit: m, sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}}
    - {name: dP, description: Pressure difference between the tube ends, unit: kg m^-1 s^-2, sampling: {min: 1.0e2, max: 1.0e6, ood_boundary: 1.0e4, distribution: log_uniform}}
    - {name: u, description: Fluid dynamic viscosity, unit: kg m^-1 s^-1, sampling: {min: 1.0e-4, max: 1.0, ood_boundary: 1.0e-2, distribution: log_uniform}}
    - {name: L, description: Tube length, unit: m, sampling: {min: 0.01, max: 10.0, ood_boundary: 1.0, distribution: log_uniform}}
    - {name: l_s, description: Wall-slip length, unit: m, sampling: {min: 1.0e-8, max: 1.0e-4, ood_boundary: 1.0e-6, distribution: log_uniform}}
  intermediates:
    - {name: G_p, description: Magnitude of the pressure gradient, unit: kg m^-2 s^-2}
    - {name: tau_w, description: Wall shear stress, unit: kg m^-1 s^-2}
    - {name: v_max, description: No-slip centerline velocity, unit: m s^-1}
    - {name: v_avg0, description: No-slip mean velocity, unit: m s^-1}
    - {name: S, description: Slip enhancement factor, unit: 1 (dimensionless)}
    - {name: v_avg, description: Cross-sectional mean velocity, unit: m s^-1}
    - {name: A, description: Tube cross-sectional area, unit: m^2}
  auxiliary_inputs: []
constants:
  - {name: π, description: Pi, value: 3.141592653589793, unit: 1 (dimensionless)}
mechanism:
  - {formula: G_p = dP / L, formula_description: Axial pressure-gradient magnitude}
  - {formula: tau_w = G_p * r / 2, formula_description: Wall shear-stress balance in circular-tube laminar flow}
  - {formula: v_max = tau_w * r / (2 * u), formula_description: No-slip centerline velocity from Newton's law of viscosity}
  - {formula: v_avg0 = v_max / 2, formula_description: Mean velocity of the no-slip parabolic profile}
  - {formula: S = 1 + 4 * l_s / r, formula_description: Navier-slip flow enhancement factor replacing the no-slip boundary condition}
  - {formula: v_avg = v_avg0 * S, formula_description: Cross-sectional mean velocity corrected for wall slip}
  - {formula: A = π * r^2, formula_description: Area of a circle}
  - {formula: Q = A * v_avg, formula_description: Definition of volumetric flow rate}
