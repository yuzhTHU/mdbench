problem_name: Atwood Machine Acceleration - Light Pulley
phenomenological_formula: a = g * (m1 - m2) / (m1 + m2)
problem_description: Two masses are connected by a light inextensible string over a massless frictionless pulley.
variable_description:
  target:
    name: a
    description: Acceleration magnitude with m1 descending
    unit: m s^-2
  inputs:
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 1.0
      max: 20.0
      ood_boundary: 10.0
      distribution: uniform
  - name: m1
    description: Mass on the descending side
    unit: kg
    sampling:
      min: 0.2
      max: 10.0
      ood_boundary: 2.0
      distribution: log_uniform
  - name: m2
    description: Mass on the ascending side
    unit: kg
    sampling:
      min: 0.05
      max: 5.0
      ood_boundary: 1.0
      distribution: log_uniform
  intermediates:
  - name: F_drive
    description: Net gravitational driving force
    unit: kg m s^-2
  - name: M_eff
    description: Effective inertial mass of the translating bodies
    unit: kg
  auxiliary_inputs: []
constants: []
mechanism:
- formula: F_drive = (m1 - m2) * g
  formula_description: Net driving force after eliminating the string tension
- formula: M_eff = m1 + m2
  formula_description: Effective inertia from the two translating masses
- formula: a = F_drive / M_eff
  formula_description: Newton second law for the full system
