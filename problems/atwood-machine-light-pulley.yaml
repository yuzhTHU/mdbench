problem_name: Atwood Machine Acceleration - Light Pulley
phenomenological_formula: a = g * (m1 - m2) / (m1 + m2)
problem_description: Two masses are connected by a light inextensible string over a massless frictionless pulley.
variable_description:
  target:
    name: a
    description: Acceleration magnitude with m1 descending
    unit: m s^-2
  inputs:
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 1.0
      max: 20.0
      ood_boundary: 10.0
      distribution: uniform
  - name: m1
    description: Mass on the descending side
    unit: kg
    sampling:
      min: 0.2
      max: 10.0
      ood_boundary: 2.0
      distribution: log_uniform
  - name: m2
    description: Mass on the ascending side
    unit: kg
    sampling:
      min: 0.05
      max: 5.0
      ood_boundary: 1.0
      distribution: log_uniform
  intermediates:
  - name: W1
    description: Weight of the descending mass
    unit: kg m s^-2
  - name: W2
    description: Weight of the ascending mass
    unit: kg m s^-2
  - name: T1
    description: Tension acting on the descending mass
    unit: kg m s^-2
  - name: T2
    description: Tension acting on the ascending mass
    unit: kg m s^-2
  auxiliary_inputs: []
constants: []
mechanism:
- formula: W1 = m1 * g
  formula_description: Near-Earth gravitational force law for the descending mass
- formula: W2 = m2 * g
  formula_description: Near-Earth gravitational force law for the ascending mass
- formula: T1 = T2
  formula_description: Uniform-tension constraint for a massless string over a frictionless massless pulley
- formula: T1 = W1 - m1 * a
  formula_description: Newton's second law for the descending mass
- formula: T2 = W2 + m2 * a
  formula_description: Newton's second law for the ascending mass
