problem_name: Black Hole Event Horizon - Physical Variant
phenomenological_formula: r = (G * M / (0.5 * c**2 - u) + sqrt((G * M / (0.5 * c**2 - u))**2 - 4 * (J / (M * c))**2)) / 2
problem_description: A physics benchmark that relates the target quantity to experimentally specified parameters.
variable_description:
  target:
    name: r
    description: Characteristic radius
    unit: m
  inputs:
  - name: J
    description: Angular momentum
    unit: kg m^2 s^-1
    sampling:
      min: 1.0e+36
      max: 1.0e+41
      ood_boundary: 1.0e+39
      distribution: log_uniform
  - name: M
    description: Mass or molar mass
    unit: kg
    sampling:
      min: 1.0e+30
      max: 1.0e+33
      ood_boundary: 5.0e+31
      distribution: log_uniform
  - name: u
    description: Dynamic viscosity or specific dissipation
    unit: m^2 s^-2
    sampling:
      min: 0.0001
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  intermediates:
  - name: E
    description: Physical quantity E
    unit: m^2 s^-2
  - name: R
    description: Physical quantity R
    unit: m
  - name: a
    description: Dimensionless coefficient or length scale
    unit: m
  - name: D
    description: Discriminant
    unit: m^2
  auxiliary_inputs: []
constants:
- name: G
  description: Gravitational constant
  value: 6.6743e-11
  unit: m^3 kg^-1 s^-2
- name: c
  description: Speed of light in vacuum
  value: 299792458.0
  unit: m s^-1
mechanism:
- formula: E = 0.5 * c**2 - u
  formula_description: Physical relationship that determines E.
- formula: R = G * M / E
  formula_description: Physical relationship that determines R.
- formula: a = J / (M * c)
  formula_description: Physical relationship that determines a.
- formula: D = R**2 - 4 * a**2
  formula_description: Physical relationship that determines D.
- formula: r = (G * M / (0.5 * c**2 - u) + sqrt((G * M / (0.5 * c**2 - u))**2 - 4 * (J / (M * c))**2)) / 2
  formula_description: Physical relationship that determines r.
