problem_name: Bound-Particle Orbital Radius - Variant 1
phenomenological_formula: r = h / sqrt(m * k)
problem_description: An electron occupies a bound orbit around an atomic nucleus. The target is the characteristic orbital radius.
variable_description:
  target:
    name: r
    description: Characteristic orbital radius
    unit: m
  inputs:
  - name: k
    description: Orbital energy-scale parameter
    unit: kg m^2 s^-2
    sampling:
      min: 0.0001
      max: 0.01
      ood_boundary: 0.001
      distribution: log_uniform
  - name: m
    description: Mass
    unit: kg
    sampling:
      min: 1.0e-30
      max: 1.0e-18
      ood_boundary: 1.0e-24
      distribution: log_uniform
  intermediates:
  - name: n
    description: Principal quantum number
    unit: 1 (dimensionless)
  - name: L
    description: Quantized orbital angular momentum
    unit: kg m^2 s^-1
  - name: v
    description: Velocity
    unit: m s^-1
  auxiliary_inputs: []
constants:
- name: h
  description: Planck constant
  value: 6.62607015e-34
  unit: kg m^2 s^-1
mechanism:
- formula: n = 1
  formula_description: Bohr's ground-state postulate fixes the principal quantum number at n = 1.
- formula: L = n * h
  formula_description: Bohr angular-momentum quantization defines L as n times Planck's constant h.
- formula: v = sqrt(k / m)
  formula_description: The prescribed kinetic-energy scale k = m * v**2 defines the orbital speed v for mass m.
- formula: r = L / (m * v)
  formula_description: The classical angular-momentum definition L = m * v * r determines the circular-orbit radius r.
