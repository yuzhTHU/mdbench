problem_name: Bound-Particle Orbital Radius - Variant 1
phenomenological_formula: r = 4 * 3.141592653589793 * eps * hbar**2 / (m * q**2) * sqrt(1 - (q**2 / (4 * 3.141592653589793 * eps * hbar * c))**2)

problem_description: A charged particle occupies a bound circular orbit around a fixed center carrying an equal-magnitude, opposite-sign charge. The orbital motion reaches sufficiently high speed that relativistic effects cannot be neglected.

variable_description:
  target:
    name: r
    description: Orbital radius of the charged particle
    unit: m

  inputs:
  - name: m
    description: Mass of the charged particle
    unit: kg
    sampling: {min: 3.0e-31, max: 3.0e-30, ood_boundary: 1.5e-30, distribution: log_uniform}
  - name: q
    description: Magnitude of the particle and central charges
    unit: A s
    sampling: {min: 3.0e-19, max: 1.5e-18, ood_boundary: 1.1e-18, distribution: uniform}

  intermediates:
  - name: F_C
    description: Magnitude of the Coulomb attraction
    unit: kg m s^-2
  - name: F_in
    description: Net inward force required for circular motion
    unit: kg m s^-2
  - name: v
    description: Orbital speed of the charged particle
    unit: m s^-1
  - name: p
    description: Magnitude of the particle momentum
    unit: kg m s^-1
  - name: L
    description: Orbital angular momentum of the charged particle
    unit: kg m^2 s^-1

  auxiliary_inputs: []

constants:
- name: eps
  description: Vacuum permittivity
  value: 8.8541878128e-12
  unit: kg^-1 m^-3 s^4 A^2
- name: hbar
  description: Reduced Planck constant
  value: 1.054571817e-34
  unit: kg m^2 s^-1
- name: c
  description: Speed of light
  value: 299792458.0
  unit: m s^-1

mechanism:
- formula: F_C = q * q / (4 * 3.141592653589793 * eps * r**2)
  formula_description: Coulomb's law gives the attractive force between the two opposite charges.
- formula: p = m * v / sqrt(1 - v**2 / c**2)
  formula_description: Relativistic momentum of a particle moving at speed v.
- formula: F_in = p * v / r
  formula_description: In uniform circular motion, the momentum vector changes direction at angular rate v / r, requiring an inward force of magnitude p * v / r.
- formula: F_in = F_C
  formula_description: The Coulomb attraction supplies the required inward force.
- formula: L = p * r
  formula_description: For a circular orbit, the orbital angular momentum is the product of orbital radius and tangential momentum.
- formula: L = 1 * hbar
  formula_description: The lowest Bohr orbit has orbital angular momentum equal to one reduced Planck constant.

