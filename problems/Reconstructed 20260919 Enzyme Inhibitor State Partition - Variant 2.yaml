task_name: Reconstructed 20260919 Enzyme Inhibitor State Partition - Variant 2
task_description: Initial catalytic rates are measured while free substrate, free inhibitor and total enzyme concentrations
  are varied independently.
mutation: Allow inhibitor binding to substrate-bound enzyme.
mechanism_model:
- formula: Ks = 1.2
  role: constitutive/component relations
  description: 'Fixed batch parameter: substrate dissociation concentration; unit mol m^-3. Assumptions: Rapid-equilibrium
    binding; substrate and inhibitor reservoirs; product-free initial assay; only uninhibited ES catalyzes; inhibitor
    states inactive; enzyme conserved.'
- formula: Ki = .7
  role: constitutive/component relations
  description: 'Fixed batch parameter: first-inhibitor dissociation concentration; unit mol m^-3.'
- formula: k_cat = 3.5
  role: constitutive/component relations
  description: 'Fixed batch parameter: uninhibited catalytic turnover; unit s^-1.'
- formula: Kim = 2.4
  role: constitutive/component relations
  description: 'Fixed batch parameter: inhibitor dissociation concentration on ES; unit mol m^-3.'
- formula: wS = S_free/Ks
  role: constitutive/component relations
  description: ES-to-free-enzyme ratio.
- formula: wI = I_free/Ki
  role: constitutive/component relations
  description: EI-to-free-enzyme ratio.
- formula: wSI = wS*I_free/Kim
  role: constitutive/component relations
  description: ESI-to-free-enzyme ratio.
- formula: E_free = E_total/(1+wS+wI+wSI)
  role: conservation/balance relations
  description: Free enzyme concentration from total enzyme conservation.
- formula: EI = wI*E_free
  role: constitutive/component relations
  description: Singly inhibitor-bound enzyme concentration.
- formula: ESI = wSI*E_free
  role: constitutive/component relations
  description: Substrate-and-inhibitor-bound inactive enzyme concentration.
- formula: rate = k_cat*(E_total-E_free-EI-ESI)
  role: conservation/balance relations
  description: Catalytic rate from the remaining active ES pool by enzyme conservation.
phenomenal_model: rate = E_total*Ki*Kim*S_free*k_cat/(I_free*Ki*S_free + I_free*Kim*Ks + Ki*Kim*Ks + Ki*Kim*S_free)
variables:
- name: S_free
  description: Free substrate concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.03
    max: 7
    ood_boundary: 2
    distribution: log_uniform
- name: I_free
  description: Free inhibitor concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.01
    max: 5
    ood_boundary: 1
    distribution: log_uniform
- name: E_total
  description: Total enzyme concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 1.0e-06
    max: 0.0001
    ood_boundary: 2.0e-05
    distribution: log_uniform
- name: wS
  description: ES-to-free-enzyme ratio.
  unit: '1'
  role: internal
- name: wI
  description: EI-to-free-enzyme ratio.
  unit: '1'
  role: internal
- name: wSI
  description: ESI-to-free-enzyme ratio.
  unit: '1'
  role: internal
- name: E_free
  description: Free enzyme concentration from total enzyme conservation.
  unit: mol m^-3
  role: internal
- name: EI
  description: Singly inhibitor-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: ESI
  description: Substrate-and-inhibitor-bound inactive enzyme concentration.
  unit: mol m^-3
  role: internal
- name: rate
  description: Catalytic rate from the remaining active ES pool by enzyme conservation.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: EI
  description: Concentration of singly inhibitor-bound enzyme without substrate.
  answer: EI = E_total*I_free*Kim*Ks/(I_free*Ki*S_free + I_free*Kim*Ks + Ki*Kim*Ks + Ki*Kim*S_free)
- probe: ESI
  description: Concentration of inactive enzyme carrying both substrate and inhibitor.
  answer: ESI = E_total*I_free*Ki*S_free/(I_free*Ki*S_free + I_free*Kim*Ks + Ki*Kim*Ks + Ki*Kim*S_free)
