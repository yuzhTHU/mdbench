task_name: Reconstructed 20260919 Receptor Trafficking Occupancy - Variant 2
task_description: Steady cell-associated ligand concentrations are measured against total receptor abundance, free
  ligand and extracellular composition.
mutation: Allow extracellular decoy competition.
mechanism_model:
- formula: k_on = 2
  role: constitutive/component relations
  description: 'Fixed batch parameter: surface ligand association; unit m^3 mol^-1 s^-1. Assumptions: Stationary
    binding and trafficking; ligand reservoir; internalized occupied receptor returns ligand-free; no receptor synthesis
    or degradation; measured ligand includes surface-bound and internalized pools.'
- formula: k_off = .8
  role: constitutive/component relations
  description: 'Fixed batch parameter: surface ligand dissociation; unit s^-1.'
- formula: k_int0 = .4
  role: constitutive/component relations
  description: 'Fixed batch parameter: basal occupied-receptor internalization; unit s^-1.'
- formula: k_recycle = .6
  role: constitutive/component relations
  description: 'Fixed batch parameter: intracellular receptor recycling with ligand loss; unit s^-1.'
- formula: Kd = .5
  role: constitutive/component relations
  description: 'Fixed batch parameter: decoy dissociation scale; unit mol m^-3.'
- formula: k_internal = k_int0
  role: constitutive/component relations
  description: Occupied-receptor internalization frequency.
- formula: w_surface = k_on*L_free/(k_off+k_internal)
  role: conservation/balance relations
  description: Surface occupied-to-free receptor ratio from kinetic balance.
- formula: w_inside = w_surface*k_internal/k_recycle
  role: conservation/balance relations
  description: Intracellular occupied-to-free surface receptor ratio.
- formula: w_decoy = D_free/Kd
  role: constitutive/component relations
  description: Surface decoy-bound-to-free receptor ratio.
- formula: R_free = R_total/(1+w_surface+w_inside+w_decoy)
  role: conservation/balance relations
  description: Free surface receptor concentration from total receptor conservation.
- formula: RL_surface = w_surface*R_free
  role: constitutive/component relations
  description: Ligand-bound surface receptor concentration.
- formula: RL_inside = k_internal*RL_surface/k_recycle
  role: conservation/balance relations
  description: Internalized ligand-bound receptor concentration.
- formula: L_associated = RL_surface+RL_inside
  role: conservation/balance relations
  description: Total cell-associated ligand concentration.
phenomenal_model: L_associated = Kd*L_free*R_total*k_on*(k_int0 + k_recycle)/(D_free*k_int0*k_recycle + D_free*k_off*k_recycle
  + Kd*L_free*k_int0*k_on + Kd*L_free*k_on*k_recycle + Kd*k_int0*k_recycle + Kd*k_off*k_recycle)
variables:
- name: R_total
  description: Total receptor concentration across surface and intracellular pools.
  unit: mol m^-3
  role: input
  sampling:
    min: 1.0e-07
    max: 2.0e-05
    ood_boundary: 3.0e-06
    distribution: log_uniform
- name: L_free
  description: Free extracellular ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.005
    max: 2
    ood_boundary: 0.4
    distribution: log_uniform
- name: D_free
  description: Free extracellular decoy concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.01
    max: 2
    ood_boundary: 0.5
    distribution: log_uniform
- name: k_internal
  description: Occupied-receptor internalization frequency.
  unit: s^-1
  role: internal
- name: w_surface
  description: Surface occupied-to-free receptor ratio from kinetic balance.
  unit: '1'
  role: internal
- name: w_inside
  description: Intracellular occupied-to-free surface receptor ratio.
  unit: '1'
  role: internal
- name: w_decoy
  description: Surface decoy-bound-to-free receptor ratio.
  unit: '1'
  role: internal
- name: R_free
  description: Free surface receptor concentration from total receptor conservation.
  unit: mol m^-3
  role: internal
- name: RL_surface
  description: Ligand-bound surface receptor concentration.
  unit: mol m^-3
  role: internal
- name: RL_inside
  description: Internalized ligand-bound receptor concentration.
  unit: mol m^-3
  role: internal
- name: L_associated
  description: Total cell-associated ligand concentration.
  unit: mol m^-3
  role: target
mechanism_probes:
- probe: RL_inside
  description: Concentration of internalized ligand-bound receptor, excluding the surface-bound pool.
  answer: RL_inside = Kd*L_free*R_total*k_int0*k_on/(D_free*k_int0*k_recycle + D_free*k_off*k_recycle + Kd*L_free*k_int0*k_on
    + Kd*L_free*k_on*k_recycle + Kd*k_int0*k_recycle + Kd*k_off*k_recycle)
- probe: R_free
  description: Concentration of free receptors at the cell surface.
  answer: R_free = Kd*R_total*k_recycle*(k_int0 + k_off)/(D_free*k_int0*k_recycle + D_free*k_off*k_recycle + Kd*L_free*k_int0*k_on
    + Kd*L_free*k_on*k_recycle + Kd*k_int0*k_recycle + Kd*k_off*k_recycle)
