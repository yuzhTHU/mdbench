problem_name: Particle Settling Response - Variant 2
phenomenological_formula: v = sqrt(8 * (rho_1 - rho_2) * g * r / (3 * rho_2 * C))
problem_description: A particle settles through a fluid. The target is the specified settling observable.
variable_description:
  target:
    name: v
    description: Velocity
    unit: m s^-1
  inputs:
  - name: C
    description: Dimensionless particle-fluid interaction coefficient
    unit: 1 (dimensionless)
    sampling:
      min: 0.1
      max: 10.0
      ood_boundary: 1.0
      distribution: uniform
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 9.7
      max: 9.9
      ood_boundary: 9.81
      distribution: uniform
  - name: r
    description: Sphere radius
    unit: m
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  - name: rho_1
    description: Particle density
    unit: kg m^-3
    sampling:
      min: 1200.0
      max: 8000.0
      ood_boundary: 3000.0
      distribution: log_uniform
  - name: rho_2
    description: Fluid density
    unit: kg m^-3
    sampling:
      min: 1.0
      max: 1000.0
      ood_boundary: 100.0
      distribution: log_uniform
  intermediates:
  - name: V
    description: Volume
    unit: m^3
  - name: A
    description: Projected cross-sectional area of the sphere
    unit: m^2
  - name: m_p
    description: Mass of the spherical particle
    unit: kg
  - name: F_g
    description: Gravitational weight of the particle
    unit: kg m s^-2
  - name: F_b
    description: Archimedean buoyant force
    unit: kg m s^-2
  - name: F_d
    description: Quadratic drag force required at terminal balance
    unit: kg m s^-2
  auxiliary_inputs: []
constants:
- name: pi
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: V = 4 * pi * r**3 / 3
  formula_description: The sphere-volume definition gives particle volume V from radius r.
- formula: A = pi * r**2
  formula_description: The projected-area definition gives the sphere's cross-sectional area A.
- formula: m_p = rho_1 * V
  formula_description: The mass-density definition gives particle mass m_p from density rho_1 and volume V.
- formula: F_g = m_p * g
  formula_description: Newtonian gravity defines particle weight F_g.
- formula: F_b = rho_2 * V * g
  formula_description: Archimedes' principle defines buoyant force F_b as the weight of displaced fluid.
- formula: F_d = F_g - F_b
  formula_description: Terminal force balance defines required drag force F_d as weight F_g minus buoyancy F_b.
- formula: v = sqrt(2 * F_d / (rho_2 * C * A))
  formula_description: The quadratic drag law F_d = rho_2 * C * A * v**2 / 2 determines terminal speed v from the prior drag force F_d.
