problem_name: Inclined Block Displacement - Variant 3
phenomenological_formula: x = (g + a0) * (sin(theta) - mu * cos(theta)) * t^2 / 2
problem_description: A block is released on an inclined surface. The target is its displacement along the incline after a specified time.
variable_description:
  target:
    name: x
    description: Displacement down the incline
    unit: m
  inputs:
  - name: t
    description: Time after release from rest
    unit: s
    sampling:
      min: 0.01
      max: 20.0
      ood_boundary: 5.0
      distribution: log_uniform
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 1.0
      max: 20.0
      ood_boundary: 10.0
      distribution: uniform
  - name: theta
    description: Incline angle
    unit: 1 (dimensionless)
    sampling:
      min: 0.02
      max: 1.2
      ood_boundary: 0.5
      distribution: uniform
  - name: mu
    description: Dimensionless surface-interaction coefficient
    unit: 1 (dimensionless)
    sampling:
      min: 0.01
      max: 0.8
      ood_boundary: 0.3
      distribution: uniform
  - name: a0
    description: Upward frame acceleration
    unit: m s^-2
    sampling:
      min: 0.1
      max: 10.0
      ood_boundary: 2.0
      distribution: uniform
  intermediates:
  - name: g_eff
    description: Effective gravitational acceleration
    unit: m s^-2
  - name: F_parallel
    description: Down-slope effective gravity component
    unit: kg m s^-2
  - name: N
    description: Effective normal reaction force
    unit: kg m s^-2
  - name: F_f
    description: Kinetic friction force
    unit: kg m s^-2
  - name: F_net
    description: Net down-slope force
    unit: kg m s^-2
  - name: a
    description: Down-slope acceleration
    unit: m s^-2
  auxiliary_inputs:
  - name: m
    description: Block mass
    unit: kg
    sampling:
      min: 0.01
      max: 10.0
      ood_boundary: 1.0
      distribution: log_uniform
constants: []
mechanism:
- formula: g_eff = g + a0
  formula_description: Effective gravity in the vertically accelerating frame
- formula: F_parallel = m * g_eff * sin(theta)
  formula_description: Down-slope component of effective gravity
- formula: N = m * g_eff * cos(theta)
  formula_description: Effective normal force
- formula: F_f = mu * N
  formula_description: Coulomb kinetic friction
- formula: F_net = F_parallel - F_f
  formula_description: Net down-slope force
- formula: a = F_net / m
  formula_description: Newton second law along the incline
- formula: x = a * t^2 / 2
  formula_description: Constant-acceleration displacement from rest
