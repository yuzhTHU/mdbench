# 问题名称
problem_name: 毛细上升 - 表面活性剂改版

# 唯象方程
phenomenological_formula: h = 2 * (gamma0 - alpha * C_s) * cos(theta) / (rho * g *
  r)

# 问题背景
problem_description: |
  这是一个含表面活性剂的液体在细圆管中毛细上升的问题。相对于原版，本改版只将表面张力积木改为随表面活性剂浓度线性降低。

# 变量描述
# 变量列表
variable_description:
  target:
    name: h
    description: 毛细上升高度
    unit: m
  inputs:
    - name: gamma0
      description: 无表面活性剂时的表面张力
      unit: kg s^-2
      sampling: {min: 0.05, max: 0.15, ood_boundary: 0.1, distribution: uniform}
    - name: alpha
      description: 表面张力降低系数
      unit: kg m^3 mol^-1 s^-2
      sampling: {min: 1.0e-4, max: 5.0e-3, ood_boundary: 1.0e-3, distribution: log_uniform}
    - name: C_s
      description: 表面活性剂浓度
      unit: mol m^-3
      sampling: {min: 0.0, max: 10.0, ood_boundary: 5.0, distribution: uniform}
    - name: theta
      description: 接触角
      unit: 1 (dimensionless)
      sampling: {min: 0.0, max: 1.3, ood_boundary: 0.8, distribution: uniform}
    - name: rho
      description: 液体密度
      unit: kg m^-3
      sampling: {min: 5.0e2, max: 1.5e3, ood_boundary: 1.0e3, distribution: uniform}
    - name: g
      description: 重力加速度
      unit: m s^-2
      sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}
    - name: r
      description: 毛细管半径
      unit: m
      sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}

  intermediates:
    - name: gamma
      description: 有效表面张力
      unit: kg s^-2
    - name: C
      description: 液体接触线长度
      unit: m
    - name: A
      description: 液柱截面积
      unit: m^2
    - name: F_s
      description: 向上的表面张力合力
      unit: kg m s^-2
    - name: W_h
      description: 单位高度液柱重量
      unit: kg s^-2

    # 常数描述

  auxiliary_inputs: []
constants:
- name: π
  description: 圆周率
  value: 3.141592653589793
  unit: 1 (dimensionless)

# 机制
mechanism:
- formula: gamma = gamma0 - alpha * C_s
  formula_description: 表面活性剂降低表面张力公式；替换原版常数表面张力积木
- formula: C = 2 * π * r
  formula_description: 圆周长公式
- formula: A = π * r^2
  formula_description: 圆截面积公式
- formula: F_s = C * gamma * cos(theta)
  formula_description: 表面张力竖直分量公式
- formula: W_h = rho * A * g
  formula_description: 单位高度液柱重量公式
- formula: h = F_s / W_h
  formula_description: 表面张力与液柱重量平衡
