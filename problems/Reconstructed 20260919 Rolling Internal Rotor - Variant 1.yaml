task_name: Reconstructed 20260919 Rolling Internal Rotor - Variant 1
task_description: Down-slope accelerations of round mechanical bodies are measured while radius, total mass and
  inclination are varied.
mutation: Change the shell mass distribution with radius.
mechanism_model:
- formula: g0 = 9.81
  role: constitutive/component relations
  description: 'Fixed batch parameter: gravitational acceleration; unit m s^-2. Assumptions: Rigid rolling without
    contact slip; sufficient static friction; internal ideal gears; no dissipative torque; fixed rotor inertia;
    total mass includes the rotor.'
- formula: L0 = .1
  role: constitutive/component relations
  description: 'Fixed batch parameter: construction length scale; unit m.'
- formula: J0 = .00002
  role: constitutive/component relations
  description: 'Fixed batch parameter: internal rotor moment of inertia; unit kg m^2.'
- formula: I_shell = .35*mass*R**2*(1+R/(3*L0))
  role: constitutive/component relations
  description: Moment of inertia of the shell and attached non-rotor components.
- formula: gear = 1
  role: kinematic/geometric constraints
  description: Internal rotor-to-shell angular-speed ratio.
- formula: drive = mass*g0*R*sin(angle)
  role: governing/dynamical laws
  description: Generalized driving torque for rolling displacement.
- formula: alpha_rotor = gear*drive/(mass*R**2+I_shell+J0*gear**2)
  role: conservation/balance relations
  description: Internal rotor angular acceleration from coupled translation and rotation.
- formula: tau_rotor = J0*gear*alpha_rotor
  role: governing/dynamical laws
  description: Torque exerted on the shell by the inertial rotor load, opposing acceleration.
- formula: accel = R*(drive-tau_rotor)/(mass*R**2+I_shell)
  role: conservation/balance relations
  description: Down-slope center-of-mass acceleration under the no-slip constraint.
phenomenal_model: accel = 60*L0*R**2*g0*mass*sin(angle)/(60*J0*L0 + 81*L0*R**2*mass + 7*R**3*mass)
variables:
- name: R
  description: External rolling radius.
  unit: m
  role: input
  sampling:
    min: 0.04
    max: 0.2
    ood_boundary: 0.1
    distribution: uniform
- name: mass
  description: Total translating mass of the body.
  unit: kg
  role: input
  sampling:
    min: 0.3
    max: 3
    ood_boundary: 1
    distribution: uniform
- name: angle
  description: Inclination angle in radians.
  unit: '1'
  role: input
  sampling:
    min: 0.05
    max: 0.5
    ood_boundary: 0.25
    distribution: uniform
- name: I_shell
  description: Moment of inertia of the shell and attached non-rotor components.
  unit: kg m^2
  role: internal
- name: gear
  description: Internal rotor-to-shell angular-speed ratio.
  unit: '1'
  role: internal
- name: drive
  description: Generalized driving torque for rolling displacement.
  unit: N m
  role: internal
- name: alpha_rotor
  description: Internal rotor angular acceleration from coupled translation and rotation.
  unit: s^-2
  role: internal
- name: tau_rotor
  description: Torque exerted on the shell by the inertial rotor load, opposing acceleration.
  unit: N m
  role: internal
- name: accel
  description: Down-slope center-of-mass acceleration under the no-slip constraint.
  unit: m s^-2
  role: target
mechanism_probes:
- probe: tau_rotor
  description: Magnitude of internal load torque transmitted from the accelerating rotor to the rolling shell.
  answer: tau_rotor = 60*J0*L0*R*g0*mass*sin(angle)/(60*J0*L0 + 81*L0*R**2*mass + 7*R**3*mass)
- probe: I_shell
  description: Moment of inertia of shell and attached components, excluding the separately rotating rotor.
  answer: I_shell = 7*R**2*mass*(3*L0 + R)/(60*L0)
