# 问题名称
problem_name: 泊肃叶圆管流量 - 幂律流体改版

# 唯象方程
phenomenological_formula: Q = π * r^3 * n * gamma_ref / (3 * n + 1) * (dP * r / (2
  * K * L))^(1 / n)

# 问题背景
problem_description: |
  这是一个幂律非牛顿流体在圆管内层流流动的问题。相对于原版，本改版只将牛顿黏性本构积木改为幂律流体本构。

# 变量描述
# 变量列表
variable_description:
  target:
    name: Q
    description: 体积流量
    unit: m^3 s^-1
  inputs:
    - name: r
      description: 圆管半径
      unit: m
      sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}
    - name: dP
      description: 管两端压差
      unit: kg m^-1 s^-2
      sampling: {min: 1.0e2, max: 1.0e6, ood_boundary: 1.0e4, distribution: log_uniform}
    - name: K
      description: 幂律本构中的参考剪切应力
      unit: kg m^-1 s^-2
      sampling: {min: 1.0e-3, max: 10.0, ood_boundary: 0.1, distribution: log_uniform}
    - name: L
      description: 圆管长度
      unit: m
      sampling: {min: 0.01, max: 10.0, ood_boundary: 1.0, distribution: log_uniform}
    - name: n
      description: 幂律指数
      unit: 1 (dimensionless)
      sampling: {min: 0.3, max: 1.5, ood_boundary: 1.0, distribution: uniform}

  intermediates:
    - name: G_p
      description: 压强梯度大小
      unit: kg m^-2 s^-2
    - name: tau_w
      description: 壁面剪应力
      unit: kg m^-1 s^-2
    - name: gamma_w
      description: 壁面剪切率
      unit: s^-1
    - name: v_avg
      description: 截面平均速度
      unit: m s^-1
    - name: A
      description: 圆管截面积
      unit: m^2

    # 常数描述

  auxiliary_inputs: []
constants:
- name: π
  description: 圆周率
  value: 3.141592653589793
  unit: 1 (dimensionless)
- name: gamma_ref
  description: 幂律本构中的参考剪切率
  value: 1.0
  unit: s^-1

# 机制
mechanism:
- formula: G_p = dP / L
  formula_description: 轴向压强梯度公式
- formula: tau_w = G_p * r / 2
  formula_description: 圆管层流中的壁面剪应力平衡
- formula: gamma_w = gamma_ref * (tau_w / K)^(1 / n)
  formula_description: 以参考剪切应力和参考剪切率表示的幂律流体本构关系；替换原版牛顿黏性本构积木
- formula: v_avg = n * r * gamma_w / (3 * n + 1)
  formula_description: 幂律流体圆管速度剖面的截面平均速度
- formula: A = π * r^2
  formula_description: 圆截面积公式
- formula: Q = A * v_avg
  formula_description: 体积流量定义
