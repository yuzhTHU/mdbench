task_name: Reconstructed 20260919 Promoter Initiation State Ensemble - Variant 2
task_description: Mean transcription-initiation rates per promoter are measured against free activator and polymerase
  concentrations.
mutation: Add a productive preinitiation isomer.
mechanism_model:
- formula: Ka = 2.5
  role: constitutive/component relations
  description: 'Fixed batch parameter: activator association constant; unit m^3 mol^-1. Assumptions: Rapid promoter-state
    equilibration compared with initiation; independent free protein reservoirs; activator and polymerase may co-occupy;
    inaccessible and preinitiation states included in normalization.'
- formula: Kp = 4
  role: constitutive/component relations
  description: 'Fixed batch parameter: polymerase association constant; unit m^3 mol^-1.'
- formula: omega = 3
  role: constitutive/component relations
  description: 'Fixed batch parameter: activator-polymerase recruitment factor; unit 1.'
- formula: k_basal = .02
  role: constitutive/component relations
  description: 'Fixed batch parameter: basal initiation frequency; unit s^-1.'
- formula: k_active = .12
  role: constitutive/component relations
  description: 'Fixed batch parameter: activated initiation frequency; unit s^-1.'
- formula: Kiso = .7
  role: constitutive/component relations
  description: 'Fixed batch parameter: productive preinitiation-to-AP statistical weight ratio; unit 1.'
- formula: wA = Ka*A_free
  role: constitutive/component relations
  description: Activator-only to empty-promoter statistical weight.
- formula: wP = Kp*P_free
  role: constitutive/component relations
  description: Polymerase-only to empty-promoter statistical weight.
- formula: wAP = omega*wA*wP
  role: constitutive/component relations
  description: Activator-polymerase to empty-promoter statistical weight.
- formula: wIso = Kiso*wAP
  role: constitutive/component relations
  description: Productive preinitiation-isomer weight.
- formula: Z = 1+wA+wP+wAP+wIso
  role: conservation/balance relations
  description: Normalization from conservation of promoter-state probability.
- formula: P_poly = wP/Z
  role: constitutive/component relations
  description: Probability of polymerase-only promoter occupancy.
- formula: P_AP = wAP/Z
  role: constitutive/component relations
  description: Probability of the activator-polymerase promoter state.
- formula: P_iso = Kiso*P_AP
  role: constitutive/component relations
  description: Probability of productive preinitiation isomer.
- formula: rate = k_basal*P_poly+k_active*P_iso
  role: governing/dynamical laws
  description: Mean initiation rate averaged over the productive promoter states.
phenomenal_model: rate = Kp*P_free*(A_free*Ka*Kiso*k_active*omega + k_basal)/(A_free*Ka*Kiso*Kp*P_free*omega + A_free*Ka*Kp*P_free*omega
  + A_free*Ka + Kp*P_free + 1)
variables:
- name: A_free
  description: Free transcriptional activator concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.005
    max: 1.5
    ood_boundary: 0.3
    distribution: log_uniform
- name: P_free
  description: Free polymerase concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.003
    max: 1
    ood_boundary: 0.2
    distribution: log_uniform
- name: wA
  description: Activator-only to empty-promoter statistical weight.
  unit: '1'
  role: internal
- name: wP
  description: Polymerase-only to empty-promoter statistical weight.
  unit: '1'
  role: internal
- name: wAP
  description: Activator-polymerase to empty-promoter statistical weight.
  unit: '1'
  role: internal
- name: wIso
  description: Productive preinitiation-isomer weight.
  unit: '1'
  role: internal
- name: Z
  description: Normalization from conservation of promoter-state probability.
  unit: '1'
  role: internal
- name: P_poly
  description: Probability of polymerase-only promoter occupancy.
  unit: '1'
  role: internal
- name: P_AP
  description: Probability of the activator-polymerase promoter state.
  unit: '1'
  role: internal
- name: P_iso
  description: Probability of productive preinitiation isomer.
  unit: '1'
  role: internal
- name: rate
  description: Mean initiation rate averaged over the productive promoter states.
  unit: s^-1
  role: target
mechanism_probes:
- probe: P_poly
  description: Probability that the promoter carries polymerase without activator.
  answer: P_poly = Kp*P_free/(A_free*Ka*Kiso*Kp*P_free*omega + A_free*Ka*Kp*P_free*omega + A_free*Ka + Kp*P_free
    + 1)
- probe: P_AP
  description: Probability of the activator-polymerase state before any additional preinitiation isomerization.
  answer: P_AP = A_free*Ka*Kp*P_free*omega/(A_free*Ka*Kiso*Kp*P_free*omega + A_free*Ka*Kp*P_free*omega + A_free*Ka
    + Kp*P_free + 1)
