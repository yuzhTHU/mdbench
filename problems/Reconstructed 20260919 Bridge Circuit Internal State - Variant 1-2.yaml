task_name: Reconstructed 20260919 Bridge Circuit Internal State - Variant 1-2
task_description: Terminal currents of an electrical device are recorded under applied voltage and independently
  controlled illumination and temperature.
mutation: Make the bridge conductance temperature dependent. Make an arm conductance light dependent.
mechanism_model:
- formula: g1 = .01
  role: constitutive/component relations
  description: 'Fixed batch parameter: upper-left conductance; unit ohm^-1. Assumptions: Steady passive five-resistor
    bridge; ideal voltage source; no capacitive current; positive conductances; synthetic constitutive dependencies;
    reference ground at return terminal.'
- formula: g3 = .004
  role: constitutive/component relations
  description: 'Fixed batch parameter: upper-right conductance; unit ohm^-1.'
- formula: g4 = .003
  role: constitutive/component relations
  description: 'Fixed batch parameter: lower-right conductance; unit ohm^-1.'
- formula: g20 = .005
  role: constitutive/component relations
  description: 'Fixed batch parameter: dark lower-left conductance; unit ohm^-1.'
- formula: gb0 = .002
  role: constitutive/component relations
  description: 'Fixed batch parameter: bridge conductance scale; unit ohm^-1.'
- formula: T0 = 300
  role: constitutive/component relations
  description: 'Fixed batch parameter: temperature scale; unit K.'
- formula: P0 = 100
  role: constitutive/component relations
  description: 'Fixed batch parameter: illumination scale; unit W m^-2.'
- formula: g2 = g20*(1+light/P0)
  role: constitutive/component relations
  description: Lower-left arm conductance.
- formula: gb = gb0*(temp/T0)**2
  role: constitutive/component relations
  description: Bridge-link conductance.
- formula: detG = (g1+g2+gb)*(g3+g4+gb)-gb**2
  role: conservation/balance relations
  description: Determinant of the two-node Kirchhoff conductance matrix.
- formula: U_left = V_source*(g1*(g3+g4+gb)+gb*g3)/detG
  role: conservation/balance relations
  description: Left internal-node potential relative to return.
- formula: U_right = V_source*(g3*(g1+g2+gb)+gb*g1)/detG
  role: conservation/balance relations
  description: Right internal-node potential relative to return.
- formula: I_bridge = gb*(U_left-U_right)
  role: constitutive/component relations
  description: Signed current through bridge link from left node to right node.
- formula: I_terminal = g1*(V_source-U_left)+g4*U_right-I_bridge
  role: conservation/balance relations
  description: Terminal current using upper-left branch current and right-node current conservation.
phenomenal_model: I_terminal = V_source*(P0*T0**2*g1*g20*g3 + P0*T0**2*g1*g20*g4 + P0*T0**2*g1*g3*g4 + P0*T0**2*g20*g3*g4
  + P0*g1*g20*gb0*temp**2 + P0*g1*g4*gb0*temp**2 + P0*g20*g3*gb0*temp**2 + P0*g3*g4*gb0*temp**2 + T0**2*g1*g20*g3*light
  + T0**2*g1*g20*g4*light + T0**2*g20*g3*g4*light + g1*g20*gb0*light*temp**2 + g20*g3*gb0*light*temp**2)/(P0*T0**2*g1*g3
  + P0*T0**2*g1*g4 + P0*T0**2*g20*g3 + P0*T0**2*g20*g4 + P0*g1*gb0*temp**2 + P0*g20*gb0*temp**2 + P0*g3*gb0*temp**2
  + P0*g4*gb0*temp**2 + T0**2*g20*g3*light + T0**2*g20*g4*light + g20*gb0*light*temp**2)
variables:
- name: V_source
  description: Applied source-to-return terminal voltage.
  unit: V
  role: input
  sampling:
    min: 0.1
    max: 5
    ood_boundary: 2
    distribution: uniform
- name: temp
  description: Uniform measured device temperature.
  unit: K
  role: input
  sampling:
    min: 280
    max: 370
    ood_boundary: 320
    distribution: uniform
- name: light
  description: Incident optical power density.
  unit: W m^-2
  role: input
  sampling:
    min: 1
    max: 500
    ood_boundary: 100
    distribution: log_uniform
- name: g2
  description: Lower-left arm conductance.
  unit: ohm^-1
  role: internal
- name: gb
  description: Bridge-link conductance.
  unit: ohm^-1
  role: internal
- name: detG
  description: Determinant of the two-node Kirchhoff conductance matrix.
  unit: ohm^-2
  role: internal
- name: U_left
  description: Left internal-node potential relative to return.
  unit: V
  role: internal
- name: U_right
  description: Right internal-node potential relative to return.
  unit: V
  role: internal
- name: I_bridge
  description: Signed current through bridge link from left node to right node.
  unit: A
  role: internal
- name: I_terminal
  description: Terminal current using upper-left branch current and right-node current conservation.
  unit: A
  role: target
mechanism_probes:
- probe: I_bridge
  description: Signed current in the internal bridge link, positive from the left node to the right node.
  answer: I_bridge = V_source*gb0*temp**2*(P0*g1*g4 - P0*g20*g3 - g20*g3*light)/(P0*T0**2*g1*g3 + P0*T0**2*g1*g4
    + P0*T0**2*g20*g3 + P0*T0**2*g20*g4 + P0*g1*gb0*temp**2 + P0*g20*gb0*temp**2 + P0*g3*gb0*temp**2 + P0*g4*gb0*temp**2
    + T0**2*g20*g3*light + T0**2*g20*g4*light + g20*gb0*light*temp**2)
- probe: U_left
  description: Potential of the left internal node relative to the return terminal.
  answer: U_left = P0*V_source*(T0**2*g1*g3 + T0**2*g1*g4 + g1*gb0*temp**2 + g3*gb0*temp**2)/(P0*T0**2*g1*g3 + P0*T0**2*g1*g4
    + P0*T0**2*g20*g3 + P0*T0**2*g20*g4 + P0*g1*gb0*temp**2 + P0*g20*gb0*temp**2 + P0*g3*gb0*temp**2 + P0*g4*gb0*temp**2
    + T0**2*g20*g3*light + T0**2*g20*g4*light + g20*gb0*light*temp**2)
