problem_name: Binary Radial Velocity Semi-amplitude - Physical Variant
phenomenological_formula: y = (2 * sqrt(2) / pi) * (2 * pi * G * M_2**3 / (P * (M_1 + M_2)**2))**(1/3) * sin(i)
problem_description: A physics benchmark that relates the target quantity to experimentally specified parameters.
variable_description:
  target:
    name: y
    description: Physical quantity y
    unit: m s^-1
  inputs:
  - name: M_1
    description: Physical quantity M_1
    unit: kg
    sampling:
      min: 2.0e+29
      max: 2.0e+31
      ood_boundary: 2.0e+30
      distribution: log_uniform
  - name: M_2
    description: Physical quantity M_2
    unit: kg
    sampling:
      min: 2.0e+28
      max: 2.0e+30
      ood_boundary: 2.0e+29
      distribution: log_uniform
  - name: P
    description: Orbital period or pressure
    unit: s
    sampling:
      min: 86400.0
      max: 31540000.0
      ood_boundary: 2592000.0
      distribution: log_uniform
  - name: i
    description: Orbital inclination
    unit: 1 (dimensionless)
    sampling:
      min: 0.05
      max: 1.5
      ood_boundary: 0.8
      distribution: uniform
  intermediates:
  - name: M
    description: Mass or molar mass
    unit: kg
  - name: a3
    description: Physical quantity a3
    unit: m^3
  - name: a
    description: Dimensionless coefficient or length scale
    unit: m
  - name: r
    description: Characteristic radius
    unit: m
  - name: l
    description: Physical quantity l
    unit: m
  - name: C
    description: Model coefficient
    unit: m
  - name: v
    description: Velocity
    unit: m s^-1
  auxiliary_inputs: []
constants:
- name: G
  description: Gravitational constant
  value: 6.6743e-11
  unit: m^3 kg^-1 s^-2
- name: pi
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: M = M_1 + M_2
  formula_description: Physical relationship that determines M.
- formula: a3 = G * M * P**2 / (4 * pi**2)
  formula_description: Physical relationship that determines a3.
- formula: a = a3**(1/3)
  formula_description: Physical relationship that determines a.
- formula: r = a * M_2 / M
  formula_description: Physical relationship that determines r.
- formula: l = sqrt(2) * r
  formula_description: Physical relationship that determines l.
- formula: C = 4 * l
  formula_description: Physical relationship that determines C.
- formula: v = C / P
  formula_description: Physical relationship that determines v.
- formula: y = v * sin(i)
  formula_description: Physical relationship that determines y.
