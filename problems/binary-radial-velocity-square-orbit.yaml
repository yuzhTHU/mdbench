problem_name: Binary Radial Velocity Semi-amplitude - Square Orbit
phenomenological_formula: y = (2 * sqrt(2) / pi) * (2 * pi * G * M_2**3 / (P * (M_1 + M_2)**2))**(1/3) * sin(i)
problem_description: Orbiting celestial bodies produce observable line-of-sight motion. The target is the radial-velocity semi-amplitude.
variable_description:
  target:
    name: y
    description: Projected radial-velocity semi-amplitude in the path model
    unit: m s^-1
  inputs:
  - name: M_1
    description: Mass of the observed primary body
    unit: kg
    sampling:
      min: 2.0e+29
      max: 2.0e+31
      ood_boundary: 2.0e+30
      distribution: log_uniform
  - name: M_2
    description: Mass of the companion body
    unit: kg
    sampling:
      min: 2.0e+28
      max: 2.0e+30
      ood_boundary: 2.0e+29
      distribution: log_uniform
  - name: P
    description: Path traversal period
    unit: s
    sampling:
      min: 86400.0
      max: 31540000.0
      ood_boundary: 2592000.0
      distribution: log_uniform
  - name: i
    description: Orbital inclination
    unit: 1 (dimensionless)
    sampling:
      min: 0.05
      max: 1.5
      ood_boundary: 0.8
      distribution: uniform
  intermediates:
  - name: M
    description: Total binary mass
    unit: kg
  - name: a3
    description: Cube of the relative-orbit semi-major axis
    unit: m^3
  - name: a
    description: Relative-orbit semi-major axis
    unit: m
  - name: r
    description: Primary barycentric vertex radius
    unit: m
  - name: l
    description: Side length of the square path
    unit: m
  - name: C
    description: Perimeter of the square path
    unit: m
  - name: v
    description: Velocity
    unit: m s^-1
  auxiliary_inputs: []
constants:
- name: G
  description: Gravitational constant
  value: 6.6743e-11
  unit: m^3 kg^-1 s^-2
- name: pi
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: M = M_1 + M_2
  formula_description: The binary-system mass definition gives total mass M as the sum of component masses.
- formula: a3 = G * M * P**2 / (4 * pi**2)
  formula_description: Kepler's third law defines the cube a3 of the relative-orbit semi-major axis.
- formula: a = a3**(1/3)
  formula_description: The semi-major-axis definition takes the physical positive cube root of a3.
- formula: r = a * M_2 / M
  formula_description: The center-of-mass relation defines the primary barycentric vertex radius r.
- formula: l = sqrt(2) * r
  formula_description: Square geometry defines side length l from the center-to-vertex radius r.
- formula: C = 4 * l
  formula_description: The perimeter definition gives square-path length C as four times side length l.
- formula: v = C / P
  formula_description: The path-speed definition gives v as the previously defined perimeter C traversed in period P.
- formula: y = v * sin(i)
  formula_description: Line-of-sight projection at inclination i defines the observed semi-amplitude y.
