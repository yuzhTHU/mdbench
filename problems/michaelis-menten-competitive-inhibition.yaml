problem_name: Michaelis-Menten Kinetics - Competitive Inhibition
phenomenological_formula: v = k_cat * E_T * S / (K_M * (1 + I / K_I) + S)
problem_description: An enzyme-catalyzed reaction has a competitive inhibitor that increases the apparent Michaelis constant.
variable_description:
  target:
    name: v
    description: Initial reaction rate
    unit: mol m^-3 s^-1
  inputs:
  - name: k_cat
    description: Catalytic turnover constant
    unit: s^-1
    sampling:
      min: 0.1
      max: 1000.0
      ood_boundary: 10.0
      distribution: log_uniform
  - name: E_T
    description: Total enzyme concentration
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  - name: S
    description: Substrate concentration
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  - name: K_M
    description: Michaelis constant
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  - name: I
    description: Competitive inhibitor concentration
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  - name: K_I
    description: Inhibition constant
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  intermediates:
  - name: alpha_inh
    description: Competitive-inhibition amplification factor
    unit: 1 (dimensionless)
  - name: K_app
    description: Apparent Michaelis constant
    unit: mol m^-3
  - name: f
    description: Fraction of enzyme in substrate-bound active complex
    unit: 1 (dimensionless)
  - name: C_complex
    description: Enzyme-substrate complex concentration
    unit: mol m^-3
  auxiliary_inputs: []
constants: []
mechanism:
- formula: alpha_inh = 1 + I / K_I
  formula_description: Competitive-inhibition amplification factor
- formula: K_app = K_M * alpha_inh
  formula_description: Apparent Michaelis constant under competitive inhibition
- formula: f = S / (K_app + S)
  formula_description: Substrate-bound fraction with competitive inhibition
- formula: C_complex = E_T * f
  formula_description: Active complex concentration from enzyme conservation
- formula: v = k_cat * C_complex
  formula_description: Catalytic turnover rate
