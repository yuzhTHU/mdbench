problem_name: Bohr Radius - Original
phenomenological_formula: r = 4 * pi * eps * h**2 / (m * q**2)
problem_description: A physics benchmark that relates the target quantity to experimentally specified parameters.
variable_description:
  target:
    name: r
    description: Characteristic radius
    unit: m
  inputs:
  - name: m
    description: Mass
    unit: kg
    sampling:
      min: 1.0e-30
      max: 1.0e-18
      ood_boundary: 1.0e-24
      distribution: log_uniform
  - name: q
    description: Eccentricity or charge-related term
    unit: A s
    sampling:
      min: 0.01
      max: 0.7
      ood_boundary: 0.3
      distribution: uniform
  intermediates:
  - name: n
    description: Dimensionless quantum or layer number
    unit: 1 (dimensionless)
  - name: k_e
    description: Physical quantity k_e
    unit: kg m^3 s^-4 A^-2
  - name: L
    description: Physical quantity L
    unit: kg m^2 s^-1
  - name: v
    description: Electron orbital speed
    unit: m s^-1
  - name: F_C
    description: Coulomb force magnitude
    unit: kg m s^-2
  - name: F_cent
    description: Centripetal force magnitude
    unit: kg m s^-2
  auxiliary_inputs: []
constants:
- name: eps
  description: Vacuum permittivity
  value: 8.8541878128e-12
  unit: kg^-1 m^-3 s^4 A^2
- name: h
  description: Planck constant
  value: 6.62607015e-34
  unit: kg m^2 s^-1
- name: pi
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: n = 1
  formula_description: Physical relationship that determines n.
- formula: k_e = 1 / (4 * pi * eps)
  formula_description: Physical relationship that determines k_e.
- formula: L = n * h
  formula_description: Physical relationship that determines L.
- formula: F_C = k_e * q**2 / r**2
  formula_description: Coulomb's law for the electron-nucleus force.
- formula: F_cent = m * v**2 / r
  formula_description: Centripetal-force relation for circular motion.
- formula: F_C = F_cent
  formula_description: Radial force balance for the circular orbit.
- formula: L = m * r * v
  formula_description: Classical angular-momentum definition.
