problem_name: Bohr Radius - Original
phenomenological_formula: r = 4 * pi * eps * h**2 / (m * q**2)
problem_description: An electron occupies a bound orbit around an atomic nucleus. The target is the characteristic orbital radius.
variable_description:
  target:
    name: r
    description: Bohr-orbit radius
    unit: m
  inputs:
  - name: m
    description: Mass
    unit: kg
    sampling:
      min: 1.0e-30
      max: 1.0e-18
      ood_boundary: 1.0e-24
      distribution: log_uniform
  - name: q
    description: Magnitude of the electron and nuclear charge
    unit: A s
    sampling:
      min: 0.01
      max: 0.7
      ood_boundary: 0.3
      distribution: uniform
  intermediates:
  - name: n
    description: Principal quantum number
    unit: 1 (dimensionless)
  - name: k_e
    description: Coulomb constant
    unit: kg m^3 s^-4 A^-2
  - name: L
    description: Orbital angular momentum
    unit: kg m^2 s^-1
  - name: F_C
    description: Electrostatic Coulomb attraction
    unit: kg m s^-2
  - name: F_n
    description: Centripetal force required for circular motion
    unit: kg m s^-2
  - name: v
    description: Orbital speed of the electron
    unit: m s^-1
  auxiliary_inputs: []
constants:
- name: eps
  description: Vacuum permittivity
  value: 8.8541878128e-12
  unit: kg^-1 m^-3 s^4 A^2
- name: h
  description: Planck constant
  value: 6.62607015e-34
  unit: kg m^2 s^-1
- name: pi
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: n = 1
  formula_description: Bohr's ground-state postulate fixes the principal quantum number at n = 1.
- formula: k_e = 1 / (4 * pi * eps)
  formula_description: The SI definition of the Coulomb constant relates k_e to the vacuum permittivity eps.
- formula: L = n * h
  formula_description: Bohr angular-momentum quantization sets the circular-orbit angular momentum L to n times Planck's constant h.
- formula: F_C = k_e * q**2 / r**2
  formula_description: Coulomb's law gives the electrostatic attraction F_C between charges separated by the orbit radius r.
- formula: F_n = m * v**2 / r
  formula_description: Newton's circular-motion relation defines the required centripetal force F_n for speed v at radius r.
- formula: F_n = F_C
  formula_description: Circular-orbit force balance equates the centripetal force F_n to the Coulomb attraction F_C.
- formula: r = L / (m * v)
  formula_description: The classical angular-momentum definition L = m * v * r determines the orbit radius r from the previously quantized L and orbital speed v.
