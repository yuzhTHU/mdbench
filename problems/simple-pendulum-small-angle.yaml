problem_name: Simple Pendulum Period - Small Angle
phenomenological_formula: T = 2 * π * sqrt(L / g)
problem_description: A point mass suspended by a light rod or string undergoes small-angle oscillations. The period follows from the linear gravitational restoring torque.
variable_description:
  target:
    name: T
    description: Small-angle pendulum period
    unit: s
  inputs:
  - name: L
    description: Pendulum length
    unit: m
    sampling:
      min: 0.05
      max: 10.0
      ood_boundary: 1.0
      distribution: log_uniform
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 1.0
      max: 20.0
      ood_boundary: 10.0
      distribution: uniform
  intermediates:
  - name: tau_g
    description: Small-angle gravitational restoring torque magnitude
    unit: kg m^2 s^-2
  - name: I_moment
    description: Moment of inertia about the pivot
    unit: kg m^2
  - name: k_restore
    description: Angular restoring coefficient
    unit: s^-2
  - name: omega
    description: Angular frequency
    unit: s^-1
  auxiliary_inputs:
  - name: m
    description: Pendulum bob mass used in the torque derivation
    unit: kg
    sampling:
      min: 0.01
      max: 10.0
      ood_boundary: 1.0
      distribution: log_uniform
  - name: theta
    description: Small angular displacement
    unit: 1 (dimensionless)
    sampling:
      min: 0.02
      max: 1.2
      ood_boundary: 0.5
      distribution: uniform
constants:
- name: π
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: tau_g = m * g * L * theta
  formula_description: Small-angle gravitational restoring torque
- formula: I_moment = m * L^2
  formula_description: Moment of inertia of a point mass about the pivot
- formula: k_restore = tau_g / (I_moment * theta)
  formula_description: Restoring coefficient relating angular displacement to angular acceleration
- formula: omega = sqrt(k_restore)
  formula_description: Angular frequency of the linear oscillator
- formula: T = 2 * π / omega
  formula_description: Period-frequency relation
