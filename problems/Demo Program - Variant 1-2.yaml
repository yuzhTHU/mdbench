# Template: copy to problems/<task_name>.yaml before library validation.
# Two combined mutations make the hidden responses differ from textbook laws.
task_name: Demo Problem - Variant 1-2
task_description: An electrical component is driven by an applied voltage. Relate its measured power transfer to voltage and resistance.
mutation: "Combine Variants 1 and 2: introduce an offset in the current response and alter component power transfer."
mechanism_model:
  - formula: I = (V + 0.37) / R
    role: constitutive/component relations
    description: Component current response.
  - formula: H = 0.19 * R * I^2
    role: constitutive/component relations
    description: Component heating response.
  - formula: P = 0.82 * V * I + H
    role: conservation/balance relations
    description: Total power transfer balance.
phenomenal_model: P = (0.82 * V * (V + 0.37) + 0.19 * (V + 0.37)^2) / R
variables:
  - name: P
    description: Measured total power transfer.
    unit: W
    role: target
  - name: V
    description: Applied voltage.
    unit: V
    role: input
    sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}
  - name: R
    description: Component resistance.
    unit: ohm
    role: input
    sampling: {min: 1.0, max: 100.0, ood_boundary: 40.0, distribution: log_uniform}
  - name: I
    description: Current through the component.
    unit: A
    role: internal
  - name: H
    description: Component heating rate.
    unit: W
    role: internal
mechanism_probes:
  - probe: I
    description: Current through the component.
    answer: I
  - probe: H
    description: Component heating rate.
    answer: 0.19 * R * I^2
