problem_name: Atmosphere-Surface Equilibrium Temperature - Variant 4
phenomenological_formula: T = (((2 + b) * (1 - a) * S) / (4 * s * (2 - b)))**(1/4)
problem_description: A planet receives stellar radiation and exchanges radiative energy with its atmosphere and space, eventually reaching thermal equilibrium.

variable_description:
  target:
    name: T
    description: Surface equilibrium temperature
    unit: K
  
  inputs:
  - name: S
    description: Incident stellar flux
    unit: kg s^-3
    sampling: {min: 1200.0, max: 1500.0, ood_boundary: 1361.0, distribution: uniform}
  - name: a
    description: Planetary shortwave albedo
    unit: 1 (dimensionless)
    sampling: {min: 0.1, max: 0.6, ood_boundary: 0.3, distribution: uniform}
  - name: b
    description: Atmospheric longwave absorptivity
    unit: 1 (dimensionless)
    sampling: {min: 0.05, max: 0.8, ood_boundary: 0.4, distribution: uniform}

  intermediates:
  - name: P_in
    description: Absorbed stellar power
    unit: kg m^2 s^-3
  - name: P_emit
    description: Surface emission power
    unit: kg m^2 s^-3
  - name: P_1
    description: Lower-layer directional emission power
    unit: kg m^2 s^-3
  - name: P_2
    description: Upper-layer directional emission power
    unit: kg m^2 s^-3
  - name: P_back
    description: Downward atmospheric power
    unit: kg m^2 s^-3
  - name: E
    description: Surface emission flux
    unit: kg s^-3
  
  auxiliary_inputs:
  - name: R
    description: Planetary radius
    unit: m
    sampling: {min: 5.0e6, max: 8.0e6, ood_boundary: 6.5e6, distribution: uniform}

constants:
- name: s
  description: Stefan-Boltzmann constant
  value: 5.670374419e-08
  unit: kg s^-3 K^-4

mechanism:
- formula: P_in = 3.141592653589793 * R**2 * (1 - a) * S
  formula_description: The planet intercepts stellar radiation over its cross-sectional area, with a fraction 1-a absorbed.
- formula: P_emit = 4 * 3.141592653589793 * R**2 * E
  formula_description: The entire planetary surface emits longwave radiation with flux E.
- formula: 2 * P_1 = b * (P_emit + P_2)
  formula_description: The lower atmospheric layer absorbs fraction b of longwave radiation from the surface and the upper layer, and emits equally upward and downward at radiative equilibrium.
- formula: 2 * P_2 = b * ((1 - b) * P_emit + P_1)
  formula_description: The upper atmospheric layer absorbs fraction b of transmitted surface radiation and upward lower-layer emission, and emits equally upward and downward at radiative equilibrium.
- formula: P_back = P_1 + (1 - b) * P_2
  formula_description: Downward atmospheric power reaching the surface combines lower-layer emission with upper-layer emission transmitted through the lower layer.
- formula: P_emit = P_in + P_back
  formula_description: At equilibrium, surface emission balances absorbed stellar radiation and downward atmospheric radiation.
- formula: E = s * T**4
  formula_description: The surface longwave emission flux follows the Stefan-Boltzmann law.

