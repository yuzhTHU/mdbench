problem_name: Settling Terminal Velocity - Linear Density Gradient
phenomenological_formula: v_T = 2 * r^2 * g * (rho_p - rho_0 - alpha * z) / (9 * u)
problem_description: |
  A sphere settles slowly through a stably stratified viscous fluid. This variant replaces uniform fluid density with a local density that increases linearly with depth z, making buoyancy depth dependent. The formula gives the local quasi-steady terminal velocity when the sphere is small relative to the stratification scale, relaxation is fast, Stokes drag applies, and rho_p > rho_0 + alpha * z.
variable_description:
  target: {name: v_T, description: Local terminal settling velocity at depth z, unit: m s^-1}
  inputs:
    - {name: r, description: Sphere radius, unit: m, sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}}
    - {name: g, description: Gravitational acceleration, unit: m s^-2, sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}}
    - {name: rho_p, description: Sphere material density, unit: kg m^-3, sampling: {min: 1.5e3, max: 8.0e3, ood_boundary: 4.0e3, distribution: uniform}}
    - {name: rho_0, description: Fluid density at the reference depth, unit: kg m^-3, sampling: {min: 5.0e2, max: 1.0e3, ood_boundary: 8.0e2, distribution: uniform}}
    - {name: alpha, description: Linear increase of fluid density with depth, unit: kg m^-4, sampling: {min: 1.0e-4, max: 5.0e-3, ood_boundary: 1.0e-3, distribution: log_uniform}}
    - {name: z, description: Depth measured downward from the reference surface, unit: m, sampling: {min: 0.0, max: 10.0, ood_boundary: 5.0, distribution: uniform}}
    - {name: u, description: Fluid dynamic viscosity, unit: kg m^-1 s^-1, sampling: {min: 1.0e-4, max: 1.0, ood_boundary: 1.0e-2, distribution: log_uniform}}
  intermediates:
    - {name: V, description: Sphere volume, unit: m^3}
    - {name: rho_f_z, description: Local fluid density at depth z, unit: kg m^-3}
    - {name: m, description: Sphere mass, unit: kg}
    - {name: F_g, description: Gravitational force on the sphere, unit: kg m s^-2}
    - {name: F_b, description: Buoyant force at depth z, unit: kg m s^-2}
    - {name: F, description: Effective driving force, unit: kg m s^-2}
    - {name: b, description: Linear drag coefficient, unit: kg s^-1}
  auxiliary_inputs: []
constants:
  - {name: π, description: Pi, value: 3.141592653589793, unit: 1 (dimensionless)}
mechanism:
  - {formula: V = 4 * π * r^3 / 3, formula_description: Volume of a sphere}
  - {formula: rho_f_z = rho_0 + alpha * z, formula_description: Linear density stratification replacing uniform fluid density}
  - {formula: m = rho_p * V, formula_description: Mass-density relation}
  - {formula: F_g = m * g, formula_description: Gravitational force}
  - {formula: F_b = rho_f_z * V * g, formula_description: Archimedes' law using local fluid density}
  - {formula: F = F_g - F_b, formula_description: Depth-dependent effective driving force}
  - {formula: b = 6 * π * u * r, formula_description: Stokes linear drag coefficient}
  - {formula: v_T = F / b, formula_description: Local terminal-velocity force balance}
