# 问题名称
problem_name: 毛细上升 - 锥形管半径改版

# 唯象方程
phenomenological_formula: h = (-r0 + sqrt(r0^2 + 4 * k * gamma * cos(theta) / (rho
  * g))) / k

# 问题背景
problem_description: |
  这是一个液体在缓慢变宽的锥形毛细管中上升的问题。相对于原版，本改版只将圆管定半径几何积木改为随高度线性增大的等效半径。

# 变量描述
# 变量列表
variable_description:
  target:
    name: h
    description: 毛细上升高度
    unit: m
  inputs:
    - name: r0
      description: 管口参考半径
      unit: m
      sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}
    - name: k
      description: 半径随高度增加的斜率
      unit: 1 (dimensionless)
      sampling: {min: 1.0e-3, max: 0.5, ood_boundary: 0.1, distribution: log_uniform}
    - name: gamma
      description: 液体表面张力
      unit: kg s^-2
      sampling: {min: 0.01, max: 0.1, ood_boundary: 0.05, distribution: uniform}
    - name: theta
      description: 接触角
      unit: 1 (dimensionless)
      sampling: {min: 0.0, max: 1.3, ood_boundary: 0.8, distribution: uniform}
    - name: rho
      description: 液体密度
      unit: kg m^-3
      sampling: {min: 5.0e2, max: 1.5e3, ood_boundary: 1.0e3, distribution: uniform}
    - name: g
      description: 重力加速度
      unit: m s^-2
      sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}

  intermediates:
    - name: A_cap
      description: 毛细驱动面积尺度
      unit: m^2
    - name: r_eff
      description: 平均等效半径
      unit: m

    # 机制

  auxiliary_inputs: []
mechanism:
- formula: A_cap = 2 * gamma * cos(theta) / (rho * g)
  formula_description: 毛细驱动尺度公式
- formula: r_eff = r0 + k * h / 2
  formula_description: 平均等效半径公式；替换原版定半径几何积木
- formula: h = A_cap / r_eff
  formula_description: 锥形管中的毛细平衡方程反解高度
