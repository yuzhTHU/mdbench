task_name: Reconstructed 20260919 Orbital Momentum Response - Variant 2
task_description: Orbital periods are measured for circular trajectories around central sources with independently
  measured masses and orbital radii.
mutation: Add source-mass-dependent inertia.
mechanism_model:
- formula: G0 = 6.67430e-11
  role: constitutive/component relations
  description: 'Fixed batch parameter: gravitational coupling; unit m^3 kg^-1 s^-2. Assumptions: Synthetic isotropic
    momentum law; stationary circular motion; central source fixed; no radiation or drag; positive orbital branch.'
- formula: pi0 = 3.141592653589793
  role: constitutive/component relations
  description: 'Fixed batch parameter: circle constant; unit 1.'
- formula: M0 = 5e24
  role: constitutive/component relations
  description: 'Fixed batch parameter: inertia mass scale; unit kg.'
- formula: mu = 1 + M/(5*M0)
  role: constitutive/component relations
  description: Ratio of effective inertial mass to bare mass in the synthetic momentum law.
- formula: g_rad = G0*M/r**2
  role: governing/dynamical laws
  description: Inward force per unit bare orbiting mass.
- formula: v_orb = sqrt(g_rad*r/mu)
  role: conservation/balance relations
  description: Positive circular speed from radial balance g_rad=mu*v_orb^2/r.
- formula: p_spec = mu*v_orb
  role: governing/dynamical laws
  description: Tangential momentum per unit bare mass.
- formula: period = 2*pi0*r*mu/p_spec
  role: kinematic/geometric constraints
  description: Orbital period from circumference and the momentum-speed relation.
phenomenal_model: period = 2*sqrt(5)*pi0*r**(3/2)/(5*sqrt(M)*sqrt(G0*M0/(M + 5*M0)))
variables:
- name: r
  description: Circular orbital radius.
  unit: m
  role: input
  sampling:
    min: 10000000.0
    max: 200000000.0
    ood_boundary: 80000000.0
    distribution: log_uniform
- name: M
  description: Central source mass.
  unit: kg
  role: input
  sampling:
    min: 1.0e+24
    max: 5.0e+25
    ood_boundary: 1.0e+25
    distribution: log_uniform
- name: mu
  description: Ratio of effective inertial mass to bare mass in the synthetic momentum law.
  unit: '1'
  role: internal
- name: g_rad
  description: Inward force per unit bare orbiting mass.
  unit: m s^-2
  role: internal
- name: v_orb
  description: Positive circular speed from radial balance g_rad=mu*v_orb^2/r.
  unit: m s^-1
  role: internal
- name: p_spec
  description: Tangential momentum per unit bare mass.
  unit: m s^-1
  role: internal
- name: period
  description: Orbital period from circumference and the momentum-speed relation.
  unit: s
  role: target
mechanism_probes:
- probe: p_spec
  description: Magnitude of tangential momentum per unit bare orbiting mass, not speed.
  answer: p_spec = sqrt(5)*sqrt(M)*sqrt(G0*M0/(M + 5*M0))*(M + 5*M0)/(5*M0*sqrt(r))
