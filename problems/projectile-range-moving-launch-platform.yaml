problem_name: Projectile Range - Case 04
phenomenological_formula: R = (v0 * cos(theta) + U) * 2 * v0 * sin(theta) / g
problem_description: A projectile is launched and later reaches a landing surface. The target is its horizontal range.
variable_description:
  target:
    name: R
    description: Horizontal range
    unit: m
  inputs:
  - name: v0
    description: Launch speed
    unit: m s^-1
    sampling:
      min: 1.0
      max: 100.0
      ood_boundary: 20.0
      distribution: log_uniform
  - name: theta
    description: Launch angle
    unit: 1 (dimensionless)
    sampling:
      min: 0.02
      max: 1.2
      ood_boundary: 0.5
      distribution: uniform
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 1.0
      max: 20.0
      ood_boundary: 10.0
      distribution: uniform
  - name: U
    description: Horizontal speed of the launch platform
    unit: m s^-1
    sampling:
      min: 0.01
      max: 50.0
      ood_boundary: 5.0
      distribution: uniform
  intermediates:
  - name: v_x0
    description: Horizontal launch velocity relative to the platform
    unit: m s^-1
  - name: v_x
    description: Horizontal launch velocity in the lab frame
    unit: m s^-1
  - name: v_y
    description: Vertical launch velocity
    unit: m s^-1
  - name: t_f
    description: Time of flight
    unit: s
  auxiliary_inputs: []
constants: []
mechanism:
- formula: v_x0 = v0 * cos(theta)
  formula_description: Horizontal launch velocity relative to the platform
- formula: v_x = v_x0 + U
  formula_description: Galilean addition of platform speed
- formula: v_y = v0 * sin(theta)
  formula_description: Vertical component of launch velocity
- formula: t_f = 2 * v_y / g
  formula_description: Equal-height time of flight
- formula: R = v_x * t_f
  formula_description: Horizontal displacement in the lab frame
