problem_name: Michaelis-Menten Kinetics - Substrate Inhibition
phenomenological_formula: v = k_cat * E_T * S / ((k_off + k_cat) / k_on + S + S^2 * k_si_on / k_si_off)
problem_description: An enzyme converts a substrate into a product. The target is the initial reaction rate under the supplied conditions.
variable_description:
  target:
    name: v
    description: Initial reaction rate under substrate inhibition
    unit: mol m^-3 s^-1
  inputs:
  - name: k_cat
    description: Catalytic turnover constant
    unit: s^-1
    sampling:
      min: 0.1
      max: 1000.0
      ood_boundary: 10.0
      distribution: log_uniform
  - name: E_T
    description: Total enzyme concentration
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  - name: S
    description: Substrate concentration
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  - name: k_on
    description: Association rate constant for free enzyme and substrate
    unit: m^3 mol^-1 s^-1
    sampling:
      min: 100.0
      max: 100000000.0
      ood_boundary: 100000.0
      distribution: log_uniform
  - name: k_off
    description: Dissociation rate constant of the enzyme-substrate complex
    unit: s^-1
    sampling:
      min: 0.01
      max: 1000.0
      ood_boundary: 10.0
      distribution: log_uniform
  - name: k_si_on
    description: Association rate constant for substrate binding to the active ES complex
    unit: m^3 mol^-1 s^-1
    sampling:
      min: 100.0
      max: 100000000.0
      ood_boundary: 100000.0
      distribution: log_uniform
  - name: k_si_off
    description: Dissociation rate constant of the inactive substrate-inhibited complex
    unit: s^-1
    sampling:
      min: 0.01
      max: 1000.0
      ood_boundary: 10.0
      distribution: log_uniform
  intermediates:
  - name: E_free
    description: Free enzyme concentration
    unit: mol m^-3
  - name: C_complex
    description: Enzyme-substrate complex concentration
    unit: mol m^-3
  - name: C_inactive
    description: Inactive substrate-inhibited enzyme complex concentration
    unit: mol m^-3
  - name: r_on
    description: Formation rate of the enzyme-substrate complex
    unit: mol m^-3 s^-1
  - name: r_off
    description: Dissociation rate of the enzyme-substrate complex
    unit: mol m^-3 s^-1
  - name: r_cat
    description: Catalytic turnover rate of the enzyme-substrate complex
    unit: mol m^-3 s^-1
  - name: r_si_on
    description: Formation rate of the inactive substrate-inhibited complex
    unit: mol m^-3 s^-1
  - name: r_si_off
    description: Dissociation rate of the inactive substrate-inhibited complex
    unit: mol m^-3 s^-1
  auxiliary_inputs: []
constants: []
mechanism:
- formula: r_on = k_on * E_free * S
  formula_description: Mass-action association rate for formation of active ES from free enzyme and substrate
- formula: r_off = k_off * C_complex
  formula_description: Mass-action dissociation rate for active ES returning to free enzyme and substrate
- formula: r_cat = k_cat * C_complex
  formula_description: First-order catalytic turnover rate for active ES producing product and free enzyme
- formula: r_si_on = k_si_on * C_complex * S
  formula_description: Mass-action association rate for inactive complex formation by substrate binding to active ES
- formula: r_si_off = k_si_off * C_inactive
  formula_description: Mass-action dissociation rate for the inactive substrate-inhibited complex
- formula: r_on = r_off + r_cat + r_si_on - r_si_off
  formula_description: Quasi-steady-state balance for active ES including conversion to and from the inactive complex
- formula: r_si_on = r_si_off
  formula_description: Binding equilibrium for the inactive substrate-inhibited complex
- formula: E_T = E_free + C_complex + C_inactive
  formula_description: Conservation of total enzyme among free enzyme, active ES, and inactive inhibited complex
- formula: v = r_cat
  formula_description: Definition of the observed initial product-formation rate as the catalytic flux through active ES
