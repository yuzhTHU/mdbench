# 问题名称
problem_name: 分层流体小球终端速度 - 二次阻力改版

# 唯象方程
phenomenological_formula: v_T = sqrt(8 * r * g * (rho_p - rho_f) / (3 * C_d * rho_f))

# 问题背景
problem_description: |
  这是一个小球在流体中下沉并达到终端速度的问题。相对于原版，本改版只将低雷诺数 Stokes 线性阻力积木改为正比于速度平方的惯性阻力。该版本适用于惯性阻力主导、阻力系数 C_d 可近似视为常数且 rho_p > rho_f 的速度区间。

# 变量描述
# 变量列表
variable_description:
  target:
    name: v_T
    description: 小球终端下落速度
    unit: m s^-1
  inputs:
    - name: r
      description: 小球半径
      unit: m
      sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}
    - name: g
      description: 重力加速度
      unit: m s^-2
      sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}
    - name: rho_p
      description: 小球材料密度
      unit: kg m^-3
      sampling: {min: 1.5e3, max: 8.0e3, ood_boundary: 4.0e3, distribution: uniform}
    - name: rho_f
      description: 流体密度
      unit: kg m^-3
      sampling: {min: 5.0e2, max: 1.2e3, ood_boundary: 9.0e2, distribution: uniform}
    - name: C_d
      description: 二次阻力系数
      unit: 1 (dimensionless)
      sampling: {min: 0.1, max: 2.0, ood_boundary: 1.0, distribution: uniform}

  intermediates:
    - name: V
      description: 小球体积
      unit: m^3
    - name: A
      description: 迎风截面积
      unit: m^2
    - name: m
      description: 小球质量
      unit: kg
    - name: F_g
      description: 小球重力
      unit: kg m s^-2
    - name: F_b
      description: 小球受到的浮力
      unit: kg m s^-2
    - name: F_d
      description: 终端速度下的二次阻力
      unit: kg m s^-2

  auxiliary_inputs: []

# 常数描述
constants:
- name: π
  description: 圆周率
  value: 3.141592653589793
  unit: 1 (dimensionless)

# 机制
mechanism:
- formula: V = 4 * π * r^3 / 3
  formula_description: 球体体积公式
- formula: A = π * r^2
  formula_description: 球体迎风截面积公式
- formula: m = rho_p * V
  formula_description: 质量密度关系
- formula: F_g = m * g
  formula_description: 重力公式
- formula: F_b = rho_f * V * g
  formula_description: 阿基米德浮力公式
- formula: F_d = C_d * rho_f * A * v_T^2 / 2
  formula_description: 二次惯性阻力公式；替换原版 Stokes 线性阻力积木
- formula: F_g = F_b + F_d
  formula_description: 终端状态下合力达到平衡
