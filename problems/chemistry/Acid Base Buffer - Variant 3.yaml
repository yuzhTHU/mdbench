task_name: Acid Base Buffer - Variant 3
task_description: An acid-base buffer is prepared from protonated and conjugate-base components. Relate equilibrated
  pH to their analytical preparation concentrations.
mutation: Change the preparation boundary through fixed concentration-dependent base addition, retaining the total
  reference buffer pool.
mechanism_model:
- formula: T = A0 + B0
  role: conservation/balance relations
  description: Total reference analytical buffer concentration.
- formula: x * T = B0
  role: constitutive/component relations
  description: Reference conjugate-base preparation fraction.
- formula: (1) * a = (1 - ((x + 0.0017 * T) / (1 + 0.0017 * T))) * T
  role: conservation/balance relations
  description: Protonated component conservation in the buffer-dominant preparation limit.
- formula: (1) * b = ((x + 0.0017 * T) / (1 + 0.0017 * T)) * T
  role: conservation/balance relations
  description: Conjugate-base component conservation in the buffer-dominant preparation limit.
- formula: h * b = 0.018 * a
  role: constitutive/component relations
  description: Ideal proton-transfer equilibrium; acid dissociation constant is in moles per cubic metre.
- formula: pH = -log(h / 1000.0) / log(10)
  role: constitutive/component relations
  description: pH from ideal proton activity relative to one mole per litre.
phenomenal_model: pH = -log(9*A0/(50*(17*A0**2 + 34*A0*B0 + 17*B0**2 + 10000*B0))) / log(10)
variables:
- name: pH
  description: Equilibrated buffer pH.
  unit: '1'
  role: target
- name: A0
  description: Analytical protonated-buffer preparation concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 10.0
    max: 100.0
    ood_boundary: 40.0
    distribution: log_uniform
- name: B0
  description: Analytical conjugate-base preparation concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 10.0
    max: 100.0
    ood_boundary: 40.0
    distribution: log_uniform
- name: T
  description: Total reference analytical buffer concentration.
  unit: mol m^-3
  role: internal
- name: x
  description: Reference conjugate-base preparation fraction.
  unit: '1'
  role: internal
- name: a
  description: Free protonated buffer concentration.
  unit: mol m^-3
  role: internal
- name: b
  description: Free conjugate-base concentration.
  unit: mol m^-3
  role: internal
- name: h
  description: Free proton concentration.
  unit: mol m^-3
  role: internal
mechanism_probes:
- probe: a
  description: Free protonated buffer concentration.
  answer: a
- probe: b
  description: Free conjugate-base concentration.
  answer: b
