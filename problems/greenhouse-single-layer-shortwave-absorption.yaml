problem_name: Greenhouse Effect - Single-Layer Shortwave Absorption
phenomenological_formula: T = (((1 - p / 2) * (1 - a) * S / 4) / (s * (1 - b / 2)))**(1/4)
problem_description: A planet exchanges energy with its atmosphere and surroundings. The target is the equilibrium planetary surface temperature.
variable_description:
  target:
    name: T
    description: Surface temperature
    unit: K
  inputs:
  - name: S
    description: Incident radiative flux
    unit: kg s^-3
    sampling:
      min: 1200.0
      max: 1500.0
      ood_boundary: 1361.0
      distribution: uniform
  - name: a
    description: Planetary shortwave albedo
    unit: 1 (dimensionless)
    sampling:
      min: 0.1
      max: 0.6
      ood_boundary: 0.3
      distribution: uniform
  - name: b
    description: Longwave absorptivity and emissivity of the gray atmospheric layer
    unit: 1 (dimensionless)
    sampling:
      min: 0.05
      max: 0.8
      ood_boundary: 0.4
      distribution: uniform
  - name: p
    description: Fraction of absorbed solar flux taken up by the atmosphere
    unit: 1 (dimensionless)
    sampling:
      min: 0.05
      max: 0.7
      ood_boundary: 0.3
      distribution: uniform
  intermediates:
  - name: S0
    description: Globally averaged absorbed solar flux
    unit: kg s^-3
  - name: S_s
    description: Direct shortwave flux absorbed at the surface
    unit: kg s^-3
  - name: S_a
    description: Shortwave flux absorbed by the atmosphere
    unit: kg s^-3
  - name: S_d
    description: Downward half of atmospheric re-emission
    unit: kg s^-3
  - name: Q
    description: Surface radiative source flux before longwave feedback
    unit: kg s^-3
  - name: f
    description: Downward longwave feedback fraction
    unit: 1 (dimensionless)
  - name: E
    description: Surface outgoing longwave emission flux
    unit: kg s^-3
  auxiliary_inputs: []
constants:
- name: s
  description: Stefan-Boltzmann constant
  value: 5.670374419e-08
  unit: kg s^-3 K^-4
mechanism:
- formula: S0 = (1 - a) * S / 4
  formula_description: Global radiative geometry and albedo define absorbed solar flux S0 from stellar flux S.
- formula: S_s = (1 - p) * S0
  formula_description: The shortwave partition definition assigns fraction 1 - p of the prior absorbed flux S0 directly to the surface.
- formula: S_a = p * S0
  formula_description: The same shortwave partition assigns fraction p of S0 to atmospheric absorption S_a.
- formula: S_d = S_a / 2
  formula_description: Isotropic atmospheric re-emission defines downward flux S_d as half the previously absorbed atmospheric flux S_a.
- formula: Q = S_s + S_d
  formula_description: Surface energy balance defines radiative source flux Q as direct surface absorption S_s plus downward atmospheric emission S_d.
- formula: f = b / 2
  formula_description: Isotropic longwave emission by a gray layer defines feedback fraction f as b / 2.
- formula: E = Q / (1 - f)
  formula_description: Surface radiative-equilibrium balance defines emission flux E from net source Q and feedback f.
- formula: T = (E / s)**(1/4)
  formula_description: The Stefan-Boltzmann law E = s * T**4 defines surface temperature T from emission flux E.
