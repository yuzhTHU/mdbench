problem_name: Atwood Machine Acceleration - Bearing Friction Torque
phenomenological_formula: a = ((m1 - m2) * g - tau_f / R) / (m1 + m2)
problem_description: A constant bearing friction torque opposes the pulley rotation and subtracts an equivalent force from the gravitational drive.
variable_description:
  target:
    name: a
    description: Acceleration magnitude with m1 descending
    unit: m s^-2
  inputs:
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 1.0
      max: 20.0
      ood_boundary: 10.0
      distribution: uniform
  - name: m1
    description: Mass on the descending side
    unit: kg
    sampling:
      min: 0.2
      max: 10.0
      ood_boundary: 2.0
      distribution: log_uniform
  - name: m2
    description: Mass on the ascending side
    unit: kg
    sampling:
      min: 0.05
      max: 5.0
      ood_boundary: 1.0
      distribution: log_uniform
  - name: tau_f
    description: Constant bearing friction torque
    unit: kg m^2 s^-2
    sampling:
      min: 0.0001
      max: 1.0
      ood_boundary: 0.01
      distribution: log_uniform
  - name: R
    description: Pulley radius
    unit: m
    sampling:
      min: 0.01
      max: 1.0
      ood_boundary: 0.1
      distribution: log_uniform
  intermediates:
  - name: F_g
    description: Driving force due to the weight difference
    unit: kg m s^-2
  - name: F_tau
    description: Equivalent resisting force from bearing torque
    unit: kg m s^-2
  - name: F_drive
    description: Net driving force after bearing friction
    unit: kg m s^-2
  - name: M_eff
    description: Effective inertial mass of the translating bodies
    unit: kg
  auxiliary_inputs: []
constants: []
mechanism:
- formula: F_g = (m1 - m2) * g
  formula_description: Driving force due to weight difference
- formula: F_tau = tau_f / R
  formula_description: Bearing torque converted into an equivalent string-direction force
- formula: F_drive = F_g - F_tau
  formula_description: Net driving force after subtracting bearing friction
- formula: M_eff = m1 + m2
  formula_description: Effective inertia from the two translating masses
- formula: a = F_drive / M_eff
  formula_description: Newton second law for the full system
