problem_name: Spring Oscillator Period - Added Inertia
phenomenological_formula: T = 2 * π * sqrt((m + eta) / k)
problem_description: A mass-spring system oscillates about equilibrium. The target is its oscillation period.
variable_description:
  target:
    name: T
    description: Oscillation period with added inertia
    unit: s
  inputs:
  - name: m
    description: Oscillator mass
    unit: kg
    sampling:
      min: 0.01
      max: 10.0
      ood_boundary: 1.0
      distribution: log_uniform
  - name: eta
    description: Added inertial mass
    unit: kg
    sampling:
      min: 1.0e-09
      max: 0.001
      ood_boundary: 1.0e-06
      distribution: log_uniform
  - name: k
    description: Linear spring stiffness
    unit: kg s^-2
    sampling:
      min: 0.1
      max: 10000.0
      ood_boundary: 100.0
      distribution: log_uniform
  intermediates:
  - name: M_eff
    description: Effective inertial mass
    unit: kg
  - name: omega
    description: Angular frequency
    unit: s^-1
  auxiliary_inputs: []
constants:
- name: π
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: M_eff = m + eta
  formula_description: Added inertia modifies the oscillator mass
- formula: omega = sqrt(k / M_eff)
  formula_description: Angular frequency using effective mass
- formula: T = 2 * π / omega
  formula_description: Period-frequency relation
