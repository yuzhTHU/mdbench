problem_name: Atmospheric Parcel Stability Measure - Variant 2
phenomenological_formula: Y = g * (A - B) * r**3 / T
problem_description: An air parcel is displaced in a stratified atmosphere. The target is the specified atmospheric stability diagnostic.
variable_description:
  target:
    name: Y
    description: Atmospheric stability diagnostic
    unit: m^3 s^-2
  inputs:
  - name: A
    description: Parcel temperature-profile parameter
    unit: K m^-1
    sampling:
      min: -0.012
      max: -0.001
      ood_boundary: -0.007
      distribution: uniform
  - name: B
    description: Environmental temperature-profile parameter
    unit: K m^-1
    sampling:
      min: -0.012
      max: -0.001
      ood_boundary: -0.006
      distribution: uniform
  - name: T
    description: Reference temperature
    unit: K
    sampling:
      min: 200.0
      max: 330.0
      ood_boundary: 288.0
      distribution: uniform
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 9.7
      max: 9.9
      ood_boundary: 9.81
      distribution: uniform
  - name: r
    description: Characteristic length-scale parameter
    unit: m
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  intermediates:
  - name: T_p
    description: Temperature of the displaced parcel
    unit: K
  - name: T_e
    description: Environmental temperature at radial displacement r
    unit: K
  - name: rho_p
    description: Density of the displaced parcel
    unit: kg m^-3
  - name: rho_e
    description: Environmental density at radial displacement r
    unit: kg m^-3
  - name: V
    description: Volume
    unit: m^3
  - name: F_g
    description: Weight of the displaced parcel
    unit: kg m s^-2
  - name: F_b
    description: Archimedean buoyant force
    unit: kg m s^-2
  - name: F
    description: Net radial buoyancy force
    unit: kg m s^-2
  - name: a
    description: Net radial acceleration of the parcel
    unit: m s^-2
  - name: a_l
    description: Linearized radial restoring acceleration
    unit: m s^-2
  - name: a_i
    description: Acceleration supplied to the inverse-square scaling diagnostic
    unit: m s^-2
  auxiliary_inputs:
  - name: P
    description: Reference pressure
    unit: kg m^-1 s^-2
    sampling:
      min: 50000.0
      max: 150000.0
      ood_boundary: 101325.0
      distribution: log_uniform
  - name: m
    description: Parcel mass
    unit: kg
    sampling:
      min: 1.0e-30
      max: 1.0e-18
      ood_boundary: 1.0e-24
      distribution: log_uniform
constants:
- name: M
  description: Molar mass of dry air
  value: 0.0289652
  unit: kg mol^-1
- name: R
  description: Molar gas constant
  value: 8.314462618
  unit: kg m^2 s^-2 K^-1 mol^-1
mechanism:
- formula: T_p = T - A * r
  formula_description: The linear parcel temperature-profile definition gives T_p at radial displacement r.
- formula: T_e = T - B * r
  formula_description: The linear environmental temperature-profile definition gives T_e at the same radial displacement.
- formula: rho_p = P * M / (R * T_p)
  formula_description: The ideal-gas law defines parcel density rho_p from P and T_p.
- formula: rho_e = P * M / (R * T_e)
  formula_description: The ideal-gas law defines environmental density rho_e from P and T_e.
- formula: V = m / rho_p
  formula_description: The mass-density definition gives parcel volume V from mass m and density rho_p.
- formula: F_g = m * g
  formula_description: Newtonian gravity defines parcel weight F_g.
- formula: F_b = rho_e * V * g
  formula_description: Archimedes' principle defines buoyant force F_b from displaced environmental fluid.
- formula: F = F_b - F_g
  formula_description: The net-force definition gives radial buoyancy force F as F_b minus F_g.
- formula: a = F / m
  formula_description: Newton's second law defines parcel acceleration a from net force F and mass m.
- formula: a_l = a * (T_e / T)
  formula_description: The linearized stratification approximation defines restoring acceleration a_l.
- formula: a_i = a_l
  formula_description: The inverse-square model carries the prior linearized acceleration forward as a_i before geometric scaling.
- formula: Y = -a_i * r**2
  formula_description: The inverse-square scaling definition forms the diagnostic Y from restoring acceleration a_i and radius scale r.
