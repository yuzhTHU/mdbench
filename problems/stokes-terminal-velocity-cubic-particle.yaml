problem_name: Particle Settling Response - Case 02
phenomenological_formula: v = s**2 * g * (rho_1 - rho_2) / (C * u)
problem_description: A particle settles through a fluid. The target is the specified settling observable.
variable_description:
  target:
    name: v
    description: Velocity
    unit: m s^-1
  inputs:
  - name: C
    description: Dimensionless particle-fluid interaction coefficient
    unit: 1 (dimensionless)
    sampling:
      min: 0.1
      max: 10.0
      ood_boundary: 1.0
      distribution: uniform
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 9.7
      max: 9.9
      ood_boundary: 9.81
      distribution: uniform
  - name: rho_1
    description: Particle density
    unit: kg m^-3
    sampling:
      min: 1200.0
      max: 8000.0
      ood_boundary: 3000.0
      distribution: log_uniform
  - name: rho_2
    description: Fluid density
    unit: kg m^-3
    sampling:
      min: 1.0
      max: 1000.0
      ood_boundary: 100.0
      distribution: log_uniform
  - name: s
    description: Particle characteristic length
    unit: m
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  - name: u
    description: Dynamic viscosity of the surrounding fluid
    unit: kg m^-1 s^-1
    sampling:
      min: 0.0001
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  intermediates:
  - name: V
    description: Volume
    unit: m^3
  - name: m_p
    description: Mass of the cubic particle
    unit: kg
  - name: F_g
    description: Gravitational weight of the particle
    unit: kg m s^-2
  - name: F_b
    description: Archimedean buoyant force
    unit: kg m s^-2
  - name: F
    description: Net downward settling force
    unit: kg m s^-2
  - name: b
    description: Geometry-specific linear drag coefficient
    unit: kg s^-1
  auxiliary_inputs: []
constants: []
mechanism:
- formula: V = s**3
  formula_description: The cube-volume definition gives particle volume V from side length s.
- formula: m_p = rho_1 * V
  formula_description: The mass-density definition gives particle mass m_p from density rho_1 and volume V.
- formula: F_g = m_p * g
  formula_description: Newtonian gravity defines particle weight F_g.
- formula: F_b = rho_2 * V * g
  formula_description: Archimedes' principle defines buoyant force F_b as the weight of displaced fluid.
- formula: F = F_g - F_b
  formula_description: The net-force definition gives downward settling force F as weight F_g minus buoyancy F_b.
- formula: b = C * u * s
  formula_description: The cubic-particle drag model defines linear coefficient b from positive geometry factor C, viscosity u, and side length s.
- formula: v = F / b
  formula_description: Terminal force balance F = b * v defines the settling speed v.
