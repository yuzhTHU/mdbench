task_name: Acid Base Buffer - Variant 2-3-4
task_description: An acid-base buffer is prepared from protonated and conjugate-base components. Relate equilibrated
  pH to their analytical preparation concentrations.
mutation: Combine Variants 2, 3, 4; apply all component changes in the same balance equations.
mechanism_model:
- formula: T = A0 + B0
  role: conservation/balance relations
  description: Total reference analytical buffer concentration.
- formula: x * T = B0
  role: constitutive/component relations
  description: Reference conjugate-base preparation fraction.
- formula: (1) * a = (1 - ((x + 0.0017 * T) / (1 + 0.0017 * T))) * T
  role: conservation/balance relations
  description: Protonated component conservation in the buffer-dominant preparation limit.
- formula: ((1 + 0.000013 * T^2) * (1 + 0.23 * (1 - x)^2)) * b = ((x + 0.0017 * T) / (1 + 0.0017 * T)) * T
  role: conservation/balance relations
  description: Conjugate-base component conservation in the buffer-dominant preparation limit.
- formula: h * b = 0.018 * a
  role: constitutive/component relations
  description: Ideal proton-transfer equilibrium; acid dissociation constant is in moles per cubic metre.
- formula: pH = -log(h / 1000.0) / log(10)
  role: constitutive/component relations
  description: pH from ideal proton activity relative to one mole per litre.
phenomenal_model: pH = -log((14391*A0**5 + 52182*A0**4*B0 + 72891*A0**3*B0**2 + 1107000000*A0**3 + 46800*A0**2*B0**3
  + 1800000000*A0**2*B0 + 11700*A0*B0**4 + 900000000*A0*B0**2)/(85000000000*A0**4 + 340000000000*A0**3*B0 + 510000000000*A0**2*B0**2
  + 50000000000000*A0**2*B0 + 340000000000*A0*B0**3 + 100000000000000*A0*B0**2 + 85000000000*B0**4 + 50000000000000*B0**3))
  / log(10)
variables:
- name: pH
  description: Equilibrated buffer pH.
  unit: '1'
  role: target
- name: A0
  description: Analytical protonated-buffer preparation concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 10.0
    max: 100.0
    ood_boundary: 40.0
    distribution: log_uniform
- name: B0
  description: Analytical conjugate-base preparation concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 10.0
    max: 100.0
    ood_boundary: 40.0
    distribution: log_uniform
- name: T
  description: Total reference analytical buffer concentration.
  unit: mol m^-3
  role: internal
- name: x
  description: Reference conjugate-base preparation fraction.
  unit: '1'
  role: internal
- name: a
  description: Free protonated buffer concentration.
  unit: mol m^-3
  role: internal
- name: b
  description: Free conjugate-base concentration.
  unit: mol m^-3
  role: internal
- name: h
  description: Free proton concentration.
  unit: mol m^-3
  role: internal
mechanism_probes:
- probe: a
  description: Free protonated buffer concentration.
  answer: a
- probe: b
  description: Free conjugate-base concentration.
  answer: b
