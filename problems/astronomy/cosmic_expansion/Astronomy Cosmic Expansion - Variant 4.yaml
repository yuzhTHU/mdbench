task_name: Astronomy Cosmic Expansion - Variant 4
task_description: The universe expands with matter, radiation, and vacuum energy present. The target is the positive cosmic expansion rate.
mutation: Transfer energy from radiation into matter through a fixed fractional interaction rate per expansion interval.
mechanism_model:
- formula: pi0 = 3.141592653589793
  role: auxiliary/regime constraints
  description: Circle constant.
- formula: n_m = 3
  role: auxiliary/regime constraints
  description: Matter dilution exponent.
- formula: n_r = 4
  role: auxiliary/regime constraints
  description: Radiation dilution exponent.
- formula: eta = 1/20
  role: auxiliary/regime constraints
  description: Fractional radiation-to-matter transfer coefficient.
- formula: rho_m = rho_m0/a**n_m+eta*rho_r0*(a**(-n_m)-a**(-n_r-eta))/(n_r+eta-n_m)
  role: conservation/balance relations
  description: Normalized matter density at the sampled epoch.
- formula: rho_r = rho_r0/a**(n_r+eta)
  role: conservation/balance relations
  description: Normalized radiation mass-equivalent density at the sampled epoch.
- formula: rho_v = rho_v0
  role: constitutive/component relations
  description: Normalized vacuum mass-equivalent density at the sampled epoch.
- formula: rho_e = rho_m+rho_r+rho_v
  role: conservation/balance relations
  description: Normalized combined gravitational source density.
- formula: H = sqrt(8*pi0*rho_e/3)
  role: governing/dynamical laws
  description: Normalized positive cosmic expansion rate.
phenomenal_model: H = sqrt(47123889803846895.0)*sqrt(rho_r0*(a**(-3) - 1/a**(81/20))/21 + rho_v0 + rho_m0/a**3 + rho_r0/a**(81/20))/75000000
variables:
- name: a
  description: Scale factor relative to the reference epoch.
  unit: '1'
  role: input
  sampling:
    min: 0.3
    max: 2.0
    ood_boundary: 1.15
    distribution: uniform
- name: rho_m0
  description: Normalized matter density at the reference epoch.
  unit: '1'
  role: input
  sampling:
    min: 0.1
    max: 0.6
    ood_boundary: 0.35
    distribution: uniform
- name: rho_r0
  description: Normalized radiation density at the reference epoch.
  unit: '1'
  role: input
  sampling:
    min: 0.001
    max: 0.01
    ood_boundary: 0.0055
    distribution: uniform
- name: rho_v0
  description: Normalized vacuum density at the reference epoch.
  unit: '1'
  role: input
  sampling:
    min: 0.2
    max: 0.8
    ood_boundary: 0.5
    distribution: uniform
- name: H
  description: Normalized positive cosmic expansion rate.
  unit: '1'
  role: target
- name: pi0
  description: Circle constant.
  unit: '1'
  role: internal
- name: n_m
  description: Matter dilution exponent.
  unit: '1'
  role: internal
- name: n_r
  description: Radiation dilution exponent.
  unit: '1'
  role: internal
- name: eta
  description: Fractional radiation-to-matter transfer coefficient.
  unit: '1'
  role: internal
- name: rho_m
  description: Normalized matter density at the sampled epoch.
  unit: '1'
  role: internal
- name: rho_r
  description: Normalized radiation mass-equivalent density at the sampled epoch.
  unit: '1'
  role: internal
- name: rho_v
  description: Normalized vacuum mass-equivalent density at the sampled epoch.
  unit: '1'
  role: internal
- name: rho_e
  description: Normalized combined gravitational source density.
  unit: '1'
  role: internal
mechanism_probes:
- probe: rho_m
  description: Normalized matter density at the sampled epoch.
  answer: rho_r0*(a**(-3) - 1/a**(81/20))/21 + rho_m0/a**3
- probe: rho_r
  description: Normalized radiation mass-equivalent density at the sampled epoch.
  answer: rho_r0/a**(81/20)
