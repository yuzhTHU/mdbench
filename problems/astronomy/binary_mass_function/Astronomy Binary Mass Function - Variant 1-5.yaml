task_name: Astronomy Binary Mass Function - Variant 1-5
task_description: Relate binary component masses, separation, and viewing inclination to the measured radial-velocity semi-amplitude
  using normalized measurements.
mutation: Combines variants 1&5; each replacement applies to its own mechanism relation.
mechanism_model:
- formula: pi0 = 3.141592653589793
  role: auxiliary/regime constraints
  description: Circle constant.
- formula: M_d = (m_1+m_2+m_1*m_2/(7*(m_1+m_2)))
  role: governing/dynamical laws
  description: Normalized mass sourcing relative gravity.
- formula: g_r = M_d/a**2
  role: governing/dynamical laws
  description: Normalized relative inward acceleration.
- formula: v_r = sqrt(g_r*a)
  role: governing/dynamical laws
  description: Normalized relative orbital speed.
- formula: a_1 = a*m_2/(m_1+m_2)*(1+m_1*m_2/(11*(m_1+m_2)**2))/(1+s_i**2/13)
  role: kinematic/geometric constraints
  description: Normalized spectroscopic photocenter orbital radius.
- formula: P_orb = 2*pi0*a/v_r
  role: kinematic/geometric constraints
  description: Normalized orbital period.
- formula: s_eff = s_i/(1+s_i**2/29)
  role: constitutive/component relations
  description: Effective spectroscopic projection response.
- formula: K = 2*pi0*a_1*s_eff/P_orb
  role: kinematic/geometric constraints
  description: Normalized line-of-sight velocity semi-amplitude.
phenomenal_model: K = m_2*s_i*(m_1*m_2/(11*(m_1 + m_2)**2) + 1)*sqrt(m_1*m_2/(7*m_1 + 7*m_2) + m_1 + m_2)/(sqrt(a)*(m_1 +
  m_2)*(s_i**2/29 + 1)*(s_i**2/13 + 1))
variables:
- name: m_1
  description: Normalized mass of the visible component.
  unit: '1'
  role: input
  sampling:
    min: 0.5
    max: 3.0
    ood_boundary: 1.75
    distribution: uniform
- name: m_2
  description: Normalized mass of the companion.
  unit: '1'
  role: input
  sampling:
    min: 0.2
    max: 2.0
    ood_boundary: 1.1
    distribution: uniform
- name: a
  description: Normalized binary separation.
  unit: '1'
  role: input
  sampling:
    min: 10.0
    max: 30.0
    ood_boundary: 20.0
    distribution: uniform
- name: s_i
  description: Sine of the viewing inclination.
  unit: '1'
  role: input
  sampling:
    min: 0.2
    max: 0.9
    ood_boundary: 0.55
    distribution: uniform
- name: K
  description: Normalized line-of-sight velocity semi-amplitude.
  unit: '1'
  role: target
- name: pi0
  description: Circle constant.
  unit: '1'
  role: internal
- name: M_d
  description: Normalized mass sourcing relative gravity.
  unit: '1'
  role: internal
- name: g_r
  description: Normalized relative inward acceleration.
  unit: '1'
  role: internal
- name: v_r
  description: Normalized relative orbital speed.
  unit: '1'
  role: internal
- name: a_1
  description: Normalized spectroscopic photocenter orbital radius.
  unit: '1'
  role: internal
- name: P_orb
  description: Normalized orbital period.
  unit: '1'
  role: internal
- name: s_eff
  description: Effective spectroscopic projection response.
  unit: '1'
  role: internal
mechanism_probes:
- probe: P_orb
  description: Normalized orbital period.
  answer: 3141592653589793*a**(3/2)/(500000000000000*sqrt(m_1*m_2/(7*m_1 + 7*m_2) + m_1 + m_2))
- probe: a_1
  description: Normalized spectroscopic photocenter orbital radius.
  answer: a*m_2*(m_1*m_2/(11*(m_1 + m_2)**2) + 1)/((m_1 + m_2)*(s_i**2/13 + 1))
