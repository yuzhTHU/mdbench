task_name: Reconstructed 20260919 Divided Flow Pressure Response - Variant 1-2
task_description: Steady pressure differences between two sections of a liquid-flow device are recorded with imposed
  inlet flow, fluid density and independently measured section areas.
mutation: Make the bypass division depend on flow. Add irreversible throat dissipation.
mechanism_model:
- formula: Q0 = 1e-4
  role: constitutive/component relations
  description: 'Fixed batch parameter: flow scale of the passive bypass; unit m^3 s^-1. Assumptions: Steady incompressible
    equal-height control volumes; bypass exits before the throat; prescribed passive split closure; kinetic correction
    factors one; positive pressure-drop branch.'
- formula: beta = .2 + Q/(5*Q0)
  role: constitutive/component relations
  description: Bypass-to-throat volumetric-flow ratio.
- formula: Q_throat = Q/(1+beta)
  role: conservation/balance relations
  description: Throat flow from inlet/bypass mass balance.
- formula: v_in = Q/A1
  role: kinematic/geometric constraints
  description: Section-averaged inlet speed.
- formula: v_throat = Q_throat/A2
  role: kinematic/geometric constraints
  description: Section-averaged throat speed.
- formula: p_loss = .6*rho*v_throat**2/2
  role: constitutive/component relations
  description: Irreversible mechanical-energy loss per fluid volume along the throat path.
- formula: dp = rho*(v_throat**2-v_in**2)/2+p_loss
  role: conservation/balance relations
  description: Inlet-minus-throat pressure from steady mechanical-energy balance.
phenomenal_model: dp = Q**2*rho*(40*A1**2*Q0**2 - A2**2*Q**2 - 12*A2**2*Q*Q0 - 36*A2**2*Q0**2)/(2*A1**2*A2**2*(Q
  + 6*Q0)**2)
variables:
- name: Q
  description: Imposed total inlet volumetric flow rate.
  unit: m^3 s^-1
  role: input
  sampling:
    min: 1.0e-05
    max: 0.0002
    ood_boundary: 8.0e-05
    distribution: log_uniform
- name: A1
  description: Measured inlet cross-sectional area.
  unit: m^2
  role: input
  sampling:
    min: 0.004
    max: 0.008
    ood_boundary: 0.006
    distribution: uniform
- name: A2
  description: Measured throat cross-sectional area.
  unit: m^2
  role: input
  sampling:
    min: 0.0005
    max: 0.0015
    ood_boundary: 0.001
    distribution: uniform
- name: rho
  description: Liquid density.
  unit: kg m^-3
  role: input
  sampling:
    min: 800
    max: 1200
    ood_boundary: 1000
    distribution: uniform
- name: beta
  description: Bypass-to-throat volumetric-flow ratio.
  unit: '1'
  role: internal
- name: Q_throat
  description: Throat flow from inlet/bypass mass balance.
  unit: m^3 s^-1
  role: internal
- name: v_in
  description: Section-averaged inlet speed.
  unit: m s^-1
  role: internal
- name: v_throat
  description: Section-averaged throat speed.
  unit: m s^-1
  role: internal
- name: p_loss
  description: Irreversible mechanical-energy loss per fluid volume along the throat path.
  unit: Pa
  role: internal
- name: dp
  description: Inlet-minus-throat pressure from steady mechanical-energy balance.
  unit: Pa
  role: target
mechanism_probes:
- probe: Q_throat
  description: Volumetric flow passing through the throat after the unobserved bypass split.
  answer: Q_throat = 5*Q*Q0/(Q + 6*Q0)
- probe: p_loss
  description: Irreversible mechanical-energy dissipation per unit fluid volume along the throat path.
  answer: p_loss = 15*Q**2*Q0**2*rho/(2*A2**2*(Q + 6*Q0)**2)
