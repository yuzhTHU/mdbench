problem_name: Stokes Terminal Velocity - Original
phenomenological_formula: v = 2 * r**2 * g * (rho_1 - rho_2) / (9 * u)
problem_description: A physics benchmark that relates the target quantity to experimentally specified parameters.
variable_description:
  target:
    name: v
    description: Velocity
    unit: m s^-1
  inputs:
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 9.7
      max: 9.9
      ood_boundary: 9.81
      distribution: uniform
  - name: r
    description: Characteristic radius
    unit: m
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  - name: rho_1
    description: Particle density
    unit: kg m^-3
    sampling:
      min: 1200.0
      max: 8000.0
      ood_boundary: 3000.0
      distribution: log_uniform
  - name: rho_2
    description: Fluid density
    unit: kg m^-3
    sampling:
      min: 1.0
      max: 1000.0
      ood_boundary: 100.0
      distribution: log_uniform
  - name: u
    description: Dynamic viscosity or specific dissipation
    unit: kg m^-1 s^-1
    sampling:
      min: 0.0001
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  intermediates:
  - name: V
    description: Volume
    unit: m^3
  - name: m_p
    description: Physical quantity m_p
    unit: kg
  - name: F_g
    description: Physical quantity F_g
    unit: kg m s^-2
  - name: F_b
    description: Physical quantity F_b
    unit: kg m s^-2
  - name: F
    description: Force
    unit: kg m s^-2
  - name: b
    description: Dimensionless absorption coefficient or drag coefficient
    unit: kg s^-1
  auxiliary_inputs: []
constants:
- name: pi
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: V = 4 * pi * r**3 / 3
  formula_description: Physical relationship that determines V.
- formula: m_p = rho_1 * V
  formula_description: Physical relationship that determines m_p.
- formula: F_g = m_p * g
  formula_description: Physical relationship that determines F_g.
- formula: F_b = rho_2 * V * g
  formula_description: Physical relationship that determines F_b.
- formula: F = F_g - F_b
  formula_description: Physical relationship that determines F.
- formula: b = 6 * pi * u * r
  formula_description: Physical relationship that determines b.
- formula: v = F / b
  formula_description: Physical relationship that determines v.
