task_name: Geoscience Box Carbon Cycle - Variant 1-2-3-5
task_description: Relate external carbon supply and exchange rates to the steady atmospheric carbon concentration in a reservoir
  system.
mutation: Combines variants 1&2&3&5; all constitutive changes enter the same simultaneous balances.
mechanism_model:
- formula: b0 = 1/5000000000
  role: auxiliary/regime constraints
  description: Reference ocean burial rate
- formula: bl = 3/10000000000
  role: auxiliary/regime constraints
  description: Terrestrial burial rate
- formula: r0 = 7/10000000000
  role: auxiliary/regime constraints
  description: Reference terrestrial return rate
- formula: bo = b0*(37*ka/(100*ko) + 1)
  role: constitutive/component relations
  description: Ocean burial rate
- formula: E0 = 1/10000000000
  role: auxiliary/regime constraints
  description: Source reference scale
- formula: rl = r0/(21*E/(100*E0) + 1)
  role: constitutive/component relations
  description: Terrestrial carbon return rate
- formula: h = 17*ka*kl/(100*(ka + kl))
  role: constitutive/component relations
  description: Ocean-land exchange rate
- formula: p = 0
  role: constitutive/component relations
  description: Direct terrestrial source fraction
- formula: g = 23*ka*kl/(100*(ka + kl))
  role: constitutive/component relations
  description: Atmospheric mineral export rate
- formula: c*ka + h*land = o*(bo + h + ko)
  role: conservation/balance relations
  description: Ocean inflows balance atmospheric return, burial, and terrestrial exchange
- formula: E*p + c*kl + h*o = land*(bl + h + rl)
  role: conservation/balance relations
  description: Terrestrial inflows balance atmospheric return, burial, and ocean exchange
- formula: E*(1 - p) + ko*o + land*rl = c*(g + ka + kl)
  role: conservation/balance relations
  description: Atmospheric inflows balance reservoir uptake and mineral export
phenomenal_model: c = 100*E*(ka + kl)*(13209000000000000000.0*E*ka**2*kl + 23310000000*E*ka**2 + 178500000000000000000000000000.0*E*ka*kl*ko**2
  + 89250000000000000000.0*E*ka*kl*ko + 23310000000*E*ka*kl + 315000000000000000000.0*E*ka*ko**2 + 63000000000*E*ka*ko + 315000000000000000000.0*E*kl*ko**2
  + 63000000000*E*kl*ko + 6290000000*ka**2*kl + 37*ka**2 + 85000000000000000000.0*ka*kl*ko**2 + 102000000000*ka*kl*ko + 37*ka*kl
  + 500000000000*ka*ko**2 + 100*ka*ko + 500000000000*kl*ko**2 + 100*kl*ko)/(1320900000000000000000.0*E*ka**4*kl + 2331000000000*E*ka**4
  + 2945607000000000000000.0*E*ka**3*kl**2 + 8925000000000000000000.0*E*ka**3*kl*ko + 7529130000000*E*ka**3*kl + 6300000000000*E*ka**3*ko
  + 1320900000000000000000.0*E*ka**2*kl**3 + 4105500000000000000000000000000.0*E*ka**2*kl**2*ko**2 + 19902750000000000000000.0*E*ka**2*kl**2*ko
  + 7529130000000*E*ka**2*kl**2 + 38745000000000000000000.0*E*ka**2*kl*ko**2 + 20349000000000*E*ka**2*kl*ko + 8925000000000000000000.0*E*ka*kl**3*ko
  + 2331000000000*E*ka*kl**3 + 70245000000000000000000.0*E*ka*kl**2*ko**2 + 20349000000000*E*ka*kl**2*ko + 31500000000000000000000.0*E*kl**3*ko**2
  + 6300000000000*E*kl**3*ko + 629000000000*ka**4*kl + 3700*ka**4 + 1402670000000*ka**3*kl**2 + 4250000000000*ka**3*kl*ko
  + 9361*ka**3*kl + 10000*ka**3*ko + 629000000000*ka**2*kl**3 + 1955000000000000000000.0*ka**2*kl**2*ko**2 + 10846000000000*ka**2*kl**2*ko
  + 6771*ka**2*kl**2 + 26500000000000*ka**2*kl*ko**2 + 25300*ka**2*kl*ko + 4250000000000*ka*kl**3*ko + 1110*ka*kl**3 + 41500000000000*ka*kl**2*ko**2
  + 18300*ka*kl**2*ko + 15000000000000*kl**3*ko**2 + 3000*kl**3*ko)
variables:
- name: E
  description: External carbon source per reference volume
  unit: kg m^-3 s^-1
  role: input
  sampling:
    min: 1.0e-11
    max: 5.0e-10
    ood_boundary: 1.0e-10
    distribution: log_uniform
- name: ka
  description: Reference atmosphere-to-ocean exchange rate
  unit: s^-1
  role: input
  sampling:
    min: 1.0e-10
    max: 2.0e-09
    ood_boundary: 5.0e-10
    distribution: log_uniform
- name: ko
  description: Reference ocean-to-atmosphere exchange rate
  unit: s^-1
  role: input
  sampling:
    min: 2.0e-10
    max: 3.0e-09
    ood_boundary: 8.0e-10
    distribution: log_uniform
- name: kl
  description: Reference atmosphere-to-land exchange rate
  unit: s^-1
  role: input
  sampling:
    min: 1.0e-10
    max: 1.0e-09
    ood_boundary: 4.0e-10
    distribution: log_uniform
- name: c
  description: Steady atmospheric carbon concentration
  unit: kg m^-3
  role: target
- name: b0
  description: Reference ocean burial rate
  unit: s^-1
  role: internal
- name: bl
  description: Terrestrial burial rate
  unit: s^-1
  role: internal
- name: r0
  description: Reference terrestrial return rate
  unit: s^-1
  role: internal
- name: bo
  description: Ocean burial rate
  unit: s^-1
  role: internal
- name: E0
  description: Source reference scale
  unit: kg m^-3 s^-1
  role: internal
- name: rl
  description: Terrestrial carbon return rate
  unit: s^-1
  role: internal
- name: h
  description: Ocean-land exchange rate
  unit: s^-1
  role: internal
- name: p
  description: Direct terrestrial source fraction
  unit: '1'
  role: internal
- name: g
  description: Atmospheric mineral export rate
  unit: s^-1
  role: internal
- name: o
  description: Steady ocean carbon concentration
  unit: kg m^-3
  role: internal
- name: land
  description: Steady terrestrial carbon concentration
  unit: kg m^-3
  role: internal
mechanism_probes:
- probe: o
  description: Steady ocean carbon concentration
  answer: 50000000000000*E*ka*ko*(ka + kl)**2*(357000000000000000.0*E*kl + 630000000*E + 170000000*kl + 1)/(1320900000000000000000.0*E*ka**4*kl
    + 2331000000000*E*ka**4 + 2945607000000000000000.0*E*ka**3*kl**2 + 8925000000000000000000.0*E*ka**3*kl*ko + 7529130000000*E*ka**3*kl
    + 6300000000000*E*ka**3*ko + 1320900000000000000000.0*E*ka**2*kl**3 + 4105500000000000000000000000000.0*E*ka**2*kl**2*ko**2
    + 19902750000000000000000.0*E*ka**2*kl**2*ko + 7529130000000*E*ka**2*kl**2 + 38745000000000000000000.0*E*ka**2*kl*ko**2
    + 20349000000000*E*ka**2*kl*ko + 8925000000000000000000.0*E*ka*kl**3*ko + 2331000000000*E*ka*kl**3 + 70245000000000000000000.0*E*ka*kl**2*ko**2
    + 20349000000000*E*ka*kl**2*ko + 31500000000000000000000.0*E*kl**3*ko**2 + 6300000000000*E*kl**3*ko + 629000000000*ka**4*kl
    + 3700*ka**4 + 1402670000000*ka**3*kl**2 + 4250000000000*ka**3*kl*ko + 9361*ka**3*kl + 10000*ka**3*ko + 629000000000*ka**2*kl**3
    + 1955000000000000000000.0*ka**2*kl**2*ko**2 + 10846000000000*ka**2*kl**2*ko + 6771*ka**2*kl**2 + 26500000000000*ka**2*kl*ko**2
    + 25300*ka**2*kl*ko + 4250000000000*ka*kl**3*ko + 1110*ka*kl**3 + 41500000000000*ka*kl**2*ko**2 + 18300*ka*kl**2*ko +
    15000000000000*kl**3*ko**2 + 3000*kl**3*ko)
- probe: land
  description: Steady terrestrial carbon concentration
  answer: 100000000000*E*kl*(2100000000*E + 1)*(ka + kl)**2*(85000000000*ka*ko + 37*ka + 500000000000*ko**2 + 100*ko)/(1320900000000000000000.0*E*ka**4*kl
    + 2331000000000*E*ka**4 + 2945607000000000000000.0*E*ka**3*kl**2 + 8925000000000000000000.0*E*ka**3*kl*ko + 7529130000000*E*ka**3*kl
    + 6300000000000*E*ka**3*ko + 1320900000000000000000.0*E*ka**2*kl**3 + 4105500000000000000000000000000.0*E*ka**2*kl**2*ko**2
    + 19902750000000000000000.0*E*ka**2*kl**2*ko + 7529130000000*E*ka**2*kl**2 + 38745000000000000000000.0*E*ka**2*kl*ko**2
    + 20349000000000*E*ka**2*kl*ko + 8925000000000000000000.0*E*ka*kl**3*ko + 2331000000000*E*ka*kl**3 + 70245000000000000000000.0*E*ka*kl**2*ko**2
    + 20349000000000*E*ka*kl**2*ko + 31500000000000000000000.0*E*kl**3*ko**2 + 6300000000000*E*kl**3*ko + 629000000000*ka**4*kl
    + 3700*ka**4 + 1402670000000*ka**3*kl**2 + 4250000000000*ka**3*kl*ko + 9361*ka**3*kl + 10000*ka**3*ko + 629000000000*ka**2*kl**3
    + 1955000000000000000000.0*ka**2*kl**2*ko**2 + 10846000000000*ka**2*kl**2*ko + 6771*ka**2*kl**2 + 26500000000000*ka**2*kl*ko**2
    + 25300*ka**2*kl*ko + 4250000000000*ka*kl**3*ko + 1110*ka*kl**3 + 41500000000000*ka*kl**2*ko**2 + 18300*ka*kl**2*ko +
    15000000000000*kl**3*ko**2 + 3000*kl**3*ko)
