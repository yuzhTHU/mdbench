task_name: Geoscience Box Carbon Cycle - Variant 2-3-4-5
task_description: Carbon moves between the atmosphere and environmental reservoirs under a sustained external supply. The target is the steady atmospheric carbon concentration.
mutation: Combines variants 2&3&4&5; all constitutive changes enter the same simultaneous balances.
mechanism_model:
- formula: b0 = 1/5000000000
  role: auxiliary/regime constraints
  description: Reference ocean burial rate
- formula: bl = 3/10000000000
  role: auxiliary/regime constraints
  description: Terrestrial burial rate
- formula: r0 = 7/10000000000
  role: auxiliary/regime constraints
  description: Reference terrestrial return rate
- formula: bo = b0
  role: constitutive/component relations
  description: Ocean burial rate
- formula: E0 = 1/10000000000
  role: auxiliary/regime constraints
  description: Source reference scale
- formula: rl = r0/(21*E/(100*E0) + 1)
  role: constitutive/component relations
  description: Terrestrial carbon return rate
- formula: h = 17*ka*kl/(100*(ka + kl))
  role: constitutive/component relations
  description: Ocean-land exchange rate
- formula: p = 13*kl/(100*(kl + ko))
  role: constitutive/component relations
  description: Direct terrestrial source fraction
- formula: g = 23*ka*kl/(100*(ka + kl))
  role: constitutive/component relations
  description: Atmospheric mineral export rate
- formula: c*ka + h*land = o*(bo + h + ko)
  role: conservation/balance relations
  description: Ocean inflows balance atmospheric return, burial, and terrestrial exchange
- formula: E*p + c*kl + h*o = land*(bl + h + rl)
  role: conservation/balance relations
  description: Terrestrial inflows balance atmospheric return, burial, and ocean exchange
- formula: E*(1 - p) + ko*o + land*rl = c*(g + ka + kl)
  role: conservation/balance relations
  description: Atmospheric inflows balance reservoir uptake and mineral export
phenomenal_model: c = E*(ka + kl)*(1785000000000000000000000000000.0*E*ka*kl**2*ko + 776475000000000000000.0*E*ka*kl**2 +
  1785000000000000000000000000000.0*E*ka*kl*ko**2 + 3633000000000000000000.0*E*ka*kl*ko + 548100000000*E*ka*kl + 3150000000000000000000.0*E*ka*ko**2
  + 630000000000*E*ka*ko + 2740500000000000000000.0*E*kl**2*ko + 548100000000*E*kl**2 + 3150000000000000000000.0*E*kl*ko**2
  + 630000000000*E*kl*ko + 850000000000000000000.0*ka*kl**2*ko + 964750000000*ka*kl**2 + 850000000000000000000.0*ka*kl*ko**2
  + 5825000000000*ka*kl*ko + 961*ka*kl + 5000000000000*ka*ko**2 + 1000*ka*ko + 4805000000000*kl**2*ko + 961*kl**2 + 5000000000000*kl*ko**2
  + 1000*kl*ko)/(10*(kl + ko)*(89250000000000000000.0*E*ka**3*kl + 63000000000*E*ka**3 + 41055000000000000000000000000.0*E*ka**2*kl**2*ko
  + 199027500000000000000.0*E*ka**2*kl**2 + 387450000000000000000.0*E*ka**2*kl*ko + 203490000000*E*ka**2*kl + 89250000000000000000.0*E*ka*kl**3
  + 702450000000000000000.0*E*ka*kl**2*ko + 203490000000*E*ka*kl**2 + 315000000000000000000.0*E*kl**3*ko + 63000000000*E*kl**3
  + 42500000000*ka**3*kl + 100*ka**3 + 19550000000000000000.0*ka**2*kl**2*ko + 108460000000*ka**2*kl**2 + 265000000000*ka**2*kl*ko
  + 253*ka**2*kl + 42500000000*ka*kl**3 + 415000000000*ka*kl**2*ko + 183*ka*kl**2 + 150000000000*kl**3*ko + 30*kl**3))
variables:
- name: E
  description: External carbon source per reference volume
  unit: kg m^-3 s^-1
  role: input
  sampling:
    min: 1.0e-11
    max: 5.0e-10
    ood_boundary: 1.0e-10
    distribution: log_uniform
- name: ka
  description: Reference atmosphere-to-ocean exchange rate
  unit: s^-1
  role: input
  sampling:
    min: 1.0e-10
    max: 2.0e-09
    ood_boundary: 5.0e-10
    distribution: log_uniform
- name: ko
  description: Reference ocean-to-atmosphere exchange rate
  unit: s^-1
  role: input
  sampling:
    min: 2.0e-10
    max: 3.0e-09
    ood_boundary: 8.0e-10
    distribution: log_uniform
- name: kl
  description: Reference atmosphere-to-land exchange rate
  unit: s^-1
  role: input
  sampling:
    min: 1.0e-10
    max: 1.0e-09
    ood_boundary: 4.0e-10
    distribution: log_uniform
- name: c
  description: Steady atmospheric carbon concentration
  unit: kg m^-3
  role: target
- name: b0
  description: Reference ocean burial rate
  unit: s^-1
  role: internal
- name: bl
  description: Terrestrial burial rate
  unit: s^-1
  role: internal
- name: r0
  description: Reference terrestrial return rate
  unit: s^-1
  role: internal
- name: bo
  description: Ocean burial rate
  unit: s^-1
  role: internal
- name: E0
  description: Source reference scale
  unit: kg m^-3 s^-1
  role: internal
- name: rl
  description: Terrestrial carbon return rate
  unit: s^-1
  role: internal
- name: h
  description: Ocean-land exchange rate
  unit: s^-1
  role: internal
- name: p
  description: Direct terrestrial source fraction
  unit: '1'
  role: internal
- name: g
  description: Atmospheric mineral export rate
  unit: s^-1
  role: internal
- name: o
  description: Steady ocean carbon concentration
  unit: kg m^-3
  role: internal
- name: land
  description: Steady terrestrial carbon concentration
  unit: kg m^-3
  role: internal
mechanism_probes:
- probe: o
  description: Steady ocean carbon concentration
  answer: 500000000*E*ka*(357000000000000000000.0*E*ka**2*kl**2 + 357000000000000000000.0*E*ka**2*kl*ko + 548100000000*E*ka**2*kl
    + 630000000000*E*ka**2*ko + 724674300000000000000.0*E*ka*kl**3 + 714000000000000000000.0*E*ka*kl**2*ko + 1096200000000*E*ka*kl**2
    + 1260000000000*E*ka*kl*ko + 357000000000000000000.0*E*kl**4 + 357000000000000000000.0*E*kl**3*ko + 548100000000*E*kl**3
    + 630000000000*E*kl**2*ko + 170000000000*ka**2*kl**2 + 170000000000*ka**2*kl*ko + 961*ka**2*kl + 1000*ka**2*ko + 345083000000*ka*kl**3
    + 340000000000*ka*kl**2*ko + 1922*ka*kl**2 + 2000*ka*kl*ko + 170000000000*kl**4 + 170000000000*kl**3*ko + 961*kl**3 +
    1000*kl**2*ko)/((kl + ko)*(89250000000000000000.0*E*ka**3*kl + 63000000000*E*ka**3 + 41055000000000000000000000000.0*E*ka**2*kl**2*ko
    + 199027500000000000000.0*E*ka**2*kl**2 + 387450000000000000000.0*E*ka**2*kl*ko + 203490000000*E*ka**2*kl + 89250000000000000000.0*E*ka*kl**3
    + 702450000000000000000.0*E*ka*kl**2*ko + 203490000000*E*ka*kl**2 + 315000000000000000000.0*E*kl**3*ko + 63000000000*E*kl**3
    + 42500000000*ka**3*kl + 100*ka**3 + 19550000000000000000.0*ka**2*kl**2*ko + 108460000000*ka**2*kl**2 + 265000000000*ka**2*kl*ko
    + 253*ka**2*kl + 42500000000*ka*kl**3 + 415000000000*ka*kl**2*ko + 183*ka*kl**2 + 150000000000*kl**3*ko + 30*kl**3))
- probe: land
  description: Steady terrestrial carbon concentration
  answer: 10000000*E*kl*(2100000000*E + 1)*(8500000000000*ka**3*kl + 8500000000000*ka**3*ko + 1300*ka**3 + 17254150000000*ka**2*kl**2
    + 68495000000000*ka**2*kl*ko + 12899*ka**2*kl + 50000000000000*ka**2*ko**2 + 10000*ka**2*ko + 8500000000000*ka*kl**3 +
    109995000000000*ka*kl**2*ko + 21599*ka*kl**2 + 100000000000000*ka*kl*ko**2 + 20000*ka*kl*ko + 50000000000000*kl**3*ko
    + 10000*kl**3 + 50000000000000*kl**2*ko**2 + 10000*kl**2*ko)/((kl + ko)*(89250000000000000000.0*E*ka**3*kl + 63000000000*E*ka**3
    + 41055000000000000000000000000.0*E*ka**2*kl**2*ko + 199027500000000000000.0*E*ka**2*kl**2 + 387450000000000000000.0*E*ka**2*kl*ko
    + 203490000000*E*ka**2*kl + 89250000000000000000.0*E*ka*kl**3 + 702450000000000000000.0*E*ka*kl**2*ko + 203490000000*E*ka*kl**2
    + 315000000000000000000.0*E*kl**3*ko + 63000000000*E*kl**3 + 42500000000*ka**3*kl + 100*ka**3 + 19550000000000000000.0*ka**2*kl**2*ko
    + 108460000000*ka**2*kl**2 + 265000000000*ka**2*kl*ko + 253*ka**2*kl + 42500000000*ka*kl**3 + 415000000000*ka*kl**2*ko
    + 183*ka*kl**2 + 150000000000*kl**3*ko + 30*kl**3))
