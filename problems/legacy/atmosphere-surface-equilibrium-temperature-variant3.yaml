problem_name: Atmosphere-Surface Equilibrium Temperature - Variant 3
phenomenological_formula: T = (((1 - a) * S / 4 - 10.0) / (s * (1 - b / 2)))**(1/4)
problem_description: A planet receives stellar radiation and exchanges radiative energy with its atmosphere and space, eventually reaching thermal equilibrium.

variable_description:
  target:
    name: T
    description: Surface equilibrium temperature
    unit: K

  inputs:
  - name: S
    description: Incident stellar flux
    unit: kg s^-3
    sampling: {min: 1200.0, max: 1500.0, ood_boundary: 1361.0, distribution: uniform}
  - name: a
    description: Planetary shortwave albedo
    unit: 1 (dimensionless)
    sampling: {min: 0.1, max: 0.6, ood_boundary: 0.3, distribution: uniform}
  - name: b
    description: Atmospheric longwave absorptivity
    unit: 1 (dimensionless)
    sampling: {min: 0.05, max: 0.8, ood_boundary: 0.4, distribution: uniform}

  intermediates:
  - name: P_in
    description: Absorbed stellar power
    unit: kg m^2 s^-3
  - name: P_emit
    description: Surface emission power
    unit: kg m^2 s^-3
  - name: P_abs
    description: Atmosphere-absorbed power
    unit: kg m^2 s^-3
  - name: P_back
    description: Downward atmospheric power
    unit: kg m^2 s^-3
  - name: E
    description: Surface emission flux
    unit: kg s^-3
  - name: P_loss
    description: Non-radiative surface energy loss
    unit: kg m^2 s^-3

  auxiliary_inputs:
  - name: R
    description: Planetary radius
    unit: m
    sampling: {min: 5.0e6, max: 8.0e6, ood_boundary: 6.5e6, distribution: uniform}

constants:
- name: s
  description: Stefan-Boltzmann constant
  value: 5.670374419e-08
  unit: kg s^-3 K^-4

mechanism:
- formula: P_in = 3.141592653589793 * R**2 * (1 - a) * S
  formula_description: The planet intercepts stellar radiation over its cross-sectional area, with a fraction 1-a absorbed.
- formula: P_emit = 4 * 3.141592653589793 * R**2 * E
  formula_description: The entire planetary surface emits longwave radiation with flux E.
- formula: P_abs = b * P_emit
  formula_description: The atmosphere absorbs a fraction b of the surface longwave emission.
- formula: P_back = P_abs / 2
  formula_description: Under isotropic atmospheric re-emission, half of the absorbed longwave radiation is emitted back toward the surface.
- formula: P_loss = 4 * 3.141592653589793 * R**2 * 10.0
  formula_description: A uniform non-radiative energy-loss flux acts over the entire planetary surface.
- formula: P_emit = P_in + P_back - P_loss
  formula_description: At equilibrium, surface emission balances absorbed stellar radiation and downward atmospheric radiation after accounting for non-radiative energy loss.
- formula: E = s * T**4
  formula_description: The surface longwave emission flux follows the Stefan-Boltzmann law.

aha: 热量流失正比于行星表面积
understanding_checking:
- question: Give the equation for H_atm, the total radiative and non-radiative power heating the atmosphere.
  answer: H_atm = P_abs = b*P_emit
- question: Give the equation for P_back, the atmospheric longwave power reaching the surface.
  answer: P_back = P_abs/2 = b*P_emit/2
- question: Give the equation for Q_surface, the net non-radiative power removed from the surface.
  answer: Q_surface = P_in + P_back - P_emit = P_loss = 40*pi*R**2
- question: Give the equation for P_LW_out, the total longwave power escaping the planet-atmosphere system, in terms
    of absorbed stellar power P_in and any existing external non-radiative loss.
  answer: P_LW_out = (1-b)*P_emit + P_back = P_in - P_loss
- question: Give the equation and resulting value of r_atm, total atmospheric input power minus total atmospheric
    output power.
  answer: r_atm = b*P_emit - 2*P_back = 0
