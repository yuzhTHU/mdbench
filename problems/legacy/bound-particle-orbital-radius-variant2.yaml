problem_name: Bound-Particle Orbital Radius - Variant 2
phenomenological_formula: r = 2 * hbar**2 / (m * q**2 / (4 * 3.141592653589793 * eps) + sqrt((m * q**2 / (4 * 3.141592653589793 * eps))**2 + 4 * q * 5.0e4 * hbar**3))
problem_description: A charged particle occupies a bound circular orbit around a fixed center carrying an equal-magnitude, opposite-sign charge.

variable_description:
  target:
    name: r
    description: Orbital radius of the charged particle
    unit: m

  inputs:
  - name: m
    description: Mass of the charged particle
    unit: kg
    sampling: {min: 3.0e-31, max: 3.0e-30, ood_boundary: 1.5e-30, distribution: log_uniform}
  - name: q
    description: Magnitude of the particle and central charges
    unit: A s
    sampling: {min: 8.0e-20, max: 3.2e-19, ood_boundary: 2.4e-19, distribution: uniform}

  intermediates:
  - name: F_C
    description: Magnitude of the Coulomb attraction
    unit: kg m s^-2
  - name: F_B
    description: Magnitude of the magnetic force on the orbiting particle
    unit: kg m s^-2
  - name: F_in
    description: Net inward force required for circular motion
    unit: kg m s^-2
  - name: v
    description: Orbital speed of the charged particle
    unit: m s^-1
  - name: L
    description: Orbital angular momentum of the charged particle
    unit: kg m^2 s^-1
  - name: B
    description: Strength of the uniform magnetic field perpendicular to the orbital plane
    unit: kg s^-2 A^-1

  auxiliary_inputs: []

constants:
- name: eps
  description: Vacuum permittivity
  value: 8.8541878128e-12
  unit: kg^-1 m^-3 s^4 A^2
- name: hbar
  description: Reduced Planck constant
  value: 1.054571817e-34
  unit: kg m^2 s^-1

mechanism:
- formula: F_C = q * q / (4 * 3.141592653589793 * eps * r**2)
  formula_description: Coulomb's law gives the attractive force between the two opposite charges.
- formula: B = 5.0e4
  formula_description: The uniform magnetic field strength.
- formula: F_B = q * v * B
  formula_description: A charged particle moving perpendicular to a magnetic field experiences a magnetic force of magnitude q * v * B.
- formula: F_in = m * v**2 / r
  formula_description: Circular motion at speed v and radius r requires a net inward force of magnitude m * v**2 / r.
- formula: F_in = F_C + F_B
  formula_description: The Coulomb attraction and magnetic force both point inward and together supply the required inward force.
- formula: L = m * v * r
  formula_description: Definition of the orbital angular momentum.
- formula: L = 1 * hbar
  formula_description: The lowest Bohr orbit has orbital angular momentum equal to one reduced Planck constant.

