problem_name: Michaelis-Menten Kinetics - Hill Cooperativity
phenomenological_formula: v = k_cat * E_T * S^2 / ((k_off + k_cat) / k_on + S^2)
problem_description: An enzyme converts a substrate into a product. The target is the initial reaction rate under the supplied conditions.
variable_description:
  target:
    name: v
    description: Initial reaction rate with cooperative binding
    unit: mol m^-3 s^-1
  inputs:
  - name: k_cat
    description: Catalytic turnover constant
    unit: s^-1
    sampling:
      min: 0.1
      max: 1000.0
      ood_boundary: 10.0
      distribution: log_uniform
  - name: E_T
    description: Total enzyme concentration
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  - name: S
    description: Substrate concentration
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  - name: k_on
    description: Coarse-grained association rate constant for cooperative two-substrate binding
    unit: m^6 mol^-2 s^-1
    sampling:
      min: 10000.0
      max: 100000000000000.0
      ood_boundary: 100000000.0
      distribution: log_uniform
  - name: k_off
    description: Dissociation rate constant of the cooperative substrate-bound complex
    unit: s^-1
    sampling:
      min: 0.01
      max: 1000.0
      ood_boundary: 10.0
      distribution: log_uniform
  intermediates:
  - name: E_free
    description: Free enzyme concentration
    unit: mol m^-3
  - name: C_complex
    description: Cooperative substrate-bound active complex concentration
    unit: mol m^-3
  - name: r_on
    description: Formation rate of the cooperative substrate-bound complex
    unit: mol m^-3 s^-1
  - name: r_off
    description: Dissociation rate of the cooperative substrate-bound complex
    unit: mol m^-3 s^-1
  - name: r_cat
    description: Catalytic turnover rate of the cooperative complex
    unit: mol m^-3 s^-1
  auxiliary_inputs: []
constants: []
mechanism:
- formula: r_on = k_on * E_free * S^2
  formula_description: Coarse-grained mass-action association rate for concerted formation of the two-substrate cooperative complex
- formula: r_off = k_off * C_complex
  formula_description: Mass-action dissociation rate for the cooperative complex returning to free enzyme and substrate
- formula: r_cat = k_cat * C_complex
  formula_description: First-order catalytic turnover rate for the cooperative complex producing product and free enzyme
- formula: r_on = r_off + r_cat
  formula_description: Quasi-steady-state balance for the cooperative complex, setting its net accumulation to zero
- formula: E_T = E_free + C_complex
  formula_description: Conservation of total enzyme between free enzyme and cooperative substrate-bound complex
- formula: v = r_cat
  formula_description: Definition of the observed initial product-formation rate as the catalytic flux
