problem_name: Bohr Radius - Inverse Restoring Force
phenomenological_formula: r = h / sqrt(m * k)
problem_description: A physics benchmark that relates the target quantity to experimentally specified parameters.
variable_description:
  target:
    name: r
    description: Characteristic radius
    unit: m
  inputs:
  - name: k
    description: Model coefficient
    unit: kg m^2 s^-2
    sampling:
      min: 0.0001
      max: 0.01
      ood_boundary: 0.001
      distribution: log_uniform
  - name: m
    description: Mass
    unit: kg
    sampling:
      min: 1.0e-30
      max: 1.0e-18
      ood_boundary: 1.0e-24
      distribution: log_uniform
  intermediates:
  - name: n
    description: Dimensionless quantum or layer number
    unit: 1 (dimensionless)
  - name: L
    description: Physical quantity L
    unit: kg m^2 s^-1
  - name: v
    description: Velocity
    unit: m s^-1
  auxiliary_inputs: []
constants:
- name: h
  description: Planck constant
  value: 6.62607015e-34
  unit: kg m^2 s^-1
mechanism:
- formula: n = 1
  formula_description: Physical relationship that determines n.
- formula: L = n * h
  formula_description: Physical relationship that determines L.
- formula: v = sqrt(k / m)
  formula_description: Physical relationship that determines v.
- formula: r = L / (m * v)
  formula_description: Physical relationship that determines r.
