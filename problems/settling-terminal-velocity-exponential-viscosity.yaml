problem_name: Settling Terminal Velocity - Exponential Viscosity Profile
phenomenological_formula: v_T = 2 * r^2 * g * (rho_p - rho_f) / (9 * u_0 * exp(beta * z))
problem_description: |
  A sphere settles slowly through a fluid whose viscosity varies with depth. This variant replaces constant viscosity with a local viscosity that increases exponentially with depth z. The formula gives the local quasi-steady terminal velocity when the sphere is small relative to the viscosity-variation scale, relaxation is fast, and local Stokes drag applies.
variable_description:
  target: {name: v_T, description: Local terminal settling velocity at depth z, unit: m s^-1}
  inputs:
    - {name: r, description: Sphere radius, unit: m, sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}}
    - {name: g, description: Gravitational acceleration, unit: m s^-2, sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}}
    - {name: rho_p, description: Sphere material density, unit: kg m^-3, sampling: {min: 1.5e3, max: 8.0e3, ood_boundary: 4.0e3, distribution: uniform}}
    - {name: rho_f, description: Fluid density, unit: kg m^-3, sampling: {min: 5.0e2, max: 1.2e3, ood_boundary: 9.0e2, distribution: uniform}}
    - {name: u_0, description: Fluid dynamic viscosity at the reference depth, unit: kg m^-1 s^-1, sampling: {min: 1.0e-4, max: 1.0, ood_boundary: 1.0e-2, distribution: log_uniform}}
    - {name: beta, description: Exponential depth coefficient of viscosity, unit: m^-1, sampling: {min: 1.0e-3, max: 0.5, ood_boundary: 0.1, distribution: log_uniform}}
    - {name: z, description: Depth measured downward from the reference surface, unit: m, sampling: {min: 0.0, max: 10.0, ood_boundary: 5.0, distribution: uniform}}
  intermediates:
    - {name: V, description: Sphere volume, unit: m^3}
    - {name: m, description: Sphere mass, unit: kg}
    - {name: F_g, description: Gravitational force on the sphere, unit: kg m s^-2}
    - {name: F_b, description: Buoyant force on the sphere, unit: kg m s^-2}
    - {name: F, description: Effective driving force, unit: kg m s^-2}
    - {name: u_z, description: Local dynamic viscosity at depth z, unit: kg m^-1 s^-1}
    - {name: b, description: Depth-dependent linear drag coefficient, unit: kg s^-1}
  auxiliary_inputs: []
constants:
  - {name: π, description: Pi, value: 3.141592653589793, unit: 1 (dimensionless)}
mechanism:
  - {formula: V = 4 * π * r^3 / 3, formula_description: Volume of a sphere}
  - {formula: m = rho_p * V, formula_description: Mass-density relation}
  - {formula: F_g = m * g, formula_description: Gravitational force}
  - {formula: F_b = rho_f * V * g, formula_description: Archimedes' buoyancy law}
  - {formula: F = F_g - F_b, formula_description: Effective driving force}
  - {formula: u_z = u_0 * exp(beta * z), formula_description: Exponential depth-dependent viscosity replacing constant viscosity}
  - {formula: b = 6 * π * u_z * r, formula_description: Stokes drag coefficient using local viscosity}
  - {formula: v_T = F / b, formula_description: Local terminal-velocity force balance}
