problem_name: Atwood Machine Acceleration - One Side Buoyant
phenomenological_formula: a = g * (m1 - m2 + rho_f * V2) / (m1 + m2)
problem_description: The lighter side is immersed in a fluid. Buoyancy reduces its apparent weight while drag and added mass are neglected.
variable_description:
  target:
    name: a
    description: Acceleration magnitude with m1 descending
    unit: m s^-2
  inputs:
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 1.0
      max: 20.0
      ood_boundary: 10.0
      distribution: uniform
  - name: m1
    description: Mass on the descending side
    unit: kg
    sampling:
      min: 0.2
      max: 10.0
      ood_boundary: 2.0
      distribution: log_uniform
  - name: m2
    description: Mass on the ascending side
    unit: kg
    sampling:
      min: 0.05
      max: 5.0
      ood_boundary: 1.0
      distribution: log_uniform
  - name: rho_f
    description: Fluid density
    unit: kg m^-3
    sampling:
      min: 500.0
      max: 1300.0
      ood_boundary: 1000.0
      distribution: uniform
  - name: V2
    description: Displaced volume of the immersed mass
    unit: m^3
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  intermediates:
  - name: F_b
    description: Buoyant force on the immersed body
    unit: kg m s^-2
  - name: W2_app
    description: Apparent weight of the immersed side
    unit: kg m s^-2
  - name: W1
    description: Weight of the descending side
    unit: kg m s^-2
  - name: F_drive
    description: Net drive from apparent weight difference
    unit: kg m s^-2
  - name: M_eff
    description: Effective inertial mass of the translating bodies
    unit: kg
  auxiliary_inputs: []
constants: []
mechanism:
- formula: F_b = rho_f * V2 * g
  formula_description: Archimedes buoyancy force on the immersed side
- formula: W2_app = m2 * g - F_b
  formula_description: Apparent weight after buoyancy
- formula: W1 = m1 * g
  formula_description: Weight of the descending side
- formula: F_drive = W1 - W2_app
  formula_description: Driving force from apparent weight difference
- formula: M_eff = m1 + m2
  formula_description: Effective inertia from the two translating masses
- formula: a = F_drive / M_eff
  formula_description: Newton second law for the full system
