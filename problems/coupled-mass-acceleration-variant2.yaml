problem_name: Coupled-Mass Acceleration - Variant 2
phenomenological_formula: a = ((m1 - m2) * g - tau_b / R) / (m1 + m2)
problem_description: Two bodies connected by a string over a pulley move vertically under gravity. The target is their common acceleration.
variable_description:
  target:
    name: a
    description: Common vertical acceleration magnitude
    unit: m s^-2
  inputs:
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 1.0
      max: 20.0
      ood_boundary: 10.0
      distribution: uniform
  - name: m1
    description: Mass of body 1
    unit: kg
    sampling:
      min: 0.2
      max: 10.0
      ood_boundary: 2.0
      distribution: log_uniform
  - name: m2
    description: Mass of body 2
    unit: kg
    sampling:
      min: 0.05
      max: 5.0
      ood_boundary: 1.0
      distribution: log_uniform
  - name: tau_b
    description: Measured pulley-bearing torque magnitude
    unit: kg m^2 s^-2
    sampling:
      min: 0.0001
      max: 1.0
      ood_boundary: 0.01
      distribution: log_uniform
  - name: R
    description: Pulley radius
    unit: m
    sampling:
      min: 0.01
      max: 1.0
      ood_boundary: 0.1
      distribution: log_uniform
  intermediates:
  - name: W1
    description: Weight of the descending mass
    unit: kg m s^-2
  - name: W2
    description: Weight of the ascending mass
    unit: kg m s^-2
  - name: T1
    description: Tension acting on the descending mass
    unit: kg m s^-2
  - name: T2
    description: Tension acting on the ascending mass
    unit: kg m s^-2
  - name: tau_string
    description: Torque on the pulley from the unequal string tensions
    unit: kg m^2 s^-2
  auxiliary_inputs: []
constants: []
mechanism:
- formula: W1 = m1 * g
  formula_description: Near-Earth gravitational force law for the descending mass
- formula: W2 = m2 * g
  formula_description: Near-Earth gravitational force law for the ascending mass
- formula: T1 = W1 - m1 * a
  formula_description: Newton's second law for the descending mass
- formula: T2 = W2 + m2 * a
  formula_description: Newton's second law for the ascending mass
- formula: tau_string = (T1 - T2) * R
  formula_description: Torque definition for the unequal string tensions acting on the pulley
- formula: tau_string = tau_b
  formula_description: Rotational torque balance for a massless pulley with constant bearing friction
