problem_name: Compact-Object Characteristic Luminosity - Variant 3
phenomenological_formula: Y = 6 * m * c * (G * M - w**2 * r**3) / s
problem_description: A luminous gravitating body interacts with surrounding matter through its radiation. The target is the characteristic limiting luminosity.
variable_description:
  target:
    name: Y
    description: Characteristic limiting luminosity
    unit: kg m^2 s^-3
  inputs:
  - name: M
    description: Mass of the gravitating central body
    unit: kg
    sampling:
      min: 1.0e+30
      max: 1.0e+33
      ood_boundary: 5.0e+31
      distribution: log_uniform
  - name: m
    description: Mass of the radiatively accelerated particle
    unit: kg
    sampling:
      min: 1.0e-30
      max: 1.0e-18
      ood_boundary: 1.0e-24
      distribution: log_uniform
  - name: r
    description: Orbital radius
    unit: m
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  - name: s
    description: Radiation-pressure cross section of the particle
    unit: m^2
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  - name: w
    description: Angular rotation frequency
    unit: s^-1
    sampling:
      min: 1.0e-05
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  intermediates:
  - name: F_g
    description: Newtonian gravitational attraction
    unit: kg m s^-2
  - name: F_c
    description: Outward centrifugal inertial force
    unit: kg m s^-2
  - name: F
    description: Net inward force balanced by radiation pressure
    unit: kg m s^-2
  - name: Phi
    description: Radiation momentum flux
    unit: kg m^-1 s^-2
  - name: S
    description: Incident radiative flux
    unit: kg s^-3
  - name: A
    description: Model effective emitting area
    unit: m^2
  auxiliary_inputs: []
constants:
- name: G
  description: Gravitational constant
  value: 6.6743e-11
  unit: m^3 kg^-1 s^-2
- name: c
  description: Speed of light in vacuum
  value: 299792458.0
  unit: m s^-1
mechanism:
- formula: F_g = G * M * m / r**2
  formula_description: Newton's law of gravitation gives the inward force F_g at radius r.
- formula: F_c = m * w**2 * r
  formula_description: Circular motion in a frame rotating at angular frequency w gives the outward centrifugal force F_c.
- formula: F = F_g - F_c
  formula_description: The effective-gravity definition subtracts centrifugal force F_c from gravity F_g.
- formula: Phi = F / s
  formula_description: Radiation pressure on cross section s defines the balancing momentum flux Phi.
- formula: S = Phi * c
  formula_description: The radiation relation converts momentum flux Phi into energy flux S using c.
- formula: A = 6 * r**2
  formula_description: The cubic-area model defines its effective emitting area A as 6 * r**2.
- formula: Y = A * S
  formula_description: Luminosity Y is the energy flux S integrated over the previously defined area A.
