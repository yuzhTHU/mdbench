problem_name: Settling Terminal Velocity - Quadratic Drag
phenomenological_formula: v_T = sqrt(8 * r * g * (rho_p - rho_f) / (3 * C_d * rho_f))
problem_description: |
  A sphere settles through a fluid and reaches terminal velocity. This variant replaces the low-Reynolds-number Stokes drag relation with inertial drag proportional to the square of velocity. It applies when inertial drag dominates, C_d is approximately constant, and rho_p > rho_f.
variable_description:
  target: {name: v_T, description: Terminal settling velocity of the sphere, unit: m s^-1}
  inputs:
    - {name: r, description: Sphere radius, unit: m, sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}}
    - {name: g, description: Gravitational acceleration, unit: m s^-2, sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}}
    - {name: rho_p, description: Sphere material density, unit: kg m^-3, sampling: {min: 1.5e3, max: 8.0e3, ood_boundary: 4.0e3, distribution: uniform}}
    - {name: rho_f, description: Fluid density, unit: kg m^-3, sampling: {min: 5.0e2, max: 1.2e3, ood_boundary: 9.0e2, distribution: uniform}}
    - {name: C_d, description: Quadratic drag coefficient, unit: 1 (dimensionless), sampling: {min: 0.1, max: 2.0, ood_boundary: 1.0, distribution: uniform}}
  intermediates:
    - {name: V, description: Sphere volume, unit: m^3}
    - {name: A, description: Frontal area, unit: m^2}
    - {name: m, description: Sphere mass, unit: kg}
    - {name: F_g, description: Gravitational force on the sphere, unit: kg m s^-2}
    - {name: F_b, description: Buoyant force on the sphere, unit: kg m s^-2}
    - {name: F_d, description: Quadratic drag at terminal velocity, unit: kg m s^-2}
  auxiliary_inputs: []
constants:
  - {name: π, description: Pi, value: 3.141592653589793, unit: 1 (dimensionless)}
mechanism:
  - {formula: V = 4 * π * r^3 / 3, formula_description: Volume of a sphere}
  - {formula: A = π * r^2, formula_description: Frontal area of a sphere}
  - {formula: m = rho_p * V, formula_description: Mass-density relation}
  - {formula: F_g = m * g, formula_description: Gravitational force}
  - {formula: F_b = rho_f * V * g, formula_description: Archimedes' buoyancy law}
  - {formula: F_d = C_d * rho_f * A * v_T^2 / 2, formula_description: Quadratic inertial drag law replacing Stokes drag}
  - {formula: F_g = F_b + F_d, formula_description: Force balance at terminal velocity}
