# 问题名称
problem_name: 毛细上升 - 电润湿接触角改版

# 唯象方程
phenomenological_formula: h = 2 * gamma * (cos(theta0) + chi * U^2) / (rho * g * r)

# 问题背景
problem_description: |
  这是一个外加电压改变润湿性的毛细上升问题。相对于原版，本改版只将接触角积木改为电润湿条件下的有效余弦项。

# 变量描述
# 变量列表
variable_description:
  target:
    name: h
    description: 毛细上升高度
    unit: m
  inputs:
    - name: gamma
      description: 液体表面张力
      unit: kg s^-2
      sampling: {min: 0.01, max: 0.1, ood_boundary: 0.05, distribution: uniform}
    - name: theta0
      description: 无电压时的接触角
      unit: 1 (dimensionless)
      sampling: {min: 0.0, max: 1.3, ood_boundary: 0.8, distribution: uniform}
    - name: chi
      description: 电润湿系数
      unit: kg^-2 m^-4 s^6 A^2
      sampling: {min: 1.0e-6, max: 1.0e-2, ood_boundary: 1.0e-4, distribution: log_uniform}
    - name: U
      description: 外加电压
      unit: kg m^2 s^-3 A^-1
      sampling: {min: 1.0, max: 100.0, ood_boundary: 20.0, distribution: log_uniform}
    - name: rho
      description: 液体密度
      unit: kg m^-3
      sampling: {min: 5.0e2, max: 1.5e3, ood_boundary: 1.0e3, distribution: uniform}
    - name: g
      description: 重力加速度
      unit: m s^-2
      sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}
    - name: r
      description: 毛细管半径
      unit: m
      sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}

  intermediates:
    - name: c_eff
      description: 有效接触角余弦
      unit: 1 (dimensionless)
    - name: C
      description: 液体接触线长度
      unit: m
    - name: A
      description: 液柱截面积
      unit: m^2
    - name: F_s
      description: 向上的表面张力合力
      unit: kg m s^-2
    - name: W_h
      description: 单位高度液柱重量
      unit: kg s^-2

    # 常数描述

  auxiliary_inputs: []
constants:
- name: π
  description: 圆周率
  value: 3.141592653589793
  unit: 1 (dimensionless)

# 机制
mechanism:
- formula: c_eff = cos(theta0) + chi * U^2
  formula_description: 电润湿 Young-Lippmann 型接触角修正；替换原版固定接触角积木
- formula: C = 2 * π * r
  formula_description: 圆周长公式
- formula: A = π * r^2
  formula_description: 圆截面积公式
- formula: F_s = C * gamma * c_eff
  formula_description: 表面张力竖直分量公式
- formula: W_h = rho * A * g
  formula_description: 单位高度液柱重量公式
- formula: h = F_s / W_h
  formula_description: 表面张力与液柱重量平衡
