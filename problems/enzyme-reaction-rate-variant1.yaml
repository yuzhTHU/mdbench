problem_name: Enzyme Reaction Rate - Variant 1
phenomenological_formula: v = k3 * E_T * S / (((k2 + k3) / k1) * (1 + k4 * X / k5) + S)
problem_description: An enzyme converts a substrate into a product. The target is the initial reaction rate under the supplied conditions.
variable_description:
  target:
    name: v
    description: Initial product-formation rate
    unit: mol m^-3 s^-1
  inputs:
  - name: k3
    description: Kinetic parameter 3
    unit: s^-1
    sampling:
      min: 0.1
      max: 1000.0
      ood_boundary: 10.0
      distribution: log_uniform
  - name: E_T
    description: Total enzyme concentration
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  - name: S
    description: Substrate concentration
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  - name: k1
    description: Kinetic parameter 1
    unit: m^3 mol^-1 s^-1
    sampling:
      min: 100.0
      max: 100000000.0
      ood_boundary: 100000.0
      distribution: log_uniform
  - name: X
    description: Additional molecular-species concentration
    unit: mol m^-3
    sampling:
      min: 1.0e-06
      max: 0.1
      ood_boundary: 0.001
      distribution: log_uniform
  - name: k2
    description: Kinetic parameter 2
    unit: s^-1
    sampling:
      min: 0.01
      max: 1000.0
      ood_boundary: 10.0
      distribution: log_uniform
  - name: k4
    description: Kinetic parameter 4
    unit: m^3 mol^-1 s^-1
    sampling:
      min: 100.0
      max: 100000000.0
      ood_boundary: 100000.0
      distribution: log_uniform
  - name: k5
    description: Kinetic parameter 5
    unit: s^-1
    sampling:
      min: 0.01
      max: 1000.0
      ood_boundary: 10.0
      distribution: log_uniform
  intermediates:
  - name: E_free
    description: Free enzyme concentration
    unit: mol m^-3
  - name: C_complex
    description: Enzyme-substrate complex concentration
    unit: mol m^-3
  - name: C_inhib
    description: Enzyme-inhibitor complex concentration
    unit: mol m^-3
  - name: r_on
    description: Formation rate of the enzyme-substrate complex
    unit: mol m^-3 s^-1
  - name: r_off
    description: Dissociation rate of the enzyme-substrate complex
    unit: mol m^-3 s^-1
  - name: r_cat
    description: Catalytic turnover rate of the enzyme-substrate complex
    unit: mol m^-3 s^-1
  - name: r_i_on
    description: Formation rate of the enzyme-inhibitor complex
    unit: mol m^-3 s^-1
  - name: r_i_off
    description: Dissociation rate of the enzyme-inhibitor complex
    unit: mol m^-3 s^-1
  auxiliary_inputs: []
constants: []
mechanism:
- formula: r_on = k1 * E_free * S
  formula_description: Mass-action association rate for formation of ES from free enzyme and substrate
- formula: r_off = k2 * C_complex
  formula_description: Mass-action dissociation rate for ES returning to free enzyme and substrate
- formula: r_cat = k3 * C_complex
  formula_description: First-order catalytic turnover rate for ES producing product and free enzyme
- formula: r_i_on = k4 * E_free * X
  formula_description: Mass-action association rate for competitive inhibitor binding to free enzyme
- formula: r_i_off = k5 * C_inhib
  formula_description: Mass-action dissociation rate for the enzyme-inhibitor complex
- formula: r_on = r_off + r_cat
  formula_description: Quasi-steady-state balance for the ES complex, setting its net accumulation to zero
- formula: r_i_on = r_i_off
  formula_description: Binding equilibrium for the competitive enzyme-inhibitor complex
- formula: E_T = E_free + C_complex + C_inhib
  formula_description: Conservation of total enzyme among free enzyme, ES complex, and inhibitor-bound enzyme
- formula: v = r_cat
  formula_description: Definition of the observed initial product-formation rate as the catalytic flux
