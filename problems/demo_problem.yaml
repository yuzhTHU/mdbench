# Problem name
problem_name: Kepler's Third Law - Original

# Phenomenological equation in the form y = f(x)
phenomenological_formula: T = sqrt((4 * π^2 / G / M) * a^3)

# Physical context of the phenomenological equation
problem_description: |
  A planet moves around a star in a circular orbit. Its orbital period T is related to the orbital semi-major axis  and the stellar mass M.

# Target, input, intermediate, and auxiliary input variables
variable_description:
  target:
    name: T
    description: Orbital period of the planet around the star
    unit: s
  inputs:
    - name: a
      description: Semi-major axis of the planetary orbit
      unit: m
      sampling: {min: 1.0e9, max: 1.0e12, ood_boundary: 5.0e11, distribution: log_uniform}
    - name: M
      description: Mass of the star
      unit: kg
      sampling: {min: 1.0e28, max: 1.0e31, ood_boundary: 5.0e30, distribution: log_uniform}

  intermediates:
    - name: r
      description: Radius of the circular planetary orbit
      unit: m
    - name: F
      description: Gravitational force exerted by the star on the planet
      unit: kg m s^-2
    - name: acc
      description: Acceleration of the planet
      unit: m s^-2
    - name: v
      description: Orbital speed of the planet
      unit: m s^-1

  auxiliary_inputs:
    - name: m
      description: Mass of the planet
      unit: kg
      sampling: {min: 1.0e20, max: 1.0e28, ood_boundary: 1.0e24, distribution: log_uniform}

# Constants used by the phenomenological equation or mechanism
constants:
- name: π
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
- name: G
  description: Gravitational constant
  value: 6.67430e-11
  unit: m^3 kg^-1 s^-2

# Fundamental relationships behind the phenomenological equation. Each item
# preserves the original physical relationship; MDBench resolves the equations
# into an executable order automatically.
mechanism:
- formula: r = a
  formula_description: The orbital radius equals the semi-major axis for a circular orbit
- formula: F = G * M * m / r^2
  formula_description: Newton's law of universal gravitation
- formula: acc = F / m
  formula_description: Newton's second law of motion
- formula: v = sqrt(r * acc)
  formula_description: Orbital speed for uniform circular motion
- formula: T = 2 * π * r / v
  formula_description: Period of uniform circular motion
