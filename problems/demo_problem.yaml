# 问题名称，这里为了方便理解使用中文，实际使用中建议使用英文
problem_name: 开普勒第三定律 - 原版

# 唯象方程，写成 y = f(x) 的形式
phenomenological_formula: T = sqrt((4 * π^2 / G / M) * a^3)

# 对 phenomenological_formula 所处问题背景的描述
problem_description: |
  一颗围绕恒星沿正圆轨道公转的行星，其公转周期 T 与轨道半径 a、恒星质量 M 之间存在关系

# 唯象方程的因变量和自变量。
variable_description:
  target:
    name: T
    description: 行星绕恒星公转的周期
    unit: s
  inputs:
    - name: a
      description: 行星轨道半长轴
      unit: m
      sampling: {min: 1.0e9, max: 1.0e12, ood_boundary: 5.0e11, distribution: log_uniform}
    - name: M
      description: 恒星质量
      unit: kg
      sampling: {min: 1.0e28, max: 1.0e31, ood_boundary: 5.0e30, distribution: log_uniform}

  intermediates:
    - name: r
      description: 行星圆轨道半径
      unit: m
    - name: F
      description: 恒星对行星的引力
      unit: kg m s^-2
    - name: acc
      description: 行星的加速度
      unit: m s^-2
    - name: v
      description: 行星的公转速度
      unit: m s^-1

  auxiliary_inputs:
    - name: m
      description: 行星质量
      unit: kg
      sampling: {min: 1.0e20, max: 1.0e28, ood_boundary: 1.0e24, distribution: log_uniform}

# 常数描述，包括在 phenomenological_formula 中出现的常数，以及 mechanism 依赖，但是在推导过程中消去，最终没有出现在 phenomenological_formula 中的常数

constants:
- name: π
  description: 圆周率
  value: 3.141592653589793
  unit: 1 (dimensionless)
- name: G
  description: 万有引力常数
  value: 6.67430e-11
  unit: m^3 kg^-1 s^-2

# 唯象方程背后的基本关系。每个 item 保存原始 relationship，不要求作者为了
# 计算顺序手工反解；程序会自动将连续方程块规范化为显式或数值计算函数。
mechanism:
- formula: r = a
  formula_description: 圆轨道下轨道半径等于半长轴
- formula: F = G * M * m / r^2
  formula_description: 万有引力公式
- formula: acc = F / m
  formula_description: 牛顿第二定律
- formula: v = sqrt(r * acc)
  formula_description: 圆周运动的速度公式
- formula: T = 2 * π * r / v
  formula_description: 圆周运动的周期公式
