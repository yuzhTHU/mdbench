problem_name: Brunt-Vaisala Frequency - Original
phenomenological_formula: Y = (g / T) * (A - B)
problem_description: An air parcel is displaced in a stratified atmosphere. The target is the specified atmospheric stability diagnostic.
variable_description:
  target:
    name: Y
    description: Squared Brunt-Vaisala frequency
    unit: s^-2
  inputs:
  - name: A
    description: Displaced parcel temperature gradient
    unit: K m^-1
    sampling:
      min: -0.012
      max: -0.001
      ood_boundary: -0.007
      distribution: uniform
  - name: B
    description: Environmental temperature gradient
    unit: K m^-1
    sampling:
      min: -0.012
      max: -0.001
      ood_boundary: -0.006
      distribution: uniform
  - name: T
    description: Reference temperature
    unit: K
    sampling:
      min: 200.0
      max: 330.0
      ood_boundary: 288.0
      distribution: uniform
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 9.7
      max: 9.9
      ood_boundary: 9.81
      distribution: uniform
  intermediates:
  - name: T_p
    description: Temperature of the displaced parcel
    unit: K
  - name: T_e
    description: Environmental temperature at the displaced level
    unit: K
  - name: rho_p
    description: Density of the displaced parcel
    unit: kg m^-3
  - name: rho_e
    description: Environmental density at the displaced level
    unit: kg m^-3
  - name: V
    description: Volume
    unit: m^3
  - name: F_g
    description: Weight of the displaced parcel
    unit: kg m s^-2
  - name: F_b
    description: Archimedean buoyant force
    unit: kg m s^-2
  - name: F
    description: Net vertical buoyancy force
    unit: kg m s^-2
  - name: a
    description: Net vertical acceleration of the parcel
    unit: m s^-2
  - name: a_l
    description: Linearized restoring acceleration
    unit: m s^-2
  auxiliary_inputs:
  - name: P
    description: Reference pressure
    unit: kg m^-1 s^-2
    sampling:
      min: 50000.0
      max: 150000.0
      ood_boundary: 101325.0
      distribution: log_uniform
  - name: m
    description: Mass
    unit: kg
    sampling:
      min: 1.0e-30
      max: 1.0e-18
      ood_boundary: 1.0e-24
      distribution: log_uniform
  - name: z
    description: Vertical displacement
    unit: m
    sampling:
      min: 1.0
      max: 1000.0
      ood_boundary: 100.0
      distribution: log_uniform
constants:
- name: M
  description: Molar mass of dry air
  value: 0.0289652
  unit: kg mol^-1
- name: R
  description: Molar gas constant
  value: 8.314462618
  unit: kg m^2 s^-2 K^-1 mol^-1
mechanism:
- formula: T_p = T - A * z
  formula_description: The linear parcel temperature-profile definition gives T_p after vertical displacement z.
- formula: T_e = T - B * z
  formula_description: The linear environmental temperature-profile definition gives T_e at the same displacement z.
- formula: rho_p = P * M / (R * T_p)
  formula_description: The ideal-gas law defines parcel density rho_p from pressure P and parcel temperature T_p.
- formula: rho_e = P * M / (R * T_e)
  formula_description: The ideal-gas law defines environmental density rho_e from the prior environmental temperature T_e.
- formula: V = m / rho_p
  formula_description: The mass-density definition gives parcel volume V from mass m and density rho_p.
- formula: F_g = m * g
  formula_description: Newtonian gravity defines the parcel weight F_g.
- formula: F_b = rho_e * V * g
  formula_description: Archimedes' principle defines buoyant force F_b as the weight of displaced environmental fluid.
- formula: F = F_b - F_g
  formula_description: The net-force definition subtracts parcel weight F_g from buoyancy F_b.
- formula: a = F / m
  formula_description: Newton's second law defines parcel acceleration a from net force F and mass m.
- formula: a_l = a * (T_e / T)
  formula_description: The linearized stratification approximation defines restoring acceleration a_l using the environmental temperature ratio.
- formula: Y = - a_l / z
  formula_description: The Brunt-Vaisala definition gives squared frequency Y as negative restoring acceleration a_l per displacement z.
