# 问题名称
problem_name: 泊肃叶圆管流量 - 壁面滑移改版

# 唯象方程
phenomenological_formula: Q = π * r^4 * dP * (1 + 4 * l_s / r) / (8 * u * L)

# 问题背景
problem_description: |
  这是一个圆管内层流流动但壁面存在滑移长度的问题。相对于原版，本改版只将无滑移边界条件积木改为 Navier 滑移边界条件。

# 变量描述
# 变量列表
variable_description:
  target:
    name: Q
    description: 体积流量
    unit: m^3 s^-1
  inputs:
    - name: r
      description: 圆管半径
      unit: m
      sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}
    - name: dP
      description: 管两端压差
      unit: kg m^-1 s^-2
      sampling: {min: 1.0e2, max: 1.0e6, ood_boundary: 1.0e4, distribution: log_uniform}
    - name: u
      description: 流体动力黏度
      unit: kg m^-1 s^-1
      sampling: {min: 1.0e-4, max: 1.0, ood_boundary: 1.0e-2, distribution: log_uniform}
    - name: L
      description: 圆管长度
      unit: m
      sampling: {min: 0.01, max: 10.0, ood_boundary: 1.0, distribution: log_uniform}
    - name: l_s
      description: 壁面滑移长度
      unit: m
      sampling: {min: 1.0e-8, max: 1.0e-4, ood_boundary: 1.0e-6, distribution: log_uniform}

  intermediates:
    - name: G_p
      description: 压强梯度大小
      unit: kg m^-2 s^-2
    - name: tau_w
      description: 壁面剪应力
      unit: kg m^-1 s^-2
    - name: v_max
      description: 无滑移中心线速度
      unit: m s^-1
    - name: v_avg0
      description: 无滑移平均速度
      unit: m s^-1
    - name: S
      description: 滑移增强因子
      unit: 1 (dimensionless)
    - name: v_avg
      description: 截面平均速度
      unit: m s^-1
    - name: A
      description: 圆管截面积
      unit: m^2

    # 常数描述

  auxiliary_inputs: []
constants:
- name: π
  description: 圆周率
  value: 3.141592653589793
  unit: 1 (dimensionless)

# 机制
mechanism:
- formula: G_p = dP / L
  formula_description: 轴向压强梯度公式
- formula: tau_w = G_p * r / 2
  formula_description: 圆管层流中的壁面剪应力平衡
- formula: v_max = tau_w * r / (2 * u)
  formula_description: 牛顿黏性定律给出的无滑移中心线速度
- formula: v_avg0 = v_max / 2
  formula_description: 无滑移抛物线速度剖面的截面平均速度
- formula: S = 1 + 4 * l_s / r
  formula_description: Navier 壁面滑移流量增强因子；替换原版无滑移边界条件积木
- formula: v_avg = v_avg0 * S
  formula_description: 滑移修正后的截面平均速度
- formula: A = π * r^2
  formula_description: 圆截面积公式
- formula: Q = A * v_avg
  formula_description: 体积流量定义
