task_name: Materials Defect Resistivity - Variant 1-2-3
task_description: Relate the electrical resistivity of a specimen to temperature, defect content, and carrier density.
mutation: Combines variants 1, 2, 3. The component changes act together.
mechanism_model:
- formula: q = 1.602176634e-19
  role: auxiliary/regime constraints
  description: Magnitude of carrier electric charge
- formula: mass = 9.1093837139e-31
  role: auxiliary/regime constraints
  description: Carrier effective mass
- formula: Tref = 300
  role: auxiliary/regime constraints
  description: Reference scattering temperature
- formula: nu = 1e13
  role: auxiliary/regime constraints
  description: Reference collision frequency
- formula: cf = c / (1 + 6*c)
  role: constitutive/component relations
  description: Isolated defect site fraction
- formula: cc = c - cf
  role: conservation/balance relations
  description: Clustered defect site fraction
- formula: theta = (T/Tref) * (1 + T/(2*Tref))
  role: constitutive/component relations
  description: Effective phonon population factor
- formula: screen = 1
  role: constitutive/component relations
  description: Carrier scattering screening factor
- formula: gm = 12 * nu * cf * T / Tref
  role: constitutive/component relations
  description: Joint phonon-defect collision frequency
- formula: g1 = (nu * (theta + 50 * cf + 20 * cc) + (7/10) * gm) / screen
  role: constitutive/component relations
  description: First population momentum relaxation frequency
- formula: g2 = (nu * ((3/2) * theta + 25 * cf + 80 * cc) + (13/10) * gm) / screen
  role: constitutive/component relations
  description: Second population momentum relaxation frequency
- formula: eta = 0
  role: constitutive/component relations
  description: Interpopulation momentum exchange frequency
- formula: n1 = (3/5) * n
  role: constitutive/component relations
  description: First population carrier density
- formula: n2 = n - n1
  role: conservation/balance relations
  description: Second population carrier density
- formula: g1 * mu1 + eta * n2/n * (mu1 - mu2) = q / mass
  role: governing/dynamical laws
  description: First population momentum balance per unit electric field.
- formula: g2 * mu2 + eta * n1/n * (mu2 - mu1) = q / mass
  role: governing/dynamical laws
  description: Second population momentum balance per unit electric field.
- formula: rho = 1 / (q * (n1 * mu1 + n2 * mu2))
  role: constitutive/component relations
  description: Parallel current response from both carrier populations.
phenomenal_model: rho = 5000000000000000000000000000.0/(801088317*(337300344000000000000.0*n/(4794412481*(520000000000*T*c/(6*c + 1) + 50000000000*T*(T/600 + 1) + 800000000000000*c - 550000000000000*c/(6*c + 1))) + 505950516000000000000.0*n/(4794412481*(280000000000*T*c/(6*c + 1) + 100000000000*T*(T/600 + 1)/3 + 200000000000000*c + 300000000000000*c/(6*c + 1)))))
variables:
- name: rho
  description: Measured electrical resistivity
  unit: kg m^3 s^-3 A^-2
  role: target
- name: T
  description: Specimen temperature
  unit: K
  role: input
  sampling:
    min: 120.0
    max: 600.0
    ood_boundary: 300.0
    distribution: log_uniform
- name: c
  description: Total defect site fraction
  unit: '1'
  role: input
  sampling:
    min: 0.001
    max: 0.05
    ood_boundary: 0.015
    distribution: log_uniform
- name: n
  description: Total carrier number density
  unit: m^-3
  role: input
  sampling:
    min: 1.0e+27
    max: 8.0e+28
    ood_boundary: 1.0e+28
    distribution: log_uniform
- name: q
  description: Magnitude of carrier electric charge
  unit: A s
  role: internal
- name: mass
  description: Carrier effective mass
  unit: kg
  role: internal
- name: Tref
  description: Reference scattering temperature
  unit: K
  role: internal
- name: nu
  description: Reference collision frequency
  unit: s^-1
  role: internal
- name: cf
  description: Isolated defect site fraction
  unit: '1'
  role: internal
- name: cc
  description: Clustered defect site fraction
  unit: '1'
  role: internal
- name: theta
  description: Effective phonon population factor
  unit: '1'
  role: internal
- name: screen
  description: Carrier scattering screening factor
  unit: '1'
  role: internal
- name: gm
  description: Joint phonon-defect collision frequency
  unit: s^-1
  role: internal
- name: g1
  description: First population momentum relaxation frequency
  unit: s^-1
  role: internal
- name: g2
  description: Second population momentum relaxation frequency
  unit: s^-1
  role: internal
- name: eta
  description: Interpopulation momentum exchange frequency
  unit: s^-1
  role: internal
- name: n1
  description: First population carrier density
  unit: m^-3
  role: internal
- name: n2
  description: Second population carrier density
  unit: m^-3
  role: internal
- name: mu1
  description: Drift mobility of the first carrier population
  unit: kg^-1 s^2 A
  role: internal
- name: mu2
  description: Drift mobility of the second carrier population
  unit: kg^-1 s^2 A
  role: internal
mechanism_probes:
- probe: mu1
  description: Drift mobility of the first carrier population
  answer: 843250860000000000000.0/(4794412481*(280000000000*T*c/(6*c + 1) + 100000000000*T*(T/600 + 1)/3 + 200000000000000*c + 300000000000000*c/(6*c + 1)))
- probe: mu2
  description: Drift mobility of the second carrier population
  answer: 843250860000000000000.0/(4794412481*(520000000000*T*c/(6*c + 1) + 50000000000*T*(T/600 + 1) + 800000000000000*c - 550000000000000*c/(6*c + 1)))
