problem_name: Settling Transient Velocity - Case 02
phenomenological_formula: v = sqrt(8 * r * g * (rho_p - rho_f) / (3 * rho_f * c_f)) * tanh(t * sqrt(3 * rho_f * c_f * g * (rho_p - rho_f) / (8 * rho_p^2 * r)))
problem_description: A spherical particle moves vertically through a fluid after release. The target is its instantaneous vertical velocity.
variable_description:
  target:
    name: v
    description: Instantaneous vertical velocity
    unit: m s^-1
  inputs:
  - name: t
    description: Time after release
    unit: s
    sampling:
      min: 0.01
      max: 20.0
      ood_boundary: 5.0
      distribution: log_uniform
  - name: r
    description: Sphere radius
    unit: m
    sampling:
      min: 1.0e-05
      max: 0.005
      ood_boundary: 0.0005
      distribution: log_uniform
  - name: g
    description: Gravitational acceleration
    unit: m s^-2
    sampling:
      min: 1.0
      max: 20.0
      ood_boundary: 10.0
      distribution: uniform
  - name: rho_p
    description: Particle material density
    unit: kg m^-3
    sampling:
      min: 1500.0
      max: 8000.0
      ood_boundary: 3000.0
      distribution: uniform
  - name: rho_f
    description: Fluid density
    unit: kg m^-3
    sampling:
      min: 500.0
      max: 1300.0
      ood_boundary: 1000.0
      distribution: uniform
  - name: c_f
    description: Dimensionless particle-fluid interaction coefficient
    unit: 1 (dimensionless)
    sampling:
      min: 0.1
      max: 2.5
      ood_boundary: 1.0
      distribution: uniform
  intermediates:
  - name: V
    description: Sphere volume
    unit: m^3
  - name: m
    description: Sphere mass
    unit: kg
  - name: F_g
    description: Sphere weight
    unit: kg m s^-2
  - name: F_b
    description: Buoyant force
    unit: kg m s^-2
  - name: F
    description: Effective downward driving force
    unit: kg m s^-2
  - name: A
    description: Frontal area of the sphere
    unit: m^2
  - name: k_drag
    description: Quadratic drag coefficient multiplying velocity squared
    unit: kg m^-1
  - name: v_T
    description: Quadratic-drag terminal velocity
    unit: m s^-1
  - name: tau
    description: Quadratic-drag relaxation time scale
    unit: s
  auxiliary_inputs: []
constants:
- name: π
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: V = 4 * π * r^3 / 3
  formula_description: Volume of a sphere
- formula: A = π * r^2
  formula_description: Frontal area of the sphere
- formula: m = rho_p * V
  formula_description: Mass-density relation for the sphere
- formula: F_g = m * g
  formula_description: Weight of the sphere
- formula: F_b = rho_f * V * g
  formula_description: Archimedes buoyancy force
- formula: F = F_g - F_b
  formula_description: Effective downward force after buoyancy
- formula: k_drag = rho_f * c_f * A / 2
  formula_description: Quadratic inertial drag coefficient replacing linear drag
- formula: v_T = sqrt(F / k_drag)
  formula_description: Terminal velocity from balance with quadratic drag
- formula: tau = m / sqrt(F * k_drag)
  formula_description: Velocity relaxation time scale for quadratic drag
- formula: v = v_T * tanh(t / tau)
  formula_description: Velocity response from rest under quadratic drag
