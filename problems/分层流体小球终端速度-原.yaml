# 问题名称
problem_name: 分层流体小球终端速度 - 均匀流体原版

# 唯象方程
phenomenological_formula: v_T = 2 * r^2 * g * (rho_p - rho_f) / (9 * u)

# 问题背景
problem_description: |
  这是一个小球在均匀黏性流体中缓慢下沉的问题。公式给出 Stokes 线性阻力近似下，小球局部终端速度 v_T 与半径 r、颗粒密度 rho_p、流体密度 rho_f 和动力黏度 u 的关系。

# 变量描述
# 变量列表
variable_description:
  target:
    name: v_T
    description: 小球终端下落速度
    unit: m s^-1
  inputs:
    - name: r
      description: 小球半径
      unit: m
      sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}
    - name: g
      description: 重力加速度
      unit: m s^-2
      sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}
    - name: rho_p
      description: 小球材料密度
      unit: kg m^-3
      sampling: {min: 1.5e3, max: 8.0e3, ood_boundary: 4.0e3, distribution: uniform}
    - name: rho_f
      description: 均匀流体密度
      unit: kg m^-3
      sampling: {min: 5.0e2, max: 1.2e3, ood_boundary: 9.0e2, distribution: uniform}
    - name: u
      description: 流体动力黏度
      unit: kg m^-1 s^-1
      sampling: {min: 1.0e-4, max: 1.0, ood_boundary: 1.0e-2, distribution: log_uniform}

  intermediates:
    - name: V
      description: 小球体积
      unit: m^3
    - name: m
      description: 小球质量
      unit: kg
    - name: F_g
      description: 小球重力
      unit: kg m s^-2
    - name: F_b
      description: 小球受到的浮力
      unit: kg m s^-2
    - name: F
      description: 有效驱动力
      unit: kg m s^-2
    - name: b
      description: 线性阻力系数
      unit: kg s^-1

    # 常数描述

  auxiliary_inputs: []
constants:
- name: π
  description: 圆周率
  value: 3.141592653589793
  unit: 1 (dimensionless)

# 机制
mechanism:
- formula: V = 4 * π * r^3 / 3
  formula_description: 球体体积公式
- formula: m = rho_p * V
  formula_description: 质量密度关系
- formula: F_g = m * g
  formula_description: 重力公式
- formula: F_b = rho_f * V * g
  formula_description: 阿基米德浮力公式
- formula: F = F_g - F_b
  formula_description: 重力扣除浮力后的有效驱动力
- formula: b = 6 * π * u * r
  formula_description: Stokes 线性阻力系数公式
- formula: v_T = F / b
  formula_description: 终端速度平衡公式；驱动力与线性阻力平衡
