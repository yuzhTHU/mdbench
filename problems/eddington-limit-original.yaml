problem_name: Eddington Limit - Original
phenomenological_formula: Y = 4 * pi * G * M * m * c / s
problem_description: A luminous gravitating body interacts with surrounding matter through its radiation. The target is the characteristic limiting luminosity.
variable_description:
  target:
    name: Y
    description: Eddington-limit luminosity
    unit: kg m^2 s^-3
  inputs:
  - name: M
    description: Mass of the gravitating central body
    unit: kg
    sampling:
      min: 1.0e+30
      max: 1.0e+33
      ood_boundary: 5.0e+31
      distribution: log_uniform
  - name: m
    description: Mass of the radiatively accelerated particle
    unit: kg
    sampling:
      min: 1.0e-30
      max: 1.0e-18
      ood_boundary: 1.0e-24
      distribution: log_uniform
  - name: s
    description: Radiation-pressure cross section of the particle
    unit: m^2
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
  intermediates:
  - name: F_g
    description: Newtonian gravitational attraction
    unit: kg m s^-2
  - name: F
    description: Force supplied by radiation pressure at balance
    unit: kg m s^-2
  - name: Phi
    description: Radiation momentum flux
    unit: kg m^-1 s^-2
  - name: S
    description: Incident radiative flux
    unit: kg s^-3
  auxiliary_inputs:
  - name: r
    description: Radius at which gravitational and radiative fluxes are evaluated
    unit: m
    sampling:
      min: 1.0e-06
      max: 0.01
      ood_boundary: 0.0001
      distribution: log_uniform
constants:
- name: G
  description: Gravitational constant
  value: 6.6743e-11
  unit: m^3 kg^-1 s^-2
- name: c
  description: Speed of light in vacuum
  value: 299792458.0
  unit: m s^-1
- name: pi
  description: Pi
  value: 3.141592653589793
  unit: 1 (dimensionless)
mechanism:
- formula: F_g = G * M * m / r**2
  formula_description: Newton's law of gravitation gives the attractive force F_g at radius r.
- formula: F = F_g
  formula_description: At the Eddington limit, force balance sets the radiation-pressure force F equal to F_g.
- formula: Phi = F / s
  formula_description: Radiation pressure on cross section s defines the momentum flux Phi = F / s.
- formula: S = Phi * c
  formula_description: For radiation, energy flux S equals momentum flux Phi times the speed of light c.
- formula: Y = 4 * pi * r**2 * S
  formula_description: Spherical-surface integration defines luminosity Y as the area 4 * pi * r**2 times flux S.
