# 问题名称
problem_name: 分层流体小球终端速度 - 黏度随深度指数改版

# 唯象方程
phenomenological_formula: v_T = 2 * r^2 * g * (rho_p - rho_f) / (9 * u_0 * exp(beta
  * z))

# 问题背景
problem_description: |
  这是一个小球在黏度随深度变化的流体中缓慢下沉的问题。相对于原版，本改版只将常数黏度积木改为随深度 z 指数增加的局部黏度，使阻力系数随深度变化。公式表示给定深度 z 处的局部准稳态终端速度，适用于小球半径远小于黏度变化尺度、速度弛豫快于环境变化尺度且局部 Stokes 阻力成立的情形。

# 变量描述
# 变量列表
variable_description:
  target:
    name: v_T
    description: 深度 z 处的小球局部终端下落速度
    unit: m s^-1
  inputs:
    - name: r
      description: 小球半径
      unit: m
      sampling: {min: 1.0e-5, max: 1.0e-3, ood_boundary: 3.0e-4, distribution: log_uniform}
    - name: g
      description: 重力加速度
      unit: m s^-2
      sampling: {min: 1.0, max: 20.0, ood_boundary: 10.0, distribution: uniform}
    - name: rho_p
      description: 小球材料密度
      unit: kg m^-3
      sampling: {min: 1.5e3, max: 8.0e3, ood_boundary: 4.0e3, distribution: uniform}
    - name: rho_f
      description: 流体密度
      unit: kg m^-3
      sampling: {min: 5.0e2, max: 1.2e3, ood_boundary: 9.0e2, distribution: uniform}
    - name: u_0
      description: 参考深度处的流体动力黏度
      unit: kg m^-1 s^-1
      sampling: {min: 1.0e-4, max: 1.0, ood_boundary: 1.0e-2, distribution: log_uniform}
    - name: beta
      description: 黏度随深度变化的指数系数
      unit: m^-1
      sampling: {min: 1.0e-3, max: 0.5, ood_boundary: 0.1, distribution: log_uniform}
    - name: z
      description: 从参考面向下量取的深度
      unit: m
      sampling: {min: 0.0, max: 10.0, ood_boundary: 5.0, distribution: uniform}

  intermediates:
    - name: V
      description: 小球体积
      unit: m^3
    - name: m
      description: 小球质量
      unit: kg
    - name: F_g
      description: 小球重力
      unit: kg m s^-2
    - name: F_b
      description: 小球受到的浮力
      unit: kg m s^-2
    - name: F
      description: 有效驱动力
      unit: kg m s^-2
    - name: u_z
      description: 深度 z 处的局部动力黏度
      unit: kg m^-1 s^-1
    - name: b
      description: 深度相关的线性阻力系数
      unit: kg s^-1

    # 常数描述

  auxiliary_inputs: []
constants:
- name: π
  description: 圆周率
  value: 3.141592653589793
  unit: 1 (dimensionless)

# 机制
mechanism:
- formula: V = 4 * π * r^3 / 3
  formula_description: 球体体积公式
- formula: m = rho_p * V
  formula_description: 质量密度关系
- formula: F_g = m * g
  formula_description: 重力公式
- formula: F_b = rho_f * V * g
  formula_description: 阿基米德浮力公式
- formula: F = F_g - F_b
  formula_description: 有效驱动力公式
- formula: u_z = u_0 * exp(beta * z)
  formula_description: 指数深度依赖黏度公式；替换原版常数黏度积木
- formula: b = 6 * π * u_z * r
  formula_description: 使用局部黏度的 Stokes 线性阻力系数
- formula: v_T = F / b
  formula_description: 局部终端速度平衡公式
