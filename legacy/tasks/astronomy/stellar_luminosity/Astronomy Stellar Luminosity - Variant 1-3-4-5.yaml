  + 1)*(562500000000000000000000000000.0*M**2/(2852315671914824207833029483243361.0*R**6) + 1)))*(epsilon/7 + 1)*(750000000000000*M/(40840704496667309.0*R**3)
  + 1)*(562500000000000000000000000000.0*M**2/(2852315671914824207833029483243361.0*R**6) + 1)*(150000000000000*M**2*(750000000000000*M/(59690260418206067.0*R**3)
  + 1)/(3141592653589793*R**3) + 31006276680299813114880451174049119330924860257.0*R**6/(35156250000000000000000000000000000000000000.0*M*kappa*(3141592653589793*R**2/250000000000000
  + 9869604401089357120529513782849.0*R**4/(140625000000000000000000000000.0*M*kappa*(750000000000000*M/(40840704496667309.0*R**3)
  + 1)*(562500000000000000000000000000.0*M**2/(2852315671914824207833029483243361.0*R**6) + 1)))*(750000000000000*M/(40840704496667309.0*R**3)
  + 1)*(562500000000000000000000000000.0*M**2/(2852315671914824207833029483243361.0*R**6) + 1))))
variables:
- name: M
  description: Normalized stellar mass.
  unit: '1'
  role: input
  sampling:
    min: 0.5
    max: 3.0
    ood_boundary: 1.75
    distribution: uniform
- name: R
  description: Normalized stellar radius.
  unit: '1'
  role: input
  sampling:
    min: 1.0
    max: 3.0
    ood_boundary: 2.0
