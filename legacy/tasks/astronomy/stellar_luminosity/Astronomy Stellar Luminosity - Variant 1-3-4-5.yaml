task_name: Astronomy Stellar Luminosity - Variant 1-3-4-5
task_description: Relate stellar mass, radius, reference opacity, and specific heating rate to outgoing luminosity using normalized
  measurements.
mutation: Combines variants 1&3&4&5; each replacement applies to its own mechanism relation.
mechanism_model:
- formula: pi0 = 3.141592653589793
  role: auxiliary/regime constraints
  description: Circle constant.
- formula: rho = 3*M/(4*pi0*R**3)
  role: kinematic/geometric constraints
  description: Normalized representative stellar density.
- formula: Q = epsilon*M/(1+epsilon/7)
  role: governing/dynamical laws
  description: Normalized total internal heating power.
- formula: k_e = kappa*(1+rho/13)
  role: constitutive/component relations
  description: Normalized effective transport opacity.
- formula: C = 16*pi0*R/(3*k_e*rho*(1+(rho/17)**2))
  role: governing/dynamical laws
  description: Normalized core-to-surface radiative conductance.
- formula: A = 4*pi0*R**2
  role: kinematic/geometric constraints
  description: Normalized surface emission coefficient.
- formula: N = rho*M/5*(1+rho/19)
  role: constitutive/component relations
  description: Normalized non-photon cooling coefficient.
- formula: U_c = Q/(C*A/(C+A)+N)
  role: conservation/balance relations
  description: Fourth power of normalized core temperature.
- formula: U_s = C*U_c/(C+A)
  role: conservation/balance relations
  description: Fourth power of normalized surface temperature.
- formula: L = A*U_s
  role: governing/dynamical laws
  description: Normalized outgoing photon luminosity.
