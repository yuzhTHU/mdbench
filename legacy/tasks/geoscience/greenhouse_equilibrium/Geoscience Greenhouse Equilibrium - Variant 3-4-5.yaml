  answer: (-19*e/(100*(e + 1)) + 1)*(12507*e/(10000*(e + 1)) + (23*S/(100*(S + 1361)) + e)*(S*(1 - a)/4 + 19329*e*(-93*e/(500*(2*e
    + 1)) + 3/5)/(20000*(2*e + 1)) - 57987*e/(50000*(2*e + 1)) + 12507*e*(-19*e/(250*(e + 1)) + 2/5)/(20000*(e + 1)) - 12507*e/(25000*(e
    + 1)) + 1137/100)/(111*S/(500*(S + 2722)) + 23*S/(250*(S + 1361)) - (23*S/(100*(S + 1361)) + e)*(-19*e/(250*(e + 1)) +
    2/5)/2 - (37*S/(100*(S + 2722)) + e)*(-93*e/(500*(2*e + 1)) + 3/5)/2 + 1))/2
- probe: D2
  description: Patch 2 downward atmospheric thermal flux per patch area
  answer: (-31*e/(100*(2*e + 1)) + 1)*(19329*e/(10000*(2*e + 1)) + (37*S/(100*(S + 2722)) + e)*(S*(1 - a)/4 + 19329*e*(-93*e/(500*(2*e
    + 1)) + 3/5)/(20000*(2*e + 1)) - 57987*e/(50000*(2*e + 1)) + 12507*e*(-19*e/(250*(e + 1)) + 2/5)/(20000*(e + 1)) - 12507*e/(25000*(e
    + 1)) + 1137/100)/(111*S/(500*(S + 2722)) + 23*S/(250*(S + 1361)) - (23*S/(100*(S + 1361)) + e)*(-19*e/(250*(e + 1)) +
    2/5)/2 - (37*S/(100*(S + 2722)) + e)*(-93*e/(500*(2*e + 1)) + 3/5)/2 + 1))/2
