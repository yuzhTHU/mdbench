task_name: Geoscience Geostrophic Balance - Variant 1-2-3-4-5
task_description: Relate horizontal pressure gradients, density, and rotation to the magnitude of a steady horizontal flow.
mutation: Combines variants 1&2&3&4&5; all constitutive changes enter the same simultaneous balances.
mechanism_model:
- formula: p0 = 1/1000
  role: auxiliary/regime constraints
  description: Pressure-gradient reference scale
- formula: r0 = 6/5
  role: auxiliary/regime constraints
  description: Density reference scale
- formula: ax = px/(rho*(1 + 29*px**2/(100*p0**2))) + 17*py*sqrt(px**2 + py**2)/(100*p0*rho)
  role: governing/dynamical laws
  description: Applied acceleration along the first horizontal axis
- formula: ay = py/(rho*(1 + 41*py**2/(100*p0**2))) - 11*px*sqrt(px**2 + py**2)/(100*p0*rho)
  role: governing/dynamical laws
  description: Applied acceleration along the second horizontal axis
- formula: fx = f*(1 + 23*rho/(100*r0))
  role: constitutive/component relations
  description: First transverse momentum-response rate
- formula: fy = f/(1 + 19*rho/(100*r0))
  role: constitutive/component relations
  description: Second transverse momentum-response rate
- formula: rx = 37*f*(1 + rho/r0)/100 + 31*f*px**2/(100*p0**2)
  role: constitutive/component relations
  description: First directional momentum-drag rate
- formula: ry = 37*f*(1 + rho/r0)/100 + 47*f*py**2/(100*p0**2)
  role: constitutive/component relations
  description: Second directional momentum-drag rate
- formula: ax = -fy*v + rx*u
  role: conservation/balance relations
  description: First horizontal momentum balance
- formula: ay = fx*u + ry*v
  role: conservation/balance relations
  description: Second horizontal momentum balance
- formula: speed = sqrt(u**2 + v**2)
  role: kinematic/geometric constraints
  description: Velocity components determine the observed speed magnitude
phenomenal_model: speed = sqrt((f*(-110*px*sqrt(px**2 + py**2)/rho + py/(rho*(410000*py**2 + 1)))/(19*rho/120 + 1) + (470000*f*py**2
  + 37*f*(5*rho/6 + 1)/100)*(px/(rho*(290000*px**2 + 1)) + 170*py*sqrt(px**2 + py**2)/rho))**2/(f**2*(23*rho/120 + 1)/(19*rho/120
  + 1) + (310000*f*px**2 + 37*f*(5*rho/6 + 1)/100)*(470000*f*py**2 + 37*f*(5*rho/6 + 1)/100))**2 + (-f*(23*rho/120 + 1)*(px/(rho*(290000*px**2
  + 1)) + 170*py*sqrt(px**2 + py**2)/rho) + (310000*f*px**2 + 37*f*(5*rho/6 + 1)/100)*(-110*px*sqrt(px**2 + py**2)/rho + py/(rho*(410000*py**2
  + 1))))**2/(f**2*(23*rho/120 + 1)/(19*rho/120 + 1) + (310000*f*px**2 + 37*f*(5*rho/6 + 1)/100)*(470000*f*py**2 + 37*f*(5*rho/6
  + 1)/100))**2)
variables:
- name: px
  description: Pressure decrease per distance along the first horizontal axis
  unit: kg m^-2 s^-2
  role: input
  sampling:
    min: 0.0002
    max: 0.002
    ood_boundary: 0.001
    distribution: uniform
- name: py
  description: Pressure decrease per distance along the second horizontal axis
  unit: kg m^-2 s^-2
  role: input
  sampling:
    min: 0.0003
    max: 0.0025
    ood_boundary: 0.0012
    distribution: uniform
- name: rho
  description: Reference fluid mass density
  unit: kg m^-3
  role: input
  sampling:
    min: 0.9
    max: 1.5
    ood_boundary: 1.2
    distribution: uniform
- name: f
  description: Positive local Coriolis parameter
  unit: s^-1
  role: input
  sampling:
    min: 7.0e-05
    max: 0.00014
    ood_boundary: 0.0001
    distribution: uniform
- name: speed
  description: Magnitude of steady horizontal velocity
  unit: m s^-1
  role: target
- name: p0
  description: Pressure-gradient reference scale
  unit: kg m^-2 s^-2
  role: internal
- name: r0
  description: Density reference scale
  unit: kg m^-3
  role: internal
- name: ax
  description: Applied acceleration along the first horizontal axis
  unit: m s^-2
  role: internal
- name: ay
  description: Applied acceleration along the second horizontal axis
  unit: m s^-2
  role: internal
- name: fx
  description: First transverse momentum-response rate
  unit: s^-1
  role: internal
- name: fy
  description: Second transverse momentum-response rate
  unit: s^-1
  role: internal
- name: rx
  description: First directional momentum-drag rate
  unit: s^-1
  role: internal
- name: ry
  description: Second directional momentum-drag rate
  unit: s^-1
  role: internal
- name: u
  description: Signed velocity along the first horizontal axis
  unit: m s^-1
  role: internal
- name: v
  description: Signed velocity along the second horizontal axis
  unit: m s^-1
  role: internal
mechanism_probes:
- probe: u
  description: Signed velocity along the first horizontal axis
  answer: (f*(-110*px*sqrt(px**2 + py**2)/rho + py/(rho*(410000*py**2 + 1)))/(19*rho/120 + 1) + (470000*f*py**2 + 37*f*(5*rho/6
    + 1)/100)*(px/(rho*(290000*px**2 + 1)) + 170*py*sqrt(px**2 + py**2)/rho))/(f**2*(23*rho/120 + 1)/(19*rho/120 + 1) + (310000*f*px**2
    + 37*f*(5*rho/6 + 1)/100)*(470000*f*py**2 + 37*f*(5*rho/6 + 1)/100))
- probe: v
  description: Signed velocity along the second horizontal axis
  answer: (-f*(23*rho/120 + 1)*(px/(rho*(290000*px**2 + 1)) + 170*py*sqrt(px**2 + py**2)/rho) + (310000*f*px**2 + 37*f*(5*rho/6
    + 1)/100)*(-110*px*sqrt(px**2 + py**2)/rho + py/(rho*(410000*py**2 + 1))))/(f**2*(23*rho/120 + 1)/(19*rho/120 + 1) + (310000*f*px**2
    + 37*f*(5*rho/6 + 1)/100)*(470000*f*py**2 + 37*f*(5*rho/6 + 1)/100))
