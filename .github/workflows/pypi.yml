name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check package version
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.new_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether package version changed
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          def project_version(text: str) -> str:
              return tomllib.loads(text)["project"]["version"]

          new_version = project_version(Path("pyproject.toml").read_text())
          old_version = None
          before_sha = os.environ.get("BEFORE_SHA", "")

          if before_sha and before_sha != "0" * 40:
              try:
                  old_text = subprocess.check_output(
                      ["git", "show", f"{before_sha}:pyproject.toml"],
                      text=True,
                  )
              except subprocess.CalledProcessError:
                  pass
              else:
                  old_version = project_version(old_text)

          manual = os.environ["EVENT_NAME"] == "workflow_dispatch"
          should_publish = manual or old_version != new_version
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"old_version={old_version or ''}\n")
              output.write(f"new_version={new_version}\n")
              output.write(f"should_publish={str(should_publish).lower()}\n")

          if should_publish:
              print(
                  f"Preparing mdbench {new_version} "
                  f"(previous version: {old_version or 'none'})"
              )
          else:
              print(
                  "pyproject.toml changed, but project.version remains "
                  f"{new_version}; skipping publication"
              )
          PY

  publish:
    name: Build and publish mdbench ${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mdbench
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MDBench and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" twine

      - name: Run tests
        run: python -m pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

