[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdbench"
version = "0.4.0"
description = "A benchmark for discovering scientific mechanisms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "benchmark",
    "mechanism discovery",
    "scientific discovery",
    "symbolic regression",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "nd2py>=3.2.3",
    "openai>=1.0",
    "google-genai>=1.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "sympy>=1.13",
    "scipy>=1.14",
]

[project.urls]
Documentation = "https://yuzhthu.github.io/mdbench/"
Repository = "https://github.com/yuzhthu/mdbench"
Issues = "https://github.com/yuzhthu/mdbench/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "sphinx>=7.0",
    "sphinx-book-theme>=1.1",
    "myst-parser>=3.0",
    "sphinx-autodoc-typehints>=2.0",
    "build>=1.2",
]

[project.scripts]
mdbench = "src.cli.run:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*", "problems"]

[tool.setuptools.package-data]
problems = ["*.yaml", "*.yml"]
