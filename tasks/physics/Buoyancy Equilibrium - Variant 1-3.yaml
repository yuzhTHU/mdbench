task_name: Buoyancy Equilibrium - Variant 1-3
task_description: Determine equilibrium immersion depth from dry mass, reference cross-sectional area, and bulk fluid density.
mutation: Combines variants 1, 3 using their shared state and balance equations.
mechanism_model:
- formula: grav = 9.81
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Static vertical prismatic body; immersion measured along its main body; uniform supporting-fluid
    density.
- formula: rho0 = 1000
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Attached cavity remains submerged and contributes no additional mass.
- formula: aref = 0.004
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Absorbed material adds mass without changing the specified displaced volume; local
    density and geometry closures are externally controlled.
- formula: absorbed_mass = 0.12*dry_mass*density/rho0
  role: constitutive/component relations
  description: Mass retained in the internal absorption compartment.
- formula: cavity_volume = 0
  role: kinematic/geometric constraints
  description: Submerged sealed-cavity volume.
- formula: local_density = density*(1+0.08*area/aref)
  role: constitutive/component relations
  description: Local supporting-fluid mass density.
- formula: effective_area = area
  role: kinematic/geometric constraints
  description: Immersed body cross-sectional area.
- formula: magnetic_force = 0
  role: governing/dynamical laws
  description: Externally applied downward magnetic force.
- formula: support_force = (dry_mass+absorbed_mass)*grav+magnetic_force
  role: conservation/balance relations
  description: Required upward supporting force.
- formula: displaced_volume = support_force/(local_density*grav)
  role: conservation/balance relations
  description: Total excluded supporting-fluid volume.
- formula: depth = (displaced_volume-cavity_volume)/effective_area
  role: kinematic/geometric constraints
  description: Equilibrium main-body immersion depth.
phenomenal_model: depth = (3*density*dry_mass/(25*rho0) + dry_mass)/(area*density*(2*area/(25*aref) + 1))
variables:
- name: dry_mass
  description: Dry body mass.
  unit: kg
  role: input
  sampling:
    min: 0.1
    max: 1
    ood_boundary: 0.65
    distribution: uniform
- name: area
  description: Reference body cross-sectional area.
  unit: m^2
  role: input
  sampling:
    min: 0.001
    max: 0.008
    ood_boundary: 0.005
    distribution: uniform
- name: density
  description: Bulk supporting-fluid density.
  unit: kg m^-3
  role: input
  sampling:
    min: 800
    max: 1300
    ood_boundary: 1100
    distribution: uniform
- name: absorbed_mass
  description: Mass retained in the internal absorption compartment.
  unit: kg
  role: internal
- name: cavity_volume
  description: Submerged sealed-cavity volume.
  unit: m^3
  role: internal
- name: local_density
  description: Local supporting-fluid mass density.
  unit: kg m^-3
  role: internal
- name: effective_area
  description: Immersed body cross-sectional area.
  unit: m^2
  role: internal
- name: magnetic_force
  description: Externally applied downward magnetic force.
  unit: N
  role: internal
- name: support_force
  description: Required upward supporting force.
  unit: N
  role: internal
- name: displaced_volume
  description: Total excluded supporting-fluid volume.
  unit: m^3
  role: internal
- name: depth
  description: Equilibrium main-body immersion depth.
  unit: m
  role: target
mechanism_probes:
- probe: absorbed_mass
  description: Mass retained in the internal absorption compartment.
  answer: 3*density*dry_mass/(25*rho0)
- probe: local_density
  description: Local supporting-fluid mass density.
  answer: density*(2*area/(25*aref) + 1)
