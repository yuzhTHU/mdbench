    + 74060000*substrate + 213716000) + 225142400*substrate + 225475670) + 84724640*substrate + 71286982) + laplace_rate*(laplace_rate*(laplace_rate*(115000000*laplace_rate
    + 241500000*substrate + 685975000) + substrate*(112700000*substrate + 1124585000) + 1441691750) + substrate*(342608000*substrate
