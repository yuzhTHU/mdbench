- probe: mixed_complex
  description: Laplace-weighted enzyme carrying both substrate and inhibitor.
  answer: enzyme_total*inhibitor*(inhibitor*(laplace_rate*(74060000*laplace_rate*substrate + 225142400*substrate)
    + 84724640*substrate) + laplace_rate*(laplace_rate*(161000000*laplace_rate*substrate + substrate*(112700000*substrate
