    + 1562770650) + 1287589105) + substrate*(128928800*substrate + 504086170) + 403368043) + laplace_rate*(laplace_rate*(laplace_rate*(laplace_rate*(62500000*laplace_rate
    + 175000000*substrate + 493125000) + substrate*(122500000*substrate + 1176000000) + 1424187500) + substrate*(679875000*substrate
    + 2327946250) + 1825205750) + substrate*(611691500*substrate + 1584685200) + 988210905) + substrate*(147955500*substrate
    + 302204980) + 153707983)
- probe: locked_complex
