  + 326373264) + 3438590400*laplace_rate + 1616137488) + b_concentration*(b_concentration*(4166467200*laplace_rate
  + 1958239584) + laplace_rate*(5019840000*laplace_rate + 16214083200) + 6205024224)) + b_concentration*(b_concentration*(6249700800*laplace_rate
