  + 7455620250) + 10453058595) + 3426919272) + laplace_rate*(laplace_rate*(laplace_rate*(3735000000*laplace_rate
  + 21550950000) + 40930371000) + 28051433640) + 5349768984) + laplace_rate*(laplace_rate*(laplace_rate*(laplace_rate*(2250000000*laplace_rate
  + 15142500000) + 35758125000) + 35680461750) + 14661317925) + 1993345200)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: a_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: b_concentration
