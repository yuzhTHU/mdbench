task_name: Surface Pair Catalysis - Variant 2-4-5
task_description: Determine the Laplace-weighted B-containing product rate after exposing initially empty surface
  cells to buffered A and B.
mutation: Combines variants 2, 4, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: a_ratio = a_concentration/concentration_scale
  description: Dimensionless gas A concentration.
  role: constitutive/component relations
- formula: b_ratio = b_concentration/concentration_scale
  description: Dimensionless gas B concentration.
  role: constitutive/component relations
- formula: a_adsorption = rate_scale*(1.2*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_adsorption = rate_scale*(0.83*b_ratio*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: a_desorption = rate_scale*(0.64)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_desorption = rate_scale*(0.51*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_b_adsorption = rate_scale*(0.83*b_ratio*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_a_adsorption = rate_scale*(1.2*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_a_desorption = rate_scale*(0.64)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_b_desorption = rate_scale*(0.51*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: surface_reaction = rate_scale*(1.6)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: immobilization = rate_scale*(0.26)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: remobilization = rate_scale*(0.47)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: gas_surface_reaction = rate_scale*(0.24*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: gas_surface_flux = gas_surface_reaction*b_cells
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: laplace_rate*empty_cells+a_adsorption*empty_cells+b_adsorption*empty_cells = laplace_rate*(1)+a_desorption*a_cells+b_desorption*b_cells+surface_reaction*ab_cells+gas_surface_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*a_cells+a_desorption*a_cells+second_b_adsorption*a_cells+immobilization*a_cells = 0+a_adsorption*empty_cells+paired_b_desorption*ab_cells+remobilization*immobile_a_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*b_cells+b_desorption*b_cells+second_a_adsorption*b_cells+gas_surface_flux = 0+b_adsorption*empty_cells+paired_a_desorption*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*ab_cells+paired_a_desorption*ab_cells+paired_b_desorption*ab_cells+surface_reaction*ab_cells
    = 0+second_b_adsorption*a_cells+second_a_adsorption*b_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*immobile_a_cells+remobilization*immobile_a_cells = 0+immobilization*a_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = surface_reaction*ab_cells+gas_surface_reaction*b_cells
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = a_concentration*(a_concentration*(a_concentration*b_concentration*(b_concentration*(laplace_rate*(103335000*laplace_rate
  + 1106717850) + 497330688) + laplace_rate*(63495000*laplace_rate + 5184516150) + 2414937456) + b_concentration*(b_concentration*(laplace_rate*(620010000*laplace_rate
  + 6640307100) + 2983984128) + laplace_rate*(laplace_rate*(373500000*laplace_rate + 7705305000) + 24094858500)
  + 9168785568)) + b_concentration*(b_concentration*(laplace_rate*(930015000*laplace_rate + 9960460650) + 4475976192)
  + laplace_rate*(laplace_rate*(1120500000*laplace_rate + 22544460000) + 25623930150) + 5771919600))/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(b_concentration*(516675000*laplace_rate
  + 242837250) + 3324150000*laplace_rate + 1644894000) + 1847475000*laplace_rate + 1348656750) + b_concentration*(b_concentration*(laplace_rate*(430562500*laplace_rate
  + 4266874375) + 1910319700) + laplace_rate*(6505125000*laplace_rate + 22466025000) + 9356772600) + laplace_rate*(13554562500*laplace_rate
  + 36167000625) + 18922500900) + b_concentration*(b_concentration*(laplace_rate*(2583375000*laplace_rate + 11651021250)
  + 4905312450) + laplace_rate*(laplace_rate*(3112500000*laplace_rate + 30938250000) + 47601330000) + 15389196000)
  + laplace_rate*(laplace_rate*(16762500000*laplace_rate + 61722000000) + 57411438750) + 13249389150) + b_concentration*(b_concentration*(laplace_rate*(3875062500*laplace_rate
  + 10501419375) + 4079665800) + laplace_rate*(laplace_rate*(9337500000*laplace_rate + 34268625000) + 30361815000)
  + 6368772600) + laplace_rate*(laplace_rate*(laplace_rate*(5625000000*laplace_rate + 26043750000) + 34703437500)
  + 16323935625) + 2373030000)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: a_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: b_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: a_ratio
