task_name: Surface Pair Catalysis - Variant 2-3
task_description: Determine the Laplace-weighted B-containing product rate after exposing initially empty surface
  cells to buffered A and B.
mutation: Combines variants 2, 3 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: a_ratio = a_concentration/concentration_scale
  description: Dimensionless gas A concentration.
  role: constitutive/component relations
- formula: b_ratio = b_concentration/concentration_scale
  description: Dimensionless gas B concentration.
  role: constitutive/component relations
- formula: a_adsorption = rate_scale*(1.2*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_adsorption = rate_scale*(0.83*b_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: a_desorption = rate_scale*(0.64)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_desorption = rate_scale*(0.51)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_b_adsorption = rate_scale*(0.83*b_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_a_adsorption = rate_scale*(1.2*a_ratio*(1+(0.22/1.2)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_a_desorption = rate_scale*(0.64*(1+(0.22/1.2)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_b_desorption = rate_scale*(0.51)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: surface_reaction = rate_scale*(1.6)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: immobilization = rate_scale*(0.26)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: remobilization = rate_scale*(0.47)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: laplace_rate*empty_cells+a_adsorption*empty_cells+b_adsorption*empty_cells = laplace_rate*(1)+a_desorption*a_cells+b_desorption*b_cells+surface_reaction*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*a_cells+a_desorption*a_cells+second_b_adsorption*a_cells+immobilization*a_cells = 0+a_adsorption*empty_cells+paired_b_desorption*ab_cells+remobilization*immobile_a_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*b_cells+b_desorption*b_cells+second_a_adsorption*b_cells = 0+b_adsorption*empty_cells+paired_a_desorption*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*ab_cells+paired_a_desorption*ab_cells+paired_b_desorption*ab_cells+surface_reaction*ab_cells
    = 0+second_b_adsorption*a_cells+second_a_adsorption*b_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*immobile_a_cells+remobilization*immobile_a_cells = 0+immobilization*a_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = surface_reaction*ab_cells
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = a_concentration*(a_concentration*(a_concentration*b_concentration*(262944000*laplace_rate
  + 123583680) + b_concentration*(b_concentration*(181869600*laplace_rate + 85478712) + laplace_rate*(219120000*laplace_rate
  + 1734434400) + 740004096)) + b_concentration*(b_concentration*(992016000*laplace_rate + 466247520) + laplace_rate*(2390400000*laplace_rate
  + 2808720000) + 646005600))/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(164340000*laplace_rate
  + 77239800) + laplace_rate*(198000000*laplace_rate + 562320000) + 304979400) + b_concentration*(b_concentration*(113668500*laplace_rate
  + 53424195) + laplace_rate*(273900000*laplace_rate + 1525000500) + 657670005) + laplace_rate*(laplace_rate*(165000000*laplace_rate
  + 1759800000) + 3724741500) + 1807562400) + b_concentration*(b_concentration*(680633200*laplace_rate + 319897604)
  + laplace_rate*(2387080000*laplace_rate + 4332434000) + 1507781320) + laplace_rate*(laplace_rate*(1888000000*laplace_rate
  + 6888440000) + 6364376000) + 1506161604) + b_concentration*(b_concentration*(laplace_rate*(516675000*laplace_rate
  + 1400189250) + 543955440) + laplace_rate*(laplace_rate*(1245000000*laplace_rate + 4569150000) + 4048242000) +
  849169680) + laplace_rate*(laplace_rate*(laplace_rate*(750000000*laplace_rate + 3472500000) + 4627125000) + 2176524750)
  + 316404000)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: a_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: b_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: a_ratio
  description: Dimensionless gas A concentration.
  unit: '1'
  role: internal
- name: b_ratio
  description: Dimensionless gas B concentration.
  unit: '1'
  role: internal
- name: a_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: b_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: a_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: b_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_b_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_a_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: paired_a_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: paired_b_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: surface_reaction
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: immobilization
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: remobilization
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: empty_cells
  description: Laplace-weighted empty catalytic-cell fraction.
  unit: '1'
  role: internal
- name: a_cells
  description: Laplace-weighted cells carrying only adsorbed A.
  unit: '1'
  role: internal
- name: b_cells
  description: Laplace-weighted cells carrying only adsorbed B.
  unit: '1'
  role: internal
- name: ab_cells
  description: Laplace-weighted cells carrying both adsorbed reactants.
  unit: '1'
  role: internal
- name: immobile_a_cells
  description: Laplace-weighted cells containing immobilized adsorbed A.
  unit: '1'
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: s^-1
  role: target
mechanism_probes:
- probe: immobile_a_cells
  description: Laplace-weighted cells containing immobilized adsorbed A.
  answer: a_concentration*(a_concentration*(a_concentration*(51480000*laplace_rate + 108622800) + 18159570*b_concentration
    + 308256000*laplace_rate + 606490560) + 99052200*b_concentration + laplace_rate*(234000000*laplace_rate + 762840000)
    + 328185000)/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(164340000*laplace_rate + 77239800)
    + laplace_rate*(198000000*laplace_rate + 562320000) + 304979400) + b_concentration*(b_concentration*(113668500*laplace_rate
    + 53424195) + laplace_rate*(273900000*laplace_rate + 1525000500) + 657670005) + laplace_rate*(laplace_rate*(165000000*laplace_rate
    + 1759800000) + 3724741500) + 1807562400) + b_concentration*(b_concentration*(680633200*laplace_rate + 319897604)
    + laplace_rate*(2387080000*laplace_rate + 4332434000) + 1507781320) + laplace_rate*(laplace_rate*(1888000000*laplace_rate
    + 6888440000) + 6364376000) + 1506161604) + b_concentration*(b_concentration*(laplace_rate*(516675000*laplace_rate
    + 1400189250) + 543955440) + laplace_rate*(laplace_rate*(1245000000*laplace_rate + 4569150000) + 4048242000)
    + 849169680) + laplace_rate*(laplace_rate*(laplace_rate*(750000000*laplace_rate + 3472500000) + 4627125000)
    + 2176524750) + 316404000)
- probe: a_cells
  description: Laplace-weighted cells carrying only adsorbed A.
  answer: a_concentration*(a_concentration*(a_concentration*(laplace_rate*(198000000*laplace_rate + 510840000) +
    196356600) + b_concentration*(69844500*laplace_rate + 32826915) + laplace_rate*(1185600000*laplace_rate + 2889888000)
    + 1096348320) + b_concentration*(380970000*laplace_rate + 179055900) + laplace_rate*(laplace_rate*(900000000*laplace_rate
    + 3357000000) + 2641230000) + 593257500)/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(164340000*laplace_rate
    + 77239800) + laplace_rate*(198000000*laplace_rate + 562320000) + 304979400) + b_concentration*(b_concentration*(113668500*laplace_rate
    + 53424195) + laplace_rate*(273900000*laplace_rate + 1525000500) + 657670005) + laplace_rate*(laplace_rate*(165000000*laplace_rate
    + 1759800000) + 3724741500) + 1807562400) + b_concentration*(b_concentration*(680633200*laplace_rate + 319897604)
    + laplace_rate*(2387080000*laplace_rate + 4332434000) + 1507781320) + laplace_rate*(laplace_rate*(1888000000*laplace_rate
    + 6888440000) + 6364376000) + 1506161604) + b_concentration*(b_concentration*(laplace_rate*(516675000*laplace_rate
    + 1400189250) + 543955440) + laplace_rate*(laplace_rate*(1245000000*laplace_rate + 4569150000) + 4048242000)
    + 849169680) + laplace_rate*(laplace_rate*(laplace_rate*(750000000*laplace_rate + 3472500000) + 4627125000)
    + 2176524750) + 316404000)
