  + b_concentration*(b_concentration*(laplace_rate*(465007500*laplace_rate + 2018132550) + 2187395280) + laplace_rate*(laplace_rate*(1120500000*laplace_rate
  + 5792985000) + 8849933100) + 3414746160) + laplace_rate*(laplace_rate*(laplace_rate*(675000000*laplace_rate +
  4050000000) + 7883257500) + 5551395750) + 1272348000)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: a_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: b_concentration
  description: Buffered gas-reactant concentration for the named species.
