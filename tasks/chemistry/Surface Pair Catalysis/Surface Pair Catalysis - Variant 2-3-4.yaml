  + b_concentration*(b_concentration*(laplace_rate*(4650075000*laplace_rate + 12601703250) + 4895598960) + laplace_rate*(laplace_rate*(11205000000*laplace_rate
  + 41122350000) + 36434178000) + 7642527120) + laplace_rate*(laplace_rate*(laplace_rate*(6750000000*laplace_rate
  + 31252500000) + 41644125000) + 19588722750) + 2847636000)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: a_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: b_concentration
  description: Buffered gas-reactant concentration for the named species.
