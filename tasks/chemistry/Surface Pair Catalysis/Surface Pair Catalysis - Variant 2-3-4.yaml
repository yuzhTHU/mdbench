  + 53424195) + 562864500*laplace_rate + 282705885) + 302940000*laplace_rate + 221146200) + b_concentration*(b_concentration*(1362644200*laplace_rate
  + 640442774) + laplace_rate*(821700000*laplace_rate + 7062785400) + 3295799358) + laplace_rate*(2034450000*laplace_rate
  + 7454794500) + 4315833900) + b_concentration*(b_concentration*(laplace_rate*(516675000*laplace_rate + 6507004950)
  + 2944158819) + laplace_rate*(10261290000*laplace_rate + 30415175700) + 12296123229) + laplace_rate*(laplace_rate*(1485000000*laplace_rate
  + 20298915000) + 42360313050) + 20058426072) + b_concentration*(b_concentration*(laplace_rate*(3100050000*laplace_rate
  + 14526834300) + 6142811076) + laplace_rate*(laplace_rate*(3735000000*laplace_rate + 37096020000) + 55022526000)
