    + 8000370*b_concentration + 17820000*laplace_rate + 63666540) + 29144205*b_concentration + 153684000*laplace_rate
    + 308289240) + 34287300*b_concentration + laplace_rate*(81000000*laplace_rate + 264060000) + 113602500)/(a_concentration*(a_concentration*(a_concentration*(a_concentration*(b_concentration*(1136685*b_concentration
