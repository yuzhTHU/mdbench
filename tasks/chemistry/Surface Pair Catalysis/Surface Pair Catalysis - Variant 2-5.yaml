task_name: Surface Pair Catalysis - Variant 2-5
task_description: Determine the Laplace-weighted B-containing product rate after exposing initially empty surface
  cells to buffered A and B.
mutation: Combines variants 2, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: a_ratio = a_concentration/concentration_scale
  description: Dimensionless gas A concentration.
  role: constitutive/component relations
- formula: b_ratio = b_concentration/concentration_scale
  description: Dimensionless gas B concentration.
  role: constitutive/component relations
- formula: a_adsorption = rate_scale*(1.2*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_adsorption = rate_scale*(0.83*b_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: a_desorption = rate_scale*(0.64)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_desorption = rate_scale*(0.51)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_b_adsorption = rate_scale*(0.83*b_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_a_adsorption = rate_scale*(1.2*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_a_desorption = rate_scale*(0.64)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_b_desorption = rate_scale*(0.51)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: surface_reaction = rate_scale*(1.6)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: immobilization = rate_scale*(0.26)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: remobilization = rate_scale*(0.47)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: gas_surface_reaction = rate_scale*(0.24*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: gas_surface_flux = gas_surface_reaction*b_cells
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: laplace_rate*empty_cells+a_adsorption*empty_cells+b_adsorption*empty_cells = laplace_rate*(1)+a_desorption*a_cells+b_desorption*b_cells+surface_reaction*ab_cells+gas_surface_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*a_cells+a_desorption*a_cells+second_b_adsorption*a_cells+immobilization*a_cells = 0+a_adsorption*empty_cells+paired_b_desorption*ab_cells+remobilization*immobile_a_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*b_cells+b_desorption*b_cells+second_a_adsorption*b_cells+gas_surface_flux = 0+b_adsorption*empty_cells+paired_a_desorption*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*ab_cells+paired_a_desorption*ab_cells+paired_b_desorption*ab_cells+surface_reaction*ab_cells
    = 0+second_b_adsorption*a_cells+second_a_adsorption*b_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*immobile_a_cells+remobilization*immobile_a_cells = 0+immobilization*a_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = surface_reaction*ab_cells+gas_surface_reaction*b_cells
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = a_concentration*(a_concentration*b_concentration*(1529856000*laplace_rate + 719032320)
  + b_concentration*(b_concentration*(laplace_rate*(103335000*laplace_rate + 1106717850) + 497330688) + laplace_rate*(laplace_rate*(124500000*laplace_rate
  + 2504940000) + 2847103350) + 641324400))/(a_concentration*(a_concentration*(b_concentration*(896400000*laplace_rate
  + 421308000) + laplace_rate*(1080000000*laplace_rate + 3182400000) + 1747620000) + b_concentration*(b_concentration*(516675000*laplace_rate
  + 242837250) + laplace_rate*(1992000000*laplace_rate + 3804720000) + 1354659600) + laplace_rate*(laplace_rate*(1650000000*laplace_rate
  + 6220500000) + 5840595000) + 1367964750) + b_concentration*(b_concentration*(laplace_rate*(430562500*laplace_rate
  + 1166824375) + 453296200) + laplace_rate*(laplace_rate*(1037500000*laplace_rate + 3807625000) + 3373535000) +
  707641400) + laplace_rate*(laplace_rate*(laplace_rate*(625000000*laplace_rate + 2893750000) + 3855937500) + 1813770625)
  + 263670000)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: a_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: b_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: a_ratio
  description: Dimensionless gas A concentration.
  unit: '1'
  role: internal
- name: b_ratio
  description: Dimensionless gas B concentration.
  unit: '1'
  role: internal
- name: a_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: b_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: a_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: b_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_b_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_a_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: paired_a_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: paired_b_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: surface_reaction
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: immobilization
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: remobilization
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: gas_surface_reaction
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: empty_cells
  description: Laplace-weighted empty catalytic-cell fraction.
  unit: '1'
  role: internal
- name: a_cells
  description: Laplace-weighted cells carrying only adsorbed A.
  unit: '1'
  role: internal
- name: b_cells
  description: Laplace-weighted cells carrying only adsorbed B.
  unit: '1'
  role: internal
- name: ab_cells
  description: Laplace-weighted cells carrying both adsorbed reactants.
  unit: '1'
  role: internal
- name: immobile_a_cells
  description: Laplace-weighted cells containing immobilized adsorbed A.
  unit: '1'
  role: internal
- name: gas_surface_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: s^-1
  role: target
mechanism_probes:
- probe: immobile_a_cells
  description: Laplace-weighted cells containing immobilized adsorbed A.
  answer: a_concentration*(a_concentration*(11232000*laplace_rate + 24897600) + 3301740*b_concentration + laplace_rate*(7800000*laplace_rate
    + 25428000) + 10939500)/(a_concentration*(a_concentration*(b_concentration*(35856000*laplace_rate + 16852320)
    + laplace_rate*(43200000*laplace_rate + 127296000) + 69904800) + b_concentration*(b_concentration*(20667000*laplace_rate
    + 9713490) + laplace_rate*(79680000*laplace_rate + 152188800) + 54186384) + laplace_rate*(laplace_rate*(66000000*laplace_rate
    + 248820000) + 233623800) + 54718590) + b_concentration*(b_concentration*(laplace_rate*(17222500*laplace_rate
    + 46672975) + 18131848) + laplace_rate*(laplace_rate*(41500000*laplace_rate + 152305000) + 134941400) + 28305656)
    + laplace_rate*(laplace_rate*(laplace_rate*(25000000*laplace_rate + 115750000) + 154237500) + 72550825) + 10546800)
- probe: gas_surface_flux
  description: Laplace-weighted transition flux per adsorption cell.
  answer: a_concentration*(a_concentration*b_concentration*(95616000*laplace_rate + 44939520) + b_concentration*(b_concentration*(laplace_rate*(103335000*laplace_rate
    + 280037850) + 108791088) + laplace_rate*(laplace_rate*(124500000*laplace_rate + 512940000) + 506503350) + 102986400))/(a_concentration*(a_concentration*(b_concentration*(896400000*laplace_rate
    + 421308000) + laplace_rate*(1080000000*laplace_rate + 3182400000) + 1747620000) + b_concentration*(b_concentration*(516675000*laplace_rate
    + 242837250) + laplace_rate*(1992000000*laplace_rate + 3804720000) + 1354659600) + laplace_rate*(laplace_rate*(1650000000*laplace_rate
    + 6220500000) + 5840595000) + 1367964750) + b_concentration*(b_concentration*(laplace_rate*(430562500*laplace_rate
    + 1166824375) + 453296200) + laplace_rate*(laplace_rate*(1037500000*laplace_rate + 3807625000) + 3373535000)
    + 707641400) + laplace_rate*(laplace_rate*(laplace_rate*(625000000*laplace_rate + 2893750000) + 3855937500)
    + 1813770625) + 263670000)
