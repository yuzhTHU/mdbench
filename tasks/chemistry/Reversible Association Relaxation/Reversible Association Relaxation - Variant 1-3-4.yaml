task_name: Reversible Association Relaxation - Variant 1-3-4
task_description: Determine the Laplace-weighted stable bound-molecule concentration after mixing initially unassociated
  molecules with buffered ligand.
mutation: Combines variants 1, 3, 4 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_binding_rate = rate_scale*(0.38*ligand_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_unbinding_rate = rate_scale*(0.94)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: compaction_rate = rate_scale*(0.34)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: expansion_rate = rate_scale*(0.78)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux = laplace_rate*(molecule_total)+desorption_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+desorption_rate*bound_pool+second_binding_rate*bound_pool+compaction_rate*bound_pool
    = 0+binding_flux+second_unbinding_rate*double_bound_pool+expansion_rate*compact_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*double_bound_pool+second_unbinding_rate*double_bound_pool = 0+second_binding_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*compact_pool+expansion_rate*compact_pool = 0+compaction_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool+double_bound_pool+compact_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (laplace_rate*(laplace_rate*ligand*(6325000*ligand*molecule_total + 30250000*molecule_total)
  + ligand*(ligand*(2403500*ligand*molecule_total + 24524500*molecule_total) + 62315000*molecule_total)) + ligand*(ligand*(1874730*ligand*molecule_total
  + 15625060*molecule_total) + 31847200*molecule_total))/(laplace_rate*(laplace_rate*(27500000*laplace_rate + ligand*(6325000*ligand
  + 44552500) + 75075000) + ligand*(ligand*(2403500*ligand + 24524500) + 77092300) + 60643000) + ligand*(ligand*(1874730*ligand
  + 15625060) + 34671853) + 13509210)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: molecule_total
  description: Conserved concentration of initially unassociated binding molecules.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0001
    ood_boundary: 0.001
    max: 0.004
    distribution: log_uniform
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_unbinding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: compaction_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: expansion_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted free molecule concentration.
  unit: mol m^-3
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: mol m^-3
  role: internal
- name: double_bound_pool
  description: Laplace-weighted population carrying a second ligand.
  unit: mol m^-3
  role: internal
- name: compact_pool
  description: Laplace-weighted compact bound-complex concentration.
  unit: mol m^-3
  role: internal
- name: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3
  role: target
mechanism_probes:
- probe: double_bound_pool
  description: Laplace-weighted population carrying a second ligand.
  answer: (laplace_rate*ligand**2*(2403500*ligand*molecule_total + 11495000*molecule_total) + ligand**2*(1874730*ligand*molecule_total
    + 8966100*molecule_total))/(laplace_rate*(laplace_rate*(27500000*laplace_rate + ligand*(6325000*ligand + 44552500)
    + 75075000) + ligand*(ligand*(2403500*ligand + 24524500) + 77092300) + 60643000) + ligand*(ligand*(1874730*ligand
    + 15625060) + 34671853) + 13509210)
- probe: compact_pool
  description: Laplace-weighted compact bound-complex concentration.
  answer: (laplace_rate*ligand*(2150500*ligand*molecule_total + 10285000*molecule_total) + ligand*(2021470*ligand*molecule_total
    + 9667900*molecule_total))/(laplace_rate*(laplace_rate*(27500000*laplace_rate + ligand*(6325000*ligand + 44552500)
    + 75075000) + ligand*(ligand*(2403500*ligand + 24524500) + 77092300) + 60643000) + ligand*(ligand*(1874730*ligand
    + 15625060) + 34671853) + 13509210)
- probe: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: (laplace_rate*(laplace_rate*(laplace_rate*ligand*(632500000*ligand*molecule_total + 3025000000*molecule_total)
    + ligand*(ligand*(328957500*ligand*molecule_total + 3300000000*molecule_total) + 8258250000*molecule_total))
    + ligand*(ligand*(339877900*ligand*molecule_total + 3020292000*molecule_total) + 6670730000*molecule_total))
    + ligand*(ligand*(64967019*ligand*molecule_total + 621423660*molecule_total) + 1486013100*molecule_total))/(laplace_rate*(laplace_rate*(2750000000*laplace_rate
    + ligand*(632500000*ligand + 4455250000) + 7507500000) + ligand*(ligand*(240350000*ligand + 2452450000) + 7709230000)
    + 6064300000) + ligand*(ligand*(187473000*ligand + 1562506000) + 3467185300) + 1350921000)
