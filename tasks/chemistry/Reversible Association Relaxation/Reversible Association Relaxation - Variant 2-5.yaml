task_name: Reversible Association Relaxation - Variant 2-5
task_description: Determine the Laplace-weighted stable bound-molecule concentration after mixing initially unassociated
  molecules with buffered ligand.
mutation: Combines variants 2, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_binding = rate_scale*(1.43)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_return = rate_scale*(0.48)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: storage_rate = rate_scale*(0.29)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: return_rate = rate_scale*(0.53)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux+storage_rate*unoccupied_pool = laplace_rate*(molecule_total)+desorption_rate*precursor_pool+return_rate*stored_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+precursor_return*bound_pool = 0+precursor_binding*precursor_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*precursor_pool+desorption_rate*precursor_pool+precursor_binding*precursor_pool = 0+binding_flux+precursor_return*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*stored_pool+return_rate*stored_pool = 0+storage_rate*unoccupied_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (786500*laplace_rate*ligand*molecule_total + 416845*ligand*molecule_total)/(laplace_rate*(laplace_rate*(500000*laplace_rate
  + 550000*ligand + 1700000) + 1342000*ligand + 1218600) + 556765*ligand + 131856)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: molecule_total
  description: Conserved concentration of initially unassociated binding molecules.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0001
    ood_boundary: 0.001
    max: 0.004
    distribution: log_uniform
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_binding
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_return
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: storage_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: return_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted free molecule concentration.
  unit: mol m^-3
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: mol m^-3
  role: internal
- name: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  unit: mol m^-3
  role: internal
- name: stored_pool
  description: Laplace-weighted reversibly stored population.
  unit: mol m^-3
  role: internal
- name: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3
  role: target
mechanism_probes:
- probe: stored_pool
  description: Laplace-weighted reversibly stored population.
  answer: (laplace_rate*(145000*laplace_rate*molecule_total + 374100*molecule_total) + 46632*molecule_total)/(laplace_rate*(laplace_rate*(500000*laplace_rate
    + 550000*ligand + 1700000) + 1342000*ligand + 1218600) + 556765*ligand + 131856)
- probe: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  answer: (laplace_rate*(550000*laplace_rate*ligand*molecule_total + 555500*ligand*molecule_total) + 139920*ligand*molecule_total)/(laplace_rate*(laplace_rate*(500000*laplace_rate
    + 550000*ligand + 1700000) + 1342000*ligand + 1218600) + 556765*ligand + 131856)
