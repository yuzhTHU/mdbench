    + 1091200*flow_rate + 725617)*(1000000*flow_rate**3 + 410000*flow_rate**2*substrate + 4090000*flow_rate**2 +
    233700*flow_rate*substrate + 4347100*flow_rate + 1334199) + (310000*flow_rate**2 + 127100*flow_rate*substrate
