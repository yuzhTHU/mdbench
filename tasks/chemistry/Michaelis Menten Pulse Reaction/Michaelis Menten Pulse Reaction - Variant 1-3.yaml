mechanism_probes:
- probe: double_complex
  description: Second-vessel steady nonproductive two-substrate complex concentration.
  answer: 1435*enzyme_total*(second_substrate**2*(100*flow_rate + 57)*(1000000*flow_rate**3 + 410000*flow_rate**2*substrate
    + 4090000*flow_rate**2 + 233700*flow_rate*substrate + 4347100*flow_rate + 1334199) + 1767*second_substrate**2*(10000*flow_rate**2
    + 4100*flow_rate*substrate + 35200*flow_rate + 23407) + 20*second_substrate*substrate*(10000*flow_rate**2 +
    14600*flow_rate + 5073)*(500*flow_rate**2 + 700*flow_rate*second_substrate + 440*flow_rate + 399*second_substrate)
    + 20*substrate**2*(100*flow_rate + 57)*(50000*flow_rate**3 + 90500*flow_rate**2*second_substrate + 175500*flow_rate**2
    + 28700*flow_rate*second_substrate**2 + 57940*flow_rate*second_substrate + 115720*flow_rate + 16359*second_substrate**2))/(4*(250000*flow_rate**3
    + 452500*flow_rate**2*second_substrate + 1100000*flow_rate**2 + 143500*flow_rate*second_substrate**2 + 601200*flow_rate*second_substrate
    + 1359575*flow_rate + 81795*second_substrate**2 + 177555*second_substrate + 514954)*(250000*flow_rate**3 + 452500*flow_rate**2*substrate
    + 1100000*flow_rate**2 + 143500*flow_rate*substrate**2 + 601200*flow_rate*substrate + 1359575*flow_rate + 81795*substrate**2
    + 177555*substrate + 514954))
