    + 13826120000)) + ligand*(ligand*(ligand*(ligand*(ligand*(99969925*ligand + 732848050) + 705051050) + 5168507300)
    + 1243116325) + 9112894450)) + ligand*(ligand**2*(118701132*ligand**2 + 837155352) + 1476037068))/(laplace_rate*(laplace_rate*(laplace_rate*(8375000000*laplace_rate
