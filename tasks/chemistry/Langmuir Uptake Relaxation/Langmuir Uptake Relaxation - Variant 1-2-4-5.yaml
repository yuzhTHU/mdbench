    + ligand*(ligand*(522500000*ligand + 318250000) + 2479000000) + 7269500000) + ligand*(ligand*(ligand*(198550000*ligand
    + 2038510000) + 1413030000) + 8435970000) + 9202450000) + ligand*(ligand*(ligand*(389158000*ligand + 2150542550)
    + 1842158300) + 8065895500) + 3903701400) + ligand*(ligand*(ligand*(150481045*ligand + 700871050) + 606748717)
    + 2471492650) + 268370376)
- probe: dissociation_flux
