task_name: Langmuir Uptake Relaxation - Variant 2-3
task_description: Determine Laplace-weighted coverage after exposing an initially empty homogeneous surface to a
  buffered adsorbate concentration.
mutation: Combines variants 2, 3 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: storage_rate = rate_scale*(0.29)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: return_rate = rate_scale*(0.53)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: dissociation_flux = desorption_rate*bound_pool
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux = laplace_rate*(1)+dissociation_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+dissociation_flux+storage_rate*bound_pool = 0+binding_flux+return_rate*stored_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*stored_pool+return_rate*stored_pool = 0+storage_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool+stored_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (laplace_rate*ligand*(253000*ligand + 1210000) + ligand*(207460*ligand + 992200))/(laplace_rate*(1100000*laplace_rate
  + ligand*(253000*ligand + 1364100) + 1639000) + ligand*(207460*ligand + 1073873) + 390610)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: storage_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: return_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted empty-site fraction.
  unit: '1'
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: '1'
  role: internal
- name: stored_pool
  description: Laplace-weighted reversibly stored population.
  unit: '1'
  role: internal
- name: binding_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: dissociation_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: '1'
  role: target
mechanism_probes:
- probe: stored_pool
  description: Laplace-weighted reversibly stored population.
  answer: ligand*(73370*ligand + 350900)/(laplace_rate*(1100000*laplace_rate + ligand*(253000*ligand + 1364100)
    + 1639000) + ligand*(207460*ligand + 1073873) + 390610)
- probe: binding_flux
  description: Laplace-weighted transition flux per adsorption cell.
  answer: (laplace_rate*(laplace_rate*ligand*(25300000*ligand + 121000000) + ligand*(ligand*(3544300*ligand + 54648000)
    + 180290000)) + ligand*(ligand*(1878479*ligand + 17968060) + 42967100))/(laplace_rate*(110000000*laplace_rate
    + ligand*(25300000*ligand + 136410000) + 163900000) + ligand*(20746000*ligand + 107387300) + 39061000)
