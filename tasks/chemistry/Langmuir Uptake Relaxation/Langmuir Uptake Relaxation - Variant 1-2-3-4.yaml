    + ligand*(ligand*(ligand*(ligand*(10880937100*ligand + 16045477580) + 82654570971) + 56581420940) + 135303397900))/(laplace_rate*(laplace_rate*(368500000000*laplace_rate
    + ligand*(ligand*(114950000000*ligand + 154770000000) + 597003500000) + 895455000000) + ligand*(ligand*(ligand*(43681000000*ligand
    + 234518900000) + 406123850000) + 863518445000) + 646975450000) + ligand*(ligand*(ligand*(23150930000*ligand
    + 105673117000) + 181848117000) + 338162607700) + 123003089000)
- probe: dissociation_flux
