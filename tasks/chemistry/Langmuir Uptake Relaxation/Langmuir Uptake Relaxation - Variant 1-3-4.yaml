task_name: Langmuir Uptake Relaxation - Variant 1-3-4
task_description: Determine Laplace-weighted coverage after exposing an initially empty homogeneous surface to a
  buffered adsorbate concentration.
mutation: Combines variants 1, 3, 4 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1+(0.23/1.1)*ligand_ratio+(0.19/0.67)*ligand_ratio**2))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1+(0.23/1.1)*ligand_ratio+(0.19/0.67)*ligand_ratio**2))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_binding_rate = rate_scale*(0.38*ligand_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_unbinding_rate = rate_scale*(0.94)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: dissociation_flux = desorption_rate*bound_pool
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux = laplace_rate*(1)+dissociation_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+dissociation_flux+second_binding_rate*bound_pool = 0+binding_flux+second_unbinding_rate*double_bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*double_bound_pool+second_unbinding_rate*double_bound_pool = 0+second_binding_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool+double_bound_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (laplace_rate*ligand*(ligand*(11495000*ligand + 8475500) + 40535000) + ligand*(ligand*(ligand*(4368100*ligand
  + 14025990) + 23370270) + 38102900))/(laplace_rate*(36850000*laplace_rate + ligand*(ligand*(11495000*ligand +
  15477000) + 59700350) + 59328500) + ligand*(ligand*(ligand*(4368100*ligand + 14025990) + 29951680) + 42955509)
  + 23208130)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_unbinding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted empty-site fraction.
  unit: '1'
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: '1'
  role: internal
- name: double_bound_pool
  description: Laplace-weighted population carrying a second ligand.
  unit: '1'
  role: internal
- name: binding_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: dissociation_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: '1'
  role: target
mechanism_probes:
- probe: double_bound_pool
  description: Laplace-weighted population carrying a second ligand.
  answer: ligand**2*(ligand*(4368100*ligand + 3220690) + 15403300)/(laplace_rate*(36850000*laplace_rate + ligand*(ligand*(11495000*ligand
    + 15477000) + 59700350) + 59328500) + ligand*(ligand*(ligand*(4368100*ligand + 14025990) + 29951680) + 42955509)
    + 23208130)
- probe: binding_flux
  description: Laplace-weighted transition flux per adsorption cell.
  answer: (laplace_rate*(laplace_rate*ligand*(ligand*(1149500000*ligand + 847550000) + 4053500000) + ligand*(ligand*(ligand*(ligand*(218405000*ligand
    + 758879000) + 3061663050) + 3472744000) + 6526135000)) + ligand*(ligand*(ligand*(ligand*(205300700*ligand +
    302744860) + 1559520207) + 1067573980) + 2552894300))/(laplace_rate*(3685000000*laplace_rate + ligand*(ligand*(1149500000*ligand
    + 1547700000) + 5970035000) + 5932850000) + ligand*(ligand*(ligand*(436810000*ligand + 1402599000) + 2995168000)
    + 4295550900) + 2320813000)
- probe: dissociation_flux
  description: Laplace-weighted transition flux per adsorption cell.
  answer: (laplace_rate*ligand*(ligand*(ligand*(ligand*(218405000*ligand + 322069000) + 1659064050) + 1135717000)
    + 2715845000) + ligand*(ligand*(ligand*(ligand*(205300700*ligand + 302744860) + 1559520207) + 1067573980) +
    2552894300))/(laplace_rate*(3685000000*laplace_rate + ligand*(ligand*(1149500000*ligand + 1547700000) + 5970035000)
    + 5932850000) + ligand*(ligand*(ligand*(436810000*ligand + 1402599000) + 2995168000) + 4295550900) + 2320813000)
