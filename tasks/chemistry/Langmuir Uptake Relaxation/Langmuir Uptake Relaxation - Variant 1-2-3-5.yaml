task_name: Langmuir Uptake Relaxation - Variant 1-2-3-5
task_description: Determine Laplace-weighted coverage after exposing an initially empty homogeneous surface to a
  buffered adsorbate concentration.
mutation: Combines variants 1, 2, 3, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_binding = rate_scale*(1.43)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_return = rate_scale*(0.48)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_binding_rate = rate_scale*(0.38*ligand_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_unbinding_rate = rate_scale*(0.94)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: storage_rate = rate_scale*(0.29)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: return_rate = rate_scale*(0.53)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: dissociation_flux = desorption_rate*precursor_pool
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux = laplace_rate*(1)+dissociation_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+precursor_return*bound_pool+second_binding_rate*bound_pool+storage_rate*bound_pool
    = 0+precursor_binding*precursor_pool+second_unbinding_rate*double_bound_pool+return_rate*stored_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*precursor_pool+dissociation_flux+precursor_binding*precursor_pool = 0+binding_flux+precursor_return*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*double_bound_pool+second_unbinding_rate*double_bound_pool = 0+second_binding_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*stored_pool+return_rate*stored_pool = 0+storage_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool+precursor_pool+double_bound_pool+stored_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (laplace_rate*(laplace_rate*(laplace_rate*ligand*(632500000*ligand + 3025000000) +
  ligand*(ligand*(240350000*ligand + 3470775000) + 11101750000)) + ligand*(ligand*(471086000*ligand + 4778719000)
  + 12079430000)) + ligand*(ligand*(182161265*ligand + 1719628900) + 4057674500))/(laplace_rate*(laplace_rate*(laplace_rate*(2750000000*laplace_rate
  + ligand*(632500000*ligand + 4455250000) + 11935000000) + ligand*(ligand*(240350000*ligand + 3617170000) + 14713060000)
  + 15108500000) + ligand*(ligand*(471086000*ligand + 4856308350) + 13811298100) + 6409062000) + ligand*(ligand*(182161265*ligand
  + 1719628900) + 4149801644) + 440608080)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_binding
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_return
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_unbinding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: storage_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: return_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted empty-site fraction.
  unit: '1'
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: '1'
  role: internal
- name: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  unit: '1'
  role: internal
- name: double_bound_pool
  description: Laplace-weighted population carrying a second ligand.
  unit: '1'
  role: internal
- name: stored_pool
  description: Laplace-weighted reversibly stored population.
  unit: '1'
  role: internal
- name: binding_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: dissociation_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: '1'
  role: target
mechanism_probes:
- probe: double_bound_pool
  description: Laplace-weighted population carrying a second ligand.
  answer: (laplace_rate*ligand**2*(343700500*ligand + 1643785000) + ligand**2*(182161265*ligand + 871206050))/(laplace_rate*(laplace_rate*(laplace_rate*(2750000000*laplace_rate
    + ligand*(632500000*ligand + 4455250000) + 11935000000) + ligand*(ligand*(240350000*ligand + 3617170000) + 14713060000)
    + 15108500000) + ligand*(ligand*(471086000*ligand + 4856308350) + 13811298100) + 6409062000) + ligand*(ligand*(182161265*ligand
    + 1719628900) + 4149801644) + 440608080)
- probe: stored_pool
  description: Laplace-weighted reversibly stored population.
  answer: (laplace_rate*ligand*(262297750*ligand + 1254467500) + ligand*(246559885*ligand + 1179199450))/(laplace_rate*(laplace_rate*(laplace_rate*(2750000000*laplace_rate
    + ligand*(632500000*ligand + 4455250000) + 11935000000) + ligand*(ligand*(240350000*ligand + 3617170000) + 14713060000)
    + 15108500000) + ligand*(ligand*(471086000*ligand + 4856308350) + 13811298100) + 6409062000) + ligand*(ligand*(182161265*ligand
    + 1719628900) + 4149801644) + 440608080)
- probe: binding_flux
  description: Laplace-weighted transition flux per adsorption cell.
  answer: (laplace_rate*(laplace_rate*(laplace_rate*(laplace_rate*ligand*(31625000000*ligand + 151250000000) + ligand*(ligand*(16447875000*ligand
    + 215916250000) + 656425000000)) + ligand*(ligand*(ligand*(1683542500*ligand + 49581790000) + 372369800000)
    + 830967500000)) + ligand*(ligand*(ligand*(892277525*ligand + 24183897400) + 168956958500) + 352498410000))
    + ligand*(ligand*(1059462156*ligand + 10133985840) + 24233444400))/(laplace_rate*(laplace_rate*(laplace_rate*(137500000000*laplace_rate
    + ligand*(31625000000*ligand + 222762500000) + 596750000000) + ligand*(ligand*(12017500000*ligand + 180858500000)
    + 735653000000) + 755425000000) + ligand*(ligand*(23554300000*ligand + 242815417500) + 690564905000) + 320453100000)
    + ligand*(ligand*(9108063250*ligand + 85981445000) + 207490082200) + 22030404000)
- probe: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  answer: (laplace_rate*(laplace_rate*(laplace_rate*ligand*(632500000*ligand + 3025000000) + ligand*(ligand*(240350000*ligand
    + 2566300000) + 6776000000)) + ligand*(ligand*(127385500*ligand + 1543058000) + 4466110000)) + ligand*(151253520*ligand
    + 723386400))/(laplace_rate*(laplace_rate*(laplace_rate*(2750000000*laplace_rate + ligand*(632500000*ligand
    + 4455250000) + 11935000000) + ligand*(ligand*(240350000*ligand + 3617170000) + 14713060000) + 15108500000)
    + ligand*(ligand*(471086000*ligand + 4856308350) + 13811298100) + 6409062000) + ligand*(ligand*(182161265*ligand
    + 1719628900) + 4149801644) + 440608080)
