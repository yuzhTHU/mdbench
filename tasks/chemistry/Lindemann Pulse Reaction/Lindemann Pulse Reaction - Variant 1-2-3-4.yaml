task_name: Lindemann Pulse Reaction - Variant 1-2-3-4
task_description: Determine the Laplace-weighted product rate after a reactant pulse in a homogeneous, buffered
  collision bath.
mutation: Combines variants 1, 2, 3, 4 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: bath_ratio = collider/concentration_scale
  description: Dimensionless buffered collision-partner concentration.
  role: constitutive/component relations
- formula: activation_rate = rate_scale*(1.3*bath_ratio+0.21*bath_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: deactivation_rate = rate_scale*(0.8*bath_ratio*(1+(0.21/1.3)*bath_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: conversion_rate = rate_scale*(1.7)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: product_rate = rate_scale*(2.3)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: quench_rate = rate_scale*(0.16*bath_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: caging_rate = rate_scale*(0.37*bath_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: escape_rate = rate_scale*(0.63)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: activation_flux = activation_rate*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: quench_flux = quench_rate*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*reactant_pool+activation_flux+quench_flux+caging_rate*reactant_pool = laplace_rate*(dose)+deactivation_rate*activated_pool+escape_rate*caged_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*activated_pool+deactivation_rate*activated_pool+conversion_rate*activated_pool = 0+activation_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*secondary_pool+product_rate*secondary_pool = 0+conversion_rate*activated_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*caged_pool+escape_rate*caged_pool = 0+caging_rate*reactant_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = product_rate*secondary_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = collider*(collider*dose*laplace_rate*(53371500*laplace_rate + 33624045) + dose*laplace_rate*(330395000*laplace_rate
  + 208148850))/(collider*(collider*(collider*(collider*(laplace_rate*(1344000*laplace_rate + 3937920) + 1947456)
  + laplace_rate*(11428000*laplace_rate + 31526000) + 12055680) + laplace_rate*(laplace_rate*(32450000*laplace_rate
  + 155203500) + 211065100) + 59242365) + laplace_rate*(laplace_rate*(160550000*laplace_rate + 639795000) + 712718500)
  + 208148850) + laplace_rate*(laplace_rate*(laplace_rate*(65000000*laplace_rate + 300950000) + 417950000) + 160114500))
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: collider
  description: Buffered collision-partner molar concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.08
    ood_boundary: 2
    max: 6
    distribution: log_uniform
- name: dose
  description: Initial unactivated reactant pulse concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0002
    ood_boundary: 0.002
    max: 0.008
    distribution: log_uniform
- name: bath_ratio
  description: Dimensionless buffered collision-partner concentration.
  unit: '1'
  role: internal
- name: activation_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: deactivation_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: conversion_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: product_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: quench_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: caging_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: escape_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: reactant_pool
  description: Laplace-weighted unactivated reactant concentration.
  unit: mol m^-3
  role: internal
- name: activated_pool
  description: Laplace-weighted primary activated-intermediate concentration.
  unit: mol m^-3
  role: internal
- name: secondary_pool
  description: Laplace-weighted second reactive intermediate concentration.
  unit: mol m^-3
  role: internal
- name: caged_pool
  description: Laplace-weighted reversibly caged reactant concentration.
  unit: mol m^-3
  role: internal
- name: activation_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: quench_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: quench_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: collider**2*(collider*(collider*dose*laplace_rate*(134400*laplace_rate + 84672) + dose*laplace_rate*(832000*laplace_rate
    + 524160)) + dose*laplace_rate*(laplace_rate*(1040000*laplace_rate + 2423200) + 1113840))/(collider*(collider*(collider*(collider*(134400*laplace_rate
    + 84672) + 1142800*laplace_rate + 524160) + laplace_rate*(3245000*laplace_rate + 8056850) + 2575755) + laplace_rate*(16055000*laplace_rate
    + 27053000) + 9049950) + laplace_rate*(laplace_rate*(6500000*laplace_rate + 15145000) + 6961500))
- probe: secondary_pool
  description: Laplace-weighted second reactive intermediate concentration.
  answer: collider*(collider*dose*laplace_rate*(23205000*laplace_rate + 14619150) + dose*laplace_rate*(143650000*laplace_rate
    + 90499500))/(collider*(collider*(collider*(collider*(laplace_rate*(1344000*laplace_rate + 3937920) + 1947456)
    + laplace_rate*(11428000*laplace_rate + 31526000) + 12055680) + laplace_rate*(laplace_rate*(32450000*laplace_rate
    + 155203500) + 211065100) + 59242365) + laplace_rate*(laplace_rate*(160550000*laplace_rate + 639795000) + 712718500)
    + 208148850) + laplace_rate*(laplace_rate*(laplace_rate*(65000000*laplace_rate + 300950000) + 417950000) + 160114500))
- probe: caged_pool
  description: Laplace-weighted reversibly caged reactant concentration.
  answer: collider*(collider*(310800*collider*dose*laplace_rate + 1924000*dose*laplace_rate) + dose*laplace_rate*(2405000*laplace_rate
    + 4088500))/(collider*(collider*(collider*(collider*(134400*laplace_rate + 84672) + 1142800*laplace_rate + 524160)
    + laplace_rate*(3245000*laplace_rate + 8056850) + 2575755) + laplace_rate*(16055000*laplace_rate + 27053000)
    + 9049950) + laplace_rate*(laplace_rate*(6500000*laplace_rate + 15145000) + 6961500))
- probe: activation_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: collider*(collider*(collider*(collider*dose*laplace_rate*(176400*laplace_rate + 111132) + dose*laplace_rate*(2184000*laplace_rate
    + 1375920)) + dose*laplace_rate*(laplace_rate*(1365000*laplace_rate + 9940450) + 5720715)) + dose*laplace_rate*(laplace_rate*(8450000*laplace_rate
    + 19688500) + 9049950))/(collider*(collider*(collider*(collider*(134400*laplace_rate + 84672) + 1142800*laplace_rate
    + 524160) + laplace_rate*(3245000*laplace_rate + 8056850) + 2575755) + laplace_rate*(16055000*laplace_rate +
    27053000) + 9049950) + laplace_rate*(laplace_rate*(6500000*laplace_rate + 15145000) + 6961500))
