task_name: Lindemann Pulse Reaction - Variant 1-2-5
task_description: Determine the Laplace-weighted product rate after a reactant pulse in a homogeneous, buffered
  collision bath.
mutation: Combines variants 1, 2, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: bath_ratio = collider/concentration_scale
  description: Dimensionless buffered collision-partner concentration.
  role: constitutive/component relations
- formula: activation_rate = rate_scale*(1.3*bath_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: deactivation_rate = rate_scale*(0.8*bath_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: conversion_rate = rate_scale*(1.7)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: product_rate = rate_scale*(2.3)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: quench_rate = rate_scale*(0.16*bath_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: direct_rate = rate_scale*(0.19)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: activation_flux = activation_rate*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: quench_flux = quench_rate*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: direct_product_flux = direct_rate*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*reactant_pool+activation_flux+quench_flux+direct_product_flux = laplace_rate*(dose)+deactivation_rate*activated_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*activated_pool+deactivation_rate*activated_pool+conversion_rate*activated_pool = 0+activation_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*secondary_pool+product_rate*secondary_pool = 0+conversion_rate*activated_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = product_rate*secondary_pool+direct_rate*reactant_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (collider*dose*laplace_rate*(1520*laplace_rate + 54326) + dose*laplace_rate*(laplace_rate*(1900*laplace_rate
  + 7600) + 7429))/(collider*(collider*(collider*(1280*laplace_rate + 2944) + laplace_rate*(1600*laplace_rate +
  6400) + 6256) + laplace_rate*(21000*laplace_rate + 71920) + 54326) + laplace_rate*(laplace_rate*(10000*laplace_rate
  + 41900) + 46700) + 7429)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: collider
  description: Buffered collision-partner molar concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.08
    ood_boundary: 2
    max: 6
    distribution: log_uniform
- name: dose
  description: Initial unactivated reactant pulse concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0002
    ood_boundary: 0.002
    max: 0.008
    distribution: log_uniform
- name: bath_ratio
  description: Dimensionless buffered collision-partner concentration.
  unit: '1'
  role: internal
- name: activation_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: deactivation_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: conversion_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: product_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: quench_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: direct_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: reactant_pool
  description: Laplace-weighted unactivated reactant concentration.
  unit: mol m^-3
  role: internal
- name: activated_pool
  description: Laplace-weighted primary activated-intermediate concentration.
  unit: mol m^-3
  role: internal
- name: secondary_pool
  description: Laplace-weighted second reactive intermediate concentration.
  unit: mol m^-3
  role: internal
- name: activation_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: quench_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: direct_product_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: quench_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: collider**2*(128*collider*dose*laplace_rate + dose*laplace_rate*(160*laplace_rate + 272))/(collider*(collider*(128*collider
    + 160*laplace_rate + 272) + 2100*laplace_rate + 2362) + laplace_rate*(1000*laplace_rate + 1890) + 323)
- probe: secondary_pool
  description: Laplace-weighted second reactive intermediate concentration.
  answer: 22100*collider*dose*laplace_rate/(collider*(collider*(collider*(1280*laplace_rate + 2944) + laplace_rate*(1600*laplace_rate
    + 6400) + 6256) + laplace_rate*(21000*laplace_rate + 71920) + 54326) + laplace_rate*(laplace_rate*(10000*laplace_rate
    + 41900) + 46700) + 7429)
- probe: direct_product_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: (152*collider*dose*laplace_rate + dose*laplace_rate*(190*laplace_rate + 323))/(collider*(collider*(128*collider
    + 160*laplace_rate + 272) + 2100*laplace_rate + 2362) + laplace_rate*(1000*laplace_rate + 1890) + 323)
