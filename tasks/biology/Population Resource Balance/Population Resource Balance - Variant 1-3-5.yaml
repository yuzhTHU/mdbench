task_name: Population Resource Balance - Variant 1-3-5
task_description: Determine steady population number density from feed resource concentration, dilution rate, and intrinsic
  mortality.
mutation: Combines variants 1, 3, 5 using their shared state and balance equations.
mechanism_model:
- formula: birth0 = 0.01
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Continuous-flow vessel; resource supplied only by feed; positive non-washout stationary
    branch.
- formula: half = 0.01
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Only active organisms reproduce and consume resource; mortality and dilution apply
    to the total population.
- formula: sref = 1
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Resource concentration is mass density; organism counts are dimensionless.
- formula: qref = 0.0001
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: cost = 1e-12
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: maint0 = 1e-16
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: extra_death = 0.13*mortality*(feed/sref)/(1+feed/sref)
  role: constitutive/component relations
  description: Additional mortality frequency.
- formula: active_fraction = 1
  role: constitutive/component relations
  description: Fraction of organisms in the active compartment.
- formula: maintenance = maint0*(1+dilution/qref)
  role: constitutive/component relations
  description: Maintenance resource uptake per active organism.
- formula: birth_max = birth0
  role: constitutive/component relations
  description: Maximum active-organism birth frequency.
- formula: usable_feed = feed/(1+0.1*(feed/sref)**2)
  role: constitutive/component relations
  description: Usable feed resource concentration.
- formula: loss = mortality+dilution+extra_death
  role: conservation/balance relations
  description: Total population loss frequency.
- formula: birth = loss/active_fraction
  role: conservation/balance relations
  description: Required active-organism birth frequency.
- formula: resource = half*birth/(birth_max-birth)
  role: governing/dynamical laws
  description: Steady vessel resource concentration.
- formula: active_population = dilution*(usable_feed-resource)/(cost*birth+maintenance)
  role: conservation/balance relations
  description: Active organism number density.
- formula: population = active_population/active_fraction
  role: conservation/balance relations
  description: Total organism number density.
phenomenal_model: population = dilution*(feed/(feed**2/(10*sref**2) + 1) - half*(dilution + 13*feed*mortality/(100*sref*(feed/sref
  + 1)) + mortality)/(birth0 - dilution - 13*feed*mortality/(100*sref*(feed/sref + 1)) - mortality))/(cost*(dilution + 13*feed*mortality/(100*sref*(feed/sref
  + 1)) + mortality) + maint0*(dilution/qref + 1))
variables:
- name: feed
  description: Feed resource mass concentration.
  unit: kg m^-3
  role: input
  sampling:
    min: 0.1
    max: 2
    ood_boundary: 1.2
    distribution: uniform
- name: dilution
  description: Vessel dilution rate.
  unit: s^-1
  role: input
  sampling:
    min: 1.0e-05
    max: 0.0002
    ood_boundary: 0.0001
    distribution: log_uniform
- name: mortality
  description: Intrinsic mortality rate.
  unit: s^-1
  role: input
  sampling:
    min: 0.0001
    max: 0.0008
    ood_boundary: 0.0005
    distribution: uniform
- name: extra_death
  description: Additional mortality frequency.
  unit: s^-1
  role: internal
- name: active_fraction
  description: Fraction of organisms in the active compartment.
  unit: '1'
  role: internal
- name: maintenance
  description: Maintenance resource uptake per active organism.
  unit: kg s^-1
  role: internal
- name: birth_max
  description: Maximum active-organism birth frequency.
  unit: s^-1
  role: internal
- name: usable_feed
  description: Usable feed resource concentration.
  unit: kg m^-3
  role: internal
- name: loss
  description: Total population loss frequency.
  unit: s^-1
  role: internal
- name: birth
  description: Required active-organism birth frequency.
  unit: s^-1
  role: internal
- name: resource
  description: Steady vessel resource concentration.
  unit: kg m^-3
  role: internal
- name: active_population
  description: Active organism number density.
  unit: m^-3
  role: internal
- name: population
  description: Total organism number density.
  unit: m^-3
  role: target
mechanism_probes:
- probe: extra_death
  description: Additional mortality frequency.
  answer: 13*feed*mortality/(100*sref*(feed/sref + 1))
- probe: usable_feed
  description: Usable feed resource concentration.
  answer: feed/(feed**2/(10*sref**2) + 1)
