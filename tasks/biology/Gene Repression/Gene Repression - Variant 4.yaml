task_name: Gene Repression - Variant 4
task_description: Determine transcription initiation rate from repressor and polymerase concentrations.
mutation: Partition polymerase into a promoter-local compartment.
mechanism_model:
- formula: delivery_diffusivity = 1e-09
  role: auxiliary/regime constraints
  description: Fixed calibrated apparatus or constitutive coefficient; units follow the surrounding relations.
- formula: access_ref = 1e-05
  role: auxiliary/regime constraints
  description: Fixed calibrated apparatus or constitutive coefficient; units follow the surrounding relations.
- formula: kr = 0.001
  role: auxiliary/regime constraints
  description: Fixed model coefficient. One promoter; buffered concentrations; steady occupancy with mutually exclusive
    enumerated states.
- formula: kp = 0.0008
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Only unpaused polymerase and the optional leaky complex initiate.
- formula: kinit = 0.1
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Driven pausing and local partition closures are synthetic.
- formula: affinity = kr
  role: constitutive/component relations
  description: Effective repressor dissociation concentration.
- formula: local_polymerase = delivery_flux/removal_speed
  role: constitutive/component relations
  description: Promoter-local free polymerase concentration.
- formula: free = (1)-p_bound-r_bound
  role: conservation/balance relations
  description: Unbound reference state abundance.
- formula: p_bound = (local_polymerase/kp)*free
  role: constitutive/component relations
  description: Productive polymerase-only promoter fraction.
- formula: r_bound = (repressor/affinity)*free
  role: constitutive/component relations
  description: Repressor-only promoter fraction.
- formula: initiation = kinit*(p_bound)
  role: conservation/balance relations
  description: Transcription initiation rate per promoter.
- formula: removal_speed = delivery_diffusivity/access_ref*(0.15*repressor/kr)
  role: constitutive/component relations
  description: Positive uptake coefficient of a maintained local sink in the delivery layer.
- formula: delivery_flux = delivery_diffusivity*(polymerase-local_polymerase)/access_length
  role: constitutive/component relations
  description: Steady diffusive supply flux from the buffered feed.
phenomenal_model: initiation = 125*polymerase/(access_length*repressor*(15000000000*repressor + 15000000) + 1250*polymerase
  + 1000*repressor + 1)
variables:
- name: access_length
  role: input
  unit: m
  description: Measured thickness of the solution layer between the well-mixed feed and the assay surface.
  sampling:
    min: 2.0e-06
    max: 4.0e-05
    ood_boundary: 1.2e-05
    distribution: log_uniform
- name: repressor
  description: Free repressor concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 1.0e-05
    max: 0.006
    ood_boundary: 0.002
    distribution: log_uniform
- name: polymerase
  description: Free polymerase concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 1.0e-05
    max: 0.004
    ood_boundary: 0.001
    distribution: log_uniform
- name: affinity
  description: Effective repressor dissociation concentration.
  unit: mol m^-3
  role: internal
- name: local_polymerase
  description: Promoter-local free polymerase concentration.
  unit: mol m^-3
  role: internal
- name: free
  description: Unbound reference state abundance.
  unit: '1'
  role: internal
- name: p_bound
  description: Productive polymerase-only promoter fraction.
  unit: '1'
  role: internal
- name: r_bound
  description: Repressor-only promoter fraction.
  unit: '1'
  role: internal
- name: initiation
  description: Transcription initiation rate per promoter.
  unit: s^-1
  role: target
- name: removal_speed
  role: internal
  unit: m s^-1
  description: Positive uptake coefficient of a maintained local sink in the delivery layer.
- name: delivery_flux
  role: internal
  unit: mol m^-2 s^-1
  description: Steady diffusive supply flux from the buffered feed.
mechanism_probes:
- probe: local_polymerase
  description: Promoter-local free polymerase concentration.
  answer: polymerase/(15000000*access_length*repressor + 1)
