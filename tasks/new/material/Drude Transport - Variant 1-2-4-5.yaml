  description: Effective carrier inertial mass.
  answer: 1548595229*field**2/40000000000000000000000000000000000000000000000 + 91093837/100000000000000000000000000000000000000
- probe: backflow
  description: Momentum per carrier stored in the backflow reservoir.
  answer: 10414148121*density*field*(temp + 300)/(500000000000000000000000000000000000000000000000000000*(density/1000000000000000000000000
    + 1)*(231027296988201296040000000000000000000000000000000000000000000000000000*magnetic_field**2*(87*density
    + 100000000000000000000000000)**2*(temp + 300)**2/(8298087139382569*(9*density + 500000000000000000000*temp**2
    + 150000000000000000000000*temp)**2*(17*density*field**2 + 400000000*density + 17000000000000000000000000*field**2
    + 400000000000000000000000000000000)**2) + 1)*(3*density/2500000000 + 200000000000*temp**2/3 + 20000000000000*temp))
- probe: mobile
  description: Mobile carrier number density.
  answer: 1000000000000000000000000*density*temp/(81*density + 1000000000000000000000000*temp)
- probe: collision
  description: Total momentum relaxation frequency.
  answer: (9*density + temp*(500000000000000000000*temp + 150000000000000000000000))/(7500000000*temp + 2250000000000)
