task_name: Cooperative Binding - Variant 5
task_description: Determine mean primary-site occupancy from free ligand concentration.
mutation: Partition the local free ligand pool.
mechanism_model:
- formula: delivery_diffusivity = 1e-09
  role: auxiliary/regime constraints
  description: Fixed calibrated apparatus or constitutive coefficient; units follow the surrounding relations.
- formula: access_ref = 1e-05
  role: auxiliary/regime constraints
  description: Fixed calibrated apparatus or constitutive coefficient; units follow the surrounding relations.
- formula: kd = 0.001
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Two primary binding sites per protein; measured occupancy excludes the third
    allosteric ligand.
- formula: local_ligand = delivery_flux/removal_speed
  role: constitutive/component relations
  description: Local free ligand concentration. Receptor pool conserved; extracellular ligand buffered.
- formula: coupling = 2
  role: constitutive/component relations
  description: Cooperative statistical coupling factor. Additional gating and affinity closures describe a driven
    stationary protein population.
- formula: second_affinity = kd
  role: constitutive/component relations
  description: Second-site dissociation concentration.
- formula: free = (1)-single-double
  role: conservation/balance relations
  description: Unbound reference state abundance.
- formula: single = (2*local_ligand/kd)*free
  role: constitutive/component relations
  description: Protein fraction with one primary ligand.
- formula: double = (coupling*local_ligand**2/(kd*second_affinity))*free
  role: constitutive/component relations
  description: Protein fraction with two primary ligands only.
- formula: occupancy = (single+2*double)/2
  role: conservation/balance relations
  description: Mean primary-site occupancy.
- formula: removal_speed = delivery_diffusivity/access_ref*(0.14*(ligand/kd)**2)
  role: constitutive/component relations
  description: Positive uptake coefficient of a maintained local sink in the delivery layer.
- formula: delivery_flux = delivery_diffusivity*(ligand-local_ligand)/access_length
  role: constitutive/component relations
  description: Steady diffusive supply flux from the buffered feed.
phenomenal_model: occupancy = (14000000000000*access_length*ligand**3 + ligand*(2000000*ligand + 1000))/(access_length*(196000000000000000000*access_length*ligand**4
  + ligand**2*(28000000000000*ligand + 28000000000)) + ligand*(2000000*ligand + 2000) + 1)
variables:
- name: access_length
  role: input
  unit: m
  description: Measured thickness of the solution layer between the well-mixed feed and the assay surface.
  sampling:
    min: 2.0e-06
    max: 4.0e-05
    ood_boundary: 1.2e-05
    distribution: log_uniform
- name: ligand
  description: Free extracellular ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 1.0e-05
    max: 0.01
    ood_boundary: 0.003
    distribution: log_uniform
- name: local_ligand
  description: Local free ligand concentration.
  unit: mol m^-3
  role: internal
- name: coupling
  description: Cooperative statistical coupling factor.
  unit: '1'
  role: internal
- name: second_affinity
  description: Second-site dissociation concentration.
  unit: mol m^-3
  role: internal
- name: free
  description: Unbound reference state abundance.
  unit: '1'
  role: internal
- name: single
  description: Protein fraction with one primary ligand.
  unit: '1'
  role: internal
- name: double
  description: Protein fraction with two primary ligands only.
  unit: '1'
  role: internal
- name: occupancy
  description: Mean primary-site occupancy.
  unit: '1'
  role: target
- name: removal_speed
  role: internal
  unit: m s^-1
  description: Positive uptake coefficient of a maintained local sink in the delivery layer.
- name: delivery_flux
  role: internal
  unit: mol m^-2 s^-1
  description: Steady diffusive supply flux from the buffered feed.
mechanism_probes:
- probe: local_ligand
  description: Local free ligand concentration.
  answer: ligand/(14000000000*access_length*ligand**2 + 1)
