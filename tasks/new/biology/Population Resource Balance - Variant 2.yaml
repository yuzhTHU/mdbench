task_name: Population Resource Balance - Variant 2
task_description: Determine steady population number density from feed resource concentration, dilution rate, and
  intrinsic mortality.
mutation: Partition organisms between active and protected compartments.
mechanism_model:
- formula: birth0 = 0.01
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Continuous-flow vessel; resource supplied only by feed; positive non-washout
    stationary branch.
- formula: half = 0.01
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Only active organisms reproduce and consume resource; mortality and dilution
    apply to the total population.
- formula: qref = 0.0001
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Resource concentration is mass density; organism counts are dimensionless.
- formula: cost = 1e-12
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: extra_death = 0
  role: constitutive/component relations
  description: Additional mortality frequency.
- formula: active_fraction = 1/(1+0.25*dilution/qref)
  role: constitutive/component relations
  description: Fraction of organisms in the active compartment.
- formula: maintenance = 0
  role: constitutive/component relations
  description: Maintenance resource uptake per active organism.
- formula: birth_max = birth0
  role: constitutive/component relations
  description: Maximum active-organism birth frequency.
- formula: usable_feed = feed
  role: constitutive/component relations
  description: Usable feed resource concentration.
- formula: loss = mortality+dilution+extra_death
  role: conservation/balance relations
  description: Total population loss frequency.
- formula: birth = loss/active_fraction
  role: conservation/balance relations
  description: Required active-organism birth frequency.
- formula: resource = half*birth/(birth_max-birth)
  role: governing/dynamical laws
  description: Steady vessel resource concentration.
- formula: active_population = dilution*(usable_feed-resource)/(cost*birth+maintenance+maintenance_load)
  role: conservation/balance relations
  description: Active organism number density.
- formula: population = active_population/active_fraction
  role: conservation/balance relations
  description: Total organism number density.
phenomenal_model: population = dilution*(dilution*(dilution*(dilution*(625000000000000000000*feed + 6250000000000000000)
  + feed*(625000000000000000000*mortality + 500000000000000000) + 6250000000000000000*mortality + 5000000000000000)
  + feed*(500000000000000000*mortality - 2400000000000000) + 5000000000000000*mortality + 1000000000000) + feed*(100000000000000*mortality
  - 1000000000000) + 1000000000000*mortality)/(dilution*(dilution*(dilution*(625000000*dilution + 1250000000*mortality
  + 500000) + 250000000000000000*maintenance_load + mortality*(625000000*mortality + 1000000) - 2400) + maintenance_load*(250000000000000000*mortality
  + 100000000000000) + mortality*(500000*mortality - 2300) - 1) + maintenance_load*(100000000000000*mortality -
  1000000000000) + mortality*(100*mortality - 1))
variables:
- name: maintenance_load
  role: input
  unit: kg s^-1
  description: Calibrated extra substrate expenditure per growing individual under an imposed metabolic load.
  sampling:
    min: 1.0e-17
    max: 3.0e-15
    ood_boundary: 8.0e-16
    distribution: log_uniform
- name: feed
  description: Feed resource mass concentration.
  unit: kg m^-3
  role: input
  sampling:
    min: 0.1
    max: 2
    ood_boundary: 1.2
    distribution: uniform
- name: dilution
  description: Vessel dilution rate.
  unit: s^-1
  role: input
  sampling:
    min: 1.0e-05
    max: 0.0002
    ood_boundary: 0.0001
    distribution: log_uniform
- name: mortality
  description: Intrinsic mortality rate.
  unit: s^-1
  role: input
  sampling:
    min: 0.0001
    max: 0.0008
    ood_boundary: 0.0005
    distribution: uniform
- name: extra_death
  description: Additional mortality frequency.
  unit: s^-1
  role: internal
- name: active_fraction
  description: Fraction of organisms in the active compartment.
  unit: '1'
  role: internal
- name: maintenance
  description: Maintenance resource uptake per active organism.
  unit: kg s^-1
  role: internal
- name: birth_max
  description: Maximum active-organism birth frequency.
  unit: s^-1
  role: internal
- name: usable_feed
  description: Usable feed resource concentration.
  unit: kg m^-3
  role: internal
- name: loss
  description: Total population loss frequency.
  unit: s^-1
  role: internal
- name: birth
  description: Required active-organism birth frequency.
  unit: s^-1
  role: internal
- name: resource
  description: Steady vessel resource concentration.
  unit: kg m^-3
  role: internal
- name: active_population
  description: Active organism number density.
  unit: m^-3
  role: internal
- name: population
  description: Total organism number density.
  unit: m^-3
  role: target
mechanism_probes:
- probe: active_fraction
  description: Fraction of organisms in the active compartment.
  answer: 1/(2500*dilution + 1)
