task_name: Allosteric Regulation - Variant 4
task_description: Determine protein catalytic activity from substrate and regulator concentrations.
mutation: Partition regulator into a local compartment.
mechanism_model:
- formula: delivery_diffusivity = 1e-09
  role: auxiliary/regime constraints
  description: Fixed calibrated apparatus or constitutive coefficient; units follow the surrounding relations.
- formula: access_ref = 1e-05
  role: auxiliary/regime constraints
  description: Fixed calibrated apparatus or constitutive coefficient; units follow the surrounding relations.
- formula: ks = 0.01
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Conserved protein population; substrate and regulator buffered; steady conformational
    occupancy.
- formula: kt = 0.03
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Activity is per protein; reference conformation has one catalytic substrate
    site.
- formula: kr = 0.003
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Added states and closures are synthetic.
- formula: rate_r = 12
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: rate_t = 0.7
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: local_regulator = delivery_flux/removal_speed
  role: constitutive/component relations
  description: Protein-local free regulator concentration.
- formula: substrate_coupling = 1
  role: constitutive/component relations
  description: Inactive-state substrate coupling factor.
- formula: inactive_rate = rate_t
  role: constitutive/component relations
  description: Inactive-conformation catalytic turnover frequency.
- formula: r_empty = (1)-rs-t_empty-ts
  role: conservation/balance relations
  description: Unbound reference state abundance.
- formula: rs = (substrate/ks)*r_empty
  role: constitutive/component relations
  description: Active-conformation substrate complex fraction.
- formula: t_empty = (2*(1+local_regulator/kr)**2)*r_empty
  role: constitutive/component relations
  description: Inactive-conformation fraction without substrate.
- formula: ts = (2*(1+local_regulator/kr)**2*substrate/kt*substrate_coupling)*r_empty
  role: constitutive/component relations
  description: Inactive-conformation substrate complex fraction.
- formula: inactive_flux = inactive_rate*ts
  role: governing/dynamical laws
  description: Catalytic flux through the inactive conformation.
- formula: activity = rate_r*(rs)+inactive_flux
  role: conservation/balance relations
  description: Catalytic activity per protein.
- formula: removal_speed = delivery_diffusivity/access_ref*(0.1*substrate/ks)
  role: constitutive/component relations
  description: Positive uptake coefficient of a maintained local sink in the delivery layer.
- formula: delivery_flux = delivery_diffusivity*(regulator-local_regulator)/access_length
  role: constitutive/component relations
  description: Steady diffusive supply flux from the buffered feed.
phenomenal_model: activity = 20*substrate*(7*(1000*regulator/(1000000*access_length*substrate + 1) + 3)**2 + 1620)/(200*substrate*(1000*regulator/(1000000*access_length*substrate
  + 1) + 3)**2 + 2700*substrate + 6*(1000*regulator/(1000000*access_length*substrate + 1) + 3)**2 + 27)
variables:
- name: access_length
  role: input
  unit: m
  description: Measured thickness of the solution layer between the well-mixed feed and the assay surface.
  sampling:
    min: 2.0e-06
    max: 4.0e-05
    ood_boundary: 1.2e-05
    distribution: log_uniform
- name: substrate
  description: Free substrate concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0001
    max: 0.06
    ood_boundary: 0.02
    distribution: log_uniform
- name: regulator
  description: Free regulator concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 1.0e-05
    max: 0.02
    ood_boundary: 0.006
    distribution: log_uniform
- name: local_regulator
  description: Protein-local free regulator concentration.
  unit: mol m^-3
  role: internal
- name: substrate_coupling
  description: Inactive-state substrate coupling factor.
  unit: '1'
  role: internal
- name: inactive_rate
  description: Inactive-conformation catalytic turnover frequency.
  unit: s^-1
  role: internal
- name: r_empty
  description: Unbound reference state abundance.
  unit: '1'
  role: internal
- name: rs
  description: Active-conformation substrate complex fraction.
  unit: '1'
  role: internal
- name: t_empty
  description: Inactive-conformation fraction without substrate.
  unit: '1'
  role: internal
- name: ts
  description: Inactive-conformation substrate complex fraction.
  unit: '1'
  role: internal
- name: inactive_flux
  description: Catalytic flux through the inactive conformation.
  unit: s^-1
  role: internal
- name: activity
  description: Catalytic activity per protein.
  unit: s^-1
  role: target
- name: removal_speed
  role: internal
  unit: m s^-1
  description: Positive uptake coefficient of a maintained local sink in the delivery layer.
- name: delivery_flux
  role: internal
  unit: mol m^-2 s^-1
  description: Steady diffusive supply flux from the buffered feed.
mechanism_probes:
- probe: local_regulator
  description: Protein-local free regulator concentration.
  answer: regulator/(1000000*access_length*substrate + 1)
