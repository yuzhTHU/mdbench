task_name: Receptor Binding - Variant 2-3
task_description: Determine surface receptor occupancy from free ligand concentration.
mutation: Combines variants 2, 3 using their shared state and balance equations.
mechanism_model:
- formula: kd = 0.001
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Steady state; extracellular ligand buffered, total receptor number conserved.
- formula: lref = 0.002
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Occupancy counts surface receptors bearing ligand, not ligand molecules.
- formula: local_ligand = ligand
  role: constitutive/component relations
  description: Pericellular free ligand concentration. Inaccessible-state gating and receptor recycling are driven steady-state
    processes; do not impose detailed balance on them.
- formula: affinity = kd
  role: constitutive/component relations
  description: Effective receptor dissociation concentration.
- formula: free = (1)-bound-triple-internalized
  role: conservation/balance relations
  description: Unbound reference state abundance.
- formula: bound = (local_ligand/affinity)*free
  role: constitutive/component relations
  description: Singly liganded surface receptor fraction.
- formula: triple = (0.15*(local_ligand/lref)**3)*free
  role: constitutive/component relations
  description: Triply liganded surface receptor fraction.
- formula: internalized = (0.3*ligand/(ligand+lref)*local_ligand/affinity)*free
  role: constitutive/component relations
  description: Internalized liganded receptor fraction.
- formula: occupancy = bound+triple
  role: conservation/balance relations
  description: Ligand-bearing surface receptor fraction.
phenomenal_model: occupancy = 3*ligand**3/(20*lref**3*(3*ligand**3/(20*lref**3) + 1 + 3*ligand**2/(10*kd*(ligand + lref))
  + ligand/kd)) + ligand/(kd*(3*ligand**3/(20*lref**3) + 1 + 3*ligand**2/(10*kd*(ligand + lref)) + ligand/kd))
variables:
- name: ligand
  description: Free extracellular ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 1.0e-05
    max: 0.01
    ood_boundary: 0.003
    distribution: log_uniform
- name: local_ligand
  description: Pericellular free ligand concentration.
  unit: mol m^-3
  role: internal
- name: affinity
  description: Effective receptor dissociation concentration.
  unit: mol m^-3
  role: internal
- name: free
  description: Unbound reference state abundance.
  unit: '1'
  role: internal
- name: bound
  description: Singly liganded surface receptor fraction.
  unit: '1'
  role: internal
- name: triple
  description: Triply liganded surface receptor fraction.
  unit: '1'
  role: internal
- name: internalized
  description: Internalized liganded receptor fraction.
  unit: '1'
  role: internal
- name: occupancy
  description: Ligand-bearing surface receptor fraction.
  unit: '1'
  role: target
mechanism_probes:
- probe: triple
  description: Triply liganded surface receptor fraction.
  answer: 3*ligand**3/(20*lref**3*(3*ligand**3/(20*lref**3) + 1 + 3*ligand**2/(10*kd*(ligand + lref)) + ligand/kd))
- probe: internalized
  description: Internalized liganded receptor fraction.
  answer: 3*ligand**2/(10*kd*(ligand + lref)*(3*ligand**3/(20*lref**3) + 1 + 3*ligand**2/(10*kd*(ligand + lref)) + ligand/kd))
