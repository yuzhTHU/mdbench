task_name: Circular Orbit - Variant 1-2-4-5
task_description: Determine squared orbital period from radial distance and central mass.
mutation: Combines variants 1, 2, 4, 5 using their shared state and balance equations.
mechanism_model:
- formula: grav = 6.67430e-11
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Test particle on a stable circular orbit around a fixed center; radial distance is
    proper radial distance.
- formula: scale = 5e7
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Synthetic metric is ds squared equals dr squared plus C(r) squared dphi squared; circular
    curvature is Cprime/C.
- formula: mass_ref = 5e24
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Stationary isotropic momentum closure; stored momentum contributes to radial inertia;
    no drag.
- formula: trap = 1e-8
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: pi0 = 3.141592653589793
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: inertia_ratio = 1+0.23*radius/scale
  role: constitutive/component relations
  description: Translational inertial mass relative to reference mass.
- formula: extra_accel = 0.14*grav*central_mass/(radius+scale)**2
  role: governing/dynamical laws
  description: Finite-range radial force per reference mass.
- formula: angular_radius = radius
  role: kinematic/geometric constraints
  description: Circumference divided by two pi.
- formula: radial_derivative = 1
  role: kinematic/geometric constraints
  description: Derivative of angular radius with respect to proper radius.
- formula: trap_accel = trap*radius/(1+radius/scale)
  role: governing/dynamical laws
  description: External trapping force per reference mass.
- formula: storage_ratio = 0.17*central_mass/(central_mass+mass_ref)
  role: constitutive/component relations
  description: Stored to translational tangential momentum ratio.
- formula: radial_force = grav*central_mass/radius**2+extra_accel+trap_accel
  role: conservation/balance relations
  description: Total inward force per reference mass.
- formula: reservoir_inertia = storage_ratio*inertia_ratio
  role: constitutive/component relations
  description: Momentum-storage reservoir inertial mass relative to reference mass.
- formula: speed_squared = radial_force*angular_radius/((inertia_ratio+reservoir_inertia)*radial_derivative)
  role: governing/dynamical laws
  description: Squared tangential speed along the circular orbit.
- formula: period_squared = 4*pi0**2*angular_radius**2/speed_squared
  role: kinematic/geometric constraints
  description: Squared orbital period.
phenomenal_model: period_squared = 4*pi0**2*radius*(17*central_mass*(23*radius/(100*scale) + 1)/(100*(central_mass + mass_ref))
  + 23*radius/(100*scale) + 1)/(7*central_mass*grav/(50*(radius + scale)**2) + central_mass*grav/radius**2 + radius*trap/(radius/scale
  + 1))
variables:
- name: radius
  description: Proper radial distance from the center.
  unit: m
  role: input
  sampling:
    min: 10000000.0
    max: 100000000.0
    ood_boundary: 70000000.0
    distribution: log_uniform
- name: central_mass
  description: Central gravitating mass.
  unit: kg
  role: input
  sampling:
    min: 1.0e+24
    max: 2.0e+25
    ood_boundary: 8.0e+24
    distribution: log_uniform
- name: inertia_ratio
  description: Translational inertial mass relative to reference mass.
  unit: '1'
  role: internal
- name: extra_accel
  description: Finite-range radial force per reference mass.
  unit: m s^-2
  role: internal
- name: angular_radius
  description: Circumference divided by two pi.
  unit: m
  role: internal
- name: radial_derivative
  description: Derivative of angular radius with respect to proper radius.
  unit: '1'
  role: internal
- name: trap_accel
  description: External trapping force per reference mass.
  unit: m s^-2
  role: internal
- name: storage_ratio
  description: Stored to translational tangential momentum ratio.
  unit: '1'
  role: internal
- name: radial_force
  description: Total inward force per reference mass.
  unit: m s^-2
  role: internal
- name: reservoir_inertia
  description: Momentum-storage reservoir inertial mass relative to reference mass.
  unit: '1'
  role: internal
- name: speed_squared
  description: Squared tangential speed along the circular orbit.
  unit: m^2 s^-2
  role: internal
- name: period_squared
  description: Squared orbital period.
  unit: s^2
  role: target
mechanism_probes:
- probe: inertia_ratio
  description: Translational inertial mass relative to reference mass.
  answer: 23*radius/(100*scale) + 1
- probe: reservoir_inertia
  description: Momentum-storage reservoir inertial mass relative to reference mass.
  answer: 17*central_mass*(23*radius/(100*scale) + 1)/(100*(central_mass + mass_ref))
