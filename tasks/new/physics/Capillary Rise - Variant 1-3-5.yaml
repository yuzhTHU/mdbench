task_name: Capillary Rise - Variant 1-3-5
task_description: Determine equilibrium rise height from tube size and bulk liquid density.
mutation: Combines variants 1, 3, 5 using their shared state and balance equations.
mechanism_model:
- formula: grav = 9.81
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Static column; constant ambient pressure; negligible meniscus volume; uniform
    liquid properties within each column.
- formula: pi0 = 3.141592653589793
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Tube size denotes wetted perimeter divided by two pi, including noncircular
    variants.
- formula: scale = 0.0002
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Added pressure and local-density closures are independently controlled synthetic
    effects.
- formula: sigma0 = 0.072
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: pressure0 = 60
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: tension = sigma0/(1+0.12*scale/size)
  role: constitutive/component relations
  description: Local liquid surface tension.
- formula: contact_cos = 0.8
  role: constitutive/component relations
  description: Cosine of the liquid-side contact angle.
- formula: disjoining = pressure0/(1+(size/scale)**3)
  role: constitutive/component relations
  description: Additional disjoining pressure.
- formula: column_density = density
  role: constitutive/component relations
  description: Mean liquid-column mass density.
- formula: area = pi0*size**2/(1+0.12*(size/scale)**2)
  role: kinematic/geometric constraints
  description: Tube internal cross-sectional area.
- formula: perimeter = 2*pi0*size
  role: kinematic/geometric constraints
  description: Wetted tube perimeter.
- formula: capillary_pressure = tension*projected_cosine*perimeter/area+disjoining
  role: conservation/balance relations
  description: Total upward supporting pressure.
- formula: height = capillary_pressure/(column_density*grav)
  role: conservation/balance relations
  description: Equilibrium liquid rise height.
- formula: projected_cosine = (contact_cos-sqrt(1-contact_cos**2)*collar_slope)/sqrt(1+collar_slope**2)
  role: constitutive/component relations
  description: Contact-angle projection on the tilted collar normal.
phenomenal_model: height = 2000*(60*(4 - 3*collar_slope)*(3000000*size**2 + 1)/(sqrt(collar_slope**2 + 1)*(125000*size
  + 3)) + 1/(125000000000*size**3 + 1))/(327*density)
variables:
- name: collar_slope
  role: input
  unit: '1'
  description: Signed wall slope at the circular measurement collar; radius is measured at the contact line and
    reservoir level is adjusted between readings.
  sampling:
    min: -0.2
    max: 0.25
    ood_boundary: 0.04
    distribution: uniform
- name: size
  description: Nominal tube size.
  unit: m
  role: input
  sampling:
    min: 5.0e-05
    max: 0.0006
    ood_boundary: 0.0003
    distribution: log_uniform
- name: density
  description: Bulk liquid density.
  unit: kg m^-3
  role: input
  sampling:
    min: 800
    max: 1300
    ood_boundary: 1100
    distribution: uniform
- name: tension
  description: Local liquid surface tension.
  unit: N m^-1
  role: internal
- name: contact_cos
  description: Cosine of the liquid-side contact angle.
  unit: '1'
  role: internal
- name: disjoining
  description: Additional disjoining pressure.
  unit: Pa
  role: internal
- name: column_density
  description: Mean liquid-column mass density.
  unit: kg m^-3
  role: internal
- name: area
  description: Tube internal cross-sectional area.
  unit: m^2
  role: internal
- name: perimeter
  description: Wetted tube perimeter.
  unit: m
  role: internal
- name: capillary_pressure
  description: Total upward supporting pressure.
  unit: Pa
  role: internal
- name: height
  description: Equilibrium liquid rise height.
  unit: m
  role: target
- name: projected_cosine
  role: internal
  unit: '1'
  description: Contact-angle projection on the tilted collar normal.
mechanism_probes:
- probe: tension
  description: Local liquid surface tension.
  answer: 1125000*size/(15625000*size + 375)
- probe: area
  description: Tube internal cross-sectional area.
  answer: 3141592653589793*size**2/(3000000000000000000000*size**2 + 1000000000000000)
- probe: disjoining
  description: Additional disjoining pressure.
  answer: 60/(125000000000*size**3 + 1)
