task_name: Michaelis Menten Pulse Reaction - Variant 2-4-5
task_description: Determine the steady net product formation rate in the second of two equal-volume, well-mixed
  flow vessels in series, supplied with unbound enzyme and separately buffered substrate.
mutation: Combines variants 2, 4, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: substrate_ratio = substrate/concentration_scale
  description: Dimensionless first-vessel free substrate concentration.
  role: constitutive/component relations
- formula: second_substrate_ratio = second_substrate/concentration_scale
  description: Dimensionless second-vessel free substrate concentration.
  role: constitutive/component relations
- formula: first_association_rate = rate_scale*(1.4*substrate_ratio)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: association_rate = rate_scale*(1.4*second_substrate_ratio)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_dissociation_rate = rate_scale*(0.73)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: dissociation_rate = rate_scale*(0.73)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_chemistry_rate = rate_scale*(1.9+0.28*substrate_ratio)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: chemistry_rate = rate_scale*(1.9+0.28*second_substrate_ratio)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_release_rate = rate_scale*(2.6)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: release_rate = rate_scale*(2.6)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_inactivation_rate = rate_scale*(0.12)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: inactivation_rate = rate_scale*(0.12)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: flow_rate*first_free_enzyme+first_association_rate*first_free_enzyme+first_inactivation_rate*first_free_enzyme
    = flow_rate*enzyme_total+first_dissociation_rate*first_substrate_complex+first_release_rate*first_product_complex
  role: conservation/balance relations
  description: 'First-vessel steady species balance: inflow and reaction production equal outflow and reaction consumption.'
- formula: flow_rate*first_substrate_complex+first_dissociation_rate*first_substrate_complex+first_chemistry_rate*first_substrate_complex
    = flow_rate*0+first_association_rate*first_free_enzyme
  role: conservation/balance relations
  description: 'First-vessel steady species balance: inflow and reaction production equal outflow and reaction consumption.'
- formula: flow_rate*first_product_complex+first_release_rate*first_product_complex = flow_rate*0+first_chemistry_rate*first_substrate_complex
  role: conservation/balance relations
  description: 'First-vessel steady species balance: inflow and reaction production equal outflow and reaction consumption.'
- formula: flow_rate*free_enzyme+association_rate*free_enzyme+inactivation_flux = flow_rate*first_free_enzyme+dissociation_rate*substrate_complex+release_rate*product_complex
  role: conservation/balance relations
  description: 'Second-vessel steady species balance: inflow and reaction production equal outflow and reaction
    consumption.'
- formula: flow_rate*substrate_complex+dissociation_rate*substrate_complex+chemistry_rate*substrate_complex = flow_rate*first_substrate_complex+association_rate*free_enzyme
  role: conservation/balance relations
  description: 'Second-vessel steady species balance: inflow and reaction production equal outflow and reaction
    consumption.'
- formula: flow_rate*product_complex+release_rate*product_complex = flow_rate*first_product_complex+chemistry_rate*substrate_complex
  role: conservation/balance relations
  description: 'Second-vessel steady species balance: inflow and reaction production equal outflow and reaction
    consumption.'
- formula: inactivation_flux = inactivation_rate*free_enzyme
  description: Second-vessel molar enzyme inactivation flux.
  role: constitutive/component relations
- formula: response = release_rate*product_complex
  description: Steady net product formation rate per unit volume in the second vessel.
  role: conservation/balance relations
phenomenal_model: response = 4550*enzyme_total*flow_rate**2*(5*second_substrate*(14*second_substrate + 95)*(500*flow_rate**2
  + 140*flow_rate*substrate + 2615*flow_rate + 364*substrate + 3419) + 20*substrate*(5*flow_rate + 13)*(350*flow_rate*second_substrate
  + 2375*flow_rate + 490*second_substrate**2 + 3367*second_substrate + 285) + substrate*(14*substrate + 95)*(2500*flow_rate**2
  + 4200*flow_rate*second_substrate + 6875*flow_rate + 980*second_substrate**2 + 6734*second_substrate + 789))/((12500*flow_rate**3
  + 21000*flow_rate**2*second_substrate + 66875*flow_rate**2 + 4900*flow_rate*second_substrate**2 + 88270*flow_rate*second_substrate
  + 93320*flow_rate + 1092*second_substrate + 10257)*(12500*flow_rate**3 + 21000*flow_rate**2*substrate + 66875*flow_rate**2
  + 4900*flow_rate*substrate**2 + 88270*flow_rate*substrate + 93320*flow_rate + 1092*substrate + 10257))
variables:
- name: flow_rate
  description: Volumetric flow divided by the volume of each vessel.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: substrate
  description: Buffered free substrate concentration in the first vessel.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.2
    ood_boundary: 1.6
    max: 5
    distribution: log_uniform
- name: second_substrate
  description: Buffered free substrate concentration in the second vessel.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.004
    ood_boundary: 0.06
    max: 0.16
    distribution: log_uniform
- name: enzyme_total
  description: Concentration of unbound enzyme in the feed entering the first vessel.
  unit: mol m^-3
  role: input
  sampling:
    min: 5.0e-05
    ood_boundary: 0.0004
    max: 0.001
    distribution: log_uniform
- name: substrate_ratio
  description: Dimensionless first-vessel free substrate concentration.
  unit: '1'
  role: internal
- name: second_substrate_ratio
  description: Dimensionless second-vessel free substrate concentration.
  unit: '1'
  role: internal
- name: first_association_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: association_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_dissociation_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: dissociation_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_chemistry_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: chemistry_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_release_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: release_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_inactivation_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: inactivation_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_free_enzyme
  description: First-vessel steady free enzyme concentration.
  unit: mol m^-3
  role: internal
- name: first_substrate_complex
  description: First-vessel steady enzyme-substrate complex concentration.
  unit: mol m^-3
  role: internal
- name: first_product_complex
  description: First-vessel steady product-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: free_enzyme
  description: Second-vessel steady free enzyme concentration.
  unit: mol m^-3
  role: internal
- name: substrate_complex
  description: Second-vessel steady enzyme-substrate complex concentration.
  unit: mol m^-3
  role: internal
- name: product_complex
  description: Second-vessel steady product-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: inactivation_flux
  description: Second-vessel molar enzyme inactivation flux.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Steady net product formation rate per unit volume in the second vessel.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: product_complex
  description: Second-vessel steady product-bound enzyme concentration.
  answer: 1750*enzyme_total*flow_rate**2*(5*second_substrate*(14*second_substrate + 95)*(500*flow_rate**2 + 140*flow_rate*substrate
    + 2615*flow_rate + 364*substrate + 3419) + 20*substrate*(5*flow_rate + 13)*(350*flow_rate*second_substrate +
    2375*flow_rate + 490*second_substrate**2 + 3367*second_substrate + 285) + substrate*(14*substrate + 95)*(2500*flow_rate**2
    + 4200*flow_rate*second_substrate + 6875*flow_rate + 980*second_substrate**2 + 6734*second_substrate + 789))/((12500*flow_rate**3
    + 21000*flow_rate**2*second_substrate + 66875*flow_rate**2 + 4900*flow_rate*second_substrate**2 + 88270*flow_rate*second_substrate
    + 93320*flow_rate + 1092*second_substrate + 10257)*(12500*flow_rate**3 + 21000*flow_rate**2*substrate + 66875*flow_rate**2
    + 4900*flow_rate*substrate**2 + 88270*flow_rate*substrate + 93320*flow_rate + 1092*substrate + 10257))
- probe: free_enzyme
  description: Second-vessel steady free enzyme concentration.
  answer: 625*enzyme_total*flow_rate**2*(140*substrate*(5*flow_rate + 13)*(365*flow_rate + 364*second_substrate
    + 3419) + 182*substrate*(14*substrate + 95)*(100*flow_rate + 28*second_substrate + 263) + (500*flow_rate**2
    + 140*flow_rate*second_substrate + 2615*flow_rate + 364*second_substrate + 3419)*(500*flow_rate**2 + 140*flow_rate*substrate
    + 2615*flow_rate + 364*substrate + 3419))/((12500*flow_rate**3 + 21000*flow_rate**2*second_substrate + 66875*flow_rate**2
    + 4900*flow_rate*second_substrate**2 + 88270*flow_rate*second_substrate + 93320*flow_rate + 1092*second_substrate
    + 10257)*(12500*flow_rate**3 + 21000*flow_rate**2*substrate + 66875*flow_rate**2 + 4900*flow_rate*substrate**2
    + 88270*flow_rate*substrate + 93320*flow_rate + 1092*substrate + 10257))
- probe: inactivation_flux
  description: Second-vessel molar enzyme inactivation flux.
  answer: 75*enzyme_total*flow_rate**2*(140*substrate*(5*flow_rate + 13)*(365*flow_rate + 364*second_substrate +
    3419) + 182*substrate*(14*substrate + 95)*(100*flow_rate + 28*second_substrate + 263) + (500*flow_rate**2 +
    140*flow_rate*second_substrate + 2615*flow_rate + 364*second_substrate + 3419)*(500*flow_rate**2 + 140*flow_rate*substrate
    + 2615*flow_rate + 364*substrate + 3419))/((12500*flow_rate**3 + 21000*flow_rate**2*second_substrate + 66875*flow_rate**2
    + 4900*flow_rate*second_substrate**2 + 88270*flow_rate*second_substrate + 93320*flow_rate + 1092*second_substrate
    + 10257)*(12500*flow_rate**3 + 21000*flow_rate**2*substrate + 66875*flow_rate**2 + 4900*flow_rate*substrate**2
    + 88270*flow_rate*substrate + 93320*flow_rate + 1092*substrate + 10257))
