task_name: Reversible Association Relaxation - Variant 2-3-4-5
task_description: Determine the Laplace-weighted stable bound-molecule concentration after mixing initially unassociated
  molecules with buffered ligand.
mutation: Combines variants 2, 3, 4, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_binding = rate_scale*(1.43)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_return = rate_scale*(0.48)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: storage_rate = rate_scale*(0.29)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: return_rate = rate_scale*(0.53)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: compaction_rate = rate_scale*(0.34)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: expansion_rate = rate_scale*(0.78)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux+storage_rate*unoccupied_pool = laplace_rate*(molecule_total)+desorption_rate*precursor_pool+return_rate*stored_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+precursor_return*bound_pool+compaction_rate*bound_pool = 0+precursor_binding*precursor_pool+expansion_rate*compact_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*precursor_pool+desorption_rate*precursor_pool+precursor_binding*precursor_pool = 0+binding_flux+precursor_return*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*stored_pool+return_rate*stored_pool = 0+storage_rate*unoccupied_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*compact_pool+expansion_rate*compact_pool = 0+compaction_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool+compact_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (laplace_rate*(laplace_rate*ligand*(452237500*ligand*molecule_total + 2162875000*molecule_total)
  + ligand*(746191875*ligand*molecule_total + 3568743750*molecule_total)) + ligand*(268448180*ligand*molecule_total
  + 1283882600*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(1375000000*laplace_rate + ligand*(316250000*ligand
  + 1705125000) + 6215000000) + ligand*(1125850000*ligand + 5850652500) + 8362750000) + ligand*(1132775875*ligand
  + 5742466550) + 3781536000) + ligand*(331202300*ligand + 1643148416) + 282831120)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: molecule_total
  description: Conserved concentration of initially unassociated binding molecules.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0001
    ood_boundary: 0.001
    max: 0.004
    distribution: log_uniform
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_binding
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_return
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: storage_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: return_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: compaction_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: expansion_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted free molecule concentration.
  unit: mol m^-3
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: mol m^-3
  role: internal
- name: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  unit: mol m^-3
  role: internal
- name: stored_pool
  description: Laplace-weighted reversibly stored population.
  unit: mol m^-3
  role: internal
- name: compact_pool
  description: Laplace-weighted compact bound-complex concentration.
  unit: mol m^-3
  role: internal
- name: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3
  role: target
mechanism_probes:
- probe: stored_pool
  description: Laplace-weighted reversibly stored population.
  answer: (laplace_rate*(laplace_rate*(398750000*laplace_rate*molecule_total + 55861250*ligand*molecule_total +
    1475375000*molecule_total) + 89378000*ligand*molecule_total + 1215390000*molecule_total) + 20914452*ligand*molecule_total
    + 100025640*molecule_total)/(laplace_rate*(laplace_rate*(laplace_rate*(1375000000*laplace_rate + ligand*(316250000*ligand
    + 1705125000) + 6215000000) + ligand*(1125850000*ligand + 5850652500) + 8362750000) + ligand*(1132775875*ligand
    + 5742466550) + 3781536000) + ligand*(331202300*ligand + 1643148416) + 282831120)
- probe: compact_pool
  description: Laplace-weighted compact bound-complex concentration.
  answer: (laplace_rate*ligand*(307521500*ligand*molecule_total + 1470755000*molecule_total) + ligand*(162986395*ligand*molecule_total
    + 779500150*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(2750000000*laplace_rate + ligand*(632500000*ligand
    + 3410250000) + 12430000000) + ligand*(2251700000*ligand + 11701305000) + 16725500000) + ligand*(2265551750*ligand
    + 11484933100) + 7563072000) + ligand*(662404600*ligand + 3286296832) + 565662240)
- probe: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: 11*ligand*molecule_total*(23*ligand/110 + 1)*(687500000*laplace_rate**4 + 96312500*laplace_rate**3*ligand
    + 2908125000*laplace_rate**3 + 205145625*laplace_rate**2*ligand + 3443687500*laplace_rate**2 + 117732400*laplace_rate*ligand
    + 1283073000*laplace_rate + 19111482*ligand + 91402740)/(5*(1375000000*laplace_rate**4 + 316250000*laplace_rate**3*ligand**2
    + 1705125000*laplace_rate**3*ligand + 6215000000*laplace_rate**3 + 1125850000*laplace_rate**2*ligand**2 + 5850652500*laplace_rate**2*ligand
    + 8362750000*laplace_rate**2 + 1132775875*laplace_rate*ligand**2 + 5742466550*laplace_rate*ligand + 3781536000*laplace_rate
    + 331202300*ligand**2 + 1643148416*ligand + 282831120))
- probe: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  answer: (laplace_rate*(laplace_rate*(laplace_rate*ligand*(316250000*ligand*molecule_total + 1512500000*molecule_total)
    + ligand*(673612500*ligand*molecule_total + 3221625000*molecule_total)) + ligand*(386584000*ligand*molecule_total
    + 1848880000*molecule_total)) + ligand*(62754120*ligand*molecule_total + 300128400*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(1375000000*laplace_rate
    + ligand*(316250000*ligand + 1705125000) + 6215000000) + ligand*(1125850000*ligand + 5850652500) + 8362750000)
    + ligand*(1132775875*ligand + 5742466550) + 3781536000) + ligand*(331202300*ligand + 1643148416) + 282831120)
