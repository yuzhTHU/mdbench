task_name: Michaelis Menten Pulse Reaction - Variant 2-3-4
task_description: Determine the steady net product formation rate in the second of two equal-volume, well-mixed
  flow vessels in series, supplied with unbound enzyme and separately buffered substrate.
mutation: Combines variants 2, 3, 4 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: substrate_ratio = substrate/concentration_scale
  description: Dimensionless first-vessel free substrate concentration.
  role: constitutive/component relations
- formula: second_substrate_ratio = second_substrate/concentration_scale
  description: Dimensionless second-vessel free substrate concentration.
  role: constitutive/component relations
- formula: first_association_rate = rate_scale*(1.4*substrate_ratio)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: association_rate = rate_scale*(1.4*second_substrate_ratio)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_dissociation_rate = rate_scale*(0.73)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: dissociation_rate = rate_scale*(0.73)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_chemistry_rate = rate_scale*(1.9+0.28*substrate_ratio)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: chemistry_rate = rate_scale*(1.9+0.28*second_substrate_ratio)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_release_rate = rate_scale*(2.6)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: release_rate = rate_scale*(2.6)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_sequestration_rate = rate_scale*(0.31)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: sequestration_rate = rate_scale*(0.31)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_recovery_rate = rate_scale*(0.57)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: recovery_rate = rate_scale*(0.57)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: flow_rate*first_free_enzyme+first_association_rate*first_free_enzyme+first_sequestration_rate*first_free_enzyme
    = flow_rate*enzyme_total+first_dissociation_rate*first_substrate_complex+first_release_rate*first_product_complex+first_recovery_rate*first_sequestered_enzyme
  role: conservation/balance relations
  description: 'First-vessel steady species balance: inflow and reaction production equal outflow and reaction consumption.'
- formula: flow_rate*first_substrate_complex+first_dissociation_rate*first_substrate_complex+first_chemistry_rate*first_substrate_complex
    = flow_rate*0+first_association_rate*first_free_enzyme
  role: conservation/balance relations
  description: 'First-vessel steady species balance: inflow and reaction production equal outflow and reaction consumption.'
- formula: flow_rate*first_product_complex+first_release_rate*first_product_complex = flow_rate*0+first_chemistry_rate*first_substrate_complex
  role: conservation/balance relations
  description: 'First-vessel steady species balance: inflow and reaction production equal outflow and reaction consumption.'
- formula: flow_rate*first_sequestered_enzyme+first_recovery_rate*first_sequestered_enzyme = flow_rate*0+first_sequestration_rate*first_free_enzyme
  role: conservation/balance relations
  description: 'First-vessel steady species balance: inflow and reaction production equal outflow and reaction consumption.'
- formula: flow_rate*free_enzyme+association_rate*free_enzyme+sequestration_rate*free_enzyme = flow_rate*first_free_enzyme+dissociation_rate*substrate_complex+release_rate*product_complex+recovery_rate*sequestered_enzyme
  role: conservation/balance relations
  description: 'Second-vessel steady species balance: inflow and reaction production equal outflow and reaction
    consumption.'
- formula: flow_rate*substrate_complex+dissociation_rate*substrate_complex+chemistry_rate*substrate_complex = flow_rate*first_substrate_complex+association_rate*free_enzyme
  role: conservation/balance relations
  description: 'Second-vessel steady species balance: inflow and reaction production equal outflow and reaction
    consumption.'
- formula: flow_rate*product_complex+release_rate*product_complex = flow_rate*first_product_complex+chemistry_rate*substrate_complex
  role: conservation/balance relations
  description: 'Second-vessel steady species balance: inflow and reaction production equal outflow and reaction
    consumption.'
- formula: flow_rate*sequestered_enzyme+recovery_rate*sequestered_enzyme = flow_rate*first_sequestered_enzyme+sequestration_rate*free_enzyme
  role: conservation/balance relations
  description: 'Second-vessel steady species balance: inflow and reaction production equal outflow and reaction
    consumption.'
- formula: response = release_rate*product_complex
  description: Steady net product formation rate per unit volume in the second vessel.
  role: conservation/balance relations
phenomenal_model: response = 91*enzyme_total*(1767*second_substrate*(14*second_substrate + 95)*(500*flow_rate**2
  + 140*flow_rate*substrate + 2615*flow_rate + 364*substrate + 3419) + second_substrate*(1400*flow_rate*second_substrate
  + 9500*flow_rate + 798*second_substrate + 5415)*(50000*flow_rate**3 + 14000*flow_rate**2*substrate + 290000*flow_rate**2
  + 44380*flow_rate*substrate + 490955*flow_rate + 20748*substrate + 194883) + 20*substrate*(500*flow_rate**2 +
  1585*flow_rate + 741)*(7000*flow_rate**2*second_substrate + 47500*flow_rate**2 + 9800*flow_rate*second_substrate**2
  + 72660*flow_rate*second_substrate + 41800*flow_rate + 5586*second_substrate**2 + 37905*second_substrate) + 2*substrate*(1400*flow_rate*substrate
  + 9500*flow_rate + 798*substrate + 5415)*(25000*flow_rate**3 + 42000*flow_rate**2*second_substrate + 87750*flow_rate**2
  + 9800*flow_rate*second_substrate**2 + 92610*flow_rate*second_substrate + 57860*flow_rate + 5586*second_substrate**2
  + 37905*second_substrate))/(10*(25000*flow_rate**3 + 42000*flow_rate**2*second_substrate + 152750*flow_rate**2
  + 9800*flow_rate*second_substrate**2 + 201810*flow_rate*second_substrate + 286010*flow_rate + 5586*second_substrate**2
  + 105791*second_substrate + 150436)*(25000*flow_rate**3 + 42000*flow_rate**2*substrate + 152750*flow_rate**2 +
  9800*flow_rate*substrate**2 + 201810*flow_rate*substrate + 286010*flow_rate + 5586*substrate**2 + 105791*substrate
  + 150436))
variables:
- name: flow_rate
  description: Volumetric flow divided by the volume of each vessel.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: substrate
  description: Buffered free substrate concentration in the first vessel.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.2
    ood_boundary: 1.6
    max: 5
    distribution: log_uniform
- name: second_substrate
  description: Buffered free substrate concentration in the second vessel.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.004
    ood_boundary: 0.06
    max: 0.16
    distribution: log_uniform
- name: enzyme_total
  description: Concentration of unbound enzyme in the feed entering the first vessel.
  unit: mol m^-3
  role: input
  sampling:
    min: 5.0e-05
    ood_boundary: 0.0004
    max: 0.001
    distribution: log_uniform
- name: substrate_ratio
  description: Dimensionless first-vessel free substrate concentration.
  unit: '1'
  role: internal
- name: second_substrate_ratio
  description: Dimensionless second-vessel free substrate concentration.
  unit: '1'
  role: internal
- name: first_association_rate
  description: First-vessel local reaction frequency.
