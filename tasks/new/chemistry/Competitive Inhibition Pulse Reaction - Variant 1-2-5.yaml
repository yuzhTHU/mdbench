task_name: Competitive Inhibition Pulse Reaction - Variant 1-2-5
task_description: Determine the Laplace-weighted product rate after substrate and inhibitor exposure of initially
  unbound enzyme in a buffered solution.
mutation: Combines variants 1, 2, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: substrate_ratio = substrate/concentration_scale
  description: Dimensionless free substrate concentration.
  role: constitutive/component relations
- formula: association_rate = rate_scale*(1.4*substrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: dissociation_rate = rate_scale*(0.73)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: release_rate = rate_scale*(1.9+0.28*substrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: inhibitor_ratio = inhibitor/concentration_scale
  description: Dimensionless free inhibitor concentration.
  role: constitutive/component relations
- formula: inhibitor_binding_rate = rate_scale*(0.92*inhibitor_ratio+0.18*inhibitor_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: inhibitor_release_rate = rate_scale*(0.61)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: mixed_inhibitor_binding = rate_scale*(0.92*inhibitor_ratio+0.18*inhibitor_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: mixed_inhibitor_release = rate_scale*(0.61)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: mixed_substrate_binding = rate_scale*(1.4*substrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: mixed_substrate_release = rate_scale*(0.73)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: laplace_rate*free_enzyme+association_rate*free_enzyme+inhibitor_binding_rate*free_enzyme = laplace_rate*(enzyme_total)+dissociation_rate*substrate_complex+release_rate*substrate_complex+inhibitor_release_rate*inhibitor_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*substrate_complex+dissociation_rate*substrate_complex+release_rate*substrate_complex+mixed_inhibitor_binding*substrate_complex
    = 0+association_rate*free_enzyme+mixed_inhibitor_release*mixed_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*inhibitor_complex+inhibitor_release_rate*inhibitor_complex+mixed_substrate_binding*inhibitor_complex
    = 0+inhibitor_binding_rate*free_enzyme+mixed_substrate_release*mixed_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*mixed_complex+mixed_inhibitor_release*mixed_complex+mixed_substrate_release*mixed_complex
    = 0+mixed_inhibitor_binding*substrate_complex+mixed_substrate_binding*inhibitor_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = release_rate*substrate_complex
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = enzyme_total*(inhibitor*(inhibitor*substrate*(107604*substrate + 730170) + substrate*(549976*substrate
  + 3731980)) + laplace_rate*(laplace_rate*substrate*(980000*substrate + 6650000) + substrate*(substrate*(1372000*substrate
  + 11221000) + 12967500)) + substrate*(substrate*(836920*substrate + 6480152) + 5435710))/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(81000*laplace_rate
  + 113400*substrate + 59130) + 828000*laplace_rate + 1159200*substrate + 604440) + laplace_rate*(900000*laplace_rate
  + 2016000*substrate + 4505500) + substrate*(1058400*substrate + 6016640) + 3330955) + laplace_rate*(4600000*laplace_rate
  + 10304000*substrate + 12213000) + substrate*(5409600*substrate + 15610560) + 9129850) + laplace_rate*(laplace_rate*(2500000*laplace_rate
  + 7700000*substrate + 11450000) + substrate*(5880000*substrate + 19530000) + 14864750) + substrate*(3586800*substrate
  + 9048130) + 5374405)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: substrate
  description: Buffered free substrate concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.6
    max: 5
    distribution: log_uniform
- name: enzyme_total
  description: Conserved enzyme concentration before exposure.
  unit: mol m^-3
  role: input
  sampling:
    min: 5.0e-05
    ood_boundary: 0.0004
    max: 0.001
    distribution: log_uniform
- name: substrate_ratio
  description: Dimensionless free substrate concentration.
  unit: '1'
  role: internal
- name: association_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: dissociation_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: release_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: inhibitor
  description: Buffered free inhibitor concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.03
    ood_boundary: 1.3
    max: 4
    distribution: log_uniform
- name: inhibitor_ratio
  description: Dimensionless free inhibitor concentration.
  unit: '1'
  role: internal
- name: inhibitor_binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: inhibitor_release_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: mixed_inhibitor_binding
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: mixed_inhibitor_release
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: mixed_substrate_binding
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: mixed_substrate_release
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: free_enzyme
  description: Laplace-weighted free enzyme concentration.
  unit: mol m^-3
  role: internal
- name: substrate_complex
  description: Laplace-weighted enzyme-substrate complex concentration.
  unit: mol m^-3
  role: internal
- name: inhibitor_complex
  description: Laplace-weighted inhibitor-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: mixed_complex
  description: Laplace-weighted enzyme carrying both substrate and inhibitor.
  unit: mol m^-3
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: free_enzyme
  description: Laplace-weighted free enzyme concentration.
  answer: enzyme_total*(inhibitor*(inhibitor*(laplace_rate*(90000*laplace_rate + 126000*substrate + 120600) + 40077)
    + laplace_rate*(460000*laplace_rate + 644000*substrate + 616400) + 204838) + laplace_rate*(laplace_rate*(500000*laplace_rate
    + 840000*substrate + 2290000) + substrate*(196000*substrate + 2541000) + 2972950) + substrate*(119560*substrate
    + 1237446) + 1074881)/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(16200*laplace_rate + 22680*substrate + 11826)
    + 165600*laplace_rate + 231840*substrate + 120888) + laplace_rate*(180000*laplace_rate + 403200*substrate +
    901100) + substrate*(211680*substrate + 1203328) + 666191) + laplace_rate*(920000*laplace_rate + 2060800*substrate
    + 2442600) + substrate*(1081920*substrate + 3122112) + 1825970) + laplace_rate*(laplace_rate*(500000*laplace_rate
    + 1540000*substrate + 2290000) + substrate*(1176000*substrate + 3906000) + 2972950) + substrate*(717360*substrate
    + 1809626) + 1074881)
- probe: inhibitor_complex
  description: Laplace-weighted inhibitor-bound enzyme concentration.
  answer: enzyme_total*inhibitor*(inhibitor*(inhibitor*(inhibitor*(16200*laplace_rate + 11826) + 165600*laplace_rate
    + 120888) + laplace_rate*(90000*laplace_rate + 25200*substrate + 780500) + 125748*substrate + 626114) + laplace_rate*(460000*laplace_rate
    + 128800*substrate + 1826200) + 642712*substrate + 1621132)/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(16200*laplace_rate
    + 22680*substrate + 11826) + 165600*laplace_rate + 231840*substrate + 120888) + laplace_rate*(180000*laplace_rate
    + 403200*substrate + 901100) + substrate*(211680*substrate + 1203328) + 666191) + laplace_rate*(920000*laplace_rate
    + 2060800*substrate + 2442600) + substrate*(1081920*substrate + 3122112) + 1825970) + laplace_rate*(laplace_rate*(500000*laplace_rate
    + 1540000*substrate + 2290000) + substrate*(1176000*substrate + 3906000) + 2972950) + substrate*(717360*substrate
    + 1809626) + 1074881)
- probe: mixed_complex
  description: Laplace-weighted enzyme carrying both substrate and inhibitor.
  answer: enzyme_total*inhibitor*(inhibitor*(inhibitor*(22680*inhibitor*substrate + 231840*substrate) + 252000*laplace_rate*substrate
    + substrate*(211680*substrate + 1000720)) + 1288000*laplace_rate*substrate + substrate*(1081920*substrate +
    2086560))/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(16200*laplace_rate + 22680*substrate + 11826) + 165600*laplace_rate
    + 231840*substrate + 120888) + laplace_rate*(180000*laplace_rate + 403200*substrate + 901100) + substrate*(211680*substrate
    + 1203328) + 666191) + laplace_rate*(920000*laplace_rate + 2060800*substrate + 2442600) + substrate*(1081920*substrate
    + 3122112) + 1825970) + laplace_rate*(laplace_rate*(500000*laplace_rate + 1540000*substrate + 2290000) + substrate*(1176000*substrate
    + 3906000) + 2972950) + substrate*(717360*substrate + 1809626) + 1074881)
