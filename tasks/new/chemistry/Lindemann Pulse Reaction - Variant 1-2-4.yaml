task_name: Lindemann Pulse Reaction - Variant 1-2-4
task_description: Determine the Laplace-weighted product rate after a reactant pulse in a homogeneous, buffered
  collision bath.
mutation: Combines variants 1, 2, 4 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: bath_ratio = collider/concentration_scale
  description: Dimensionless buffered collision-partner concentration.
  role: constitutive/component relations
- formula: activation_rate = rate_scale*(1.3*bath_ratio+0.21*bath_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: deactivation_rate = rate_scale*(0.8*bath_ratio*(1+(0.21/1.3)*bath_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: conversion_rate = rate_scale*(1.7)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: product_rate = rate_scale*(2.3)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: quench_rate = rate_scale*(0.16*bath_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: activation_flux = activation_rate*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: quench_flux = quench_rate*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*reactant_pool+activation_flux+quench_flux = laplace_rate*(dose)+deactivation_rate*activated_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*activated_pool+deactivation_rate*activated_pool+conversion_rate*activated_pool = 0+activation_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*secondary_pool+product_rate*secondary_pool = 0+conversion_rate*activated_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = product_rate*secondary_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = collider*(533715*collider*dose*laplace_rate + 3303950*dose*laplace_rate)/(collider*(collider*(collider*(collider*(13440*laplace_rate
  + 30912) + 83200*laplace_rate + 191360) + laplace_rate*(324500*laplace_rate + 1155200) + 940355) + laplace_rate*(1365000*laplace_rate
  + 4576000) + 3303950) + laplace_rate*(laplace_rate*(650000*laplace_rate + 2600000) + 2541500))
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: collider
  description: Buffered collision-partner molar concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.08
    ood_boundary: 2
    max: 6
    distribution: log_uniform
- name: dose
  description: Initial unactivated reactant pulse concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0002
    ood_boundary: 0.002
    max: 0.008
    distribution: log_uniform
- name: bath_ratio
  description: Dimensionless buffered collision-partner concentration.
  unit: '1'
  role: internal
- name: activation_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: deactivation_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: conversion_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: product_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: quench_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: reactant_pool
  description: Laplace-weighted unactivated reactant concentration.
  unit: mol m^-3
  role: internal
- name: activated_pool
  description: Laplace-weighted primary activated-intermediate concentration.
  unit: mol m^-3
  role: internal
- name: secondary_pool
  description: Laplace-weighted second reactive intermediate concentration.
  unit: mol m^-3
  role: internal
- name: activation_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: quench_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: quench_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: collider**2*(collider*(1344*collider*dose*laplace_rate + 8320*dose*laplace_rate) + dose*laplace_rate*(10400*laplace_rate
    + 17680))/(collider*(collider*(collider*(1344*collider + 8320) + 32450*laplace_rate + 40885) + 136500*laplace_rate
    + 143650) + laplace_rate*(65000*laplace_rate + 110500))
- probe: secondary_pool
  description: Laplace-weighted second reactive intermediate concentration.
  answer: collider*(232050*collider*dose*laplace_rate + 1436500*dose*laplace_rate)/(collider*(collider*(collider*(collider*(13440*laplace_rate
    + 30912) + 83200*laplace_rate + 191360) + laplace_rate*(324500*laplace_rate + 1155200) + 940355) + laplace_rate*(1365000*laplace_rate
    + 4576000) + 3303950) + laplace_rate*(laplace_rate*(650000*laplace_rate + 2600000) + 2541500))
- probe: activation_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: collider*dose*laplace_rate*(21*collider + 130)*(84*collider**2 + 520*collider + 650*laplace_rate + 1105)/(1344*collider**4
    + 8320*collider**3 + 32450*collider**2*laplace_rate + 40885*collider**2 + 136500*collider*laplace_rate + 143650*collider
    + 65000*laplace_rate**2 + 110500*laplace_rate)
