- probe: gas_surface_flux
  description: Laplace-weighted transition flux per adsorption cell.
  answer: a_concentration*(a_concentration*(a_concentration*b_concentration*(52588800*laplace_rate + 110436480)
    + b_concentration*(b_concentration*(36373920*laplace_rate + 76385232) + laplace_rate*(43824000*laplace_rate
    + 406925760) + 661280256)) + b_concentration*(b_concentration*(laplace_rate*(310005000*laplace_rate + 1345421700)
    + 1458263520) + laplace_rate*(laplace_rate*(373500000*laplace_rate + 2050515000) + 3316306500) + 1380456000))/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(410850000*laplace_rate
    + 1520145000) + laplace_rate*(495000000*laplace_rate + 2147310000) + 2326401000) + b_concentration*(b_concentration*(284171250*laplace_rate
    + 1051433625) + laplace_rate*(684750000*laplace_rate + 5879450250) + 12830030025) + laplace_rate*(laplace_rate*(412500000*laplace_rate
    + 5557425000) + 17758939500) + 16605691200) + b_concentration*(b_concentration*(1701583000*laplace_rate + 6053364300)
