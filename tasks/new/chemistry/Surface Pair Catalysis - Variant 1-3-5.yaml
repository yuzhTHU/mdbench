    + 742365000) + 265072500)/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(16434000*laplace_rate
    + 60805800) + laplace_rate*(19800000*laplace_rate + 85892400) + 93056040) + b_concentration*(b_concentration*(11366850*laplace_rate
    + 42057345) + laplace_rate*(27390000*laplace_rate + 235178010) + 513201201) + laplace_rate*(laplace_rate*(16500000*laplace_rate
    + 222297000) + 710357580) + 664227648) + b_concentration*(b_concentration*(68063320*laplace_rate + 242134572)
    + laplace_rate*(253648000*laplace_rate + 1104896000) + 837157920) + laplace_rate*(laplace_rate*(206800000*laplace_rate
    + 1046320000) + 1567597320) + 592857972) + b_concentration*(b_concentration*(laplace_rate*(51667500*laplace_rate
    + 224236950) + 243043920) + laplace_rate*(laplace_rate*(124500000*laplace_rate + 643665000) + 983325900) + 379416240)
