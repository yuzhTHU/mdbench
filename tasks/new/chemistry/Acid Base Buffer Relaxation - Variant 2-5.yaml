task_name: Acid Base Buffer Relaxation - Variant 2-5
task_description: Determine the Laplace-weighted small pH change following a weak proton pulse into a pre-equilibrated
  buffer.
mutation: Combines variants 2, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: reference_length = 0.0001
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: geometric_factor = (reference_length/length_scale)**2
  description: Dimensionless geometric factor.
  role: constitutive/component relations
- formula: ln_ten = 2.302585092994046
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: acid_constant = 0.0017
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: second_constant = 0.0061
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: solution_capacity = ln_ten*hydrogen
  description: Free-solution proton capacity per pH unit.
  role: constitutive/component relations
- formula: primary_capacity = ln_ten*0.70000000*buffer_total*acid_constant*hydrogen/(acid_constant+hydrogen)**2
  description: Equilibrium proton capacity of primary buffer sites.
  role: constitutive/component relations
- formula: relay_capacity = ln_ten*0.11*buffer_total*acid_constant*hydrogen/(acid_constant+hydrogen)**2
  description: Proton capacity of relay sites.
  role: constitutive/component relations
- formula: relay_exchange = 0.71*rate_scale*relay_capacity
  description: Linear proton-exchange conductance per pH difference.
  role: constitutive/component relations
- formula: relay_exchange_forward = relay_exchange/solution_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: relay_exchange_reverse = relay_exchange/relay_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: primary_exchange = rate_scale*primary_capacity*(1+hydrogen/acid_constant)
  description: Linear proton-exchange conductance per pH difference.
  role: constitutive/component relations
- formula: primary_exchange_forward = primary_exchange/relay_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: primary_exchange_reverse = primary_exchange/primary_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: interior_capacity = ln_ten*0.19*buffer_total*acid_constant*hydrogen/(acid_constant+hydrogen)**2
  description: Equilibrium capacity of interior buffer sites.
  role: constitutive/component relations
- formula: interior_exchange = 0.18*rate_scale*geometric_factor*interior_capacity
  description: Linear proton-exchange conductance per pH difference.
  role: constitutive/component relations
- formula: interior_exchange_forward = interior_exchange/primary_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: interior_exchange_reverse = interior_exchange/interior_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: laplace_rate*solution_protons+relay_exchange_forward*solution_protons = laplace_rate*(pulse)+relay_exchange_reverse*relay_protons
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*primary_protons+primary_exchange_reverse*primary_protons+interior_exchange_forward*primary_protons
    = 0+primary_exchange_forward*relay_protons+interior_exchange_reverse*interior_protons
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*relay_protons+relay_exchange_reverse*relay_protons+primary_exchange_forward*relay_protons
    = 0+relay_exchange_forward*solution_protons+primary_exchange_reverse*primary_protons
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*interior_protons+interior_exchange_reverse*interior_protons = 0+interior_exchange_forward*primary_protons
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: ph_change = -solution_protons/solution_capacity
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: ph_change = -500000000000000*laplace_rate*pulse/(1151292546497023*hydrogen*(13277*buffer_total/(10000*hydrogen
  + 17)**2 - 176278729*buffer_total/((10000*hydrogen + 17)**2*(70000000*hydrogen + 18700*laplace_rate - 2450000000000000*(10000*hydrogen
  + 17)**2/(3500000000000000*hydrogen + 5950000000000*laplace_rate + 5950000000000 + 2907/length_scale**2 - 26163/(length_scale**4*(5000000000*laplace_rate
  + 9/length_scale**2))) + 132277)) + laplace_rate))
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: hydrogen
  description: Pre-pulse free proton concentration; the pulse is much smaller than this concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0003
    ood_boundary: 0.003
    max: 0.012
    distribution: log_uniform
- name: buffer_total
  description: Total concentration of monoprotic buffer sites across regions.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.08
    ood_boundary: 0.8
    max: 2
    distribution: log_uniform
- name: pulse
  description: Small added proton concentration for linear-response measurement.
  unit: mol m^-3
  role: input
  sampling:
    min: 1.0e-09
    ood_boundary: 1.0e-08
    max: 5.0e-08
    distribution: log_uniform
- name: length_scale
  description: Characteristic length of the sample.
  unit: m
  role: input
  sampling:
    min: 5.0e-05
    ood_boundary: 0.00015
    max: 0.0003
    distribution: log_uniform
- name: geometric_factor
  description: Dimensionless geometric factor.
  unit: '1'
  role: internal
- name: solution_capacity
  description: Free-solution proton capacity per pH unit.
  unit: mol m^-3
  role: internal
- name: primary_capacity
  description: Equilibrium proton capacity of primary buffer sites.
  unit: mol m^-3
  role: internal
- name: relay_capacity
  description: Proton capacity of relay sites.
  unit: mol m^-3
  role: internal
- name: relay_exchange
  description: Linear proton-exchange conductance per pH difference.
  unit: mol m^-3 s^-1
  role: internal
- name: relay_exchange_forward
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: relay_exchange_reverse
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: primary_exchange
  description: Linear proton-exchange conductance per pH difference.
  unit: mol m^-3 s^-1
  role: internal
- name: primary_exchange_forward
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: primary_exchange_reverse
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: interior_capacity
  description: Equilibrium capacity of interior buffer sites.
  unit: mol m^-3
  role: internal
- name: interior_exchange
  description: Linear proton-exchange conductance per pH difference.
  unit: mol m^-3 s^-1
  role: internal
- name: interior_exchange_forward
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: interior_exchange_reverse
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: solution_protons
  description: Laplace-weighted excess free-proton concentration.
  unit: mol m^-3
  role: internal
- name: primary_protons
  description: Laplace-weighted excess protons stored on primary buffer sites.
  unit: mol m^-3
  role: internal
- name: relay_protons
  description: Laplace-weighted excess protons stored on relay sites.
  unit: mol m^-3
  role: internal
- name: interior_protons
  description: Laplace-weighted excess protons stored in interior buffer sites.
  unit: mol m^-3
  role: internal
- name: ph_change
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: '1'
  role: target
mechanism_probes:
- probe: interior_protons
  description: Laplace-weighted excess protons stored in interior buffer sites.
  answer: buffer_total*(158925690000000*hydrogen*pulse + 270173673000*pulse)/(buffer_total*(hydrogen*(376402950000000000000000*laplace_rate*length_scale**2
    + 836451000000000) + laplace_rate*(86897965000000000000*laplace_rate*length_scale**2 + 639885015000000000000*length_scale**2
    + 198872199900) + 1421966700000) + hydrogen*(hydrogen*(hydrogen*(laplace_rate*(2835000000000000000000000000*laplace_rate*length_scale**2
    + 273350000000000000000000000*length_scale**2 + 6300000000000000000) + 492030000000000000) + laplace_rate*(laplace_rate*(654500000000000000000000*laplace_rate*length_scale**2
    + 14923195000000000000000000*length_scale**2 + 1497870000000000) + 1394085000000000000000000*length_scale**2
    + 33193487700000000) + 2509353000000000) + laplace_rate*(laplace_rate*(2225300000000000000000*laplace_rate*length_scale**2
    + 26159413000000000000000*length_scale**2 + 5092758000000) + 2369944500000000000000*length_scale**2 + 58236858180000)
    + 4265900100000) + laplace_rate*(laplace_rate*(1891505000000000000*laplace_rate*length_scale**2 + 15271323550000000000*length_scale**2
    + 4328844300) + 1342968550000000000*length_scale**2 + 34025379453) + 2417343390)
- probe: relay_protons
  description: Laplace-weighted excess protons stored on relay sites.
  answer: 13277*buffer_total*laplace_rate*pulse/(100000000*(hydrogen + 17/10000)**2*(13277*buffer_total/(10000*hydrogen
    + 17)**2 - 176278729*buffer_total/((10000*hydrogen + 17)**2*(70000000*hydrogen + 18700*laplace_rate - 2450000000000000*(10000*hydrogen
    + 17)**2/(3500000000000000*hydrogen + 5950000000000*laplace_rate + 5950000000000 + 2907/length_scale**2 - 26163/(length_scale**4*(5000000000*laplace_rate
    + 9/length_scale**2))) + 132277)) + laplace_rate)*(700000*hydrogen/187 + laplace_rate - 24500000000000*(10000*hydrogen
    + 17)**2/(187*(3500000000000000*hydrogen + 5950000000000*laplace_rate + 5950000000000 + 2907/length_scale**2
    - 26163/(length_scale**4*(5000000000*laplace_rate + 9/length_scale**2)))) + 7781/1100))
