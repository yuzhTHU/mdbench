task_name: Acid Base Buffer Relaxation - Variant 1-4-5
task_description: Determine the Laplace-weighted small pH change following a weak proton pulse into a pre-equilibrated
  buffer.
mutation: Combines variants 1, 4, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: reference_length = 0.0001
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: geometric_factor = (reference_length/length_scale)**2
  description: Dimensionless geometric factor.
  role: constitutive/component relations
- formula: ln_ten = 2.302585092994046
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: acid_constant = 0.0017
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: second_constant = 0.0061
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: solution_capacity = ln_ten*hydrogen
  description: Free-solution proton capacity per pH unit.
  role: constitutive/component relations
- formula: primary_capacity = ln_ten*0.66000000*buffer_total*acid_constant*hydrogen/(acid_constant+hydrogen)**2
  description: Equilibrium proton capacity of primary buffer sites.
  role: constitutive/component relations
- formula: relay_capacity = ln_ten*0.11*buffer_total*acid_constant*hydrogen/(acid_constant+hydrogen)**2
  description: Proton capacity of relay sites.
  role: constitutive/component relations
- formula: relay_exchange = 0.71*rate_scale*relay_capacity
  description: Linear proton-exchange conductance per pH difference.
  role: constitutive/component relations
- formula: relay_exchange_forward = relay_exchange/solution_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: relay_exchange_reverse = relay_exchange/relay_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: primary_exchange = rate_scale*primary_capacity*(1+hydrogen/acid_constant)*(1+0.31*hydrogen/acid_constant)
  description: Linear proton-exchange conductance per pH difference.
  role: constitutive/component relations
- formula: primary_exchange_forward = primary_exchange/relay_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: primary_exchange_reverse = primary_exchange/primary_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: second_capacity = ln_ten*0.23*buffer_total*second_constant*hydrogen/(second_constant+hydrogen)**2
  description: Equilibrium capacity of the second acid family.
  role: constitutive/component relations
- formula: second_exchange = 0.43*rate_scale*second_capacity*(1+hydrogen/second_constant)
  description: Linear proton-exchange conductance per pH difference.
  role: constitutive/component relations
- formula: second_exchange_forward = second_exchange/solution_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: second_exchange_reverse = second_exchange/second_capacity
  description: First-order excess-proton transfer frequency.
  role: constitutive/component relations
- formula: laplace_rate*solution_protons+relay_exchange_forward*solution_protons+second_exchange_forward*solution_protons
    = laplace_rate*(pulse)+relay_exchange_reverse*relay_protons+second_exchange_reverse*second_protons
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*primary_protons+primary_exchange_reverse*primary_protons = 0+primary_exchange_forward*relay_protons
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*relay_protons+relay_exchange_reverse*relay_protons+primary_exchange_forward*relay_protons
    = 0+relay_exchange_forward*solution_protons+primary_exchange_reverse*primary_protons
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*second_protons+second_exchange_reverse*second_protons = 0+second_exchange_forward*solution_protons
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: ph_change = -solution_protons/solution_capacity
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: ph_change = -500000000000000*laplace_rate*pulse/(1151292546497023*hydrogen*(-42527*buffer_total/(430000*hydrogen
  + 6100*laplace_rate + 2623) + 989*buffer_total/(10000*hydrogen + 61) + 13277*buffer_total/(10000*hydrogen + 17)**2
  - 272430763*buffer_total/((10000*hydrogen + 17)**2*(28900*laplace_rate - 600*(3100*hydrogen + 17)**2*(10000*hydrogen
  + 17)**2/(289*laplace_rate + (3100*hydrogen + 17)*(10000*hydrogen + 17)) + 600*(3100*hydrogen + 17)*(10000*hydrogen
  + 17) + 20519)) + laplace_rate))
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: hydrogen
  description: Pre-pulse free proton concentration; the pulse is much smaller than this concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0003
    ood_boundary: 0.003
    max: 0.012
    distribution: log_uniform
- name: buffer_total
  description: Total concentration of monoprotic buffer sites across regions.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.08
    ood_boundary: 0.8
    max: 2
    distribution: log_uniform
- name: pulse
  description: Small added proton concentration for linear-response measurement.
  unit: mol m^-3
  role: input
  sampling:
    min: 1.0e-09
    ood_boundary: 1.0e-08
    max: 5.0e-08
    distribution: log_uniform
- name: length_scale
  description: Characteristic length of the sample.
  unit: m
  role: auxiliary
  sampling:
    min: 5.0e-05
    ood_boundary: 0.00015
    max: 0.0003
    distribution: log_uniform
- name: geometric_factor
  description: Dimensionless geometric factor.
  unit: '1'
  role: internal
- name: solution_capacity
  description: Free-solution proton capacity per pH unit.
  unit: mol m^-3
  role: internal
- name: primary_capacity
  description: Equilibrium proton capacity of primary buffer sites.
  unit: mol m^-3
  role: internal
- name: relay_capacity
  description: Proton capacity of relay sites.
  unit: mol m^-3
  role: internal
- name: relay_exchange
  description: Linear proton-exchange conductance per pH difference.
  unit: mol m^-3 s^-1
  role: internal
- name: relay_exchange_forward
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: relay_exchange_reverse
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: primary_exchange
  description: Linear proton-exchange conductance per pH difference.
  unit: mol m^-3 s^-1
  role: internal
- name: primary_exchange_forward
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: primary_exchange_reverse
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: second_capacity
  description: Equilibrium capacity of the second acid family.
  unit: mol m^-3
  role: internal
- name: second_exchange
  description: Linear proton-exchange conductance per pH difference.
  unit: mol m^-3 s^-1
  role: internal
- name: second_exchange_forward
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: second_exchange_reverse
  description: First-order excess-proton transfer frequency.
  unit: s^-1
  role: internal
- name: solution_protons
  description: Laplace-weighted excess free-proton concentration.
  unit: mol m^-3
  role: internal
- name: primary_protons
  description: Laplace-weighted excess protons stored on primary buffer sites.
  unit: mol m^-3
  role: internal
- name: relay_protons
  description: Laplace-weighted excess protons stored on relay sites.
  unit: mol m^-3
  role: internal
- name: second_protons
  description: Laplace-weighted excess protons stored on the second acid family.
  unit: mol m^-3
  role: internal
- name: ph_change
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: '1'
  role: target
mechanism_probes:
- probe: second_protons
  description: Laplace-weighted excess protons stored on the second acid family.
  answer: 60329*buffer_total*laplace_rate*pulse*(10000*hydrogen/61 + 1)/(100000000*(hydrogen + 61/10000)**2*(4300*hydrogen/61
    + laplace_rate + 43/100)*(-42527*buffer_total/(430000*hydrogen + 6100*laplace_rate + 2623) + 989*buffer_total/(10000*hydrogen
    + 61) + 13277*buffer_total/(10000*hydrogen + 17)**2 - 272430763*buffer_total/((10000*hydrogen + 17)**2*(28900*laplace_rate
    - 600*(3100*hydrogen + 17)**2*(10000*hydrogen + 17)**2/(289*laplace_rate + (3100*hydrogen + 17)*(10000*hydrogen
    + 17)) + 600*(3100*hydrogen + 17)*(10000*hydrogen + 17) + 20519)) + laplace_rate))
- probe: primary_exchange
  description: Linear proton-exchange conductance per pH difference.
  answer: buffer_total*hydrogen*(117777227506645452900*hydrogen + 645875118584829903)/(425000000000000000*hydrogen
    + 722500000000000)
- probe: relay_protons
  description: Laplace-weighted excess protons stored on relay sites.
  answer: 13277*buffer_total*laplace_rate*pulse/(100000000*(hydrogen + 17/10000)**2*(laplace_rate - 6*(3100*hydrogen
    + 17)**2*(10000*hydrogen + 17)**2/(289*(289*laplace_rate + (3100*hydrogen + 17)*(10000*hydrogen + 17))) + 6*(3100*hydrogen
    + 17)*(10000*hydrogen + 17)/289 + 71/100)*(-42527*buffer_total/(430000*hydrogen + 6100*laplace_rate + 2623)
    + 989*buffer_total/(10000*hydrogen + 61) + 13277*buffer_total/(10000*hydrogen + 17)**2 - 272430763*buffer_total/((10000*hydrogen
    + 17)**2*(28900*laplace_rate - 600*(3100*hydrogen + 17)**2*(10000*hydrogen + 17)**2/(289*laplace_rate + (3100*hydrogen
    + 17)*(10000*hydrogen + 17)) + 600*(3100*hydrogen + 17)*(10000*hydrogen + 17) + 20519)) + laplace_rate))
