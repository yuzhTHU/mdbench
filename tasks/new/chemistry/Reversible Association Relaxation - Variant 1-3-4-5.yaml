task_name: Reversible Association Relaxation - Variant 1-3-4-5
task_description: Determine the Laplace-weighted stable bound-molecule concentration after mixing initially unassociated
  molecules with buffered ligand.
mutation: Combines variants 1, 3, 4, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_binding = rate_scale*(1.43)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_return = rate_scale*(0.48)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_binding_rate = rate_scale*(0.38*ligand_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_unbinding_rate = rate_scale*(0.94)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: compaction_rate = rate_scale*(0.34)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: expansion_rate = rate_scale*(0.78)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux = laplace_rate*(molecule_total)+desorption_rate*precursor_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+precursor_return*bound_pool+second_binding_rate*bound_pool+compaction_rate*bound_pool
    = 0+precursor_binding*precursor_pool+second_unbinding_rate*double_bound_pool+expansion_rate*compact_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*precursor_pool+desorption_rate*precursor_pool+precursor_binding*precursor_pool = 0+binding_flux+precursor_return*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*double_bound_pool+second_unbinding_rate*double_bound_pool = 0+second_binding_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*compact_pool+expansion_rate*compact_pool = 0+compaction_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool+double_bound_pool+compact_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (laplace_rate*(laplace_rate*ligand*(452237500*ligand*molecule_total + 2162875000*molecule_total)
  + ligand*(ligand*(171850250*ligand*molecule_total + 1753501750*molecule_total) + 4455522500*molecule_total)) +
  ligand*(ligand*(134043195*ligand*molecule_total + 1117191790*molecule_total) + 2277074800*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(1375000000*laplace_rate
  + ligand*(316250000*ligand + 2227625000) + 6380000000) + ligand*(ligand*(120175000*ligand + 1903460000) + 7998692500)
  + 8973250000) + ligand*(ligand*(265586750*ligand + 2852944800) + 8514284300) + 4284456000) + ligand*(ligand*(134043195*ligand
  + 1228491550) + 2877169672) + 324221040)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: molecule_total
  description: Conserved concentration of initially unassociated binding molecules.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0001
    ood_boundary: 0.001
    max: 0.004
    distribution: log_uniform
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_binding
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_return
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_unbinding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: compaction_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: expansion_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted free molecule concentration.
  unit: mol m^-3
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: mol m^-3
  role: internal
- name: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  unit: mol m^-3
  role: internal
- name: double_bound_pool
  description: Laplace-weighted population carrying a second ligand.
  unit: mol m^-3
  role: internal
- name: compact_pool
  description: Laplace-weighted compact bound-complex concentration.
  unit: mol m^-3
  role: internal
- name: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3
  role: target
mechanism_probes:
- probe: double_bound_pool
  description: Laplace-weighted population carrying a second ligand.
  answer: (laplace_rate*ligand**2*(171850250*ligand*molecule_total + 821892500*molecule_total) + ligand**2*(134043195*ligand*molecule_total
    + 641076150*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(1375000000*laplace_rate + ligand*(316250000*ligand
    + 2227625000) + 6380000000) + ligand*(ligand*(120175000*ligand + 1903460000) + 7998692500) + 8973250000) + ligand*(ligand*(265586750*ligand
    + 2852944800) + 8514284300) + 4284456000) + ligand*(ligand*(134043195*ligand + 1228491550) + 2877169672) + 324221040)
- probe: compact_pool
  description: Laplace-weighted compact bound-complex concentration.
  answer: (laplace_rate*ligand*(153760750*ligand*molecule_total + 735377500*molecule_total) + ligand*(144535105*ligand*molecule_total
    + 691254850*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(1375000000*laplace_rate + ligand*(316250000*ligand
    + 2227625000) + 6380000000) + ligand*(ligand*(120175000*ligand + 1903460000) + 7998692500) + 8973250000) + ligand*(ligand*(265586750*ligand
    + 2852944800) + 8514284300) + 4284456000) + ligand*(ligand*(134043195*ligand + 1228491550) + 2877169672) + 324221040)
- probe: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: (laplace_rate*(laplace_rate*(laplace_rate*(laplace_rate*ligand*(15812500000*ligand*molecule_total + 75625000000*molecule_total)
    + ligand*(ligand*(8223937500*ligand*molecule_total + 112701875000*molecule_total) + 350900000000*molecule_total))
    + ligand*(ligand*(ligand*(841771250*ligand*molecule_total + 26957638750*molecule_total) + 212866087500*molecule_total)
    + 493528750000*molecule_total)) + ligand*(ligand*(ligand*(656581575*ligand*molecule_total + 17143513450*molecule_total)
    + 116243743000*molecule_total) + 235645080000*molecule_total)) + ligand*(ligand*(779604228*ligand*molecule_total
    + 7457083920*molecule_total) + 17832157200*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(68750000000*laplace_rate
    + ligand*(15812500000*ligand + 111381250000) + 319000000000) + ligand*(ligand*(6008750000*ligand + 95173000000)
    + 399934625000) + 448662500000) + ligand*(ligand*(13279337500*ligand + 142647240000) + 425714215000) + 214222800000)
    + ligand*(ligand*(6702159750*ligand + 61424577500) + 143858483600) + 16211052000)
- probe: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  answer: (laplace_rate*(laplace_rate*(laplace_rate*ligand*(316250000*ligand*molecule_total + 1512500000*molecule_total)
    + ligand*(ligand*(120175000*ligand*molecule_total + 1378025000*molecule_total) + 3841750000*molecule_total))
    + ligand*(ligand*(93736500*ligand*molecule_total + 1042349000*molecule_total) + 2841080000*molecule_total))
    + ligand*(111299760*ligand*molecule_total + 532303200*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(1375000000*laplace_rate
    + ligand*(316250000*ligand + 2227625000) + 6380000000) + ligand*(ligand*(120175000*ligand + 1903460000) + 7998692500)
    + 8973250000) + ligand*(ligand*(265586750*ligand + 2852944800) + 8514284300) + 4284456000) + ligand*(ligand*(134043195*ligand
    + 1228491550) + 2877169672) + 324221040)
