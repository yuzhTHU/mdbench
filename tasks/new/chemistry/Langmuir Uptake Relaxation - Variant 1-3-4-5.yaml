    + ligand*(ligand*(574750000*ligand + 773850000) + 2985017500) + 6485600000) + ligand*(ligand*(ligand*(218405000*ligand
    + 1932100500) + 2573114900) + 7613079350) + 5060979000) + ligand*(ligand*(ligand*(312319150*ligand + 1262185485)
