  answer: enzyme_total*flow_rate**2*(flow_rate*(flow_rate*(38750000000*flow_rate + 37975000000*second_substrate
    + 10850000000*substrate + 223200000000) + second_substrate*(18228000000*substrate + 105299250000) + 105299250000*substrate
    + 369942375000) + second_substrate*(5848150000*substrate + 14267750000) + 54930837500*substrate + 134014937500)/(flow_rate*(flow_rate*(flow_rate*(flow_rate*(flow_rate*(62500000000*flow_rate
