task_name: Surface Pair Catalysis - Variant 2-4
task_description: Determine the Laplace-weighted B-containing product rate after exposing initially empty surface
  cells to buffered A and B.
mutation: Combines variants 2, 4 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: a_ratio = a_concentration/concentration_scale
  description: Dimensionless gas A concentration.
  role: constitutive/component relations
- formula: b_ratio = b_concentration/concentration_scale
  description: Dimensionless gas B concentration.
  role: constitutive/component relations
- formula: a_adsorption = rate_scale*(1.2*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_adsorption = rate_scale*(0.83*b_ratio*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: a_desorption = rate_scale*(0.64)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_desorption = rate_scale*(0.51*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_b_adsorption = rate_scale*(0.83*b_ratio*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_a_adsorption = rate_scale*(1.2*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_a_desorption = rate_scale*(0.64)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_b_desorption = rate_scale*(0.51*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: surface_reaction = rate_scale*(1.6)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: immobilization = rate_scale*(0.26)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: remobilization = rate_scale*(0.47)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: laplace_rate*empty_cells+a_adsorption*empty_cells+b_adsorption*empty_cells = laplace_rate*(1)+a_desorption*a_cells+b_desorption*b_cells+surface_reaction*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*a_cells+a_desorption*a_cells+second_b_adsorption*a_cells+immobilization*a_cells = 0+a_adsorption*empty_cells+paired_b_desorption*ab_cells+remobilization*immobile_a_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*b_cells+b_desorption*b_cells+second_a_adsorption*b_cells = 0+b_adsorption*empty_cells+paired_a_desorption*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*ab_cells+paired_a_desorption*ab_cells+paired_b_desorption*ab_cells+surface_reaction*ab_cells
    = 0+second_b_adsorption*a_cells+second_a_adsorption*b_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*immobile_a_cells+remobilization*immobile_a_cells = 0+immobilization*a_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = surface_reaction*ab_cells
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = a_concentration*(a_concentration*(a_concentration*b_concentration*(b_concentration*(33067200*laplace_rate
  + 15541584) + 163742400*laplace_rate + 76958928) + b_concentration*(b_concentration*(198403200*laplace_rate +
  93249504) + laplace_rate*(239040000*laplace_rate + 772099200) + 295477344)) + b_concentration*(b_concentration*(297604800*laplace_rate
  + 139874256) + laplace_rate*(717120000*laplace_rate + 842616000) + 193801680))/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(b_concentration*(20667000*laplace_rate
  + 9713490) + 115038000*laplace_rate + 57369600) + 62883000*laplace_rate + 45904590) + b_concentration*(b_concentration*(laplace_rate*(17222500*laplace_rate
  + 170674975) + 76412788) + laplace_rate*(245265000*laplace_rate + 804369600) + 333263592) + laplace_rate*(468202500*laplace_rate
  + 1208599425) + 624052692) + b_concentration*(b_concentration*(laplace_rate*(103335000*laplace_rate + 466040850)
  + 196212498) + laplace_rate*(laplace_rate*(124500000*laplace_rate + 1192710000) + 1782591000) + 568381344) + laplace_rate*(laplace_rate*(616500000*laplace_rate
  + 2246400000) + 2076769350) + 485306766) + b_concentration*(b_concentration*(laplace_rate*(155002500*laplace_rate
  + 420056775) + 163186632) + laplace_rate*(laplace_rate*(373500000*laplace_rate + 1370745000) + 1214472600) + 254750904)
  + laplace_rate*(laplace_rate*(laplace_rate*(225000000*laplace_rate + 1041750000) + 1388137500) + 652957425) +
  94921200)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: a_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: b_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: a_ratio
  description: Dimensionless gas A concentration.
  unit: '1'
  role: internal
- name: b_ratio
  description: Dimensionless gas B concentration.
  unit: '1'
  role: internal
- name: a_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: b_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: a_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: b_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_b_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_a_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: paired_a_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: paired_b_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: surface_reaction
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: immobilization
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: remobilization
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: empty_cells
  description: Laplace-weighted empty catalytic-cell fraction.
  unit: '1'
  role: internal
- name: a_cells
  description: Laplace-weighted cells carrying only adsorbed A.
  unit: '1'
  role: internal
- name: b_cells
  description: Laplace-weighted cells carrying only adsorbed B.
  unit: '1'
  role: internal
- name: ab_cells
  description: Laplace-weighted cells carrying both adsorbed reactants.
  unit: '1'
  role: internal
- name: immobile_a_cells
  description: Laplace-weighted cells containing immobilized adsorbed A.
  unit: '1'
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: s^-1
  role: target
mechanism_probes:
- probe: immobile_a_cells
  description: Laplace-weighted cells containing immobilized adsorbed A.
  answer: a_concentration*(a_concentration*(a_concentration*(3301740*b_concentration + 16349580) + 19810440*b_concentration
    + 108108000*laplace_rate + 216651240) + 29715660*b_concentration + laplace_rate*(70200000*laplace_rate + 228852000)
    + 98455500)/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(b_concentration*(20667000*laplace_rate
    + 9713490) + 115038000*laplace_rate + 57369600) + 62883000*laplace_rate + 45904590) + b_concentration*(b_concentration*(laplace_rate*(17222500*laplace_rate
    + 170674975) + 76412788) + laplace_rate*(245265000*laplace_rate + 804369600) + 333263592) + laplace_rate*(468202500*laplace_rate
    + 1208599425) + 624052692) + b_concentration*(b_concentration*(laplace_rate*(103335000*laplace_rate + 466040850)
    + 196212498) + laplace_rate*(laplace_rate*(124500000*laplace_rate + 1192710000) + 1782591000) + 568381344) +
    laplace_rate*(laplace_rate*(616500000*laplace_rate + 2246400000) + 2076769350) + 485306766) + b_concentration*(b_concentration*(laplace_rate*(155002500*laplace_rate
    + 420056775) + 163186632) + laplace_rate*(laplace_rate*(373500000*laplace_rate + 1370745000) + 1214472600) +
    254750904) + laplace_rate*(laplace_rate*(laplace_rate*(225000000*laplace_rate + 1041750000) + 1388137500) +
    652957425) + 94921200)
- probe: b_cells
  description: Laplace-weighted cells carrying only adsorbed B.
  answer: (a_concentration*(a_concentration*b_concentration*(b_concentration*(laplace_rate*(17222500*laplace_rate
    + 46672975) + 18131848) + laplace_rate*(10582500*laplace_rate + 62306025) + 25652976) + b_concentration*(b_concentration*(laplace_rate*(103335000*laplace_rate
    + 280037850) + 108791088) + laplace_rate*(laplace_rate*(62250000*laplace_rate + 288217500) + 440169750) + 128452128))
    + b_concentration*(b_concentration*(laplace_rate*(155002500*laplace_rate + 420056775) + 163186632) + laplace_rate*(laplace_rate*(186750000*laplace_rate
    + 769410000) + 759755025) + 154479600))/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(b_concentration*(20667000*laplace_rate
    + 9713490) + 115038000*laplace_rate + 57369600) + 62883000*laplace_rate + 45904590) + b_concentration*(b_concentration*(laplace_rate*(17222500*laplace_rate
    + 170674975) + 76412788) + laplace_rate*(245265000*laplace_rate + 804369600) + 333263592) + laplace_rate*(468202500*laplace_rate
    + 1208599425) + 624052692) + b_concentration*(b_concentration*(laplace_rate*(103335000*laplace_rate + 466040850)
    + 196212498) + laplace_rate*(laplace_rate*(124500000*laplace_rate + 1192710000) + 1782591000) + 568381344) +
    laplace_rate*(laplace_rate*(616500000*laplace_rate + 2246400000) + 2076769350) + 485306766) + b_concentration*(b_concentration*(laplace_rate*(155002500*laplace_rate
    + 420056775) + 163186632) + laplace_rate*(laplace_rate*(373500000*laplace_rate + 1370745000) + 1214472600) +
    254750904) + laplace_rate*(laplace_rate*(laplace_rate*(225000000*laplace_rate + 1041750000) + 1388137500) +
    652957425) + 94921200)
