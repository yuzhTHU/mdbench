task_name: Competitive Inhibition Pulse Reaction - Variant 1-2-4
task_description: Determine the Laplace-weighted product rate after substrate and inhibitor exposure of initially
  unbound enzyme in a buffered solution.
mutation: Combines variants 1, 2, 4 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: substrate_ratio = substrate/concentration_scale
  description: Dimensionless free substrate concentration.
  role: constitutive/component relations
- formula: association_rate = rate_scale*(1.4*substrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: dissociation_rate = rate_scale*(0.73)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: release_rate = rate_scale*(1.9+0.28*substrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: inhibitor_ratio = inhibitor/concentration_scale
  description: Dimensionless free inhibitor concentration.
  role: constitutive/component relations
- formula: inhibitor_binding_rate = rate_scale*(0.92*inhibitor_ratio+0.18*inhibitor_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: inhibitor_release_rate = rate_scale*(0.61)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: locking_rate = rate_scale*(0.27)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: unlocking_rate = rate_scale*(0.44)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: laplace_rate*free_enzyme+association_rate*free_enzyme+inhibitor_binding_rate*free_enzyme = laplace_rate*(enzyme_total)+dissociation_rate*substrate_complex+release_rate*substrate_complex+inhibitor_release_rate*inhibitor_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*substrate_complex+dissociation_rate*substrate_complex+release_rate*substrate_complex = 0+association_rate*free_enzyme
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*inhibitor_complex+inhibitor_release_rate*inhibitor_complex+locking_rate*inhibitor_complex
    = 0+inhibitor_binding_rate*free_enzyme+unlocking_rate*locked_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*locked_complex+unlocking_rate*locked_complex = 0+locking_rate*inhibitor_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = release_rate*substrate_complex
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = enzyme_total*(laplace_rate*(laplace_rate*substrate*(980000*substrate + 6650000) + substrate*(1293600*substrate
  + 8778000)) + substrate*(263032*substrate + 1784860))/(inhibitor*(inhibitor*(laplace_rate*(450000*laplace_rate
  + 126000*substrate + 1503000) + 89460*substrate + 840285) + laplace_rate*(2300000*laplace_rate + 644000*substrate
  + 7682000) + 457240*substrate + 4294790) + laplace_rate*(laplace_rate*(2500000*laplace_rate + 4200000*substrate
  + 9875000) + 5544000*substrate + 9350000) + 1127280*substrate + 1764730)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: substrate
  description: Buffered free substrate concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.6
    max: 5
    distribution: log_uniform
- name: enzyme_total
  description: Conserved enzyme concentration before exposure.
  unit: mol m^-3
  role: input
  sampling:
    min: 5.0e-05
    ood_boundary: 0.0004
    max: 0.001
    distribution: log_uniform
- name: substrate_ratio
  description: Dimensionless free substrate concentration.
  unit: '1'
  role: internal
- name: association_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: dissociation_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: release_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: inhibitor
  description: Buffered free inhibitor concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.03
    ood_boundary: 1.3
    max: 4
    distribution: log_uniform
- name: inhibitor_ratio
  description: Dimensionless free inhibitor concentration.
  unit: '1'
  role: internal
- name: inhibitor_binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: inhibitor_release_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: locking_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unlocking_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: free_enzyme
  description: Laplace-weighted free enzyme concentration.
  unit: mol m^-3
  role: internal
- name: substrate_complex
  description: Laplace-weighted enzyme-substrate complex concentration.
  unit: mol m^-3
  role: internal
- name: inhibitor_complex
  description: Laplace-weighted inhibitor-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: locked_complex
  description: Laplace-weighted locked inhibitor-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: free_enzyme
  description: Laplace-weighted free enzyme concentration.
  answer: enzyme_total*(laplace_rate*(laplace_rate*(500000*laplace_rate + 140000*substrate + 1975000) + 184800*substrate
    + 1870000) + 37576*substrate + 352946)/(inhibitor*(inhibitor*(laplace_rate*(90000*laplace_rate + 25200*substrate
    + 300600) + 17892*substrate + 168057) + laplace_rate*(460000*laplace_rate + 128800*substrate + 1536400) + 91448*substrate
    + 858958) + laplace_rate*(laplace_rate*(500000*laplace_rate + 840000*substrate + 1975000) + 1108800*substrate
    + 1870000) + 225456*substrate + 352946)
- probe: inhibitor_complex
  description: Laplace-weighted inhibitor-bound enzyme concentration.
  answer: enzyme_total*inhibitor*(inhibitor*(laplace_rate*(90000*laplace_rate + 25200*substrate + 276300) + 11088*substrate
    + 104148) + laplace_rate*(460000*laplace_rate + 128800*substrate + 1412200) + 56672*substrate + 532312)/(inhibitor*(inhibitor*(laplace_rate*(90000*laplace_rate
    + 25200*substrate + 300600) + 17892*substrate + 168057) + laplace_rate*(460000*laplace_rate + 128800*substrate
    + 1536400) + 91448*substrate + 858958) + laplace_rate*(laplace_rate*(500000*laplace_rate + 840000*substrate
    + 1975000) + 1108800*substrate + 1870000) + 225456*substrate + 352946)
- probe: locked_complex
  description: Laplace-weighted locked inhibitor-bound enzyme concentration.
  answer: enzyme_total*inhibitor*(inhibitor*(24300*laplace_rate + 6804*substrate + 63909) + 124200*laplace_rate
    + 34776*substrate + 326646)/(inhibitor*(inhibitor*(laplace_rate*(90000*laplace_rate + 25200*substrate + 300600)
    + 17892*substrate + 168057) + laplace_rate*(460000*laplace_rate + 128800*substrate + 1536400) + 91448*substrate
    + 858958) + laplace_rate*(laplace_rate*(500000*laplace_rate + 840000*substrate + 1975000) + 1108800*substrate
    + 1870000) + 225456*substrate + 352946)
