task_name: Langmuir Uptake Relaxation - Variant 3-4-5
task_description: Determine Laplace-weighted coverage after exposing an initially empty homogeneous surface to a
  buffered adsorbate concentration.
mutation: Combines variants 3, 4, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1+(0.23/1.1)*ligand_ratio+(0.19/0.67)*ligand_ratio**2))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1+(0.23/1.1)*ligand_ratio+(0.19/0.67)*ligand_ratio**2))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_binding = rate_scale*(1.43)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_return = rate_scale*(0.48)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: dissociation_flux = desorption_rate*precursor_pool
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux = laplace_rate*(1)+dissociation_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+precursor_return*bound_pool = 0+precursor_binding*precursor_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*precursor_pool+dissociation_flux+precursor_binding*precursor_pool = 0+binding_flux+precursor_return*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool+precursor_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (laplace_rate*ligand*(ligand*(11495000*ligand + 8475500) + 40535000) + ligand*(ligand*(21955450*ligand
  + 16188205) + 77421850))/(laplace_rate*(36850000*laplace_rate + ligand*(ligand*(11495000*ligand + 15477000) +
  45697350) + 95073000) + ligand*(ligand*(21955450*ligand + 19548925) + 79899778) + 11850960)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_binding
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_return
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted empty-site fraction.
  unit: '1'
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: '1'
  role: internal
- name: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  unit: '1'
  role: internal
- name: binding_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: dissociation_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: '1'
  role: target
mechanism_probes:
- probe: binding_flux
  description: Laplace-weighted transition flux per adsorption cell.
  answer: (laplace_rate*(laplace_rate*ligand*(ligand*(574750000*ligand + 423775000) + 2026750000) + ligand*(ligand*(ligand*(ligand*(109202500*ligand
    + 161034500) + 1927304525) + 1377268750) + 5229015000)) + ligand*(ligand*(ligand*(ligand*(52417200*ligand +
    77296560) + 398175372) + 272572080) + 651802800))/(laplace_rate*(1842500000*laplace_rate + ligand*(ligand*(574750000*ligand
    + 773850000) + 2284867500) + 4753650000) + ligand*(ligand*(1097772500*ligand + 977446250) + 3994988900) + 592548000)
- probe: dissociation_flux
  description: Laplace-weighted transition flux per adsorption cell.
  answer: (laplace_rate*ligand*(ligand*(ligand*(ligand*(109202500*ligand + 161034500) + 829532025) + 567858500)
    + 1357922500) + ligand*(ligand*(ligand*(ligand*(52417200*ligand + 77296560) + 398175372) + 272572080) + 651802800))/(laplace_rate*(1842500000*laplace_rate
    + ligand*(ligand*(574750000*ligand + 773850000) + 2284867500) + 4753650000) + ligand*(ligand*(1097772500*ligand
    + 977446250) + 3994988900) + 592548000)
- probe: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  answer: (laplace_rate*ligand*(ligand*(11495000*ligand + 8475500) + 40535000) + ligand*(ligand*(5517600*ligand
    + 4068240) + 19456800))/(laplace_rate*(36850000*laplace_rate + ligand*(ligand*(11495000*ligand + 15477000) +
    45697350) + 95073000) + ligand*(ligand*(21955450*ligand + 19548925) + 79899778) + 11850960)
