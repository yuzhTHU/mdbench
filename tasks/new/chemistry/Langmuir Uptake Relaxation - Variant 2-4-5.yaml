task_name: Langmuir Uptake Relaxation - Variant 2-4-5
task_description: Determine Laplace-weighted coverage after exposing an initially empty homogeneous surface to a
  buffered adsorbate concentration.
mutation: Combines variants 2, 4, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1+(0.19/0.67)*ligand_ratio**2))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1+(0.19/0.67)*ligand_ratio**2))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_binding = rate_scale*(1.43)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: precursor_return = rate_scale*(0.48)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: storage_rate = rate_scale*(0.29)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: return_rate = rate_scale*(0.53)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: dissociation_flux = desorption_rate*precursor_pool
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux = laplace_rate*(1)+dissociation_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+precursor_return*bound_pool+storage_rate*bound_pool = 0+precursor_binding*precursor_pool+return_rate*stored_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*precursor_pool+dissociation_flux+precursor_binding*precursor_pool = 0+binding_flux+precursor_return*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*stored_pool+return_rate*stored_pool = 0+storage_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool+precursor_pool+stored_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (laplace_rate*(laplace_rate*ligand*(5225000*ligand**2 + 18425000) + ligand*(14264250*ligand**2
  + 50300250)) + ligand*(7456075*ligand**2 + 26292475))/(laplace_rate*(laplace_rate*(16750000*laplace_rate + ligand*(ligand*(5225000*ligand
  + 3182500) + 18425000) + 56950000) + ligand*(ligand*(14264250*ligand + 4137250) + 50300250) + 38491500) + ligand*(ligand*(7456075*ligand
  + 809628) + 26292475) + 2855004)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_binding
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: precursor_return
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: storage_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: return_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted empty-site fraction.
  unit: '1'
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: '1'
  role: internal
- name: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  unit: '1'
  role: internal
- name: stored_pool
  description: Laplace-weighted reversibly stored population.
  unit: '1'
  role: internal
- name: binding_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: dissociation_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: '1'
  role: target
mechanism_probes:
- probe: stored_pool
  description: Laplace-weighted reversibly stored population.
  answer: ligand*(4333615*ligand**2 + 15281695)/(laplace_rate*(laplace_rate*(33500000*laplace_rate + ligand*(ligand*(10450000*ligand
    + 6365000) + 36850000) + 113900000) + ligand*(ligand*(28528500*ligand + 8274500) + 100600500) + 76983000) +
    ligand*(ligand*(14912150*ligand + 1619256) + 52584950) + 5710008)
- probe: dissociation_flux
  description: Laplace-weighted transition flux per adsorption cell.
  answer: (laplace_rate*(laplace_rate*ligand*(ligand**2*(4963750*ligand**2 + 35007500) + 61723750) + ligand*(ligand**2*(6452875*ligand**2
    + 45509750) + 80240875)) + ligand*(ligand**2*(1262778*ligand**2 + 8905908) + 15702522))/(laplace_rate*(laplace_rate*(83750000*laplace_rate
    + ligand*(ligand*(26125000*ligand + 15912500) + 92125000) + 284750000) + ligand*(ligand*(71321250*ligand + 20686250)
    + 251501250) + 192457500) + ligand*(ligand*(37280375*ligand + 4048140) + 131462375) + 14275020)
- probe: precursor_pool
  description: Laplace-weighted reversible encounter-complex population.
  answer: (laplace_rate*(laplace_rate*ligand*(5225000*ligand**2 + 18425000) + ligand*(6792500*ligand**2 + 23952500))
    + ligand*(1329240*ligand**2 + 4687320))/(laplace_rate*(laplace_rate*(16750000*laplace_rate + ligand*(ligand*(5225000*ligand
    + 3182500) + 18425000) + 56950000) + ligand*(ligand*(14264250*ligand + 4137250) + 50300250) + 38491500) + ligand*(ligand*(7456075*ligand
    + 809628) + 26292475) + 2855004)
