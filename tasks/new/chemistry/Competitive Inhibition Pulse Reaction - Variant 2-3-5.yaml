task_name: Competitive Inhibition Pulse Reaction - Variant 2-3-5
task_description: Determine the Laplace-weighted product rate after substrate and inhibitor exposure of initially
  unbound enzyme in a buffered solution.
mutation: Combines variants 2, 3, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: substrate_ratio = substrate/concentration_scale
  description: Dimensionless free substrate concentration.
  role: constitutive/component relations
- formula: association_rate = rate_scale*(1.4*substrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: dissociation_rate = rate_scale*(0.73)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: chemistry_rate = rate_scale*(1.9)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: release_rate = rate_scale*(2.6)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: inhibitor_ratio = inhibitor/concentration_scale
  description: Dimensionless free inhibitor concentration.
  role: constitutive/component relations
- formula: inhibitor_binding_rate = rate_scale*(0.92*inhibitor_ratio+0.18*inhibitor_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: inhibitor_release_rate = rate_scale*(0.61)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: mixed_inhibitor_binding = rate_scale*(0.92*inhibitor_ratio+0.18*inhibitor_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: mixed_inhibitor_release = rate_scale*(0.61)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: mixed_substrate_binding = rate_scale*(1.4*substrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: mixed_substrate_release = rate_scale*(0.73)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: laplace_rate*free_enzyme+association_rate*free_enzyme+inhibitor_binding_rate*free_enzyme = laplace_rate*(enzyme_total)+dissociation_rate*substrate_complex+release_rate*product_complex+inhibitor_release_rate*inhibitor_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*substrate_complex+dissociation_rate*substrate_complex+chemistry_rate*substrate_complex+mixed_inhibitor_binding*substrate_complex
    = 0+association_rate*free_enzyme+mixed_inhibitor_release*mixed_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*product_complex+release_rate*product_complex = 0+chemistry_rate*substrate_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*inhibitor_complex+inhibitor_release_rate*inhibitor_complex+mixed_substrate_binding*inhibitor_complex
    = 0+inhibitor_binding_rate*free_enzyme+mixed_substrate_release*mixed_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*mixed_complex+mixed_inhibitor_release*mixed_complex+mixed_substrate_release*mixed_complex
    = 0+mixed_inhibitor_binding*substrate_complex+mixed_substrate_binding*inhibitor_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = release_rate*product_complex
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = enzyme_total*(inhibitor*(1898442*inhibitor*substrate + 9703148*substrate) + laplace_rate*(17290000*laplace_rate*substrate
  + substrate*(24206000*substrate + 33715500)) + substrate*(14765660*substrate + 14132846))/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(laplace_rate*(81000*laplace_rate
  + 113400*substrate + 269730) + 294840*substrate + 153738) + laplace_rate*(828000*laplace_rate + 1159200*substrate
  + 2757240) + 3013920*substrate + 1571544) + laplace_rate*(laplace_rate*(900000*laplace_rate + 1890000*substrate
  + 6845500) + substrate*(882000*substrate + 10761800) + 15045255) + substrate*(2293200*substrate + 15934450) +
  8660483) + laplace_rate*(laplace_rate*(4600000*laplace_rate + 9660000*substrate + 24173000) + substrate*(4508000*substrate
  + 39863600) + 40883650) + substrate*(11720800*substrate + 42075740) + 23737610) + laplace_rate*(laplace_rate*(laplace_rate*(2500000*laplace_rate
  + 7000000*substrate + 17950000) + substrate*(4900000*substrate + 43015000) + 44634750) + substrate*(25039000*substrate
  + 68672450) + 44022755) + substrate*(13450500*substrate + 27473180) + 13973453)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: substrate
  description: Buffered free substrate concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.6
    max: 5
    distribution: log_uniform
- name: enzyme_total
  description: Conserved enzyme concentration before exposure.
  unit: mol m^-3
  role: input
  sampling:
    min: 5.0e-05
    ood_boundary: 0.0004
    max: 0.001
    distribution: log_uniform
- name: substrate_ratio
  description: Dimensionless free substrate concentration.
  unit: '1'
  role: internal
- name: association_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: dissociation_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: chemistry_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: release_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: inhibitor
  description: Buffered free inhibitor concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.03
    ood_boundary: 1.3
    max: 4
    distribution: log_uniform
- name: inhibitor_ratio
  description: Dimensionless free inhibitor concentration.
  unit: '1'
  role: internal
- name: inhibitor_binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: inhibitor_release_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: mixed_inhibitor_binding
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: mixed_inhibitor_release
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: mixed_substrate_binding
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: mixed_substrate_release
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: free_enzyme
  description: Laplace-weighted free enzyme concentration.
  unit: mol m^-3
  role: internal
- name: substrate_complex
  description: Laplace-weighted enzyme-substrate complex concentration.
  unit: mol m^-3
  role: internal
- name: product_complex
  description: Laplace-weighted product-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: inhibitor_complex
  description: Laplace-weighted inhibitor-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: mixed_complex
  description: Laplace-weighted enzyme carrying both substrate and inhibitor.
  unit: mol m^-3
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
