  answer: enzyme_total*inhibitor*(inhibitor*(inhibitor*(inhibitor*(laplace_rate*(81000*laplace_rate + 269730) +
    153738) + laplace_rate*(828000*laplace_rate + 2757240) + 1571544) + laplace_rate*(laplace_rate*(450000*laplace_rate
    + 5072500) + 459900*substrate + 13277070) + 1195740*substrate + 8139482) + laplace_rate*(laplace_rate*(2300000*laplace_rate
    + 15111000) + 2350600*substrate + 31846260) + 6111560*substrate + 21074716)/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(laplace_rate*(81000*laplace_rate
    + 113400*substrate + 269730) + 294840*substrate + 153738) + laplace_rate*(828000*laplace_rate + 1159200*substrate
    + 2757240) + 3013920*substrate + 1571544) + laplace_rate*(laplace_rate*(900000*laplace_rate + 1890000*substrate
    + 6845500) + substrate*(882000*substrate + 10761800) + 15045255) + substrate*(2293200*substrate + 15934450)
    + 8660483) + laplace_rate*(laplace_rate*(4600000*laplace_rate + 9660000*substrate + 24173000) + substrate*(4508000*substrate
    + 39863600) + 40883650) + substrate*(11720800*substrate + 42075740) + 23737610) + laplace_rate*(laplace_rate*(laplace_rate*(2500000*laplace_rate
    + 7000000*substrate + 17950000) + substrate*(4900000*substrate + 43015000) + 44634750) + substrate*(25039000*substrate
    + 68672450) + 44022755) + substrate*(13450500*substrate + 27473180) + 13973453)
- probe: product_complex
  description: Laplace-weighted product-bound enzyme concentration.
  answer: enzyme_total*(inhibitor*(730170*inhibitor*substrate + 3731980*substrate) + laplace_rate*(6650000*laplace_rate*substrate
    + substrate*(9310000*substrate + 12967500)) + substrate*(5679100*substrate + 5435710))/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(laplace_rate*(81000*laplace_rate
    + 113400*substrate + 269730) + 294840*substrate + 153738) + laplace_rate*(828000*laplace_rate + 1159200*substrate
    + 2757240) + 3013920*substrate + 1571544) + laplace_rate*(laplace_rate*(900000*laplace_rate + 1890000*substrate
    + 6845500) + substrate*(882000*substrate + 10761800) + 15045255) + substrate*(2293200*substrate + 15934450)
    + 8660483) + laplace_rate*(laplace_rate*(4600000*laplace_rate + 9660000*substrate + 24173000) + substrate*(4508000*substrate
    + 39863600) + 40883650) + substrate*(11720800*substrate + 42075740) + 23737610) + laplace_rate*(laplace_rate*(laplace_rate*(2500000*laplace_rate
    + 7000000*substrate + 17950000) + substrate*(4900000*substrate + 43015000) + 44634750) + substrate*(25039000*substrate
    + 68672450) + 44022755) + substrate*(13450500*substrate + 27473180) + 13973453)
- probe: mixed_complex
  description: Laplace-weighted enzyme carrying both substrate and inhibitor.
  answer: enzyme_total*inhibitor*(inhibitor*(inhibitor*(inhibitor*(113400*laplace_rate*substrate + 294840*substrate)
    + 1159200*laplace_rate*substrate + 3013920*substrate) + laplace_rate*(1260000*laplace_rate*substrate + substrate*(882000*substrate
    + 8279600)) + substrate*(2293200*substrate + 13009360)) + laplace_rate*(6440000*laplace_rate*substrate + substrate*(4508000*substrate
    + 27176800)) + substrate*(11720800*substrate + 27125280))/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(laplace_rate*(81000*laplace_rate
    + 113400*substrate + 269730) + 294840*substrate + 153738) + laplace_rate*(828000*laplace_rate + 1159200*substrate
    + 2757240) + 3013920*substrate + 1571544) + laplace_rate*(laplace_rate*(900000*laplace_rate + 1890000*substrate
    + 6845500) + substrate*(882000*substrate + 10761800) + 15045255) + substrate*(2293200*substrate + 15934450)
    + 8660483) + laplace_rate*(laplace_rate*(4600000*laplace_rate + 9660000*substrate + 24173000) + substrate*(4508000*substrate
    + 39863600) + 40883650) + substrate*(11720800*substrate + 42075740) + 23737610) + laplace_rate*(laplace_rate*(laplace_rate*(2500000*laplace_rate
    + 7000000*substrate + 17950000) + substrate*(4900000*substrate + 43015000) + 44634750) + substrate*(25039000*substrate
    + 68672450) + 44022755) + substrate*(13450500*substrate + 27473180) + 13973453)
