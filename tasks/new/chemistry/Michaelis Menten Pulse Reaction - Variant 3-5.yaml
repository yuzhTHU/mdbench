task_name: Michaelis Menten Pulse Reaction - Variant 3-5
task_description: Determine the steady net product formation rate in the second of two equal-volume, well-mixed
  flow vessels in series, supplied with unbound enzyme and separately buffered substrate.
mutation: Combines variants 3, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: substrate_ratio = substrate/concentration_scale
  description: Dimensionless first-vessel free substrate concentration.
  role: constitutive/component relations
- formula: second_substrate_ratio = second_substrate/concentration_scale
  description: Dimensionless second-vessel free substrate concentration.
  role: constitutive/component relations
- formula: first_association_rate = rate_scale*(1.4*substrate_ratio)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: association_rate = rate_scale*(1.4*second_substrate_ratio)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_dissociation_rate = rate_scale*(0.73)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: dissociation_rate = rate_scale*(0.73)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_release_rate = rate_scale*(1.9)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: release_rate = rate_scale*(1.9)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_sequestration_rate = rate_scale*(0.31)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: sequestration_rate = rate_scale*(0.31)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_recovery_rate = rate_scale*(0.57)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: recovery_rate = rate_scale*(0.57)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: first_inactivation_rate = rate_scale*(0.12)
  description: First-vessel local reaction frequency.
  role: constitutive/component relations
- formula: inactivation_rate = rate_scale*(0.12)
  description: Second-vessel local reaction frequency.
  role: constitutive/component relations
- formula: flow_rate*first_free_enzyme+first_association_rate*first_free_enzyme+first_sequestration_rate*first_free_enzyme+first_inactivation_rate*first_free_enzyme
    = flow_rate*enzyme_total+first_dissociation_rate*first_substrate_complex+first_release_rate*first_substrate_complex+first_recovery_rate*first_sequestered_enzyme
  role: conservation/balance relations
  description: 'First-vessel steady species balance: inflow and reaction production equal outflow and reaction consumption.'
- formula: flow_rate*first_substrate_complex+first_dissociation_rate*first_substrate_complex+first_release_rate*first_substrate_complex
    = flow_rate*0+first_association_rate*first_free_enzyme
  role: conservation/balance relations
  description: 'First-vessel steady species balance: inflow and reaction production equal outflow and reaction consumption.'
- formula: flow_rate*first_sequestered_enzyme+first_recovery_rate*first_sequestered_enzyme = flow_rate*0+first_sequestration_rate*first_free_enzyme
  role: conservation/balance relations
  description: 'First-vessel steady species balance: inflow and reaction production equal outflow and reaction consumption.'
- formula: flow_rate*free_enzyme+association_rate*free_enzyme+sequestration_rate*free_enzyme+inactivation_flux =
    flow_rate*first_free_enzyme+dissociation_rate*substrate_complex+release_rate*substrate_complex+recovery_rate*sequestered_enzyme
  role: conservation/balance relations
  description: 'Second-vessel steady species balance: inflow and reaction production equal outflow and reaction
    consumption.'
- formula: flow_rate*substrate_complex+dissociation_rate*substrate_complex+release_rate*substrate_complex = flow_rate*first_substrate_complex+association_rate*free_enzyme
  role: conservation/balance relations
  description: 'Second-vessel steady species balance: inflow and reaction production equal outflow and reaction
    consumption.'
- formula: flow_rate*sequestered_enzyme+recovery_rate*sequestered_enzyme = flow_rate*first_sequestered_enzyme+sequestration_rate*free_enzyme
  role: conservation/balance relations
  description: 'Second-vessel steady species balance: inflow and reaction production equal outflow and reaction
    consumption.'
- formula: inactivation_flux = inactivation_rate*free_enzyme
  description: Second-vessel molar enzyme inactivation flux.
  role: constitutive/component relations
- formula: response = release_rate*substrate_complex
  description: Steady net product formation rate per unit volume in the second vessel.
  role: conservation/balance relations
phenomenal_model: response = 166250*enzyme_total*flow_rate**2*(second_substrate*(100*flow_rate + 57)*(10000*flow_rate**2
  + 32000*flow_rate + 14991) + 1767*second_substrate*(100*flow_rate + 263) + 4*substrate*(100*flow_rate + 57)*(2500*flow_rate**2
  + 3500*flow_rate*second_substrate + 2500*flow_rate + 1995*second_substrate + 171))/((250000*flow_rate**3 + 350000*flow_rate**2*second_substrate
  + 907500*flow_rate**2 + 199500*flow_rate*second_substrate + 674600*flow_rate + 44973)*(250000*flow_rate**3 + 350000*flow_rate**2*substrate
  + 907500*flow_rate**2 + 199500*flow_rate*substrate + 674600*flow_rate + 44973))
variables:
- name: flow_rate
  description: Volumetric flow divided by the volume of each vessel.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: substrate
  description: Buffered free substrate concentration in the first vessel.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.2
    ood_boundary: 1.6
    max: 5
    distribution: log_uniform
- name: second_substrate
  description: Buffered free substrate concentration in the second vessel.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.004
    ood_boundary: 0.06
    max: 0.16
    distribution: log_uniform
- name: enzyme_total
  description: Concentration of unbound enzyme in the feed entering the first vessel.
  unit: mol m^-3
  role: input
  sampling:
    min: 5.0e-05
    ood_boundary: 0.0004
    max: 0.001
    distribution: log_uniform
- name: substrate_ratio
  description: Dimensionless first-vessel free substrate concentration.
  unit: '1'
  role: internal
- name: second_substrate_ratio
  description: Dimensionless second-vessel free substrate concentration.
  unit: '1'
  role: internal
- name: first_association_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: association_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_dissociation_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: dissociation_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_release_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: release_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_sequestration_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: sequestration_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_recovery_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: recovery_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_inactivation_rate
  description: First-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: inactivation_rate
  description: Second-vessel local reaction frequency.
  unit: s^-1
  role: internal
- name: first_free_enzyme
  description: First-vessel steady free enzyme concentration.
  unit: mol m^-3
  role: internal
- name: first_substrate_complex
  description: First-vessel steady enzyme-substrate complex concentration.
  unit: mol m^-3
  role: internal
- name: first_sequestered_enzyme
  description: First-vessel steady reversibly sequestered enzyme concentration.
  unit: mol m^-3
  role: internal
- name: free_enzyme
  description: Second-vessel steady free enzyme concentration.
  unit: mol m^-3
  role: internal
- name: substrate_complex
  description: Second-vessel steady enzyme-substrate complex concentration.
  unit: mol m^-3
  role: internal
- name: sequestered_enzyme
  description: Second-vessel steady reversibly sequestered enzyme concentration.
  unit: mol m^-3
  role: internal
- name: inactivation_flux
  description: Second-vessel molar enzyme inactivation flux.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Steady net product formation rate per unit volume in the second vessel.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: sequestered_enzyme
  description: Second-vessel steady reversibly sequestered enzyme concentration.
  answer: enzyme_total*flow_rate**2*(flow_rate*(flow_rate*(38750000000*flow_rate + 27125000000*second_substrate
    + 223200000000) + 71338750000*second_substrate + 71338750000*substrate + 369942375000) + 40663087500*substrate
    + 134014937500)/(flow_rate*(flow_rate*(flow_rate*(flow_rate*(flow_rate*(62500000000*flow_rate + 87500000000*second_substrate
    + 87500000000*substrate + 453750000000) + second_substrate*(122500000000*substrate + 367500000000) + 367500000000*substrate
    + 1160856250000) + second_substrate*(139650000000*substrate + 417156250000) + 417156250000*substrate + 1246885500000)
    + second_substrate*(39800250000*substrate + 150323250000) + 150323250000*substrate + 536711155000) + 8972113500*second_substrate
    + 8972113500*substrate + 60677571600) + 2022570729)
- probe: inactivation_flux
  description: Second-vessel molar enzyme inactivation flux.
  answer: 75*enzyme_total*flow_rate**2*(36820*substrate*(100*flow_rate + 57)**2 + 1767*(100*flow_rate + 263)**2
    + (10000*flow_rate**2 + 32000*flow_rate + 14991)**2)/((250000*flow_rate**3 + 350000*flow_rate**2*second_substrate
    + 907500*flow_rate**2 + 199500*flow_rate*second_substrate + 674600*flow_rate + 44973)*(250000*flow_rate**3 +
    350000*flow_rate**2*substrate + 907500*flow_rate**2 + 199500*flow_rate*substrate + 674600*flow_rate + 44973))
