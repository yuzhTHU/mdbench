task_name: Surface Pair Catalysis - Variant 3-5
task_description: Determine the Laplace-weighted B-containing product rate after exposing initially empty surface
  cells to buffered A and B.
mutation: Combines variants 3, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: a_ratio = a_concentration/concentration_scale
  description: Dimensionless gas A concentration.
  role: constitutive/component relations
- formula: b_ratio = b_concentration/concentration_scale
  description: Dimensionless gas B concentration.
  role: constitutive/component relations
- formula: a_adsorption = rate_scale*(1.2*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_adsorption = rate_scale*(0.83*b_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: a_desorption = rate_scale*(0.64)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_desorption = rate_scale*(0.51)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_b_adsorption = rate_scale*(0.83*b_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_a_adsorption = rate_scale*(1.2*a_ratio*(1+(0.22/1.2)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_a_desorption = rate_scale*(0.64*(1+(0.22/1.2)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_b_desorption = rate_scale*(0.51)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: surface_reaction = rate_scale*(1.6)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: gas_surface_reaction = rate_scale*(0.24*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: gas_surface_flux = gas_surface_reaction*b_cells
  description: Laplace-weighted transition flux per adsorption cell.
  role: constitutive/component relations
- formula: laplace_rate*empty_cells+a_adsorption*empty_cells+b_adsorption*empty_cells = laplace_rate*(1)+a_desorption*a_cells+b_desorption*b_cells+surface_reaction*ab_cells+gas_surface_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*a_cells+a_desorption*a_cells+second_b_adsorption*a_cells = 0+a_adsorption*empty_cells+paired_b_desorption*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*b_cells+b_desorption*b_cells+second_a_adsorption*b_cells+gas_surface_flux = 0+b_adsorption*empty_cells+paired_a_desorption*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*ab_cells+paired_a_desorption*ab_cells+paired_b_desorption*ab_cells+surface_reaction*ab_cells
    = 0+second_b_adsorption*a_cells+second_a_adsorption*b_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = surface_reaction*ab_cells+gas_surface_reaction*b_cells
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = a_concentration*(a_concentration*(70994880*a_concentration*b_concentration + b_concentration*(49104792*b_concentration
  + 59162400*laplace_rate + 496820736)) + b_concentration*(b_concentration*(31000500*laplace_rate + 317445120) +
  laplace_rate*(37350000*laplace_rate + 724216500) + 409356000))/(a_concentration*(a_concentration*(a_concentration*(41085000*b_concentration
  + 49500000*laplace_rate + 110781000) + b_concentration*(28417125*b_concentration + 68475000*laplace_rate + 389367525)
  + laplace_rate*(41250000*laplace_rate + 469117500) + 790747200) + b_concentration*(170158300*b_concentration +
  634120000*laplace_rate + 832988000) + laplace_rate*(517000000*laplace_rate + 1530100000) + 705783300) + b_concentration*(b_concentration*(129168750*laplace_rate
  + 289338000) + laplace_rate*(311250000*laplace_rate + 955537500) + 451686000) + laplace_rate*(laplace_rate*(187500000*laplace_rate
  + 731250000) + 654168750) + 168300000)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: a_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: b_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: a_ratio
  description: Dimensionless gas A concentration.
  unit: '1'
  role: internal
- name: b_ratio
  description: Dimensionless gas B concentration.
  unit: '1'
  role: internal
- name: a_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: b_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: a_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: b_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_b_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_a_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: paired_a_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: paired_b_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: surface_reaction
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: gas_surface_reaction
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: empty_cells
  description: Laplace-weighted empty catalytic-cell fraction.
  unit: '1'
  role: internal
- name: a_cells
  description: Laplace-weighted cells carrying only adsorbed A.
  unit: '1'
  role: internal
- name: b_cells
  description: Laplace-weighted cells carrying only adsorbed B.
  unit: '1'
  role: internal
- name: ab_cells
  description: Laplace-weighted cells carrying both adsorbed reactants.
  unit: '1'
  role: internal
- name: gas_surface_flux
  description: Laplace-weighted transition flux per adsorption cell.
  unit: s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: s^-1
  role: target
mechanism_probes:
- probe: a_cells
  description: Laplace-weighted cells carrying only adsorbed A.
  answer: a_concentration*(a_concentration*(a_concentration*(1980000*laplace_rate + 4431240) + 698445*b_concentration
    + 14016000*laplace_rate + 29266560) + 3809700*b_concentration + laplace_rate*(9000000*laplace_rate + 29340000)
    + 12622500)/(a_concentration*(a_concentration*(a_concentration*(1643400*b_concentration + 1980000*laplace_rate
    + 4431240) + b_concentration*(1136685*b_concentration + 2739000*laplace_rate + 15574701) + laplace_rate*(1650000*laplace_rate
    + 18764700) + 31629888) + b_concentration*(6806332*b_concentration + 25364800*laplace_rate + 33319520) + laplace_rate*(20680000*laplace_rate
    + 61204000) + 28231332) + b_concentration*(b_concentration*(5166750*laplace_rate + 11573520) + laplace_rate*(12450000*laplace_rate
    + 38221500) + 18067440) + laplace_rate*(laplace_rate*(7500000*laplace_rate + 29250000) + 26166750) + 6732000)
- probe: gas_surface_flux
  description: Laplace-weighted transition flux per adsorption cell.
  answer: a_concentration*(a_concentration*(5258880*a_concentration*b_concentration + b_concentration*(3637392*b_concentration
    + 4382400*laplace_rate + 31489536)) + b_concentration*(b_concentration*(31000500*laplace_rate + 69441120) +
    laplace_rate*(37350000*laplace_rate + 126616500) + 65736000))/(a_concentration*(a_concentration*(a_concentration*(41085000*b_concentration
    + 49500000*laplace_rate + 110781000) + b_concentration*(28417125*b_concentration + 68475000*laplace_rate + 389367525)
    + laplace_rate*(41250000*laplace_rate + 469117500) + 790747200) + b_concentration*(170158300*b_concentration
    + 634120000*laplace_rate + 832988000) + laplace_rate*(517000000*laplace_rate + 1530100000) + 705783300) + b_concentration*(b_concentration*(129168750*laplace_rate
    + 289338000) + laplace_rate*(311250000*laplace_rate + 955537500) + 451686000) + laplace_rate*(laplace_rate*(187500000*laplace_rate
    + 731250000) + 654168750) + 168300000)
