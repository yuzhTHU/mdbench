  answer: enzyme_total*inhibitor*(inhibitor*(inhibitor*(inhibitor*(laplace_rate*(810000*laplace_rate + 947700) +
    260172) + laplace_rate*(8280000*laplace_rate + 9687600) + 2659536) + laplace_rate*(laplace_rate*(4500000*laplace_rate
    + 41005000) + 4599000*substrate + 48476700) + 2023560*substrate + 13774508) + laplace_rate*(laplace_rate*(23000000*laplace_rate
    + 101430000) + 23506000*substrate + 121233000) + 10342640*substrate + 35664904)/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(laplace_rate*(810000*laplace_rate
    + 1134000*substrate + 1166400) + 498960*substrate + 419823) + laplace_rate*(8280000*laplace_rate + 11592000*substrate
    + 11923200) + 5100480*substrate + 4291524) + laplace_rate*(laplace_rate*(9000000*laplace_rate + 18900000*substrate
    + 51445000) + substrate*(8820000*substrate + 68495000) + 64557450) + substrate*(3880800*substrate + 26972050)
    + 23108741) + laplace_rate*(laplace_rate*(46000000*laplace_rate + 96600000*substrate + 154790000) + substrate*(45080000*substrate
    + 198674000) + 174222700) + substrate*(19835200*substrate + 71236060) + 62056622) + laplace_rate*(laplace_rate*(laplace_rate*(25000000*laplace_rate
    + 70000000*substrate + 132250000) + substrate*(49000000*substrate + 221900000) + 225825000) + substrate*(51450000*substrate
    + 177348500) + 142937300) + substrate*(13151600*substrate + 37294180) + 23647382)
- probe: locked_complex
