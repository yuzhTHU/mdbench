  answer: enzyme_total*inhibitor*(inhibitor*(inhibitor*(inhibitor*(218700*laplace_rate + 159651) + 2235600*laplace_rate
    + 1631988) + laplace_rate*(1215000*laplace_rate + 10536750) + 1241730*substrate + 8452539) + laplace_rate*(6210000*laplace_rate
    + 24653700) + 6346620*substrate + 21885282)/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(laplace_rate*(810000*laplace_rate
    + 1134000*substrate + 1166400) + 498960*substrate + 419823) + laplace_rate*(8280000*laplace_rate + 11592000*substrate
    + 11923200) + 5100480*substrate + 4291524) + laplace_rate*(laplace_rate*(9000000*laplace_rate + 18900000*substrate
    + 51445000) + substrate*(8820000*substrate + 68495000) + 64557450) + substrate*(3880800*substrate + 26972050)
    + 23108741) + laplace_rate*(laplace_rate*(46000000*laplace_rate + 96600000*substrate + 154790000) + substrate*(45080000*substrate
    + 198674000) + 174222700) + substrate*(19835200*substrate + 71236060) + 62056622) + laplace_rate*(laplace_rate*(laplace_rate*(25000000*laplace_rate
    + 70000000*substrate + 132250000) + substrate*(49000000*substrate + 221900000) + 225825000) + substrate*(51450000*substrate
    + 177348500) + 142937300) + substrate*(13151600*substrate + 37294180) + 23647382)
- probe: mixed_complex
  description: Laplace-weighted enzyme carrying both substrate and inhibitor.
  answer: enzyme_total*inhibitor*(inhibitor*(inhibitor*(inhibitor*(1134000*laplace_rate*substrate + 498960*substrate)
    + 11592000*laplace_rate*substrate + 5100480*substrate) + laplace_rate*(12600000*laplace_rate*substrate + substrate*(8820000*substrate
    + 57281000)) + substrate*(3880800*substrate + 22015840)) + laplace_rate*(64400000*laplace_rate*substrate + substrate*(45080000*substrate
    + 141358000)) + substrate*(19835200*substrate + 45904320))/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(laplace_rate*(810000*laplace_rate
    + 1134000*substrate + 1166400) + 498960*substrate + 419823) + laplace_rate*(8280000*laplace_rate + 11592000*substrate
    + 11923200) + 5100480*substrate + 4291524) + laplace_rate*(laplace_rate*(9000000*laplace_rate + 18900000*substrate
    + 51445000) + substrate*(8820000*substrate + 68495000) + 64557450) + substrate*(3880800*substrate + 26972050)
    + 23108741) + laplace_rate*(laplace_rate*(46000000*laplace_rate + 96600000*substrate + 154790000) + substrate*(45080000*substrate
    + 198674000) + 174222700) + substrate*(19835200*substrate + 71236060) + 62056622) + laplace_rate*(laplace_rate*(laplace_rate*(25000000*laplace_rate
    + 70000000*substrate + 132250000) + substrate*(49000000*substrate + 221900000) + 225825000) + substrate*(51450000*substrate
    + 177348500) + 142937300) + substrate*(13151600*substrate + 37294180) + 23647382)
