task_name: Surface Pair Catalysis - Variant 4
task_description: Determine the Laplace-weighted B-containing product rate after exposing initially empty surface
  cells to buffered A and B.
mutation: Allow gas-A-assisted reversible exchange at the B site.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: a_ratio = a_concentration/concentration_scale
  description: Dimensionless gas A concentration.
  role: constitutive/component relations
- formula: b_ratio = b_concentration/concentration_scale
  description: Dimensionless gas B concentration.
  role: constitutive/component relations
- formula: a_adsorption = rate_scale*(1.2*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_adsorption = rate_scale*(0.83*b_ratio*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: a_desorption = rate_scale*(0.64)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: b_desorption = rate_scale*(0.51*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_b_adsorption = rate_scale*(0.83*b_ratio*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_a_adsorption = rate_scale*(1.2*a_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_a_desorption = rate_scale*(0.64)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: paired_b_desorption = rate_scale*(0.51*(1+(0.17/0.51)*a_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: surface_reaction = rate_scale*(1.6)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: laplace_rate*empty_cells+a_adsorption*empty_cells+b_adsorption*empty_cells = laplace_rate*(1)+a_desorption*a_cells+b_desorption*b_cells+surface_reaction*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*a_cells+a_desorption*a_cells+second_b_adsorption*a_cells = 0+a_adsorption*empty_cells+paired_b_desorption*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*b_cells+b_desorption*b_cells+second_a_adsorption*b_cells = 0+b_adsorption*empty_cells+paired_a_desorption*ab_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*ab_cells+paired_a_desorption*ab_cells+paired_b_desorption*ab_cells+surface_reaction*ab_cells
    = 0+second_b_adsorption*a_cells+second_a_adsorption*b_cells
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = surface_reaction*ab_cells
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = a_concentration*(a_concentration*(a_concentration*b_concentration*(330672*b_concentration
  + 1637424) + b_concentration*(1984032*b_concentration + 2390400*laplace_rate + 6286752)) + b_concentration*(2976048*b_concentration
  + 7171200*laplace_rate + 4123440))/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(206670*b_concentration
  + 1150380) + 628830) + b_concentration*(b_concentration*(172225*laplace_rate + 1625804) + 2452650*laplace_rate
  + 6669216) + 4682025*laplace_rate + 8668116) + b_concentration*(b_concentration*(1033350*laplace_rate + 4174734)
  + laplace_rate*(1245000*laplace_rate + 11180100) + 11460972) + laplace_rate*(6165000*laplace_rate + 17963550)
  + 8230878) + b_concentration*(b_concentration*(1550025*laplace_rate + 3472056) + laplace_rate*(3735000*laplace_rate
  + 11466450) + 5420232) + laplace_rate*(laplace_rate*(2250000*laplace_rate + 8775000) + 7850025) + 2019600)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: a_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: b_concentration
  description: Buffered gas-reactant concentration for the named species.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.05
    ood_boundary: 1.5
    max: 4.5
    distribution: log_uniform
- name: a_ratio
  description: Dimensionless gas A concentration.
  unit: '1'
  role: internal
- name: b_ratio
  description: Dimensionless gas B concentration.
  unit: '1'
  role: internal
- name: a_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: b_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: a_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: b_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_b_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_a_adsorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: paired_a_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: paired_b_desorption
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: surface_reaction
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: empty_cells
  description: Laplace-weighted empty catalytic-cell fraction.
  unit: '1'
  role: internal
- name: a_cells
  description: Laplace-weighted cells carrying only adsorbed A.
  unit: '1'
  role: internal
- name: b_cells
  description: Laplace-weighted cells carrying only adsorbed B.
  unit: '1'
  role: internal
- name: ab_cells
  description: Laplace-weighted cells carrying both adsorbed reactants.
  unit: '1'
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: s^-1
  role: target
mechanism_probes:
- probe: b_cells
  description: Laplace-weighted cells carrying only adsorbed B.
  answer: (a_concentration*(a_concentration*b_concentration*(b_concentration*(172225*laplace_rate + 385784) + 105825*laplace_rate
    + 545808) + b_concentration*(b_concentration*(1033350*laplace_rate + 2314704) + laplace_rate*(622500*laplace_rate
    + 2427750) + 2733024)) + b_concentration*(b_concentration*(1550025*laplace_rate + 3472056) + laplace_rate*(1867500*laplace_rate
    + 6330825) + 3286800))/(a_concentration*(a_concentration*(a_concentration*(b_concentration*(206670*b_concentration
    + 1150380) + 628830) + b_concentration*(b_concentration*(172225*laplace_rate + 1625804) + 2452650*laplace_rate
    + 6669216) + 4682025*laplace_rate + 8668116) + b_concentration*(b_concentration*(1033350*laplace_rate + 4174734)
    + laplace_rate*(1245000*laplace_rate + 11180100) + 11460972) + laplace_rate*(6165000*laplace_rate + 17963550)
    + 8230878) + b_concentration*(b_concentration*(1550025*laplace_rate + 3472056) + laplace_rate*(3735000*laplace_rate
    + 11466450) + 5420232) + laplace_rate*(laplace_rate*(2250000*laplace_rate + 8775000) + 7850025) + 2019600)
