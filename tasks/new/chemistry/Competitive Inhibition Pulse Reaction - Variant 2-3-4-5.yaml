  + 485157400*laplace_rate*substrate + 213469256*substrate) + laplace_rate*(laplace_rate*(864500000*laplace_rate*substrate
  + substrate*(1210300000*substrate + 2299570000)) + substrate*(1270815000*substrate + 1761159400)) + substrate*(324844520*substrate
  + 310922612))/(inhibitor*(inhibitor*(inhibitor*(inhibitor*(laplace_rate*(laplace_rate*(4050000*laplace_rate +
