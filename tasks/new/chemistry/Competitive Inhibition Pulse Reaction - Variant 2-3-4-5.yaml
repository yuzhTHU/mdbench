  + 57960000*substrate + 167256000) + 176198400*substrate + 176459220) + 66306240*substrate + 55789812) + laplace_rate*(laplace_rate*(laplace_rate*(45000000*laplace_rate
  + 94500000*substrate + 374225000) + substrate*(44100000*substrate + 588175000) + 991572250) + substrate*(134064000*substrate
  + 1061803750) + 954790555) + substrate*(50450400*substrate + 366700390) + 300413633) + laplace_rate*(laplace_rate*(laplace_rate*(230000000*laplace_rate
  + 483000000*substrate + 1371950000) + substrate*(225400000*substrate + 2249170000) + 2883383500) + substrate*(685216000*substrate
  + 3125541300) + 2575178210) + substrate*(257857600*substrate + 1008172340) + 806736086) + laplace_rate*(laplace_rate*(laplace_rate*(laplace_rate*(125000000*laplace_rate
  + 350000000*substrate + 986250000) + substrate*(245000000*substrate + 2352000000) + 2848375000) + substrate*(1359750000*substrate
  + 4655892500) + 3650411500) + substrate*(1223383000*substrate + 3169370400) + 1976421810) + substrate*(295911000*substrate
  + 604409960) + 307415966)
variables:
