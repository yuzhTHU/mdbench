task_name: Competitive Inhibition Pulse Reaction - Variant 2-3-4
task_description: Determine the Laplace-weighted product rate after substrate and inhibitor exposure of initially
  unbound enzyme in a buffered solution.
mutation: Combines variants 2, 3, 4 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: substrate_ratio = substrate/concentration_scale
  description: Dimensionless free substrate concentration.
  role: constitutive/component relations
- formula: association_rate = rate_scale*(1.4*substrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: dissociation_rate = rate_scale*(0.73)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: chemistry_rate = rate_scale*(1.9)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: release_rate = rate_scale*(2.6)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: inhibitor_ratio = inhibitor/concentration_scale
  description: Dimensionless free inhibitor concentration.
  role: constitutive/component relations
- formula: inhibitor_binding_rate = rate_scale*(0.92*inhibitor_ratio+0.18*inhibitor_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: inhibitor_release_rate = rate_scale*(0.61)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: locking_rate = rate_scale*(0.27)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: unlocking_rate = rate_scale*(0.44)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: laplace_rate*free_enzyme+association_rate*free_enzyme+inhibitor_binding_rate*free_enzyme = laplace_rate*(enzyme_total)+dissociation_rate*substrate_complex+release_rate*product_complex+inhibitor_release_rate*inhibitor_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*substrate_complex+dissociation_rate*substrate_complex+chemistry_rate*substrate_complex =
    0+association_rate*free_enzyme
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*product_complex+release_rate*product_complex = 0+chemistry_rate*substrate_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*inhibitor_complex+inhibitor_release_rate*inhibitor_complex+locking_rate*inhibitor_complex
    = 0+inhibitor_binding_rate*free_enzyme+unlocking_rate*locked_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*locked_complex+unlocking_rate*locked_complex = 0+locking_rate*inhibitor_complex
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = release_rate*product_complex
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = enzyme_total*(laplace_rate*(17290000*laplace_rate*substrate + 22822800*substrate) +
  4640636*substrate)/(inhibitor*(inhibitor*(laplace_rate*(laplace_rate*(450000*laplace_rate + 2673000) + 4748085)
  + 2184741) + laplace_rate*(laplace_rate*(2300000*laplace_rate + 13662000) + 24267990) + 11166454) + laplace_rate*(laplace_rate*(laplace_rate*(2500000*laplace_rate
  + 3500000*substrate + 16375000) + 20370000*substrate + 35025000) + 21729400*substrate + 26074730) + 4227300*substrate
  + 4588298)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: substrate
  description: Buffered free substrate concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.6
    max: 5
    distribution: log_uniform
- name: enzyme_total
  description: Conserved enzyme concentration before exposure.
  unit: mol m^-3
  role: input
  sampling:
    min: 5.0e-05
    ood_boundary: 0.0004
    max: 0.001
    distribution: log_uniform
- name: substrate_ratio
  description: Dimensionless free substrate concentration.
  unit: '1'
  role: internal
- name: association_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: dissociation_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: chemistry_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: release_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: inhibitor
  description: Buffered free inhibitor concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.03
    ood_boundary: 1.3
    max: 4
    distribution: log_uniform
- name: inhibitor_ratio
  description: Dimensionless free inhibitor concentration.
  unit: '1'
  role: internal
- name: inhibitor_binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: inhibitor_release_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: locking_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unlocking_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: free_enzyme
  description: Laplace-weighted free enzyme concentration.
  unit: mol m^-3
  role: internal
- name: substrate_complex
  description: Laplace-weighted enzyme-substrate complex concentration.
  unit: mol m^-3
  role: internal
- name: product_complex
  description: Laplace-weighted product-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: inhibitor_complex
  description: Laplace-weighted inhibitor-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: locked_complex
  description: Laplace-weighted locked inhibitor-bound enzyme concentration.
  unit: mol m^-3
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: inhibitor_complex
  description: Laplace-weighted inhibitor-bound enzyme concentration.
  answer: enzyme_total*inhibitor*(inhibitor*(laplace_rate*(laplace_rate*(450000*laplace_rate + 2551500) + 4112640)
    + 1353924) + laplace_rate*(laplace_rate*(2300000*laplace_rate + 13041000) + 21020160) + 6920056)/(inhibitor*(inhibitor*(laplace_rate*(laplace_rate*(450000*laplace_rate
    + 2673000) + 4748085) + 2184741) + laplace_rate*(laplace_rate*(2300000*laplace_rate + 13662000) + 24267990)
    + 11166454) + laplace_rate*(laplace_rate*(laplace_rate*(2500000*laplace_rate + 3500000*substrate + 16375000)
    + 20370000*substrate + 35025000) + 21729400*substrate + 26074730) + 4227300*substrate + 4588298)
- probe: product_complex
  description: Laplace-weighted product-bound enzyme concentration.
  answer: enzyme_total*(laplace_rate*(6650000*laplace_rate*substrate + 8778000*substrate) + 1784860*substrate)/(inhibitor*(inhibitor*(laplace_rate*(laplace_rate*(450000*laplace_rate
    + 2673000) + 4748085) + 2184741) + laplace_rate*(laplace_rate*(2300000*laplace_rate + 13662000) + 24267990)
    + 11166454) + laplace_rate*(laplace_rate*(laplace_rate*(2500000*laplace_rate + 3500000*substrate + 16375000)
    + 20370000*substrate + 35025000) + 21729400*substrate + 26074730) + 4227300*substrate + 4588298)
- probe: locked_complex
  description: Laplace-weighted locked inhibitor-bound enzyme concentration.
  answer: enzyme_total*inhibitor*(inhibitor*(laplace_rate*(121500*laplace_rate + 635445) + 830817) + laplace_rate*(621000*laplace_rate
    + 3247830) + 4246398)/(inhibitor*(inhibitor*(laplace_rate*(laplace_rate*(450000*laplace_rate + 2673000) + 4748085)
    + 2184741) + laplace_rate*(laplace_rate*(2300000*laplace_rate + 13662000) + 24267990) + 11166454) + laplace_rate*(laplace_rate*(laplace_rate*(2500000*laplace_rate
    + 3500000*substrate + 16375000) + 20370000*substrate + 35025000) + 21729400*substrate + 26074730) + 4227300*substrate
    + 4588298)
