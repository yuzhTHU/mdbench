task_name: Consecutive Pulse Reaction - Variant 2-3-4-5
task_description: Determine the Laplace-weighted final-product rate following a reactant pulse into a homogeneous
  solution containing buffered cosubstrate.
mutation: Combines variants 2, 3, 4, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: cosubstrate_ratio = cosubstrate/concentration_scale
  description: Dimensionless buffered cosubstrate concentration.
  role: constitutive/component relations
- formula: first_conversion = rate_scale*(0.86*cosubstrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_conversion = rate_scale*(1.71)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: final_conversion = rate_scale*(2.43)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: bypass_conversion = rate_scale*(0.23*cosubstrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: storage_conversion = rate_scale*(0.36)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: storage_release = rate_scale*(0.58)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: side_conversion = rate_scale*(0.15*cosubstrate_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: bypass_flux = bypass_conversion*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: side_flux = side_conversion*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*reactant_pool+first_conversion*reactant_pool+bypass_flux+side_flux = laplace_rate*(dose)
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*intermediate_pool+second_conversion*intermediate_pool+storage_conversion*intermediate_pool
    = 0+first_conversion*reactant_pool+storage_release*stored_intermediate
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*late_intermediate+final_conversion*late_intermediate = 0+second_conversion*intermediate_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*stored_intermediate+storage_release*stored_intermediate = 0+storage_conversion*intermediate_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = final_conversion*late_intermediate+bypass_conversion*reactant_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = cosubstrate*dose*laplace_rate*(laplace_rate*(laplace_rate*(11500000*laplace_rate +
  58420000) + 264137850) + 131349033)/(cosubstrate*(cosubstrate*(laplace_rate*(laplace_rate*(7500000*laplace_rate
  + 38100000) + 55734750) + 18075555) + laplace_rate*(laplace_rate*(54500000*laplace_rate + 276860000) + 405005850)
  + 131349033) + laplace_rate*(laplace_rate*(laplace_rate*(50000000*laplace_rate + 254000000) + 371565000) + 120503700))
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: cosubstrate
  description: Buffered cosubstrate concentration during the reaction pulse.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.07
    ood_boundary: 1.7
    max: 5
    distribution: log_uniform
- name: dose
  description: Initial primary-reactant concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0002
    ood_boundary: 0.002
    max: 0.008
    distribution: log_uniform
- name: cosubstrate_ratio
  description: Dimensionless buffered cosubstrate concentration.
  unit: '1'
  role: internal
- name: first_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: final_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: bypass_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: storage_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: storage_release
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: side_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: reactant_pool
  description: Laplace-weighted initial reactant concentration.
  unit: mol m^-3
  role: internal
- name: intermediate_pool
  description: Laplace-weighted primary intermediate concentration.
  unit: mol m^-3
  role: internal
- name: late_intermediate
  description: Laplace-weighted late intermediate concentration.
  unit: mol m^-3
  role: internal
- name: stored_intermediate
  description: Laplace-weighted off-pathway stored intermediate concentration.
  unit: mol m^-3
  role: internal
- name: bypass_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: side_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: late_intermediate
  description: Laplace-weighted late intermediate concentration.
  answer: cosubstrate*dose*laplace_rate*(73530000*laplace_rate + 42647400)/(cosubstrate*(cosubstrate*(laplace_rate*(laplace_rate*(7500000*laplace_rate
    + 38100000) + 55734750) + 18075555) + laplace_rate*(laplace_rate*(54500000*laplace_rate + 276860000) + 405005850)
    + 131349033) + laplace_rate*(laplace_rate*(laplace_rate*(50000000*laplace_rate + 254000000) + 371565000) + 120503700))
- probe: bypass_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: 23*cosubstrate*dose*laplace_rate/(cosubstrate*(15*cosubstrate + 109) + 100*laplace_rate)
- probe: stored_intermediate
  description: Laplace-weighted off-pathway stored intermediate concentration.
  answer: 154800*cosubstrate*dose*laplace_rate/(cosubstrate*(cosubstrate*(laplace_rate*(75000*laplace_rate + 198750)
    + 74385) + laplace_rate*(545000*laplace_rate + 1444250) + 540531) + laplace_rate*(laplace_rate*(500000*laplace_rate
    + 1325000) + 495900))
- probe: side_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: 15*cosubstrate**2*dose*laplace_rate/(cosubstrate*(15*cosubstrate + 109) + 100*laplace_rate)
