task_name: Reversible Association Relaxation - Variant 2-3-4
task_description: Determine the Laplace-weighted stable bound-molecule concentration after mixing initially unassociated
  molecules with buffered ligand.
mutation: Combines variants 2, 3, 4 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: storage_rate = rate_scale*(0.29)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: return_rate = rate_scale*(0.53)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: compaction_rate = rate_scale*(0.34)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: expansion_rate = rate_scale*(0.78)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux+storage_rate*unoccupied_pool = laplace_rate*(molecule_total)+desorption_rate*bound_pool+return_rate*stored_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+desorption_rate*bound_pool+compaction_rate*bound_pool = 0+binding_flux+expansion_rate*compact_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*stored_pool+return_rate*stored_pool = 0+storage_rate*unoccupied_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*compact_pool+expansion_rate*compact_pool = 0+compaction_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool+compact_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (laplace_rate*(laplace_rate*ligand*(6325000*ligand*molecule_total + 30250000*molecule_total)
  + ligand*(10436250*ligand*molecule_total + 49912500*molecule_total)) + ligand*(3754520*ligand*molecule_total +
  17956400*molecule_total))/(laplace_rate*(laplace_rate*(27500000*laplace_rate + ligand*(6325000*ligand + 34102500)
  + 71775000) + ligand*(10436250*ligand + 56076500) + 54736000) + ligand*(3754520*ligand + 20420459) + 11784630)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: molecule_total
  description: Conserved concentration of initially unassociated binding molecules.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0001
    ood_boundary: 0.001
    max: 0.004
    distribution: log_uniform
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: storage_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: return_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: compaction_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: expansion_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted free molecule concentration.
  unit: mol m^-3
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: mol m^-3
  role: internal
- name: stored_pool
  description: Laplace-weighted reversibly stored population.
  unit: mol m^-3
  role: internal
- name: compact_pool
  description: Laplace-weighted compact bound-complex concentration.
  unit: mol m^-3
  role: internal
- name: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3
  role: target
mechanism_probes:
- probe: stored_pool
  description: Laplace-weighted reversibly stored population.
  answer: (laplace_rate*(15950000*laplace_rate*molecule_total + 2234450*ligand*molecule_total + 28550500*molecule_total)
    + 1742871*ligand*molecule_total + 8335470*molecule_total)/(laplace_rate*(laplace_rate*(55000000*laplace_rate
    + ligand*(12650000*ligand + 68205000) + 143550000) + ligand*(20872500*ligand + 112153000) + 109472000) + ligand*(7509040*ligand
    + 40840918) + 23569260)
- probe: compact_pool
  description: Laplace-weighted compact bound-complex concentration.
  answer: (laplace_rate*ligand*(2150500*ligand*molecule_total + 10285000*molecule_total) + ligand*(1139765*ligand*molecule_total
    + 5451050*molecule_total))/(laplace_rate*(laplace_rate*(27500000*laplace_rate + ligand*(6325000*ligand + 34102500)
    + 71775000) + ligand*(10436250*ligand + 56076500) + 54736000) + ligand*(3754520*ligand + 20420459) + 11784630)
- probe: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: 11*ligand*molecule_total*(23*ligand/110 + 1)*(55000000*laplace_rate**3 + 7705000*laplace_rate**2*ligand
    + 127600000*laplace_rate**2 + 10093550*laplace_rate*ligand + 80921500*laplace_rate + 3185247*ligand + 15233790)/(20*(27500000*laplace_rate**3
    + 6325000*laplace_rate**2*ligand**2 + 34102500*laplace_rate**2*ligand + 71775000*laplace_rate**2 + 10436250*laplace_rate*ligand**2
    + 56076500*laplace_rate*ligand + 54736000*laplace_rate + 3754520*ligand**2 + 20420459*ligand + 11784630))
