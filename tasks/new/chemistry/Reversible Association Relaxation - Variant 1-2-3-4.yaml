task_name: Reversible Association Relaxation - Variant 1-2-3-4
task_description: Determine the Laplace-weighted stable bound-molecule concentration after mixing initially unassociated
  molecules with buffered ligand.
mutation: Combines variants 1, 2, 3, 4 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: ligand_ratio = ligand/concentration_scale
  description: Dimensionless buffered free ligand concentration.
  role: constitutive/component relations
- formula: binding_rate = rate_scale*(1.1*ligand_ratio*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: desorption_rate = rate_scale*(0.67*(1+(0.23/1.1)*ligand_ratio))
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_binding_rate = rate_scale*(0.38*ligand_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_unbinding_rate = rate_scale*(0.94)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: storage_rate = rate_scale*(0.29)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: return_rate = rate_scale*(0.53)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: compaction_rate = rate_scale*(0.34)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: expansion_rate = rate_scale*(0.78)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: binding_flux = binding_rate*unoccupied_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*unoccupied_pool+binding_flux+storage_rate*unoccupied_pool = laplace_rate*(molecule_total)+desorption_rate*bound_pool+return_rate*stored_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*bound_pool+desorption_rate*bound_pool+second_binding_rate*bound_pool+compaction_rate*bound_pool
    = 0+binding_flux+second_unbinding_rate*double_bound_pool+expansion_rate*compact_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*double_bound_pool+second_unbinding_rate*double_bound_pool = 0+second_binding_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*stored_pool+return_rate*stored_pool = 0+storage_rate*unoccupied_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*compact_pool+expansion_rate*compact_pool = 0+compaction_rate*bound_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = bound_pool+double_bound_pool+compact_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = (laplace_rate*(laplace_rate*(laplace_rate*ligand*(316250000*ligand*molecule_total +
  1512500000*molecule_total) + ligand*(ligand*(120175000*ligand*molecule_total + 1393837500*molecule_total) + 3917375000*molecule_total))
  + ligand*(ligand*(157429250*ligand*molecule_total + 1431152250*molecule_total) + 3243707500*molecule_total)) +
  ligand*(ligand*(49680345*ligand*molecule_total + 414064090*molecule_total) + 843950800*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(1375000000*laplace_rate
  + ligand*(316250000*ligand + 2227625000) + 4881250000) + ligand*(ligand*(120175000*ligand + 1393837500) + 5242642500)
  + 6110225000) + ligand*(ligand*(157429250*ligand + 1431152250) + 3990809450) + 3161823500) + ligand*(ligand*(49680345*ligand
  + 414064090) + 959761573) + 553877610)
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: ligand
  description: Buffered free adsorbate or ligand concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.04
    ood_boundary: 1.8
    max: 5
    distribution: log_uniform
- name: ligand_ratio
  description: Dimensionless buffered free ligand concentration.
  unit: '1'
  role: internal
- name: molecule_total
  description: Conserved concentration of initially unassociated binding molecules.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0001
    ood_boundary: 0.001
    max: 0.004
    distribution: log_uniform
- name: binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: desorption_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_binding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_unbinding_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: storage_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: return_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: compaction_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: expansion_rate
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: unoccupied_pool
  description: Laplace-weighted free molecule concentration.
  unit: mol m^-3
  role: internal
- name: bound_pool
  description: Laplace-weighted primary bound-state population.
  unit: mol m^-3
  role: internal
- name: double_bound_pool
  description: Laplace-weighted population carrying a second ligand.
  unit: mol m^-3
  role: internal
- name: stored_pool
  description: Laplace-weighted reversibly stored population.
  unit: mol m^-3
  role: internal
- name: compact_pool
  description: Laplace-weighted compact bound-complex concentration.
  unit: mol m^-3
  role: internal
- name: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3
  role: target
mechanism_probes:
- probe: double_bound_pool
  description: Laplace-weighted population carrying a second ligand.
  answer: (laplace_rate*(laplace_rate*ligand**2*(120175000*ligand*molecule_total + 574750000*molecule_total) + ligand**2*(157429250*ligand*molecule_total
    + 752922500*molecule_total)) + ligand**2*(49680345*ligand*molecule_total + 237601650*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(1375000000*laplace_rate
    + ligand*(316250000*ligand + 2227625000) + 4881250000) + ligand*(ligand*(120175000*ligand + 1393837500) + 5242642500)
    + 6110225000) + ligand*(ligand*(157429250*ligand + 1431152250) + 3990809450) + 3161823500) + ligand*(ligand*(49680345*ligand
    + 414064090) + 959761573) + 553877610)
- probe: stored_pool
  description: Laplace-weighted reversibly stored population.
  answer: (laplace_rate*(laplace_rate*(797500000*laplace_rate*molecule_total + 414772500*ligand*molecule_total +
    2177175000*molecule_total) + 428541700*ligand*molecule_total + 1758647000*molecule_total) + 81914937*ligand*molecule_total
    + 391767090*molecule_total)/(laplace_rate*(laplace_rate*(laplace_rate*(2750000000*laplace_rate + ligand*(632500000*ligand
    + 4455250000) + 9762500000) + ligand*(ligand*(240350000*ligand + 2787675000) + 10485285000) + 12220450000) +
    ligand*(ligand*(314858500*ligand + 2862304500) + 7981618900) + 6323647000) + ligand*(ligand*(99360690*ligand
    + 828128180) + 1919523146) + 1107755220)
- probe: compact_pool
  description: Laplace-weighted compact bound-complex concentration.
  answer: (laplace_rate*(laplace_rate*ligand*(107525000*ligand*molecule_total + 514250000*molecule_total) + ligand*(158061750*ligand*molecule_total
    + 755947500*molecule_total)) + ligand*(53568955*ligand*molecule_total + 256199350*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(1375000000*laplace_rate
    + ligand*(316250000*ligand + 2227625000) + 4881250000) + ligand*(ligand*(120175000*ligand + 1393837500) + 5242642500)
    + 6110225000) + ligand*(ligand*(157429250*ligand + 1431152250) + 3990809450) + 3161823500) + ligand*(ligand*(49680345*ligand
    + 414064090) + 959761573) + 553877610)
- probe: binding_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: (laplace_rate*(laplace_rate*(laplace_rate*(laplace_rate*ligand*(63250000000*ligand*molecule_total + 302500000000*molecule_total)
    + ligand*(ligand*(32895750000*ligand*molecule_total + 363522500000*molecule_total) + 986150000000*molecule_total))
    + ligand*(ligand*(51422537500*ligand*molecule_total + 476929200000*molecule_total) + 1104760250000*molecule_total))
    + ligand*(ligand*(24510230600*ligand*molecule_total + 222217842000*molecule_total) + 502150000000*molecule_total))
    + ligand*(ligand*(3443252007*ligand*molecule_total + 32935453980*molecule_total) + 78758694300*molecule_total))/(laplace_rate*(laplace_rate*(laplace_rate*(275000000000*laplace_rate
    + ligand*(63250000000*ligand + 445525000000) + 976250000000) + ligand*(ligand*(24035000000*ligand + 278767500000)
    + 1048528500000) + 1222045000000) + ligand*(ligand*(31485850000*ligand + 286230450000) + 798161890000) + 632364700000)
    + ligand*(ligand*(9936069000*ligand + 82812818000) + 191952314600) + 110775522000)
