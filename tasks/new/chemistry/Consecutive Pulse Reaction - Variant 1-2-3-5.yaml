task_name: Consecutive Pulse Reaction - Variant 1-2-3-5
task_description: Determine the Laplace-weighted final-product rate following a reactant pulse into a homogeneous
  solution containing buffered cosubstrate.
mutation: Combines variants 1, 2, 3, 5 with shared balances and the same measurement protocol.
mechanism_model:
- formula: rate_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: concentration_scale = 1
  role: auxiliary/regime constraints
  description: Fixed synthetic coefficient; SI units are specified by the surrounding physical relations.
- formula: cosubstrate_ratio = cosubstrate/concentration_scale
  description: Dimensionless buffered cosubstrate concentration.
  role: constitutive/component relations
- formula: first_conversion = rate_scale*(0.86*cosubstrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: reverse_conversion = rate_scale*(0.32)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: second_conversion = rate_scale*(1.71)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: final_conversion = rate_scale*(2.43)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: bypass_conversion = rate_scale*(0.23*cosubstrate_ratio)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: side_conversion = rate_scale*(0.15*cosubstrate_ratio**2)
  description: Pseudo-first-order transition frequency.
  role: constitutive/component relations
- formula: reverse_flux = reverse_conversion*intermediate_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: bypass_flux = bypass_conversion*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: side_flux = side_conversion*reactant_pool
  description: Laplace-weighted molar transfer flux for this elementary channel.
  role: constitutive/component relations
- formula: laplace_rate*reactant_pool+first_conversion*reactant_pool+bypass_flux+side_flux = laplace_rate*(dose)+reverse_flux
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*intermediate_pool+reverse_flux+second_conversion*intermediate_pool = 0+first_conversion*reactant_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: laplace_rate*late_intermediate+final_conversion*late_intermediate = 0+second_conversion*intermediate_pool
  role: conservation/balance relations
  description: Exact Laplace transform of the local population balance with the stated initially unoccupied or unreacted
    preparation.
- formula: response = final_conversion*late_intermediate+bypass_conversion*reactant_pool
  description: Laplace-weighted measured response; the same readout is used for every family member.
  role: conservation/balance relations
phenomenal_model: response = cosubstrate*dose*laplace_rate*(laplace_rate*(46000*laplace_rate + 205160) + 941625)/(cosubstrate*(cosubstrate*(laplace_rate*(30000*laplace_rate
  + 133800) + 147987) + laplace_rate*(218000*laplace_rate + 917240) + 941625) + laplace_rate*(laplace_rate*(200000*laplace_rate
  + 892000) + 986580))
variables:
- name: laplace_rate
  description: Positive transform rate s; population and pulse-rate readouts use s times integral exp(-s*t) times
    signal; electrical readouts use transform ratios.
  unit: s^-1
  role: input
  sampling:
    min: 0.03
    ood_boundary: 5
    max: 35
    distribution: log_uniform
- name: cosubstrate
  description: Buffered cosubstrate concentration during the reaction pulse.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.07
    ood_boundary: 1.7
    max: 5
    distribution: log_uniform
- name: dose
  description: Initial primary-reactant concentration.
  unit: mol m^-3
  role: input
  sampling:
    min: 0.0002
    ood_boundary: 0.002
    max: 0.008
    distribution: log_uniform
- name: cosubstrate_ratio
  description: Dimensionless buffered cosubstrate concentration.
  unit: '1'
  role: internal
- name: first_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: reverse_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: second_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: final_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: bypass_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: side_conversion
  description: Pseudo-first-order transition frequency.
  unit: s^-1
  role: internal
- name: reactant_pool
  description: Laplace-weighted initial reactant concentration.
  unit: mol m^-3
  role: internal
- name: intermediate_pool
  description: Laplace-weighted primary intermediate concentration.
  unit: mol m^-3
  role: internal
- name: late_intermediate
  description: Laplace-weighted late intermediate concentration.
  unit: mol m^-3
  role: internal
- name: reverse_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: bypass_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: side_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  unit: mol m^-3 s^-1
  role: internal
- name: response
  description: Laplace-weighted measured response; the same readout is used for every family member.
  unit: mol m^-3 s^-1
  role: target
mechanism_probes:
- probe: reverse_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: 2752*cosubstrate*dose*laplace_rate/(cosubstrate*(cosubstrate*(1500*laplace_rate + 3045) + 10900*laplace_rate
    + 19375) + laplace_rate*(10000*laplace_rate + 20300))
- probe: late_intermediate
  description: Laplace-weighted late intermediate concentration.
  answer: 294120*cosubstrate*dose*laplace_rate/(cosubstrate*(cosubstrate*(laplace_rate*(30000*laplace_rate + 133800)
    + 147987) + laplace_rate*(218000*laplace_rate + 917240) + 941625) + laplace_rate*(laplace_rate*(200000*laplace_rate
    + 892000) + 986580))
- probe: bypass_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: cosubstrate*dose*laplace_rate*(2300*laplace_rate + 4669)/(cosubstrate*(cosubstrate*(1500*laplace_rate
    + 3045) + 10900*laplace_rate + 19375) + laplace_rate*(10000*laplace_rate + 20300))
- probe: side_flux
  description: Laplace-weighted molar transfer flux for this elementary channel.
  answer: cosubstrate**2*dose*laplace_rate*(300*laplace_rate + 609)/(cosubstrate*(cosubstrate*(300*laplace_rate
    + 609) + 2180*laplace_rate + 3875) + laplace_rate*(2000*laplace_rate + 4060))
