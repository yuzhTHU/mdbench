task_name: Materials Grain Boundary Transport - Variant 2-3-4-5
task_description: Relate solute transport through a polycrystalline specimen to its microstructure, diffusivities, and imposed concentration difference.
mutation: Combines variants 2, 3, 4, 5. The component changes act together.
mechanism_model:
- formula: h = delta * Db / (d * Dg)
  role: constitutive/component relations
  description: Boundary blocking population ratio
- formula: ell1 = (d) * (1 + (1/10) * d / (d + delta))
  role: kinematic/geometric constraints
  description: Path 1 grain transport length
- formula: a1 = Dg / ell1
  role: constitutive/component relations
  description: Path 1 grain mass-transfer coefficient
- formula: b1 = Db / ((delta) * (1 + (1/2) * h))
  role: constitutive/component relations
  description: Path 1 boundary mass-transfer coefficient
- formula: p1 = 1
  role: constitutive/component relations
  description: Path 1 grain-to-boundary partition coefficient
- formula: l1 = (1/5) * Dg / d
  role: constitutive/component relations
  description: Path 1 boundary uptake coefficient
- formula: jg1 = a1 * (C - p1 * c1)
  role: constitutive/component relations
  description: Grain diffusion into path 1 with interfacial partitioning.
- formula: jb1 = b1 * c1
  role: constitutive/component relations
  description: Boundary diffusion to the zero-concentration outlet in path 1.
- formula: ell2 = (d/2) * (1 + (1/5) * d / (d + delta))
  role: kinematic/geometric constraints
  description: Path 2 grain transport length
- formula: a2 = Dg / ell2
  role: constitutive/component relations
  description: Path 2 grain mass-transfer coefficient
- formula: b2 = Db / ((2*delta) * (1 + (4/5) * h))
  role: constitutive/component relations
  description: Path 2 boundary mass-transfer coefficient
- formula: p2 = 1
  role: constitutive/component relations
  description: Path 2 grain-to-boundary partition coefficient
- formula: l2 = (3/10) * Dg / d
  role: constitutive/component relations
  description: Path 2 boundary uptake coefficient
- formula: jg2 = a2 * (C - p2 * c2)
  role: constitutive/component relations
  description: Grain diffusion into path 2 with interfacial partitioning.
- formula: jb2 = b2 * c2
  role: constitutive/component relations
  description: Boundary diffusion to the zero-concentration outlet in path 2.
- formula: kx = Dg / (3 * d)
  role: constitutive/component relations
  description: Boundary compartment exchange coefficient
- formula: jx = kx * (p1*c1 - p2*c2)
  role: constitutive/component relations
  description: Grain-bridge exchange driven by partition-adjusted concentration difference.
- formula: jg1 = jb1 + l1*c1 + (5/3)*jx
  role: conservation/balance relations
  description: First compartment balance for three-fifths specimen area.
- formula: jg2 = jb2 + l2*c2 - (5/2)*jx
  role: conservation/balance relations
  description: Second compartment balance for two-fifths specimen area.
- formula: J = (3/5)*jb1 + (2/5)*jb2
  role: conservation/balance relations
  description: Area-weighted transmitted flux through both paths.
phenomenal_model: J = C*Db*(5*Dg^2/(6*d^2*(d/(10*(d + delta)) + 1)) + 2*Dg*(Db/(delta*(Db*delta/(2*Dg*d) + 1)) + 34*Dg/(45*d) + Dg/(d*(d/(10*(d + delta)) + 1)))/(d*(d/(5*(d + delta)) + 1)))/(5*delta*(-25*Dg^2/(54*d^2) + (Db/(delta*(Db*delta/(2*Dg*d) + 1)) + 34*Dg/(45*d) + Dg/(d*(d/(10*(d + delta)) + 1)))*(Db/(2*delta*(4*Db*delta/(5*Dg*d) + 1)) + 17*Dg/(15*d) + 2*Dg/(d*(d/(5*(d + delta)) + 1))))*(4*Db*delta/(5*Dg*d) + 1)) + 3*C*Db*(10*Dg^2/(9*d^2*(d/(5*(d + delta)) + 1)) + Dg*(Db/(2*delta*(4*Db*delta/(5*Dg*d) + 1)) + 17*Dg/(15*d) + 2*Dg/(d*(d/(5*(d + delta)) + 1)))/(d*(d/(10*(d + delta)) + 1)))/(5*delta*(-25*Dg^2/(54*d^2) + (Db/(delta*(Db*delta/(2*Dg*d) + 1)) + 34*Dg/(45*d) + Dg/(d*(d/(10*(d + delta)) + 1)))*(Db/(2*delta*(4*Db*delta/(5*Dg*d) + 1)) + 17*Dg/(15*d) + 2*Dg/(d*(d/(5*(d + delta)) + 1))))*(Db*delta/(2*Dg*d) + 1))
variables:
- name: J
  description: Transmitted solute flux per specimen area
  unit: mol m^-2 s^-1
  role: target
- name: d
  description: Reference grain transport length
  unit: m
  role: input
  sampling:
    min: 1.0e-06
    max: 0.0001
    ood_boundary: 1.0e-05
    distribution: log_uniform
- name: delta
  description: Reference boundary transport length
  unit: m
  role: input
  sampling:
    min: 1.0e-09
    max: 1.0e-07
    ood_boundary: 1.0e-08
    distribution: log_uniform
- name: Dg
  description: Grain interior reference diffusivity
  unit: m^2 s^-1
  role: input
  sampling:
    min: 1.0e-16
    max: 1.0e-12
    ood_boundary: 1.0e-14
    distribution: log_uniform
- name: Db
  description: Boundary reference diffusivity
  unit: m^2 s^-1
  role: input
  sampling:
    min: 1.0e-14
    max: 1.0e-10
    ood_boundary: 1.0e-12
    distribution: log_uniform
- name: C
  description: Inlet concentration relative to the outlet
  unit: mol m^-3
  role: input
  sampling:
    min: 0.001
    max: 0.1
    ood_boundary: 0.02
    distribution: log_uniform
- name: h
  description: Boundary blocking population ratio
  unit: '1'
  role: internal
- name: ell1
  description: Path 1 grain transport length
  unit: m
  role: internal
- name: a1
  description: Path 1 grain mass-transfer coefficient
  unit: m s^-1
  role: internal
- name: b1
  description: Path 1 boundary mass-transfer coefficient
  unit: m s^-1
  role: internal
- name: p1
  description: Path 1 grain-to-boundary partition coefficient
  unit: '1'
  role: internal
- name: l1
  description: Path 1 boundary uptake coefficient
  unit: m s^-1
  role: internal
- name: c1
  description: Solute concentration in the first boundary compartment
  unit: mol m^-3
  role: internal
- name: jg1
  description: Path 1 grain influx per path area
  unit: mol m^-2 s^-1
  role: internal
- name: jb1
  description: Path 1 boundary outlet flux per path area
  unit: mol m^-2 s^-1
  role: internal
- name: ell2
  description: Path 2 grain transport length
  unit: m
  role: internal
- name: a2
  description: Path 2 grain mass-transfer coefficient
  unit: m s^-1
  role: internal
- name: b2
  description: Path 2 boundary mass-transfer coefficient
  unit: m s^-1
  role: internal
- name: p2
  description: Path 2 grain-to-boundary partition coefficient
  unit: '1'
  role: internal
- name: l2
  description: Path 2 boundary uptake coefficient
  unit: m s^-1
  role: internal
- name: c2
  description: Solute concentration in the second boundary compartment
  unit: mol m^-3
  role: internal
- name: jg2
  description: Path 2 grain influx per path area
  unit: mol m^-2 s^-1
  role: internal
- name: jb2
  description: Path 2 boundary outlet flux per path area
  unit: mol m^-2 s^-1
  role: internal
- name: kx
  description: Boundary compartment exchange coefficient
  unit: m s^-1
  role: internal
- name: jx
  description: Solute transfer from first to second compartment per specimen area
  unit: mol m^-2 s^-1
  role: internal
mechanism_probes:
- probe: c1
  description: Solute concentration in the first boundary compartment
  answer: C*(10*Dg^2/(9*d^2*(d/(5*(d + delta)) + 1)) + Dg*(Db/(2*delta*(4*Db*delta/(5*Dg*d) + 1)) + 17*Dg/(15*d) + 2*Dg/(d*(d/(5*(d + delta)) + 1)))/(d*(d/(10*(d + delta)) + 1)))/(-25*Dg^2/(54*d^2) + (Db/(delta*(Db*delta/(2*Dg*d) + 1)) + 34*Dg/(45*d) + Dg/(d*(d/(10*(d + delta)) + 1)))*(Db/(2*delta*(4*Db*delta/(5*Dg*d) + 1)) + 17*Dg/(15*d) + 2*Dg/(d*(d/(5*(d + delta)) + 1))))
- probe: c2
  description: Solute concentration in the second boundary compartment
  answer: C*(5*Dg^2/(6*d^2*(d/(10*(d + delta)) + 1)) + 2*Dg*(Db/(delta*(Db*delta/(2*Dg*d) + 1)) + 34*Dg/(45*d) + Dg/(d*(d/(10*(d + delta)) + 1)))/(d*(d/(5*(d + delta)) + 1)))/(-25*Dg^2/(54*d^2) + (Db/(delta*(Db*delta/(2*Dg*d) + 1)) + 34*Dg/(45*d) + Dg/(d*(d/(10*(d + delta)) + 1)))*(Db/(2*delta*(4*Db*delta/(5*Dg*d) + 1)) + 17*Dg/(15*d) + 2*Dg/(d*(d/(5*(d + delta)) + 1))))
