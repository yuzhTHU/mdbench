task_name: Drude Transport - Variant 4
task_description: Determine electrical current density from the applied electric field, carrier density, and bath
  temperature.
mutation: Add density-dependent correlated collisions.
mechanism_model:
- formula: charge = 1.602176634e-19
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Homogeneous stationary transport; charge magnitude fixed.
- formula: mass0 = 9.1093837e-31
  role: auxiliary/regime constraints
  description: Fixed model coefficient. All changes are synthetic constitutive closures, not asserted material laws.
- formula: nu0 = 2e13
  role: auxiliary/regime constraints
  description: Fixed model coefficient. Backflow stores momentum but carries no electric current; bath and field
    are externally clamped.
- formula: tref = 300
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: nref = 1e24
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: nuc = 4e12
  role: auxiliary/regime constraints
  description: Fixed model coefficient.
- formula: inertia = mass0
  role: constitutive/component relations
  description: Effective carrier inertial mass.
- formula: mobile = density
  role: constitutive/component relations
  description: Mobile carrier number density.
- formula: phonon_temp = temp
  role: constitutive/component relations
  description: Local phonon reservoir temperature.
- formula: collision_extra = nuc*(density/nref)/(1+temp/tref)
  role: constitutive/component relations
  description: Additional momentum relaxation frequency.
- formula: collision = nu0*phonon_temp/tref+collision_extra
  role: constitutive/component relations
  description: Total momentum relaxation frequency.
- formula: momentum = charge*field*(collision+laplace_rate)/response_denominator
  role: governing/dynamical laws
  description: Momentum delivered per carrier between relaxation events.
- formula: backflow = 0
  role: constitutive/component relations
  description: Momentum per carrier stored in the backflow reservoir.
- formula: drift = (momentum-backflow)/inertia
  role: conservation/balance relations
  description: Carrier drift speed.
- formula: current_density = charge*mobile*drift
  role: conservation/balance relations
  description: Electrical current density.
- formula: cyclotron_rate = charge*magnetic_field/inertia
  role: constitutive/component relations
  description: Cyclotron frequency of the mobile carrier.
- formula: response_denominator = (collision+laplace_rate)**2+cyclotron_rate**2
  role: constitutive/component relations
  description: Denominator of the local two-dimensional real-transform Drude response.
phenomenal_model: current_density = 13153226833996124865410315925*density*field*(3*density/(2500000000*(temp + 300))
  + laplace_rate + 200000000000*temp**2/(3*(temp + 300)) + 20000000000000*temp/(temp + 300))/(14439206061762581002500000000000000000000000000000000000000*magnetic_field**2
  + 8298087139382569*(9*density/(temp + 300) + 7500000000*laplace_rate + 500000000000000000000*temp**2/(temp + 300)
  + 150000000000000000000000*temp/(temp + 300))**2)
variables:
- name: magnetic_field
  role: input
  unit: kg A^-1 s^-2
  description: Transverse pulsed magnetic induction; lateral contacts are held at equal potential.
  sampling:
    min: 5
    max: 150
    ood_boundary: 60
    distribution: uniform
- name: laplace_rate
  role: input
  unit: s^-1
  description: Positive real rate of the linear-response readout; field and current denote transform amplitudes
    with the same normalization.
  sampling:
    min: 2000000000000.0
    max: 100000000000000.0
    ood_boundary: 30000000000000.0
    distribution: log_uniform
- name: field
  description: Applied electric field magnitude.
  unit: V m^-1
  role: input
  sampling:
    min: 100
    max: 5000
    ood_boundary: 2000
    distribution: log_uniform
- name: density
  description: Total carrier number density.
  unit: m^-3
  role: input
  sampling:
    min: 1.0e+23
    max: 5.0e+24
    ood_boundary: 2.0e+24
    distribution: log_uniform
- name: temp
  description: Bath temperature.
  unit: K
  role: input
  sampling:
    min: 250
    max: 600
    ood_boundary: 450
    distribution: uniform
- name: inertia
  description: Effective carrier inertial mass.
  unit: kg
  role: internal
- name: mobile
  description: Mobile carrier number density.
  unit: m^-3
  role: internal
- name: phonon_temp
  description: Local phonon reservoir temperature.
  unit: K
  role: internal
- name: collision_extra
  description: Additional momentum relaxation frequency.
  unit: s^-1
  role: internal
- name: collision
  description: Total momentum relaxation frequency.
  unit: s^-1
  role: internal
- name: momentum
  description: Momentum delivered per carrier between relaxation events.
  unit: kg m s^-1
  role: internal
- name: backflow
  description: Momentum per carrier stored in the backflow reservoir.
  unit: kg m s^-1
  role: internal
- name: drift
  description: Carrier drift speed.
  unit: m s^-1
  role: internal
- name: current_density
  description: Electrical current density.
  unit: A m^-2
  role: target
- name: cyclotron_rate
  role: internal
  unit: s^-1
  description: Cyclotron frequency of the mobile carrier.
- name: response_denominator
  role: internal
  unit: s^-2
  description: Denominator of the local two-dimensional real-transform Drude response.
mechanism_probes:
- probe: collision_extra
  description: Additional momentum relaxation frequency.
  answer: 300*density/(250000000000*temp + 75000000000000)
